<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>코자 온라인 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 배치: 위 막대(로고·검색) + 왼쪽 목차 + 본문. 휴대폰은 목차가 서랍으로 접힌다.
   글꼴: 제목·메뉴·라벨 = Galmuri (게임 GUI 와 같은 글꼴), 긴 본문 = 나눔고딕 (게임 퀘스트 창 글꼴) */
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Galmuri9";src:url("fonts/Galmuri9.woff2") format("woff2");font-display:swap}

:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunk:#E3E8E2; --line:#CDD5CC; --line-strong:#9AA79C;
  --ink:#18201C; --muted:#56635B; --faint:#839087;
  --accent:#0F6E64; --accent-soft:#D5EBE6; --accent-ink:#0A4D46;
  --gold:#9C6F12; --gold-soft:#F4E7C8;
  --r-common:#5E6862; --r-uncommon:#2E8B33; --r-rare:#1D7FA8; --r-epic:#A33BB0; --r-legend:#C46A0B;
  --reg-forest:#3E8F3A; --reg-desert:#B98516; --reg-volcano:#C2421B; --reg-jungle:#14866E; --reg-mushroom:#8C4FC0; --reg-ice:#2D86C4;
  --shadow:0 1px 0 rgba(24,32,28,.06), 0 10px 26px -18px rgba(24,32,28,.35);
  --f-pixel:"Galmuri11","Galmuri9","Nanum Gothic",system-ui,sans-serif;
  --f-pixel-s:"Galmuri9","Galmuri11","Nanum Gothic",system-ui,sans-serif;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#171E1B; --sunk:#1F2824; --line:#2B3732; --line-strong:#47574F;
  --ink:#E3EAE5; --muted:#A1AFA7; --faint:#75847C;
  --accent:#4FC2B2; --accent-soft:#15332F; --accent-ink:#A6EDE3;
  --gold:#E2B456; --gold-soft:#2F2716;
  --r-common:#C9D1CC; --r-uncommon:#6BD26F; --r-rare:#5CC6EE; --r-epic:#E079EC; --r-legend:#F4A447;
  --reg-forest:#6BC566; --reg-desert:#E2B44A; --reg-volcano:#F07A50; --reg-jungle:#43C7A6; --reg-mushroom:#B98AE8; --reg-ice:#6DB8EE;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1B; --sunk:#1F2824; --line:#2B3732; --line-strong:#47574F;
  --ink:#E3EAE5; --muted:#A1AFA7; --faint:#75847C;
  --accent:#4FC2B2; --accent-soft:#15332F; --accent-ink:#A6EDE3;
  --gold:#E2B456; --gold-soft:#2F2716;
  --r-common:#C9D1CC; --r-uncommon:#6BD26F; --r-rare:#5CC6EE; --r-epic:#E079EC; --r-legend:#F4A447;
  --reg-forest:#6BC566; --reg-desert:#E2B44A; --reg-volcano:#F07A50; --reg-jungle:#43C7A6; --reg-mushroom:#B98AE8; --reg-ice:#6DB8EE;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;line-height:1.35;margin:0;text-wrap:balance;letter-spacing:0}
kbd{font-family:var(--f-pixel-s);font-size:12px;padding:1px 7px 2px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 2px 0 var(--line-strong);border-radius:2px;white-space:nowrap}
code{font-family:var(--f-pixel-s);font-size:12.5px;background:var(--accent-soft);color:var(--accent-ink);padding:1px 6px;border-radius:2px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 픽셀 테두리: 모서리를 1칸 깎은 각진 상자 */
.px{border:0;box-shadow:0 -2px 0 0 var(--px-c,var(--line)),0 2px 0 0 var(--px-c,var(--line)),-2px 0 0 0 var(--px-c,var(--line)),2px 0 0 0 var(--px-c,var(--line))}

/* ───── 위 막대 ───── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.menu-btn{display:none;width:38px;height:38px;flex:none;background:var(--surface);color:var(--ink);cursor:pointer;place-items:center}
.brand{display:flex;align-items:center;gap:10px;flex:none;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand svg{width:28px;height:28px;image-rendering:pixelated}
.brand b{font-family:var(--f-pixel);font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-pixel-s);font-size:10px;color:var(--gold);letter-spacing:.12em;line-height:1}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search input{width:100%;font-family:var(--f-pixel-s);font-size:13px;color:var(--ink);background:var(--surface);padding:9px 12px 9px 34px;border-radius:2px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:60;padding:6px 0}
.sres a{display:flex;gap:10px;align-items:baseline;padding:7px 14px;color:var(--ink)}
.sres a:hover,.sres a.sel{background:var(--accent-soft);text-decoration:none}
.sres em{font-style:normal;font-family:var(--f-pixel-s);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.sres p{margin:0;padding:10px 14px;color:var(--faint);font-size:13px}
.theme-btn{width:38px;height:38px;flex:none;background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}

/* ───── 뼈대 ───── */
.shell{max-width:1320px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:36px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);align-self:start;max-height:calc(100vh - 60px);overflow:auto;padding-block:22px 40px}
.rail h4{font-family:var(--f-pixel-s);font-size:11px;font-weight:400;color:var(--faint);letter-spacing:.14em;margin:16px 10px 6px}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;align-items:center;gap:10px;padding:5px 10px;color:var(--muted);font-family:var(--f-pixel);font-size:13.5px;line-height:1.5;border-radius:2px}
.rail a:hover{background:var(--sunk);color:var(--ink);text-decoration:none}
.rail a.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail a i{width:9px;height:9px;flex:none;background:var(--ico,var(--line-strong))}
.rail a .soon{margin-left:auto;font-family:var(--f-pixel-s);font-size:10px;color:var(--faint)}
main{min-width:0;padding-block:26px 90px}
.scrim{display:none}

/* ───── 공용 조각 ───── */
.crumb{font-family:var(--f-pixel-s);font-size:12px;color:var(--faint);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.crumb a{color:var(--muted)}
.lede{color:var(--muted);max-width:64ch;margin:10px 0 0}
.section{margin-top:34px}
.section>h2{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section>h2::before{content:"";width:10px;height:10px;background:var(--accent);flex:none}
.prose{max-width:68ch}
.prose p{margin:0 0 10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-pixel-s);font-size:11.5px;line-height:1;padding:5px 8px 6px;background:var(--sunk);color:var(--muted);border-radius:2px;white-space:nowrap}
.tag.lv{background:var(--gold-soft);color:var(--gold)}
.tbl{overflow-x:auto;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-pixel-s);font-weight:400;font-size:11.5px;color:var(--faint);letter-spacing:.06em;background:var(--sunk);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
th.num{text-align:right}
td b{font-weight:700}
.who{font-family:var(--f-pixel);font-weight:700;white-space:nowrap}
.who small{display:block;font-family:var(--f-pixel-s);font-weight:400;font-size:11px;color:var(--faint)}
.note{font-size:13.5px;color:var(--muted);background:var(--gold-soft);padding:10px 14px;margin-top:12px;max-width:72ch;border-left:4px solid var(--gold)}
.note b{color:var(--gold)}

/* 사진·영상 칸 */
figure.slot{margin:0;position:relative;background:var(--sunk);overflow:hidden;max-width:100%}
figure.slot img{display:block;width:100%;height:100%;object-fit:cover}
figure.slot.icon{background:radial-gradient(circle at 50% 45%,#3A424C 0,#20252C 70%)}
figure.slot.icon img{object-fit:contain;padding:9%;box-sizing:border-box}
figure.slot.icon.px img{image-rendering:pixelated;padding:16%}
figure.slot.icon figcaption{display:none}
figure.slot .tmp{position:absolute;top:10px;right:10px;font-family:var(--f-pixel-s);font-size:11px;background:#18201CCC;color:#F4E7C8;padding:4px 8px 5px;border-radius:2px}
figure.slot figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-family:var(--f-pixel-s);font-size:11px;color:#E9EFEA;background:linear-gradient(transparent,#0B0F0DD9)}
figure.slot.video::after{content:"";position:absolute;left:50%;top:50%;width:62px;height:62px;transform:translate(-50%,-50%);background:#0B0F0DB3;clip-path:polygon(0 0,100% 50%,0 100%);margin-left:6px}
figure.slot.video::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%);background:#0B0F0D80;border-radius:50%}

/* ───── 대문 ───── */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;background:var(--surface);box-shadow:var(--shadow)}
.hero-text{padding:30px 30px 26px}
.hero-text .eye{font-family:var(--f-pixel-s);font-size:12px;color:var(--gold);letter-spacing:.14em}
.hero-text h1{font-size:clamp(26px,3.4vw,36px);margin-top:10px}
.hero-text p{color:var(--muted);margin:12px 0 0;max-width:46ch}
.hero .slot{min-height:260px}
.counts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line-strong)}
.counts div{font-family:var(--f-pixel-s);font-size:11px;color:var(--faint)}
.counts b{display:block;font-family:var(--f-pixel);font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}

.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);box-shadow:var(--shadow);position:relative}
.route a{display:flex;flex-direction:column;gap:3px;padding:14px 14px 16px;color:var(--ink);border-top:6px solid var(--rc);position:relative}
.route a+a{border-left:1px solid var(--line)}
.route a:hover{background:var(--sunk);text-decoration:none}
.route .n{font-family:var(--f-pixel-s);font-size:11px;color:var(--rc)}
.route b{font-family:var(--f-pixel);font-size:15px}
.route span{font-size:12.5px;color:var(--muted);line-height:1.5}
.route .lvp{font-family:var(--f-pixel-s);font-size:11px;color:var(--faint);margin-top:auto;padding-top:6px}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.step{background:var(--surface);box-shadow:var(--shadow);padding:16px 16px 18px;counter-increment:s;min-width:0}
.step::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;background:var(--accent);color:var(--surface);font-family:var(--f-pixel);font-size:14px;margin-bottom:10px}
.step b{font-family:var(--f-pixel);display:block;font-size:14.5px;line-height:1.45}
.step p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.65}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cat{display:flex;gap:12px;align-items:flex-start;background:var(--surface);box-shadow:var(--shadow);padding:13px 14px;color:var(--ink)}
.cat:hover{text-decoration:none;outline:2px solid var(--accent);outline-offset:-2px}
.cat i{width:14px;height:14px;flex:none;margin-top:5px;background:var(--ico)}
.cat b{font-family:var(--f-pixel);font-size:14px;display:block}
.cat span{font-size:12.5px;color:var(--muted);line-height:1.55;display:block;margin-top:2px}

.upd{list-style:none;margin:0;padding:0;background:var(--surface);box-shadow:var(--shadow)}
.upd li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:11px 16px;border-bottom:1px solid var(--line)}
.upd li:last-child{border-bottom:0}
.upd time{font-family:var(--f-pixel-s);font-size:12px;color:var(--faint);padding-top:3px;font-variant-numeric:tabular-nums}
.upd p{margin:0;font-size:14px}

/* ───── 문서(지역·아이템) ───── */
.doc-head{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.doc-head h1{font-size:clamp(26px,3vw,34px)}
.doc-head .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.infobox{background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;grid-row:span 2}
.infobox .slot{aspect-ratio:16/10}
.infobox h3{font-size:14px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk);border-top:4px solid var(--rc,var(--accent))}
.infobox dl{margin:0;padding:6px 14px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px}
.infobox dt{font-family:var(--f-pixel-s);font-size:11.5px;color:var(--faint);padding-top:2px;white-space:nowrap}
.infobox dd{margin:0;line-height:1.55}
.wide-slot{aspect-ratio:21/8;margin-top:22px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{background:var(--surface);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{font-size:15px;margin-bottom:8px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.named{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.named .card{border-top:4px solid var(--reg-forest)}
.named .card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13.5px}
.named dt{font-family:var(--f-pixel-s);font-size:11.5px;color:var(--faint);padding-top:3px}
.named dd{margin:0;font-variant-numeric:tabular-nums}

/* 아이템 */
.itemcard{background:#140F1A;color:#E8E2EE;padding:14px 16px 16px;font-family:var(--f-pixel);font-size:13px;line-height:1.7;box-shadow:inset 0 0 0 2px #2A0E5E,inset 0 0 0 4px #140F1A,var(--shadow)}
.itemcard .nm{font-weight:700;font-size:15px;color:#55FFFF}
.itemcard .gray{color:#AAAAAA}
.itemcard .wh{color:#FFFFFF}
.ico{width:64px;height:64px;flex:none;background:var(--sunk);display:grid;place-items:center;position:relative}
.ico svg{width:48px;height:48px;image-rendering:pixelated}
.rar-rare{color:var(--r-rare)}
.bar{display:inline-block;height:8px;background:var(--r-legend);vertical-align:middle;margin-right:8px;min-width:2px}
.bar.ok{background:var(--r-uncommon)}

/* 준비 중 */
.stub{background:var(--surface);box-shadow:var(--shadow);padding:26px 24px;max-width:760px}
.stub ul{margin:12px 0 0;padding-left:18px;color:var(--muted)}

/* ───── 반응형 ───── */
@media (max-width:1080px){.doc-head{grid-template-columns:1fr}.infobox{grid-row:auto}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .menu-btn{display:grid}
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(290px,84vw);max-height:none;background:var(--bg);z-index:80;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 40px;transform:translateX(-102%);transition:transform .18s ease;border-right:1px solid var(--line)}
  body.nav-open .rail{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:#0B0F0D80;z-index:70}
  .hero{grid-template-columns:1fr}.hero .slot{min-height:200px;order:-1}
  .route{grid-template-columns:repeat(3,minmax(0,1fr))}
  .route a:nth-child(4){border-left:0}
  .route a:nth-child(n+4){border-top-width:6px}
  .two,.named{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (max-width:520px){
  .route{grid-template-columns:repeat(2,minmax(0,1fr))}
  .route a:nth-child(odd){border-left:0}.route a:nth-child(4){border-left:1px solid var(--line)}
  .steps{grid-template-columns:1fr}
  .hero-text{padding:22px 18px}
  .brand b{font-size:15px}
  .upd li{grid-template-columns:1fr;gap:2px}
  th,td{padding:8px 10px}
}

/* ───── 공용 블록 (v2) ───── */
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:4px}
.blk{margin-top:14px}
.blk:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cards .card{border-top:4px solid var(--cc,var(--line-strong))}
.cards .card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13.5px}
.cards .card dt{font-family:var(--f-pixel-s);font-size:11.5px;color:var(--faint);padding-top:3px;white-space:nowrap}
.cards .card dd{margin:0;font-variant-numeric:tabular-nums}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.children{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.children a{display:block;background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;color:var(--ink);border-left:4px solid var(--cc,var(--accent))}
.children a:hover{text-decoration:none;background:var(--sunk)}
.children b{font-family:var(--f-pixel);font-size:14.5px;display:block}
.children span{font-size:13px;color:var(--muted);line-height:1.6;display:block;margin-top:4px}
.slot.inline{aspect-ratio:16/8}
.doc-head.noinfo{grid-template-columns:minmax(0,1fr)}

/* 사전 */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px}
.chip{font-family:var(--f-pixel-s);font-size:12px;padding:6px 10px 7px;background:var(--surface);color:var(--muted);border:1px solid var(--line);cursor:pointer;border-radius:2px}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}

-mana), 피해 · 치명타는 [전투력](#growth-power)에도 반영됩니다."}}]},{"h":"도감으로 받는 근원","blocks":[{"p":"완료도가 10%씩 오를 때마다 근원을 받고, 100%를 채우면 덤을 더 받습니다. 단계마다 한 번만 받으며, 이미 넘긴 단계는 한꺼번에 받습니다. 채우기 어려운 분류일수록 많이 줍니다."},{"table":{"cols":["분류","10%마다","100% 덤","100%까지 합계"],"num":[1,2,3],"rows":[["곤충 · 농작물 · 포션 · 드래곤펫","5","30","80"],["광물 · 탈것 · 나무","10","50","150"],["낚시 · 왕관 · 음식 · 램프","15","80","230"],["스킬","25","150","400"]]}},{"p":"12분류를 모두 100% 채우면 근원을 모두 2,090개 받습니다."},{"list":["**곤충** 도감: 곤충을 잡을 때 근원이 나올 확률이 완료도에 따라 오릅니다 (100%면 1.5배).","**포션** 도감: 연금술로 근원이 나올 확률이 오릅니다 (100%면 1.5배).","**음식** 도감: 요리로 근원이 나올 확률이 오릅니다 (100%면 2배).","**왕관** 도감: 화산 · 정글 · 버섯숲 · 빙하 사냥터 몬스터에게서 근원이 나올 확률이 오릅니다 (100%면 2배).","확률은 10%마다 조금씩 오르고, 100%일 때 가장 높습니다."]}]},{"h":"등록되는 방법","blocks":[{"list":["줍기 · 제작 · 낚시 · 채집 · 거래 · 유저상점 구매 등 **어떤 방법이든** 인벤토리에 들어오면 등록됩니다. 몇 초 안에 반영됩니다.","한 번 등록된 칸은 아이템을 팔거나 써도 지워지지 않습니다.","물고기는 **어종 단위**입니다. 크기나 변이는 상관없이 한 마리만 잡으면 그 어종 칸이 열립니다.","드래곤펫은 드래곤 알에서 새끼 드라코닌이 나오거나, 새끼가 성체로 자라면 그 속성 칸이 열립니다.","스킬은 스킬 아이템을 손에 넣으면 등록됩니다. 스킬북에 장착하지 않아도 됩니다.","**탈것**은 그 탈것을 가지고 있으면 칸이 열립니다 (소환권을 등록해 내 탈것이 된 순간).","**왕관** 칸은 금왕관 · 은왕관 몬스터를 **내가 직접** 잡아야 열립니다. 남에게 받은 트로피로는 열리지 않습니다."]},{"slot":{"id":"수집-도감-분류안","need":"도감에서 한 분류(예: 낚시)를 열어 등록된 칸과 빈 칸이 섞여 보이는 화면"}}]},{"h":"채우기 쉬운 순서","blocks":[{"cards":[{"h":"농작물 · 광물","p":"밭일과 채광만 해도 금방 찹니다. 루비 · 설파이트 · 히룸은 [코자 대륙](#koza)에서 캐거나 유저상점에서 삽니다.","color":"var(--reg-forest)","chips":["농부","탐험가"]},{"h":"음식 · 포션","p":"요리솥 · 가공대 · 연금술 솥에서 한 번씩 만들어 보면 됩니다. 바다 물약은 바다 채집 재료가 필요합니다.","color":"var(--reg-desert)","chips":["요리사","연금술사"]},{"h":"낚시","p":"어종 24종에 더해 찌 · 줄 · 릴 · 미끼까지 있어 시간이 걸립니다. 전설 어종은 밤 · 천둥 같은 조건이 붙습니다.","color":"var(--reg-ice)","chips":["어부"]},{"h":"램프 · 스킬 · 드래곤펫","p":"랜덤 상자와 거래가 필요한 장기 목표입니다. 유저상점에서 하나씩 사 모으는 사람이 많습니다.","color":"var(--r-legend)","chips":["현자","대마법사","드래곤"]},{"h":"왕관","p":"사냥터에서 드물게 나오는 금 · 은왕관 몬스터를 잡아야 해서 운이 필요합니다. 다 채우면 칭호 「왕관 사냥꾼」을 받고, 완료도에 따라 트로피 판매가가 오릅니다.","color":"var(--gold)","chips":["금왕관","은왕관","왕관 사냥꾼"]},{"h":"곤충 · 탈것","p":"곤 ns":[{"h":"준비 중","blocks":[{"p":"첫 레이드로 바다의 거대 보스 「만조의 무덤, 케토그라」를 준비하고 있습니다. 지역 보스가 혼자 도전하는 콘텐츠라면, 레이드는 여러 사람이 역할을 나눠 함께 싸우는 첫 파티 보스전이 될 예정입니다. 열리는 시기와 입장 조건은 공지로 알려 드립니다. 그 전까지는 [지역 보스](#combat-region-boss)와 [야생 구조물](#combat-structures)로 장비를 키워 두세요."}]}],"search":[["케토그라","레이드"],["레이드","준비 중"]]},"combat-region-boss":{"id":"combat-region-boss","parent":"combat","title":"지역 보스","short":"마을 파수에게 도전 카드를 받아 혼자 싸우는 지역 보스 6종","color":"var(--r-legend)","tags":[["보스 6종","lv"],["1인 도전",null],["목숨 2 · 7분 30초",null],["재도전 5분",null],["처치 시간 랭킹",null],["근원 매주 15~50",null]],"lede":"이프란의 여섯 지역에는 각각 지역 보스가 있습니다. 마을마다 서 있는 관문 파수 NPC에게 말을 걸어 도전 카드를 열고, 혼자 보스 던전에 들어가 싸웁니다. 보스는 공격 전에 빨간 예고 장판을 깔기 때문에 \"피하면 산다\"는 것이 기본입니다. 쓰러뜨리면 그 지역 보석을 한 번에 여러 개 얻고, 낮은 확률로 보스 전용 스킬이 나오며, 매주 첫 처치에는 [근원](#growth-origin)도 받습니다. 처치 시간은 랭킹에 남습니다.","info":{"title":"지역 보스","slot":{"id":"전투-보스-카드","need":"관문 파수 NPC에게 말을 건 뒤 열리는 보스 도전 카드 화면 (정보 · 도전하기 · 랭킹 버튼이 보이게)"},"rows":[["입장","각 마을 관문 파수 NPC → 도전 카드"],["인원","1명"],["목숨 · 시간","목숨 2 · 제한 7분 30초 (크라이오스 10분)"],["조건","카드에 표시된 사냥 레벨 이상 (Lv.1 · 100 · 230 · 400 · 590 · 780)"],["다시 도전","6종 모두 5분 뒤"],["보상","지역 보석 8~14개 · 보스 스킬(낮은 확률)"],["근원","매주 첫 처치 15~50 · 다시 잡으면 30% 확률 3~12"],["랭킹","`/보스랭킹 보스1`~`보스6` · 카드 랭킹 버튼"]]},"sections":[{"h":"보스와 관문 파수","blocks":[{"table":{"cols":["지역","보스","관문 파수","카드 사냥 Lv","권장 강화","체력","근접 피해","방어","제한 시간"],"num":[3,5,6,7],"rows":[["[아르덴](#arden) 숲","고대림의 군주","테오른 (숲문 파수)","1 (제한 없음)","+0~3","2,530","30.7","10","7분 30초"],["[듄가르드](#dunegard) 사막","모래왕의 무덤군주, 아지락","자히르 (유적문 파수)","100","+3~6","5,780","56.4","10","7분 30초"],["[이그니스포](#ignispo) 화산","화산의 심장, 볼카니온","카르반 (분화구 파수)","230","+8~11","20,130","261.9","11","7분 30초"],["[베르단트룸](#verdantrum) 정글","제단을 걷는 자, 쿠아라","엘루아 (제단 파수)","400","+15~18","61,190","134.3","12","7분 30초"],["[미스틱글렌](#mysticglen) 버섯숲","균왕의 심장, 마이코라","소린 (균사문 파수)","590","+21~24","200,000","227","13","7분 30초"],["[프로스트하버](#frostharbor) 빙하","천 년을 선 자, 크라이오스","하벤 (빙문 파수)","780","+27~30","500,000","304","14","10분"]]}},{"note":{"b":"사냥 레벨과 권장 강화","t":"도전 카드의 「권장 사냥 레벨」보다 내 사냥 레벨이 낮으면 도전하기 버튼에 붉은 자물쇠가 뜨고 들어갈 수 없습니다. 권장 강화는 관문 파수와의 대화에 나오는 기준입니다. 보스 던전 안에서는 사냥 레벨에 따른 피해 제한이 없고, 사냥 레벨의 몬스터 피해 증가는 그대로 붙습니다."}},{"note":{"b":"제한 시간 · 재도전","t":"제한 시간은 7분 30초(크라이오스 10분)이고, 모든 보스에 재도전 대기 5분이 있습니다. 근접 피해 칸은 기본 공격 한 대의 피해이고, 큰 기술은 이보다 셉니다."}}]},{"h":"도전하는 법","blocks":[{"steps":[{"h":"마을의 관문 파수에게 말 걸기","p":"보스를 지키는 파수 NPC는 각 마을에 한 명씩 있습니다. 대화에서 보스의 특징과 준비물을 들려준 뒤 「관문을 살핀다」를 고르면 도전 카드가 열립니다."},{"h":"카드의 정보 버튼 보기","p":"정보 버튼에 마우스를 올리면 체력, 평균 피해, 방어, 권장 사냥 레벨, 제한 시간, 목숨, 쿨타임, 속성 내성, 공략 한 줄이 뜹니다."},{"h":"도전하기 누르기","p":"조건이 맞으면 곧바로 보스 던전으로 이동합니다. 사냥 레벨이 모자라면 붉은 자물쇠, 재도전 대기 중이면 시계가 버튼 가운데에 뜹니다. 재도전 대기는 여섯 보스 모두 5분입니다."},{"h":"보스 처치 또는 실패","p":"목숨 2개로 제한 시간(7분 30초, 크라이오스는 10분) 안에 보스를 쓰러뜨리면 클리어입니다. 끝나면 들어가기 전에 있던 서버의 그 자리로 돌아옵니다."}]},{"note":{"b":"메인 퀘스트","t":"[메인 퀘스트](#quest-main)의 보스 단계도 이 도전 카드로 진행합니다. 퀘스트가 보스 처치를 요구하면 그 지역 파수에게 가면 됩니다."}}]},{"h":"보스 패턴","blocks":[{"p":"모든 보스는 공격 전에 바닥에 빨간 예고 장판(원 · 도넛 · 사각 · 부채꼴 · 직선 · 십자)을 깔고, 머리 위에 기술 이름과 시전 바를 띄웁니다. 장판 안쪽이 다 차오르기 전에 빠져나가면 맞지 않습니다. 도넛 모양은 **안쪽으로 붙어야** 살고, 파란 원이 깔리면 **그 안만 안전**합니다."},{"cards":[{"h":"고대림의 군주","color":"var(--reg-forest)","chips":["숲","입문 보스"],"p":"등장하며 포효로 주변을 묶고, 두 팔을 내리찍는 「강타」로 넓게 날려 버립니다. 「뿌리 솟구침」은 둔화를, 「포효」는 나약함을 겁니다. 체력이 낮아지면 격노해 공격력과 속도가 오릅니다. 공략: 팔을 내리찍으면 땅이 뒤집힙니다. 회복약과 빈 칸을 챙기세요."},{"h":"아지락","color":"var(--reg-desert)","chips":["사막","50% 2페이즈"],"p":"평타 「왕의 심판」은 대검으로 앞쪽 부채꼴을 쓸어 날립니다. 「태양 낙인」은 대상 발밑에 태양 문양을 그린 뒤 빛기둥을 떨어뜨리고, 「사암 구속」은 기둥 넷으로 가둬 발을 묶습니다. 「황금 사막」 모래폭풍은 시야를 가리고, 가슴 코어를 여는 「태양 포식」은 큰 열파입니다. 체력 절반에서 갑주와 왕관이 깨지며 빨라집니다. 공략: 발밑에 태양 문양이 보이면 바로 자리를 옮기세요."},{"h":"볼카니온","color":"var(--reg-volcano)","chips":["화산","넉백 주의"],"p":"핵이 맥박치다 터지는 「충격파」와 팔을 내리치는 「강타」가 사람을 크게 밀어냅니다. 「분화」는 분화구 셋을 차례로 열어 화염구를 쏟습니다. 체력 절반 아래에서 껍질이 떨어져 나가며 더 세지고 빨라집니다. 공략: 절벽 쪽으로 밀리지 않게 서고, 화염 저항을 챙기세요."},{"h":"쿠아라","color":"var(--reg-jungle)","chips":["정글","구속 주의"],"p":"제단 몸체로 들이받는 「제단 충각」, 룬 문양이 뜬 뒤 석주가 솟는 「의식의 기둥」, 사슬로 묶고 그 자리를 터뜨리는 「제물의 사슬」, 사원째 돌진하는 「신전 행진」이 있습니다. 완전히 멈춰 룬을 모두 켜면 「고대의 제례」로 바닥 전체가 터지고 장판이 남습니다. 체력 55%에서 외피가 깨지는 2페이즈, 20% 아래에서 격노합니다. 공략: 사슬에 묶이면 다음 한 대를 그대로 맞습니다. 사슬 예고부터 피하세요."},{"h":"마이코라","color":"var(--reg-mushroom)","chips":["버섯숲","장기전 불리"],"p":"촉수로 앞을 휩쓰는 「균사 휩쓸기」, 둔화·실명·독을 거는 「포자 범람」, 뿌리 네 가닥으로 묶는 「균사 포획」을 씁니다. 완전히 멈춘 뒤 바깥으로 퍼지는 「균왕의 공명」은 가까이 있을수록 여러 번 맞습니다. 체력 절반에서 왕관이 열리는 「균왕 개화」로 2페이즈, 낮은 체력에서 격노합니다. 공략: 독이 겹겹이 쌓이니 오래 끌수록 불리합니다. 불이 잘 먹힙니다."},{"h":"크라이오스","color":"var(--reg-ice)","chips":["빙하","움직이는 보스"],"p":"지팡이를 짚으며 걸어 다니는 보스입니다. 「못 박기」(발밑 예고 원 → 얼음 못 낙하, 묶임), 「원 긋기」(자기 주위 고리 안이 얼어붙음), 「붙드는 손」(발밑 얼음 손이 움켜쥠 — 때리면 깨짐), 「사슬 끌기」, 냉기 부채꼴 「천 년의 숨」, 얼음 능선을 남기는 「빙판 돌진」을 씁니다. 체력이 줄면 바닥에 초록 장판이 번지는데, 크라이오스의 얼음 기술이 덮은 자리는 지워집니다. 40%에서 겉껍질이 터지며 모습이 바뀌고 빨라집니다. 이때부터 가장 가까운 사람을 한가운데로 끌어당기며 큰 기술을 6초 동안 모으는데, 그사이 피해를 충분히 넣으면 끊깁니다. 15% 아래에서는 거의 공격하지 않고 버티지만, 장판이 아레나를 덮어 가므로 시간 안에 끝내야 합니다."}]}]},{"h":"보상","blocks":[{"p":"보스를 쓰러뜨리면 그 지역의 보석(지역 전리품)을 **8~14개** 얻고, 낮은 확률로 보스 전용 스킬이 나옵니다. 지역 보석은 그 지역 사냥터 몬스터도 떨어뜨리지만 보스는 한 번에 많이 줍니다. 아르덴 숲에는 지역 보석이 없습니다. 사냥 경험치도 크게 들어옵니다."},{"table":{"cols":["보스","지역 보석","보스 스킬","스킬 확률","스킬 등급","스킬 데미지","쿨타임","사냥 경험치"],"num":[3,5,6,7],"rows":[["고대림의 군주","—","숲의 울림 — 포효로 주변을 밀어내며 때림","5%","3단계(레어)","55","13초","1,200"],["아지락","사막의 호박석 8~14","모래 폭풍 — 회오리 셋을 날려 띄움","5%","3단계(레어)","62","15초","2,000"],["볼카니온","타오르는 홍옥 8~14","용암 발자국 — 5초간 지나간 자리에 용암","3%","4단계(에픽)","160","16초","3,600"],["쿠아라","정령의 에메랄드 8~14","의식의 기둥 — 적 발밑에서 석주가 네 번 솟음","3%","4단계(에픽)","172","17초","5,000"],["마이코라","신비의 자수정 8~14","포자 범람 — 독구름이 3초간 갉음","2%","5단계(레전더리)","225","20초","9,000"],["크라이오스","서리 사파이어 8~14","다섯 개의 못 — 하늘에서 얼음 못이 다섯 번","2%","5단계(레전더리)","240","22초","20,000"]]}},{"list":["지역 보석은 [강화](#growth-enhance) 재료(무기 · 갑옷 10강부터 · 도구 7강부터)로 쓰입니다.","보스 스킬은 같은 등급 스킬 중에서도 센 편입니다. 볼카니온 · 쿠아라 스킬은 랜덤 스킬북 4단계, 마이코라 · 크라이오스 스킬은 5단계 상자에서도 나옵니다. [스킬북](#growth-skillbook)을 들고 Q를 눌러 장착합니다."]}]},{"h":"근원 보상","blocks":[{"p":"보스를 쓰러뜨리면 [근원](#growth-origin)을 받습니다. 보스마다 **매주 첫 처치**에 정해진 근원이 들어오고, 그 뒤로 다시 잡을 때마다 **30% 확률**로 조금 더 받습니다. 매주 첫 처치 보상은 매주 월요일 오전 6시에 다시 열립니다."},{"table":{"cols":["보스","매주 첫 처치","다시 처치 (30%)"],"num":[1,2],"rows":[["고대림의 군주","15","3"],["아지락","20","4"],["볼카니온","25","6"],["쿠아라","30","8"],["마이코라","40","10"],["크라이오스","50","12"]]}},{"p":"여섯 보스를 매주 한 번씩 잡으면 근원 180개를 받습니다. 근원은 강화 21강 이상 · 인첸트 해방 · 상급 램프 · 룬 합성에 씁니다."}]},{"h":"보스 랭킹","blocks":[{"p":"보스가 나타난 순간부터 쓰러질 때까지의 **순수 전투 시간**이 기록됩니다. 사람마다 가장 좋은 기록 하나만 남기 때문에 한 사람이 1~3위를 다 차지하지 않습니다. 1위 기록이 깨지면 서버 전체에 알림이 뜹니다."},{"table":{"cols":["보는 곳","내용"],"rows":[["도전 카드의 랭킹 버튼","1~3위 · 내 기록과 순위(예: 7위 / 43명) · 도전·클리어 횟수 · 최초 토벌자. 누르면 채팅에도 남습니다."],["`/보스랭킹 보스1` ~ `/보스랭킹 보스6`","채팅으로 1~3위와 내 순위. 보스1 고대림의 군주 · 보스2 아지락 · 보스3 볼카니온 · 보스4 쿠아라 · 보스5 마이코라 · 보스6 크라이오스"]]}},{"note":{"b":"기록이 남는 조건","t":"목숨을 써서 다시 일어나도 시계는 계속 갑니다. 시간이 다 되거나 목숨을 모두 잃어 실패하면 기록이 남지 않습니다."}}]},{"h":"관련 문서","blocks":[{"links":[["#growth-region-gate","사냥 구역 제한","몬스터 레벨과 레벨 미달 페널티"],["#growth-enhance","강화","지역 보석이 들어가는 강화 재료"],["#growth-skillbook","스킬북","보스 스킬을 장착하는 법"],["#collect-ranking","순위판 · 랭킹","서버의 다른 랭킹들"]]}]}],"search":[["고대림의 군주","지역 보스"],["아지락","지역 보스"],["볼카니온","지역 보스"],["쿠아라","지역 보스"],["마이코라","지역 보스"],["크라이오스","지역 보스"],["테오른","관문 파수"],["자히르","관문 파수"],["카르반","관문 파수"],["엘루아","관문 파수"],["소린","관문 파수"],["하벤","관문 파수"],["보스랭킹","명령어"],["지역 보석","보스 보상"],["숲의 울림","보스 스킬"],["다섯 개의 못","보스 스킬"],["보스 근원","지역 보스"]]},"combat-siege":{"id":"combat-siege","parent":"combat","title":"재련 · 마을 공성전","short":"내 마을에 재련대를 놓고 잿불 무리를 막아 「해방의 쐐기」를 만드는 공성전","color":"var(--reg-volcano)","tags":[["재련대 500,000원","lv"],["마을당 재련대 1대",null],["로트 1~5",null],["로트당 쐐기 4개",null],["근원 매주 30",null]],"lede":"마을 서버의 내 마을 땅에 재련대를 놓고 불을 붙이면, 재련이 끝날 때까지 「잿불 무리」가 재련대의 불을 끄러 몰려옵니다. 마을 사람들과 함께 정해진 시간 동안 재련대를 지켜 내면 **해방의 쐐기**가 완성됩니다. 쐐기는 [인첸트 해방](#growth-enchant)과 [강화](#growth-enhance) 21강 이상 시도에 드는 재료입니다. 재련대는 [아르덴](#arden) 대장장이 루이흐 상점에서 **500,000원**에 삽니다.","info":{"title":"재련대","slot":{"id":"전투-재련-대표","need":"마을에 설치된 재련대 주위로 잿불 무리가 몰려오고 머리 위에 「재련 중」 글자가 뜬 장면"},"rows":[["얻는 곳","대장장이 루이흐 상점 500,000원"],["어디서","마을 서버의 내 마을 땅"],["개수","마을당 1대"],["재련 시간","12분 (1단계) ~ 8분 (5단계)"],["1로트 비용","300,000원 + 재료"],["결과물","해방의 쐐기 (로트당 4개)"],["받는 사람","마을원 누구나"],["근원","성공하면 매주 한 번 30개"]]},"sections":[{"h":"재련대 놓기","blocks":[{"list":["재련대는 [마을 서버](#conv-town)에서 **내가 속한 마을 땅 안**에만 놓을 수 있고, 마을마다 1대입니다.","재련대 아이템을 들고 우클릭하면 그 자리에 세워집니다. 바닥이 4×4 평지이고 머리 위 5칸이 비어 있어야 하며, 다른 마을과 24블록 이상 떨어져 있어야 합니다.","재련대는 좌클릭으로 부서지지 않습니다. 재련 중이 아닐 때 GUI의 회수 탭에서 다시 아이템으로 돌려받을 수 있습니다.","재련대 아이템은 대장장이 루이흐 상점에서 500,000원에 삽니다."]},{"p":"재련대를 우클릭하면 **재련 · 승급 · 회수** 탭과 **외형** 창이 있는 GUI가 열립니다. 머리 위 글자로 상태(대기 · 재련 중 남은 시간 · 완성 · 식는 중 · 파손)가 보입니다."}]},{"h":"재련 레시피 — 해방의 쐐기","blocks":[{"lore":{"name":"해방의 쐐기","color":"#FF9A2E","lines":["잿불 무리가 끝내 끄지 못한 불로 벼린 쐐기.","인첸트의 한계를 쪼개고, 강화의 끝을 연다.","","사용 방법: 인첸트 해방 · 강화 21강 이상 시도 재료","획득 방법: 마을 재련대에서 재련"]}},{"table":{"cols":["1로트에 드는 것","개수"],"num":[1],"rows":[["돈","300,000원"],["다이아몬드","32"],["네더라이트 주괴","2"],["정령의 에메랄드 (베르단트룸 지역 보석)","10"],["신비의 자수정 (미스틱글렌 지역 보석)","4"],["설파이트","6"],["히룸","3"]]}},{"p":"로트 수만큼 재료와 돈이 곱해지고, 쐐기는 **로트당 4개** 나옵니다 (5로트면 20개). 한 번에 넣을 수 있는 로트는 재련대 단계까지입니다."},{"list":["쐐기는 [인첸트 해방](#growth-enchant)과 [강화](#growth-enhance) 21강 이상 시도에 씁니다. 강화는 21~23강 1개 · 24~26강 2개 · 27~28강 3개 · 29~30강 4개가 시도마다 듭니다.","공성에 성공하면 [근원](#growth-origin) 30개를 받습니다 (매주 한 번). 불을 붙인 사람과, 완성될 때 재련대 곁에 있던 사람 모두 받습니다."]}]},{"h":"공성전 흐름","blocks":[{"steps":[{"h":"레시피와 로트 고르고 점화","p":"재련 탭에서 레시피와 로트(1~5)를 고르고 점화하면 재료와 돈이 인벤토리에서 바로 빠집니다."},{"h":"약 20초 예고","p":"점화 후 약 20초 동안 준비 시간이 있습니다. 재련대 둘레 14~21칸 땅에 균열 예고가 뜬 자리에서 잿불 무리가 솟아납니다."},{"h":"웨이브 방어","p":"웨이브마다 정해진 마릿수가 계속 나오고, 다 나오면 20초 쉰 뒤 다음 웨이브가 옵니다. 몬스터는 가까운 쪽(플레이어 또는 재련대)을 노립니다."},{"h":"중반 수리 시간 60초","p":"웨이브의 절반쯤 지나면 한 번, 60초 동안 수리 시간이 열립니다. 이때 재련대 GUI에서 한 번만 내구도를 30% 회복할 수 있습니다. 그 밖의 시간에는 고칠 수 없습니다."},{"h":"마지막 웨이브","p":"마지막 웨이브는 다른 웨이브보다 2.5배 길고, 완성 10초 전까지 몬스터가 나옵니다. 로트 3 이상이면 마지막 웨이브에 보스 「공성대장」이 나타납니다."},{"h":"완성 → 받기","p":"재련 시간이 끝날 때까지 재련대가 버티면 완성입니다. 마을원 누구나 재련대를 우클릭해 쐐기를 받을 수 있습니다. 이번 주 첫 성공이면 근원 30개도 들어옵니다. 완성 뒤에는 식는 시간이 지나야 다시 재련합니다."}]} 보스 전용 스킬이 나옵니다. → [지역 보스](#combat-region-boss)"},{"h":"사냥하면서 왕관 몬스터와 현상수배 노리기","p":"사냥터 몬스터 중 일부는 금왕관 · 은왕관을 쓰고 나오고, 50~80분마다 현상수배 네임드가 나타납니다. 트로피와 머리는 아르덴 순찰대장 가레스가 사 줍니다. → [왕관 몬스터](#combat-crown) · [현상수배](#combat-bounty)"}]}]},{"h":"한눈에 보기","blocks":[{"table":{"cols":["콘텐츠","어디서","인원","주요 보상"],"rows":[["[지역 보스](#combat-region-boss)","각 마을 파수 NPC → 보스 던전","1명 (재도전 5분)","지역 보석 · 보스 스킬 · 근원(매주 첫 처치) · 처치 시간 랭킹"],["[야생 구조물](#combat-structures)","야생 · 네더 · 코자 대륙에 자연 생성","제한 없음","상자 감정 보상 2~5배 · 근원 3"],["[왕관 몬스터](#combat-crown)","이프란 사냥터 전역","제한 없음","왕관 트로피 (가레스 매입)"],["[현상수배](#combat-bounty)","이프란 사냥터 (50~80분마다)","서버 공용","현상금 · 마일리지 · 머리 트로피 · 근원 5"],["[재련 · 공성전](#combat-siege)","마을 서버의 내 마을","마을원","해방의 쐐기 · 근원(매주 30)"],["[레이드](#combat-raid)","—","—","준비 중"]]}}]},{"h":"싸우기 전에 알아둘 것","blocks":[{"list":["어느 서버에서 죽어도 **로비에서 다시 일어납니다.** 인벤토리는 그대로 남습니다. 던전 안에서는 대신 던전의 목숨 규칙을 따릅니다.","몬스터가 떨어뜨린 전리품은 바닥이 아니라 **잡은 사람 인벤토리로 바로** 들어옵니다. 인벤토리가 꽉 차 있으면 `/우편함`으로 갑니다.","사냥 레벨이 그 몬스터 레벨 − 10보다 낮으면 내가 주는 피해가 줄고 경험치와 전리품이 나오지 않습니다. → [사냥 구역 제한](#growth-region-gate)","보스와 던전 몬스터는 공격 전에 **빨간 예고 장판**을 깝니다. 장판이 차오르는 동안 밖으로 나가면 맞지 않습니다. 파란 원이 보이면 그 안이 안전합니다.","장비는 아르덴 대장장이 루이흐의 [강화](#growth-enhance)와 마법사 후를루카의 [인첸트](#growth-enchant)로 키웁니다. 스킬은 [스킬북](#growth-skillbook)에 장착해 씁니다.","내구도가 다 닳은 장비는 부서지지 않고 1에서 멈추지만, 고치기 전까지는 쓸 수 없습니다. 싸우기 전에 내구도를 확인하세요.","내 장비와 레벨이 어느 정도인지는 [전투력](#growth-power)(`/전투력`)으로 숫자 하나로 볼 수 있습니다.","**자연회복과 배고픔**: 배고픔이 거의 차 있으면(9칸 이상) 체력이 저절로 찹니다. 회복에 쓰이는 배고픔은 **최대 체력에 비례해 줄어**, 최대 체력이 얼마든 빈 체력을 가득 채우는 데 배고픔 바 1.5개(포만감 포함)면 됩니다. 달리기 · 점프 · 공격으로 줄어드는 배고픔은 그대로입니다. 회복 속도는 그대로라 최대 체력이 높을수록 가득 차는 데 오래 걸리니, 싸우는 중에는 포션 · 흡혈을 쓰세요."]},{"slot":{"id":"전투-대문-예고장판","need":"보스가 빨간 원형 예고 장판을 깔고, 플레이어가 장판 밖으로 피하는 순간"}}]},{"h":"전투로 얻는 근원","blocks":[{"p":"[근원](#growth-origin)은 강화 21강 이상 · 인첸트 해방 · 상급 램프 · 룬 합성에 드는 재화입니다. 전투에서는 아래처럼 얻습니다. 「매주」 보상은 매주 월요일 오전 6시에 다시 열립니다."},{"table":{"cols":["어디서","근원","조건"],"rows":[["[지역 보스](#combat-region-boss~4) 매주 첫 처치","15 · 20 · 25 · 30 · 40 · 50","고대림의 ","어느 서버든","로비","없음"],["랜덤 이동 (야생)","아르덴 포탈","야생의 안전한 아무 곳","없음"],["랜덤 이동 (마을 서버)","메인 메뉴 「마을」 카드","마을 서버의 무작위 위치","없음"],["`/마을 이동`","어느 서버든","내 마을 스폰","마을에 가입되어 있어야 함"],["`/홈`","어느 서버든","저장한 홈","홈 저장은 야생 · 코자 대륙 · 마을 서버에서만"],["`/tpa`","같은 서버","상대 플레이어 옆","상대가 60초 안에 수락"],["코자 대륙 포탈","내 마을에 세운 포탈","코자 대륙의 무작위 위치","네더라이트 장비 9종을 갖추고 이장 실바에게 코자 포탈석을 받아 마을에 세워야 함"]]}}]},{"h":"비석 · 이프란 마을 사이","blocks":[{"steps":[{"h":"비석 우클릭","p":"마을마다 서 있는 비석을 4칸 안에서 우클릭하면 마을 목록이 열립니다. 한 쪽에 두 마을씩, 3쪽입니다."},{"h":"가고 싶은 마을 클릭","p":"마을 그림을 누르면 2초 동안 발동 연출이 나옵니다. 그사이 1.5칸 넘게 움직이거나 맞으면 취소됩니다."},{"h":"도착","p":"화면이 어두워졌다가 밝아지며 마을 이름이 뜹니다. 다시 쓰려면 3초 기다립니다."}]},{"p":"아르덴만 처음부터 열려 있습니다. 다른 마을은 걸어가서 그 마을 비석을 한 번 우클릭해야 목록에 열립니다. 한 번 연 마을은 모든 서버에서 계속 열려 있습니다."},{"table":{"cols":["마을","구간","권장 사냥 Lv","권장 장비"],"rows":[["[아르덴](#arden)","1 · 숲","1 ~ 120","다이아 장비 (강화 없음)"],["[듄가르드](#dunegard)","2 · 사막","100 ~ 250 (Lv.90 부터)","강화 +0~+3"],["[이그니스포](#ignispo)","3 · 화산","230 ~ 420 (Lv.220 부터)","강화 +5~+8"],["[베르단트룸](#verdantrum)","4 · 정글 · 고대 사원","400 ~ 620 (Lv.390 부터)","강화 +9~+17 · 스킬북 4~5단계"],["[미스틱글렌](#mysticglen)","5 · 버섯숲","590 ~ 820 (Lv.580 부터)","강화 +18~+23 · 스킬북 5단계"],["[프로스트하버](#frostharbor)","6 · 얼음","780 ~ 1000 (Lv.770 부터)","강화 +24~+30 · 스킬북 5단계"]]}},{"slot":{"id":"편의-이동-비석발동","need":"비석에서 마을을 고른 뒤 발동하는 순간"}}]},{"h":"사냥터 이동","blocks":[{"p":"`/사냥터` 를 입력하거나 비석 창 아래 칸, 메인 메뉴 「사냥터」 카드를 누르면 사냥터 이동 화면이 열립니다. 여섯 구간이 한 줄씩 나오고, 줄마다 열림 · 잠김 표찰과 그 구간 사냥터 카드가 있습니다(지금 있는 사냥터는 「지금 여기」). 여섯 구간에 사냥터가 13곳 있고, 열린 카드를 누르면 이동합니다."},{"list":["그 구간의 권장 사냥 레벨보다 10 낮은 레벨부터 열립니다 (예: 사막은 Lv.90 부터).","사냥터는 모두 이프란(로비)에 있어서, 다른 서버에서 고르면 로비로 옮겨 준 뒤 이동합니다. 던전 서버에서는 쓸 수 없습니다.","몬스터를 때리거나 맞은 뒤 10초 동안은 갈 수 없습니다.","비석과 같은 연출(2초 가만히 → 암전 → 도착)로 사냥터 한가운데에서 조금 떨어진 안전한 땅에 내립니다."]},{"links":[["#growth-region-gate","사냥 구역 제한","레벨이 모자라면 피해 · 경험치가 줄어드는 기준"]]}]},{"h":"로비 · 랜덤 이동","blocks":[{"list":["`/로비` 를 치면 어느 서버에 있든 로비로 돌아옵니다. 메인 메뉴 「로비」 카드도 같습니다.","야생으로 나가려면 아르덴 마을의 포탈을 우클릭합니다. 야생 맵 3곳(오버월드 1~3) 중 하나를 고르면 그 맵 중심에서 5,000칸 안의 안전한 곳으로 떨어집니다. 용암 · 물 · 허공 · 선인장 · 불 · 마그마 블록 위는 피합니다.","마을 서버로 가려면 메인 메뉴 「마을」 카드 → 「랜덤 이동」을 누릅니다. 마을 서버 중심에서 2,000칸 안의 무작위 위치(안전한 땅)로 갑니다. 이미 있는 마을 땅을 피하지는 않습니다.","야생은 주기적으로 초기화됩니다. 오래 쓸 건물과 상자는 마을 서버의 내 마을에 두세요."]},{"links":[["#world-wild","야생","야생에서 할 수 있는 것"],["#conv-town","유저 마을","마을 서버에 내 땅 만들기"]]}]},{"h":"홈 · 셋홈","blocks":[{"table":{"cols":["명령어","하는 일"],"rows":[["`/셋홈 <이름>`","지금 서 있는 곳을 홈으로 저장"],["`/홈 [이름]`","저장한 홈으로 이동. 다른 서버의 홈이면 그 서버로 옮겨 준 뒤 이동"],["`/홈목록`","저장한 홈 목록"],["`/홈삭제 <이름>`","홈 지우기"]]}},{"list":["홈은 야생 · 코자 대륙 · 마을 서버에서만 저장할 수 있습니다. 로비(이프란)와 던전 서버에서는 저장되지 않습니다.","이동은 어느 서버에서든 됩니다.","홈 이름은 한글 · 영문 · 숫자 · 밑줄(_)로 16자까지입니다."]},{"table":{"cols":["진급 등급","저장할 수 있는 홈"],"num":[1],"rows":[["나그네 (처음)","1"],["개척민","2"],["정착민","3"],["장인","4"],["촌장","5"],["영주","6"]]}},{"p":"등급을 올리는 법은 [진급](#growth-rank) 문서에 있습니다."}]},{"h":"TPA · 친구 옆으로","blocks":[{"table":{"cols":["명령어","하는 일"],"rows":[["`/tpa <플레이어>`","그 사람에게 순간이동을 신청"],["`/tpa수락 [플레이어]`","받은 신청을 수락. 신청한 사람이 내 옆으로 옵니다"],["`/tpa거절 [플레이어]`","받은 신청을 거절"],["`/tpa취소`","내가 보낸 신청 취소"]]}},{"p":"신청은 60초 동안 유효하고, 같은 서버에 있는 사람에게만 보낼 수 있습니다. 상대가 다른 서버에 있으면 먼저 같은 서버로 옮기세요."}]},{"h":"코자 대륙 가는 법","blocks":[{"steps":[{"h":"네더라이트 장비 9종 모으기","p":"네더라이트 투구 · 흉갑 · 레깅스 · 부츠와 네더라이트 검 · 곡괭이 · 괭이 · 도끼 · 삽을 모두 가지고 있어야 합니다. 입고 있거나 가방에 있으면 됩니다."},{"h":"이장 실바에게 포탈석 받기","p":"아르덴의 이장 실바에게 말을 걸어 「코자 대륙에 가고 싶어요」 → 「다 갖췄습니다」를 고르면 **코자 포탈석**을 줍니다. 모자라면 빠진 장비를 화면에 알려 줍니다. 포탈석은 받은 사람만 쓸 수 있습니다."},{"h":"내 마을에 포탈 세우기","p":"마을 서버의 **내 마을 땅** 바닥에 포탈석을 들고 우클릭하면 3칸 높이의 코자 대륙 포탈이 세워집니다. 가로 3칸 · 높이 3칸이 비어 있어야 하고, 포탈은 **마을마다 하나**만 세울 수 있습니다."},{"h":"포탈 우클릭","p":"포탈을 우클릭하면 잠시 뒤 코자 대륙의 무작위 장소로 이동합니다. 우리 마을 사람(또는 마을 권한을 받은 사람)이면 누구나 쓸 수 있습니다. 코자 대륙에서 `/셋홈` 해 두면 다음부터는 `/홈` 으로 바로 갈 수 있습니다."}]},{"links":[["#koza","코자 대륙","루비 · 설파이트 · 히룸과 화석 · 곤충 · 운석"]]}]},{"h":"길안내","blocks":[{"list":["메인 메뉴 「NPC 안내」 카드나 `/npc안내` 로 **NPC 안내** 화면을 엽니다. 왼쪽 아르덴 지도에 NPC 자리가 번호로 표시되고, 오른쪽 목록에서 NPC 를 누르면(지도 번호를 눌러도 됨) 그 NPC 까지 길안내가 켜집니다. 화면의 「길안내 멈추기」 단추로 하던 길안내를 끌 수 있습니다.","퀘스트를 받으면 목적지(NPC · 채집터 · 사냥터 등)까지 길안내가 자동으로 켜집니다.","캐릭터 앞에 방향 화살표가 뜨고, 바닥에 길이 그려지고, 화면 아래에 남은 거리가 나옵니다.","목적지 근처에 가면 「도착」 안내와 함께 끝납니다.","목적지가 다른 서버에 있으면 그 서버로 가라는 안내가 나오고, 그 서버에 들어가면 이어서 안내합니다. 접속을 끊었다 들어와도 하던 길안내가 이어집니다."]},{"slot":{"id":"새-npc안내","need":"NPC 안내 지도 + 목록"}},{"slot":{"id":"편의-이동-길안내","need":"길안내가 켜져 바닥에 길이 그려지고 화살표 · 남은 거리가 보이는 화면"}}]},{"h":"죽으면 로비로","blocks":[{"list":["어느 서버에서 죽든 로비에서 다시 시작합니다. 침대나 리스폰 정박기를 써 두었어도 로비로 갑니다.","던전 서버(보스 던전 등)는 예외입니다. 던전의 목숨 규칙을 따릅니다.","죽어도 아이템과 경험치를 떨어뜨리지 않습니다. 다시 가려면 `/홈` 이나 비석을 쓰세요."]},{"note":{"b":"워프","t":"플레이어가 직접 쓰는 워프 명령은 없습니다. 이동은 위의 비석 · 사냥터 이동 · 로비 · 랜덤 이동 · 홈 · 마을 이동 · TPA 로 합니다."}}]}],"search":[["비석","이동"],["랜덤이동","이동"],["/로비","명령어"],["/셋홈","명령어"],["/홈","명령어"],["/tpa","명령어"],["길안내","이동"],["코자 대륙 포탈","이동"],["사망","로비로"],["사냥터 이동","이동"],["/사냥터","명령어"],["NPC 안내","길안내"],["길안내 멈추기","길안내"]]},"conv-party":{"id":"conv-party","parent":"convenience","title":"파티","short":"최대 4명. 파티원이 얻은 직업 경험치를 나눠 받습니다 (사냥 0.5배 · 그 밖 0.2배).","color":"var(--accent)","tags":[["/파티",null],["최대 4명","lv"],["경험치 공유",null]],"lede":"파티를 맺으면 파티원이 얻은 직업 경험치의 일부를 같은 서버의 다른 파티원도 함께 받습니다. 사냥은 0.5배, 광질 · 농사 · 낚시 · 요리 · 연금술은 0.2배입니다. 파티는 다섯 서버 어디서나 유지되므로 한 명이 다른 서버로 옮겨도 풀리지 않습니다.","info":{"title":"파티","slot":{"id":"편의-파티-대표","need":"`/파티 정보` 로 파티원 목록이 나온 채팅 화면"},"rows":[["명령어","`/파티`"],["최대 인원","4명"],["경험치 공유","사냥 0.5배 · 광질 · 농사 · 낚시 · 요리 · 연금술 0.2배 (같은 서버 파티원)"],["서버를 옮기면","그대로 유지"],["접속이 끊기면","8초 안에 다시 들어오면 유지"]]},"sections":[{"h":"명령어","blocks":[{"p":"모두 `/파티` 뒤에 아래 말을 붙여 입력합니다. 예를 들어 친구를 부를 때는 `/파티 초대 친구닉네임` 입니다."},{"table":{"cols":["`/파티` 뒤에 붙이는 말","하는 일"],"rows":[["생성","내가 파티장인 파티 만들기"],["초대 <닉네임>","파티로 초대"],["수락","받은 초대 수락"],["거절","받은 초대 거절"],["정보","파티원 목록 보기"],["나가기","파티에서 나가기"],["추방 <닉네임>","파티원 내보내기 (파티장)"],["해체","파티 없애기 (파티장)"]]}}]},{"h":"경험치 나누기","blocks":[{"list":["파티원 한 명이 직업 경험치를 얻으면 **같은 서버**에 있는 다른 파티원도 한 명마다 그 일부를 받습니다. 사냥은 0.5배, 광질 · 농사 · 낚시 · 요리 · 연금술은 0.2배입니다. 얻은 사람의 경험치는 줄지 않습니다.","나눠 받는 경험치도 받는 사람의 사냥 레벨로 다시 판정합니다. 내 레벨이 그 사냥터 권장 레벨보다 한 구간 이상 낮으면 나눠 받는 경험치도 0 입니다.","그래서 높은 레벨 친구가 높은 사냥터에서 잡아 주는 방식으로는 레벨을 올릴 수 없습니다. 자세한 기준은 [사냥 구역 제한](#growth-region-gate) 문서에 있습니다.","나눠 받는 양은 서버 경험치 부스터 · 경험치 책을 더하기 전의 원래 경험치를 기준으로 합니다."]},{"note":{"b":"부계정 금지","t":"파티 경험치 공유는 계정 단위라 부계정으로 나눠 받는 것은 규칙 위반입니다. 같은 집에서 여럿이 한다면 디스코드로 미리 신고하세요 ([규칙](#rules))."}}]},{"h":"서버를 옮길 때","blocks":[{"list":["파티는 다섯 서버가 함께 씁니다. 파티원이 로비에 있든 야생에 있든 같은 파티입니다.","접속을 끊은 뒤 8초 안에 어느 서버로든 다시 들어오면 파티에 그대로 남습니다. 서버를 옮길 때가 이 경우입니다.","8초가 지나도록 돌아오지 않으면 파티에서 빠지고, 파티장이었다면 파티가 해체됩니다."]}]},{"h":"파티로 하는 것","blocks":[{"cards":[{"h":"같이 사냥 · 채집","p":"같은 서버에서 함께 다니면 서로의 직업 경험치를 나눠 받습니다. 사냥은 0.5배라 같은 사냥터를 함께 도는 것이 가장 이득입니다.","color":"var(--reg-forest)"},{"h":"길라잡이 「파티 가입」","p":"기초 길라잡이 3단계가 파티 가입입니다. 혼자라면 `/퀘스트스킵` 으로 넘길 수 있습니다.","color":"var(--accent)"}]},{"links":[["#growth-jobs","직업","직업 경험치와 레벨"],["#growth-region-gate","사냥 구역 제한","나눠 받는 경험치도 내 레벨로 판정"]]}]}],"search":[["/파티","명령어"],["파티 초대","파티"],["경험치 공유","파티"],["파티원","파티"]]},"conv-settings":{"id":"conv-settings","parent":"convenience","title":"개인설정 · 알림 배너","short":"/개인설정 화면의 6가지 설정, 알림 배너 바꾸기, 디스코드 채팅 연결.","color":"var(--accent)","tags":[["/개인설정",null],["/알림",null],["/시야",null]],"lede":"`/개인설정` 화면에서 채팅 채널, 자동 줍기, 아이템 버리기 방지, 자동 심기, 마을 플라이, 내 이름표 보기를 켜고 끕니다. 판매 완료나 돈 부족 같은 안내는 채팅 대신 화면 아래 띠 배너로 뜨는데, 이것도 `/알림` 으로 원하는 방식으로 바꿀 수 있습니다.","info":{"title":"개인설정","slot":{"id":"편의-설정-대표","need":"`/개인설정` 창 (「생활」 줄 5칸 · 「표시」 줄 1칸이 보이게)"},"rows":[["여는 법","`/개인설정` · 메인 메뉴 아래 「개인 설정」 단추"],["켜짐 / 꺼짐","초록 / 빨강"],["알림 배너","`/알림 배너` · `/알림 같이` · `/알림 채팅`"],["연출 시야","`/시야 <30~110>`"],["저장","5개 서버 공통"]]},"sections":[{"h":"개인설정 화면","blocks":[{"p":"`/개인설정` 이나 메인 메뉴 아래 「개인 설정」 단추를 누르면 개인설정 화면이 열립니다. 항목을 누를 때마다 켜고 꺼집니다. 초록이면 켜짐, 빨강이면 꺼짐입니다. 멤버십이 필요한 항목은 멤버십이 없으면 바뀌지 않습니다. 화면의 ◀ 단추로 메인 메뉴로 돌아갑니다."},{"table":{"cols":["줄","설정","하는 일","필요한 것"],"rows":[["생활","채팅 채널","내 채팅을 지금 서버에만 보낼지, 전체 서버에 보낼지 (`/개인챗 <닉네임>` 으로 한 사람과만 대화하는 개인챗도 됨)","—"],["생활","자동 줍기","블록을 캐면 나오는 아이템이 바닥에 떨어지지 않고 바로 인벤토리로 (램프 자동제련 · 멀티채굴 · 대박 채굴도 그대로 적용, 캔 상자 안의 물건은 바닥에)","VIP · MVP 멤버십"],["생활","아이템 버리기 방지","Q 키로 실수로 아이템을 버리지 않게 막음","—"],["생활","자동 심기","작물을 거두면 그 자리에 씨앗을 다시 심음","MVP 멤버십"],["생활","마을 플라이","내 마을 땅 안에서 날기","MVP 멤버십"],["표시","내 네임태그 보기","3인칭 시점에서 내 머리 위 이름표를 보일지","—"]]}},{"p":"채팅 채널은 `/채팅채널` 로도 바로 바꿀 수 있습니다. 지금 채널(서버 · 전체 · 개인)은 핫바 왼쪽 전투력 글자 아래에 늘 표시됩니다. 멤버십 혜택은 [멤버십](#shop-membership) 문서에 있습니다."},{"note":{"b":"공식 자동 기능","t":"자동 줍기 · 자동 심기는 서버가 제공하는 기능이라 써도 됩니다. 자동 줍기를 켜도 곡괭이 램프의 자동제련 · 멀티채굴 · 대박 채굴 기록은 꺼 둔 때와 똑같이 걸립니다. 자동제련 램프 곡괭이로 캐면 철 · 금 · 구리 광석 블록도 주괴로, 루비 · 설파이트 · 히룸 원석은 조각으로 바로 나오고, 광질 레벨 2배 드롭으로 더 나온 몫도 똑같이 구워집니다. 반대로 매크로나 자동 클릭 프로그램은 금지입니다 ([규칙](#rules))."}}]},{"h":"알림 배너","blocks":[{"p":"물건을 팔았을 때, 돈이 모자랄 때, 로비로 이동할 때 같은 안내가 화면 아래 가운데(액션바 바로 위)에 띠 모양으로 잠깐 떴다가 사라집니다. 색으로 성격을 구분합니다."},{"table":{"cols":["색","뜻","예"],"rows":[["초록","성공 · 이득","판매 완료 · 구매 완료 · 획득 · 마을 가입"],["빨강","실패 · 막힘","돈 부족 · 인벤토리 공간 부족 · 오늘 한도 도달 · 사망"],["파랑","이동 · 안내","로비 이동 · 마을 이동 · 야생 이동 · 상점 이동"]]}},{"list":["새 알림이 오면 떠 있던 배너가 바로 새 것으로 바뀝니다.","같은 알림이 연달아 오면 하나로 합쳐 ×2, ×3 처럼 표시합니다.","접속하거나 서버를 옮긴 직후 3.5초 동안은 쌓아 뒀다가 띄웁니다. 그래서 죽어서 로비로 왔을 때도 「사망」 배너를 볼 수 있습니다.","낚시 · 채집 · 곤충 · 화석 · 상자 감정 화면이 떠 있으면 그 화면을 가리지 않게 잠시 뒤에 띄웁니다.","리소스팩을 받지 않았으면 배너 대신 원래대로 채팅으로 나옵니다."]},{"table":{"cols":["명령어","보이는 방식"],"rows":[["`/알림 배너`","배너로만 보여 주고 채팅에서는 지움"],["`/알림 같이`","배너와 채팅에 둘 다"],["`/알림 채팅`","배너 없이 채팅으로만"]]}},{"slot":{"id":"편의-설정-알림배너","need":"무역상인이나 상점에서 판매한 직후 화면 아래 뜨는 초록 「판매 완료」 배너"}}]},{"h":"연출 시야 맞추기","blocks":[{"p":"랜덤 상자 · 뽑기 연출은 눈앞에 띄우는 장면이라 시야(FOV)가 넓거나 좁으면 잘려 보일 수 있습니다. 내 마인크래프트 시야 값과 같게 `/시야 <30~110>` 으로 맞춰 두세요. 처음 접속할 때 검은 화면에서 맞추는 것과 같은 설정입니다."}]},{"h":"그 밖의 편의 명령","blocks":[{"table":{"cols":["명령어","하는 일"],"rows":[["`/귓속말 <플레이어> <메시지>`","귓속말. 상대가 다른 서버에 있어도 전달되고, 닉네임으로도 보낼 수 있습니다 (`/msg` · `/w` 도 같음)"],["`/확성기 <내용>`","모든 서버에 방송. 다시 쓰기까지 5분 (VIP 3분, MVP 1분)"],["`/가방`","추가 가방 열기. VIP 는 3 · 4번, MVP 는 3~9번 가방까지"],["`/접속시간`","이번 접속 시간과 누적 접속 시간"],["`/접속보상보기`","접속 시간 단계별 일반 · 프리미엄 보상과 오늘 받은 단계 보기"],["`/쓰레기통`","버릴 아이템을 넣고 닫으면 확인 후 영구 삭제"]]}},{"note":{"b":"확성기 예절","t":"확성기는 서버 전체가 봅니다. 잡담 · 시비 · 쿨타임마다 이어 쓰는 도배는 채팅 금지 대상이고, 채팅 금지를 받으면 확성기도 함께 막힙니다."}}]},{"h":"접속 보상","blocks":[{"p":"오늘 접속한 시간이 1 · 2 · 3 · 5 · 8시간이 될 때마다 그 단계 보상이 하루에 한 번씩 자동으로 들어옵니다. VIP · MVP 멤버십이 있으면 일반 대신 프리미엄 보상을 받습니다. 경험치 책은 10분 동안 직업 경험치를 올려 주는 책입니다. 메인 메뉴 아래 **접속 보상**(시계) 단추나 `/접속보상보기` 로 단계별 일반 · 프리미엄 보상, 오늘 접속 시간과 받은 단계를 볼 수 있습니다(화면 위 머리 칸을 누르면 지금 값으로 다시 봅니다). 자리를 비워 둔 채 받아도 정상 이용입니다."},{"table":{"cols":["오늘 접속 시간","일반","VIP · MVP (프리미엄)"],"rows":[["1시간","1,500원","3,000원"],["2시간","1,500원","3,500원"],["3시간","2,000원 · 인첸트 조각 1 · 경험치 책 1","4,500원 · 인첸트 조각 2 · 내구도 수리 보석 II 2 · 경험치 책 2"],["5시간","3,000원 · 인첸트 조각 1 · 내구도 수리 보석 II 1 · 경험치 책 1","6,000원 · 인첸트 조각 2 · 내구도 수리 보석 II 2 · 경험치 책 2"],["8시간","4,000원 · 인첸트 조각 1 · 내구도 수리 보석 II 1 · 경험치 책 1","8,500원 · 인첸트 조각 2 · 내구도 수리 보석 II 2 · 경험치 책 2"]]}}]},{"h":"디스코드 채팅 연결","blocks":[{"list":["게임 채팅(서버 채팅 · 전체 채팅)과 확성기, 접속 · 퇴장 · 사망 알림은 코자 디스코드의 채팅 채널 **하나**에 「서버 이름 | 닉네임: 내용」 꼴로 올라갑니다 (로비 · 마을 · 오버월드 · 코자 대륙).","던전 서버의 채팅은 디스코드에 올라가지 않습니다.","디스코드 채팅 채널에 쓴 글은 게임 채팅으로 전달됩니다."]},{"note":{"b":"디스코드도 공개 채팅입니다","t":"게임 채팅은 디스코드에서도 보입니다. 채팅 규칙은 게임과 디스코드 모두 같습니다 ([규칙](#rules))."}}]}],"search":[["/개인설정","명령어"],["알림 배너","개인설정"],["/알림","명령어"],["자동 줍기","개인설정"],["아이템 버리기 방지","개인설정"],["채팅 채널","개인설정"],["/시야","명령어"],["확성기","편의"],["접속 보상","편의"],["귓속말","편의"],["디스코드 채팅","개인설정"]]},"conv-town":{"id":"conv-town","parent":"convenience","title":"유저 마을","short":"마을 서버에 내 땅 만들기. 최대 4명, 최소 간격 3청크, 초록 · 빨강 경계선, 권한, 확장 비용.","color":"var(--reg-forest)","tags":[["마을 서버","lv"],["1인 1마을",null],["최대 4명",null],["확장비 800원 + 청크당 400원",null],["최소 간격 3청크",null]],"lede":"유저 마을은 마을 서버에 청크 단위로 잡는 내 땅입니다. 마을 안에서는 마을원이 아닌 사람이 블록을 부수거나 놓거나 상자를 열 수 없습니다. 재련대 · 양식 수조 · 드래곤 알 · 코자 대륙 포탈처럼 내 마을 땅에서만 쓰는 시설도 많아서, 이프란을 벗어날 즈음에는 하나 만들어 두는 것이 좋습니다.","info":{"title":"유저 마을","slot":{"id":"편의-마을-대표","need":"마을 서버에서 내 마을 땅에 서 있을 때 보이는 초록 경계선과 마을 건물"},"rows":[["만드는 곳","마을 서버에서만"],["가는 법","메인 메뉴 「마을」 카드 → 「랜덤 이동」"],["소속","한 사람당 마을 1개"],["인원","마을장 포함 최대 4명"],["마을 이름","2~8글자 (띄어쓰기 없이)"],["확장 비용","800원 + 지금 청크 수 × 400원"],["다른 마을과 간격","최소 3청크"],["기본 설정","PvP 꺼짐 · 몹 스폰 켜짐"],["경계선","내 마을 초록 · 남의 마을 빨강 (근처 6청크)"]]},"sections":[{"h":"마을 만들기","blocks":[{"steps":[{"h":"마을 서버로 가기","p":"Shift+F → 「마을」 카드 → 「랜덤 이동」을 누르면 마을 서버의 무작위 위치로 갑니다. 마음에 드는 자리까지 걸어가세요."},{"h":"마을 만들기 명령","p":"자리를 잡았으면 `/마을` 뒤에 「생성 <마을 이름>」을 붙여 입력합니다. 이름은 2~8글자이고 띄어쓰기는 안 됩니다. 지금 서 있는 청크(16×16칸) 하나가 내 마을이 됩니다."},{"h":"마을 스폰은 자동","p":"만든 자리가 그대로 마을 스폰이 됩니다. 어느 서버에서든 `/마을 이동` 이나 메인 메뉴 「마을」 카드 → 「내 마을」로 돌아옵니다. 스폰을 옮기려면 내 마을 땅 안에서 `/마을 셋스폰` (마을 밖에서는 안 됩니다)."},{"h":"넓히기","p":"넓히고 싶은 옆 청크로 걸어가 `/마을 확장` 을 입력합니다. 기존 마을 청크와 위아래 · 좌우로 붙어 있어야 하고 대각선은 안 됩니다."}]},{"note":{"b":"마을은 마을 서버에서만","t":"로비(이프란) · 야생 · 코자 대륙에서는 마을을 만들 수 없습니다. 한 사람은 한 마을에만 속할 수 있습니다."}},{"slot":{"id":"편의-마을-생성","need":"`/마을 정보` 로 본 내 마을 정보와 초록 경계선"}}]},{"h":"다른 마을과의 간격","blocks":[{"p":"새로 만들거나 넓히는 청크에서 3청크 안(가로세로 7×7청크 범위, 대각선 포함)에 다른 사람 마을이 있으면 만들거나 넓힐 수 없습니다. 어느 마을 때문에 막혔는지 이름이 함께 나옵니다. 남의 마을을 둘러싸 가두는 일을 막으려는 규칙입니다."},{"p":"확장이 막혔을 때는 돈이 빠져나가지 않습니다. 쓰지도 않을 청크로 남의 마을 옆을 막아 두는 「알박기」는 규칙 위반입니다 ([규칙](#rules))."}]},{"h":"확장 비용","blocks":[{"p":"한 번 넓힐 때 드는 돈은 「800원 + 지금 마을 청크 수 × 400원」입니다. 땅이 클수록 다음 확장이 비싸집니다. 다음 확장비는 `/마을 확장비용` 으로 확인합니다. 필요 없는 청크는 그 청크에 서서 `/마을 청크해제` 로 뺄 수 있습니다(마지막 1청크는 못 뺍니다)."},{"table":{"cols":["지금 마을 크기","다음 확장비","그때까지 쓴 돈"],"num":[1,2],"rows":[["1청크 (처음)","1,200원","0원"],["2청크","1,600원","1,200원"],["3청크","2,000원","2,800원"],["4청크","2,400원","4,800원"],["5청크","2,800원","7,200원"],["10청크","4,800원","25,200원"]]}}]},{"h":"경계선 보기","blocks":[{"list":["내 마을 땅에 들어서면 땅 가장자리를 따라 초록 선과 빛 울타리가 보입니다.","마을 밖으로 나가도 내 마을 경계는 계속 초록으로 보입니다 (약 128칸 안).","다른 사람 마을은 빨간색으로 보입니다. 그 마을 안에 있을 때뿐 아니라, 근처 6청크(96칸) 안에 있는 마을도 가까운 순서로 6곳까지 보여 줍니다.","경계선이 거슬리면 `/마을 경계` 로 전부, `/마을 경계 주변` 으로 근처 남의 마을 표시만 나만 끄고 켤 수 있습니다. 끈 설정은 다시 접속하거나 서버를 옮겨도 유지됩니다.","경계선은 리소스팩 그림이라 리소스팩을 받아야 보입니다."]},{"slot":{"id":"편의-마을-경계선","need":"내 마을 땅을 두른 초록 경계선이 보이는 화면"}}]},{"h":"마을 서버에서 지을 수 있는 곳","blocks":[{"list":["마을 서버에서는 **내 마을 땅에서만** 블록을 부수고 놓을 수 있습니다. 마을 땅이 아닌 곳에서는 상자 · 문 · 버튼 같은 블록 사용, 양동이, 뼛가루 · 부싯돌 같은 아이템 사용, 액자 · 갑옷 거치대 · 동물 건드리기도 막힙니다. 마을 서버에서는 동물 · 몬스터 · 주민이 저절로 생기지 않습니다 (동물은 [포획](#life-ranch)해서 포획창에서 기릅니다).","다른 사람 마을에서는 그 마을 주민이거나 마을장에게 [권한](#conv-town)을 받은 만큼만 할 수 있습니다.","막히면 화면 아래 가운데에 빨간 알림 띠가 뜹니다. 먼저 `/마을 생성` 으로 내 땅을 만들고, 넓히려면 `/마을 확장`."]}]},{"h":"마을원과 권한","blocks":[{"note":{"b":"최대 4명","t":"마을은 마을장을 포함해 **최대 4명**까지입니다. 가득 찬 마을에는 초대할 수 없고, 초대를 받아도 들어갈 수 없습니다. 이미 4명이 넘던 마을은 그대로 두고 새로 들어오는 것만 막습니다."}},{"table":{"cols":["`/마을` 뒤에 붙이는 말","하는 일","누가"],"rows":[["초대 <플레이어>","마을원으로 초대","마을장"],["수락 · 거절","받은 초대에 답하기","초대받은 사람"],["탈퇴","마을에서 나가기","마을원"],["추방 <플레이어>","마을원 내보내기","마을장"],["위임 <플레이어>","마을장 넘기기","마을장"],["해체","마을 없애기","마을장"],["이름변경 <새이름>","마을 이름 바꾸기 (2~8글자)","마을장"],["권한 <플레이어>","마을원이 아닌 사람에게 부수기 · 놓기 · 사용을 따로 허락하는 창","마을장"],["설정 pvp on 또는 off","마을 안 PvP 켜고 끄기 (기본 꺼짐)","마을장"],["설정 몹스폰 on 또는 off","마을 안 몹 생성 켜고 끄기","마을장"],["정보 [마을이름] · 목록","마을 정보와 마을 목록 보기","누구나"],["채팅","마을원끼리 채팅","마을원"],["플라이","내 마을 땅 안에서 날기 (마을 밖으로 나가거나 서버를 옮기면 꺼짐)","MVP 멤버십"]]}},{"p":"마을 안에서는 마을원이 아닌 사람의 블록 부수기 · 놓기, 문 · 상자 같은 모든 사용, 압력판 · 철사 덫, 경작지 밟기, 폭발 피해가 막힙니다."},{"note":{"b":"초대는 신중하게","t":"마을장은 마을 안에서 생긴 일에 책임이 있습니다. 초대해서 건물을 짓게 한 뒤 내쫓고 차지하는 것은 사기로 처벌됩니다."}}]},{"h":"내 마을에서만 하는 것","blocks":[{"cards":[{"h":"코자 대륙 포탈","p":"네더라이트 장비 9종을 갖추고 아르덴 이장 실바에게 받은 코자 포탈석을 내 마을 땅 바닥에 우클릭해 세웁니다 (마을마다 1개). 포탈을 우클릭하면 코자 대륙의 무작위 위치로 갑니다. 세운 사람이나 촌장은 쉬프트 + 우클릭 두 번으로 거둘 수 있습니다.","color":"var(--gold)"},{"h":"재련대 · 공성","p":"마을마다 재련대 1대를 놓고 잿불 무리를 막아 내며 재련합니다. [재련 · 공성](#combat-siege)","color":"var(--reg-volcano)"},{"h":"양식 수조","p":"내 마을 땅에만 놓을 수 있습니다. [양식장](#life-fishfarm)","color":"var(--reg-ice)"},{"h":"트랙터 자동 수확","p":"트랙터는 내 마을 청크 안의 다 자란 작물을 거둡니다. [농사](#life-farming)","color":"var(--reg-forest)"},{"h":"드래곤 알","p":"드래곤 알은 마을 서버에만 놓을 수 있습니다. [펫 · 탈것 · 드래곤 알](#style-pets)","color":"var(--r-epic)"}]}]},{"h":"관련 문서","blocks":[{"links":[["#conv-move","이동","마을 서버 가는 법 · 코자 대륙 포탈"],["#conv-commands","명령어 모음","마을 명령 전체"],["#rules","규칙","알박기 · 초대 악용 처벌"]]} um":[1],"rows":[["참나무 · 가문비나무 · 자작나무 원목","5"],["정글 · 아카시아 · 짙은 참나무 · 맹그로브 원목","6"],["벚나무 원목 · 진홍 자루 · 뒤틀린 자루","7"],["창백한 참나무 원목","8"]]}},{"p":"플레이어가 놓은 원목과 뼛가루로 키운 나무는 경험치가 없습니다. 자세한 것은 [벌목](#life-logging) 문서에 있습니다."}]},{"h":"도구를 들면 뜨는 정보판","blocks":[{"p":"괭이 · 낚싯대 · 검 · 활 · 곡괭이를 손에 들면 핫바 오른쪽에 검은 반투명 판이 뜹니다. 그 직업의 레벨, 경험치 게이지와 숫자, 2배 드롭 · 보너스 아이템 · 회피 확률, 켜져 있는 경험치 버프가 한눈에 보이고, 사냥 정보판에는 「체력 · 피해」 줄이 더 있습니다. 검 · 활 · 스킬북을 들면 사냥 정보판이 무기 스킬 · 스킬북 HUD 옆자리에 함께 뜹니다. NPC와 대화하는 동안에는 정보판이 잠시 숨겨집니다."},{"p":"경험치가 오를 때 채팅이나 알림은 따로 뜨지 않습니다. 정보판의 게이지로 확인하세요."}]},{"h":"농사 설정과 자동 심기","blocks":[{"slot":{"id":"성장-직업-농사설정","need":"괭이를 들고 F를 눌러 연 「농사 설정」 창(자동 심기 켜기 · 단축키 3개)"}},{"list":["괭이를 들고 **F**를 누르면 「농사 설정」 창이 열립니다. `/직업메뉴 농사` 도 같은 창입니다. 다른 직업 도구는 F를 눌러도 아무 창이 열리지 않습니다.","**자동 심기**는 농사 Lv.300에 열립니다. 켜면 수확한 자리에 씨앗이 저절로 다시 심어집니다.","지속 시간은 Lv.300에서 30초, Lv.1000에서 3분까지 늘어나고, 쓰고 나면 5분을 기다려야 합니다.","발동 단축키는 쉬프트+좌클릭 · 쉬프트+우클릭(기본) · 쉬프트 두 번 중에서 고릅니다.","MVP 멤버십은 자동 심기가 늘 켜져 있습니다 ([멤버십](#shop-membership))."]},{"p":"낚시 미끼 제작 · 낚시 랭킹 · 자동 낚시는 아르덴 낚시꾼 프쉰에게서 엽니다 ([낚시](#life-fishing))."}]},{"h":"경험치를 더 받는 법","blocks":[{"table":{"cols":["방법","효과","얻는 곳"],"rows":[["경험치 책","1.5배 · 10분 (다시 쓰기까지 11분)","접속 보상 (3시간 · 5시간 · 8시간째)"],["경험치 책 - 프리미엄","2배 · 30분 (다시 쓰기까지 31분)","잼 상점 1,900잼"],["서버 경험치 부스터","접속한 모두 +50% · 30분","잼 상점 2,490잼 · [서버 부스터](#growth-booster)"],["파티","파티원이 얻은 경험치를 사냥은 0.5배, 나머지 직업은 0.2배씩 함께 받음","`/파티` (최대 4명)"]]}},{"p":"파티로 나눠 받는 사냥 경험치도 **받는 사람의 사냥 레벨**로 다시 판정합니다. 높은 지역에서 고레벨이 잡아 줘도 레벨이 모자란 파티원은 경험치를 받지 못합니다."}]}],"search":[["직업 레벨","직업"],["사냥 레벨","직업"],["자동 심기","농사"],["태양 조각","농사 보너스"],["고대 닻 조각","낚시 보너스"],["경험치 책","직업"],["2배 드롭","직업"],["사냥 체력","직업"],["몬스터 피해 증가","직업"],["벌목","직업"]]},"growth-lamp":{"id":"growth-lamp","parent":"growth","title":"램프","short":"장비에 특수 능력을 다는 램프 40종. 강화할수록 칸이 늘어 최대 6칸 (도구는 4칸).","color":"var(--r-epic)","tags":[["현자 컬티스",null],["능력 40종","lv"],["최대 6칸",null]],"lede":"램프는 도구 · 무기 · 갑옷에 다는 특수 능력입니다. 곡괭이에 멀티채굴, 낚싯대에 빠른입질, 흉갑에 두번째 목숨처럼 장비마다 달 수 있는 램프가 정해져 있습니다. 칸은 처음 1칸이고 장비를 강화할수록 늘어납니다.","info":{"title":"램프","slot":{"id":"성장-램프-대표","need":"현자 컬티스의 램프 부여 창에 곡괭이와 램프를 올린 화면"},"rows":[["어디서","[아르덴](#arden) 현자 컬티스 → 「램프를 만진다」"],["등급","하급 · 중급 · 상급"],["부여 성공","하급 80% · 중급 50% · 상급 20%"],["부여 비용","하급 2,000 · 중급 10,000 · 상급 30,000원"],["근원","상급 부여 15 · 상급으로 승급 30 (시도마다)"],["칸","기본 1칸 → 30강 6칸"],["승급","같은 램프 3개 → 다음 단계 1개"],["빼기","현자 컬티스 (돈을 내고 램프를 돌려받음)"]]},"sections":[{"h":"램프 얻기","blocks":[{"p":"램프는 **램프 랜덤 상자**에서 나옵니다. 상자는 하급 · 중급 · 상급 세 가지이고, 열면 그 등급 램프 중 하나가 같은 확률로 나옵니다."},{"table":{"cols":["하는 일","상자가 나올 확률"],"rows":[["광석 캐기","3% (다이아 · 에메랄드 광석은 2.2배, 고대 잔해는 3배 더 잘 나옴)"],["다 자란 작물 수확","0.5%"],["땅 · 바다 채집","3.5% (드문 채집물일수록 더 잘 나옴, 감별안 램프로 최대 12%)"],["낚시","3% (높은 등급 물고기일수록 더 잘 나옴)"]]}},{"p":"상자가 나오면 등급은 하급 60% · 중급 30% · 상급 10%입니다. 그 밖에 기초 길라잡이 졸업 선물로 하급 램프 랜덤 상자 3개를 받고, 다른 사람과 거래하거나 유저상점에서 살 수도 있습니다. [잼 상점](#shop-gem) 「근원」 쪽의 램프 패키지에는 상급 램프 랜덤 상자 2개가 들어 있습니다."}]},{"h":"부여하기","blocks":[{"steps":[{"h":"컬티스에게 가기","p":"아르덴의 현자 컬티스에게 말을 걸고 「램프를 만진다」 → 「램프 부여 하기」를 고릅니다."},{"h":"장비와 램프 올리기","p":"램프를 달 장비와 램프를 올립니다. 그 장비에 맞는 램프만 들어갑니다."},{"h":"성공 확률","p":"하급 80% · 중급 50% · 상급 20%로 붙습니다. 부여할 때마다 등급별 수수료(하급 2,000원 · 중급 10,000원 · 상급 30,000원)가 들고, 상급은 [근원](#growth-origin) 15개도 함께 듭니다. 실패하면 **램프만 사라지고** 장비는 그대로이며, 수수료와 근원은 돌아오지 않습니다."}]},{"table":{"cols":["등급","부여 성공","부여 수수료","근원","램프 단계"],"num":[1,2,3],"rows":[["하급","80%","2,000원","—","대부분 I"],["중급","50%","10,000원","—","대부분 II"],["상급","20%","30,000원","15개","III · 특수 능력"]]}},{"list":["같은 능력을 다시 달면 더 높은 단계로 덮어씁니다.","검 램프는 스킬북에도 달 수 있고, 스킬 피해에 그대로 적용됩니다."]}]},{"h":"칸 수","blocks":[{"p":"램프 칸은 장비의 강화 단계로 정해집니다. 램프를 달 수 있는 모든 장비(곡괭이 · 도끼 · 괭이 · 낚싯대 · 검 · 스킬북 · 활 · 네더라이트 갑옷 4부위)가 같은 규칙입니다. 도구는 20강까지라 최대 4칸입니다."},{"table":{"cols":["강화 단계","램프 칸"],"num":[1],"rows":[["0~4강","1"],["5강","2"],["8강","3"],["15강","4"],["23강","5"],["30강","6"]]}},{"note":{"b":"이미 강화해 둔 장비","t":"옛 단계로 강화해 둔 장비는 단계가 1.5배로 맞춰져 있어, 램프 칸 수가 줄지 않습니다."}}]},{"h":"승급","blocks":[{"p":"컬티스의 「램프 승급 하기」에서 **같은 램프 3개를 넣으면 다음 단계 램프 1개** ws":[["770 이상","270"],["769 이하","0 (안내 메시지)"]]}}]},{"h":"레벨이 없는 몬스터","blocks":[{"list":["**정예(미니 보스)** — 고목의 수호자 · 황사의 집행자 같은 3단계 몬스터는 1단계 · 2단계를 잡을 때 2% · 4% 확률로 기습해 나타납니다. 레벨이 없어 누구나 보상을 받습니다.","**지역 보스** — 보스 던전은 들어갈 때 도전 카드의 사냥 레벨을 확인하고, 안에서는 제한 없이 싸웁니다 ([지역 보스](#combat-region-boss)).","**현상수배 네임드**, 야생 · 네더 · 코자 대륙의 **구조물 몬스터**, 일반 몬스터."]},{"note":{"b":"우회는 규칙 위반","t":"사냥 구역 제한을 피하려는 시도는 서버 규칙 위반입니다. [규칙](#rules)을 확인하세요."}}]}],"search":[["요구 레벨","사냥 구역 제한"],["몬스터 레벨","사냥 구역 제한"],["레벨 미달","사냥 구역 제한"],["파워레벨링","사냥 구역 제한"],["피해 감소","사냥 구역 제한"]]},"growth-skillbook":{"id":"growth-skillbook","parent":"growth","title":"스킬북 · 스킬","short":"스킬북 1권에 스킬 최대 5개. 스킬북 강화 0 · 5 · 10강에서 장착 칸이 3 · 4 · 5칸.","color":"var(--r-epic)","tags":[["장착 칸 3~5","lv"],["인벤토리에 1권만",null],["현자 컬티스",null],["무기 스킬 5종씩 (검 · 활 · 삼지창 · 창 · 철퇴)",null],["스킬마다 마나",null]],"lede":"스킬북은 스킬을 쓰는 무기입니다. 스킬북을 들고 Q를 눌러 스킬 아이템을 장착하면 좌클릭 · 우클릭 · 쉬프트 조합으로 스킬이 나갑니다. 스킬을 쓸 때마다 [마나](#growth-mana)가 듭니다. 스킬은 랜덤 스킬북 상자, 지역 보스, 다른 사람과의 거래로 모읍니다. 네더라이트 검 · 활 · 삼지창 · 네더라이트 창 · 철퇴에는 따로 강화 단계에 따라 열리는 **무기 스킬**이 5종씩 있습니다.","info":{"title":"스킬북","slot":{"id":"성장-스킬북-장착창","need":"스킬북을 들고 Q로 연 스킬 장착 창(5칸 중 일부 자물쇠)"},"rows":[["만드는 곳","[아르덴](#arden) 현자 컬티스"],["장착","스킬북 들고 Q"],["장착 칸","0강 3칸 · 5강 4칸 · 10강 5칸"],["마나","커먼 8 · 언커먼 12 · 레어 16 · 에픽 22 · 레전더리 30"],["쿨타임","칸끼리 공유"],["보유 제한","인벤토리에 1권"]]},"sections":[{"h":"스킬북 얻기","blocks":[{"list":["현자 컬티스의 스킬 제작소에서 만듭니다: **책 1 · 다이아몬드 64 · 철 주괴 128 · 금 주괴 128** (성공 100%).","[심화 길라잡이](#quest-guide-advanced) 보상으로 스킬북과 랜덤 스킬북 상자를 받고, [메인 스토리](#quest-main) 보상으로도 랜덤 스킬북이 나옵니다.","다른 사람과 거래하거나 유저상점에서 살 수 있습니다."]},{"lore":{"name":"스킬북","color":"#55FF55","lines":["도구","","GUI 슬롯에 스킬 아이템을 드래그하면 장착됩니다.","강화수치가 높아질수록 트리거가 순서대로 해금됩니다.","","좌클릭: 비어있음","우클릭: 비어있음","쉬프트+좌클릭: 비어있음","🔒 쉬프트+우클릭: 강화 5강 필요","🔒 더블스니크: 강화 10강 필요","사용 방법: Q(드롭 키)를 눌러 스킬 장착 GUI를 여세요.","획득 방법: 유저간 거래, 유저상점, 현자에게서 제작"]}}]},{"h":"스킬 장착","blocks":[{"steps":[{"h":"스킬북을 들고 Q","p":"아이템이 버려지지 않고 스킬 장착 창이 열립니다."},{"h":"스킬 아이템 끌어다 놓기","p":"인벤토리의 스킬 아이템을 열린 칸에 끌어다 놓으면 장착됩니다. 같은 스킬을 두 칸에 넣을 수는 없습니다."},{"h":"해제","p":"빈 손(커서)으로 장착된 칸을 누르면 스킬 아이템이 돌아옵니다. 인벤토리가 꽉 차면 [우편함](#conv-mailbox)으로 갑니다."}]},{"table":{"cols":["트리거","조작","열리는 스킬북 강화"],"rows":[["1","좌클릭","0강 (처음부터)"],["2","우클릭","0강 (처음부터)"],["3","쉬프트 + 좌클릭","0강 (처음부터)"],["4","쉬프트 + 우클릭","5강"],["5","쉬프트 두 번 (0.4초 안에)","10강"]]}},{"list":["**쿨타임은 칸끼리 함께 씁니다.** 스킬 하나를 쓰면 그 스킬의 쿨타임만큼 다른 칸도 기다려야 합니다.","**스킬마다 [마나](#growth-mana)가 듭니다.** 스킬 아이템의 등급(테두리 색)에 따라 커먼 8 · 언커먼 12 · 레어 16 · 에픽 22 · 레전더리 30이고, 마나가 모자라면 스킬이 나가지 않으며 쿨타임 · 마나도 그대로입니다.","트리거가 비어 있으면 그 조작은 평소처럼 공격 · 상호작용이 됩니다.","스킬 피해에는 스킬북 강화 능력치(스킬 피해 % · 치명타 · 흡혈 — 흡혈은 15강부터 3%로 고정), 스킬북에 단 검 램프, [사냥 레벨](#growth-jobs)의 몬스터 피해 증가가 함께 적용됩니다. 스킬북 강화는 무기와 같은 비용표를 씁니다 ([강화](#growth-enhance)).","스킬북을 들면 핫바 옆에 다섯 칸의 스킬 아이콘 · 자물쇠 · 쿨타임과 그 스킬에 드는 마나가 표시됩니다. 쿨타임 중인 칸은 어둡게 보입니다.","스킬 칸은 0강에 3칸, 5강에 4칸, 10강에 5칸이 열립니다."]},{"slot":{"id":"성장-스킬북-HUD","need":"스킬북을 들었을 때 핫바 옆에 뜨는 다섯 칸 스킬 아이콘과 쿨타임 숫자"}}]},{"h":"스킬북은 1권만","blocks":[{"p":"인벤토리에는 스킬북을 **1권만** 가질 수 있습니다. 이미 1권이 있으면 바닥에서 줍기, 상자에서 꺼내기, 제작, 유저상점 구매가 막힙니다. 보상으로 받은 스킬북이 넘치면 우편함으로 들어갑니다. 다른 스킬북으로 바꾸려면 지금 것을 상자에 넣어 두세요."}]},{"h":"스킬 얻는 법","blocks":[{"table":{"cols":["방법","내용"],"rows":[["랜덤 스킬북 상자","현자 컬티스에게서 1~5단계를 만들고 우클릭으로 엽니다. 단계가 곧 스킬 등급입니다."],["지역 보스","보스 6마리가 낮은 확률로 고유 스킬을 떨어뜨립니다 (2~5%)."],["퀘스트","메인 스토리 · 심화 길라잡이 · 사이드 퀘스트 보상으로 랜덤 스킬북이 나옵니다."],["거래 · 유저상점","스킬 아이템은 다른 사람과 사고팔 수 있습니다."],["첫 항해 스킬 상자","사전예약 보상으로만 받은 한정 스킬 13종입니다."]]}},{"table":{"cols":["만드는 것","재료 (현자 컬티스, 성공 100%)"],"rows":[["스킬북","책 1 · 다이아몬드 64 · 철 주괴 128 · 금 주괴 128"],["랜덤 스킬북 - 1단계","다이아몬드 32 · 철 주괴 64 · 금 주괴 64"],["랜덤 스킬북 - 2단계","다이아몬드 32 · 철 주괴 64 · 금 주괴 64"],["랜덤 스킬북 - 3단계","네더라이트 주괴 2 · 다이아몬드 64 · 고대 닻 조각 20 · 사막의 호박석 16"],["랜덤 스킬북 - 4단계","루비 4 · 네더라이트 주괴 3 · 다이아몬드 64 · 고대 닻 조각 32 · 빙하 점액 4 · 타오르는 홍옥 16 · 근원 30"],["랜덤 스킬북 - 5단계","설파이트 4 · 루비 2 · 네더라이트 주괴 6 · 드래곤 이빨 4 · 고대 닻 조각 64 · 정령의 에메랄드 16 · 근원 70"]]}},{"p":"2단계는 1단계와 같은 재료를 씁니다. 4단계 · 5단계는 [근원](#growth-origin)도 듭니다. 고대 닻 조각은 낚시 보 초","12","빈 시위를 튕겨 앞쪽 부채꼴에 충격파, 반동으로 뒤로 6칸 물러남"],["나선 드릴 화살","웅크린 채 당기기","2강","14초","17","1.0 · 1.6 · 2.2초 당기면 1~3단, 놓으면 드릴이 박혀 갈다가 터짐"],["도탄 화살","쉬프트 + 좌클릭","5강","14초","17","맞은 적에서 가까운 적으로 5번 튕기며 세지다가 마지막 적 자리에서 폭발"],["정지된 일제사격","쉬프트 두 번","10강","20초","22","앞에 장판을 깔고 둘레에 화살 16발을 띄워 장판 안 적에게 꽂은 뒤 폭발"],["천궁 개방 (궁극기)","쉬프트 + Q","15강","60초","45","머리 위 거대한 빛의 활로 바라보는 곳(2~20칸)에 거대 화살을 꽂고, 그 자리가 연달아 폭발"]],"num":[4]}},{"list":["그냥 서서 당겨 쏘면 보통 화살이 나갑니다. Q를 눌러도 활은 버려지지 않습니다.","`/무기스킬` 창에서 스킬 설명 · 피해를 보고, 좌클릭 「시위 울림」과 웅크려 당기기 「나선 드릴 화살」을 따로 끌 수 있습니다.","활을 들면 핫바 옆에 스킬 아이콘과 쿨타임이 보이고, 연출은 장착한 활 이펙트 스킨을 따릅니다."]}]},{"h":"삼지창 무기 스킬","blocks":[{"p":"삼지창도 검 · 활과 같은 틀의 무기 스킬 5종이 있습니다. 삼지창의 강화 단계에 따라 0 · 2 · 5 · 10 · 15강에 하나씩 열리고, 피해는 삼지창의 공격 피해를 바탕으로 정해집니다. 물 · 비와 상관없이 땅 위 어디서나 똑같이 씁니다. 24~30강에서 위력과 쿨타임 보너스가 붙고(30강 위력 ×1.5 · 쿨타임 −15%), 30강이면 「각성」해 스킬마다 효과가 하나씩 더해집니다."},{"table":{"cols":["스킬","조작","열리는 강화","쿨타임","마나","하는 일","30강 각성"],"rows":[["세 갈래 물살","좌클릭","0강","9초","12","세 줄기 물살이 앞으로 갈라져 8칸 뻗고, 맞은 적은 물살에 밀려남","2회 충전 · 물살 10칸"],["귀환 소용돌이","웅크린 채 던지기","2강","14초","17","빛의 삼지창이 박힌 자리에 소용돌이를 만들고, 돌아오며 길 위의 적을 끌고 옴","소용돌이 반경 4.5 · 1.5초 · 빨아들임 · 돌아올 때 기절"],["급류 타기","쉬프트 + 좌클릭","5강","12초","15","물줄기를 타고 보는 방향으로 10칸 돌진, 지나간 적은 옆으로 튕겨 나감","2회 충전"],["대해일","쉬프트 두 번","10강","20초","22","앞에 거대한 파도 벽을 일으켜 14칸 밀고 나감. 휩쓸린 적은 파도에 실려 가다 무너질 때 내려찍힘","파도 18칸 · 폭 9 · 내려찍기 0.5초 기절"],["바다의 왕 (궁극기)","쉬프트 + Q","15강","60초","45","바라보는 곳(2~12칸)에 삼지창을 꽂아 8초 폭우 구역. 낙뢰가 떨어지다 파도가 안으로 휩쓸어 물기둥으로 터짐","반경 15 · 낙뢰 1.5초마다 · 물기둥 1초 기절"]],"num":[4]}},{"list":["**그냥 던진 삼지창**은 진짜 삼지창이 손에 남고, 날아간 삼지창은 맞히든 빗나가든 자동으로 돌아옵니다. 인첸트(충성)가 없어도 잃어버리지 않고, 날아가는 동안에만 다시 던지기가 막힙니다.","던진 삼지창 피해는 삼지창의 공격 피해(강화 포함)를 따라갑니다.","바다의 왕 폭우 구역 안에 서 있으면 다른 삼지창 스킬 피해가 20% 오릅니다.","Q를 눌러도 삼지창은 버려지지 않습니다. `/무기스킬` 창에서 스킬 설명 · 피해를 봅니다."]}]},{"h":"창 무기 스킬 (네더라이트 창)","blocks":[{"p":"네더라이트 창에도 무기 스킬 5종이 있습니다. 창의 강화 단계에 따라 0 · 2 · 5 · 10 · 15강에 하나씩 열리고, 피해는 창의 공격 피해를 바탕으로 정해집니다. 24~30강에서 위력과 쿨타임 보너스가 붙고(30강 위력 ×1.5 · 쿨타임 −15%), 30강이면 「각성」해 스킬마다 효과가 하나씩 더해집니다."},{"t  쓸 수 있습니다."}]},{"note":{"b":"도착하면 홈부터","t":"코자 대륙에서는 `/셋홈 이름` 으로 홈을 저장할 수 있습니다. 좋은 사냥터나 광산을 찾으면 홈으로 저장해 두고 `/홈 이름` 으로 돌아오세요."}},{"note":{"b":"포탈 옮기기","t":"세운 사람이나 촌장이 포탈을 쉬프트 + 우클릭으로 두 번 누르면 포탈을 거두고 포탈석을 돌려받습니다. 다른 자리에 다시 세울 수 있습니다."}},{"slot":{"id":"지역-코자-포탈","need":"유저 마을에 세운 코자 대륙 포탈과 그 앞에 선 플레이어"}}]},{"h":"루비 · 설파이트 · 히룸","blocks":[{"p":"코자 대륙 땅속 깊은 돌 · 심층암 사이에서만 나옵니다. 아래로 갈수록 귀한 광물이 나옵니다. 세 광물 모두 네더라이트 곡괭이로 캡니다. 캔 원석 9개를 제작대에서 합치면 루비 · 설파이트 · 히룸 1개가 됩니다."},{"table":{"cols":["광물","나오는 높이","필요한 곡괭이","광질 경험치","키레이 판매가"],"num":[3,4],"rows":[["루비","Y -60 ~ 20","네더라이트 곡괭이","150","3,500원"],["설파이트","Y -60 ~ -10","네더라이트 곡괭이","200","5,500원"],["히룸","Y -60 ~ -30","네더라이트 곡괭이","500","8,500원"]]}},{"list":["광물 희귀도: 네더라이트 < 루비 < 설파이트 < 히룸.","10강 이상 강화의 재료로 쓰입니다 (무기 · 스킬북은 루비, 갑옷은 설파이트, 16강부터는 히룸도). 랜덤 스킬북 · 트랙터 재료로도 들어갑니다. → [장비](#growth-gear) · [강화](#growth-enhance)","판매는 아르덴의 광부 키레이에게 합니다."]},{"slot":{"id":"지역-코자-광물","need":"코자 대륙 지하에서 루비 · 설파이트 · 히룸 광석이 박힌 벽"}}]},{"h":"광맥 핵","blocks":[{"p":"광석을 캘 때 2% 확률로 「광맥 핵」 미니게임이 열립니다. 빛나는 약점 3개를 곡괭이로 때려 맞히면 드롭이 2배, 모두 완벽하게 맞히면 3배가 됩니다. 루비 · 설파이트 · 히룸 같은 특수 광석에도 적용됩니다. → [광맥](#life-bonanza)"}]},{"h":"코자 대륙 구조물","blocks":[{"p":"코자 대륙에는 이곳에만 생기는 구조물 6종이 있습니다. 다가가면 몬스터가 나오고, 모두 처치하면 상자를 감정해 보상을 받습니다. 별이 높을수록 감정 보상이 2~5배로 늘어나고, 30분 뒤 다시 몬스터가 채워집니다. 구조물을 정복하면 [근원](#growth-origin) 3개도 받습니다."},{"table":{"cols":["난이도","구조물","권장 장비"],"rows":[["★1","변이 감염 마을","네더라이트 풀세트 +0~4강"],["★2","운석 분화구 기지","네더라이트 풀세트 +4~8강"],["★3","고대 화석 발굴장","네더라이트 풀세트 +8~12강"],["★4","거대 곤충 군락","네더라이트 풀세트 +12~16강"],["★5","변이 연구소","네더라이트 풀세트 +16~20강"],["★6","고대 거인 요새","네더라이트 풀세트 +20~24강"]]}},{"note":{"b":"생각보다 쉽습니다","t":"오버월드 · 네더 구조물은 다이아 장비로도, 코자 대륙 구조물은 네더라이트 0강부터 혼자 클리어할 수 있게 맞춰져 있습니다. 표의 권장 장비는 구조물에 다가가면 화면에 뜨는 값이고, 그보다 낮아도 도전해 볼 만합니다."}},{"p":"코자 대륙 구조물 상자에서는 랜덤 스킬북 5단계 재료인 **드래곤 이빨**과, 재련대 4 → 5단계 승급 재료인 **잠식된 심장**이 나옵니다. → [야생 구조물](#combat-structures) · [상자 감정](#life-appraisal)"},{"slot":{"id":"지역-코자-구조물","need":"코자 대륙에 생긴 구조물(예: 변이 감염 마을)을 멀리서 찍은 전경"}}]},{"h":"운석 낙하","blocks":[{"p":"60~100분마다 코자 대륙 어딘가에 운석이 떨어집니다. 떨어지기 3분 전에 전체 공지로 대략의 좌표가 알려지고, 화면 위에 방향을 알려 주는 막대가 뜹니다. 운석이 떨어질 때 충격파로 밀려나지만 피해는 없습니다."},{"table":{"cols":["운석","나올 확률","캘 수 있는 횟수","한 번에 얻는 것","키레이 판매가"],"num":[1],"rows":[["금맥 운석","60%","40~52번","운석 금덩이 1~2개","1,400원"],["수정맥 운석","40%","30~40번","별빛 수정 1개","3,200원"]]}},{"list":["철 곡괭이 이상으로 운석을 좌클릭하면 1번에 1개씩 캡니다. 한 사람당 2초에 한 번입니다.","여러 사람이 함께 캘 수 있습니다. 다 캐거나 25분이 지나면 사라집니다.","수정맥 운석을 캐면 6% 확률로 주변에 화석 흙블록이 생깁니다.","판매는 광부 키레이의 「운석 거래」 창에서, 1인 하루 40개부터 광질 레벨이 오를수록 늘어 최대 120개까지입니다.","운석을 캘 때마다 20% 확률로 [근원](#growth-origin) 1~2개가 나옵니다."]},{"links":[["#life-meteor","운석","운석 낙하 자세히"]]}]},{"h":"화석 발굴","blocks":[{"p":"코자 대륙 Y 40 아래에서 돌 · 심층암 · 응회암 · 안산암 · 섬록암 · 화강암을 캘 때 0.3% 확률로 화석 흙블록이 나타납니다. 10분이 지나면 다시 돌로 돌아가니 바로 파세요. 솔을 들고 우클릭한 뒤 쉬프트를 누른 채 시점을 움직여 흙을 털어 냅니다. 너무 세게 긁으면 보존도가 떨어집니다."},{"table":{"cols":["생물","조각 3종","조각 기준가","골격 기준가","많이 나오는 깊이"],"num":[2,3],"rows":[["고대 어룡","머리뼈 · 등뼈 · 꼬리지느러미","3,000원","60,000원","Y 10~40"],["매머드","엄니 · 어금니 · 등뼈","6,000원","120,000원","Y 10~40"],["뿔공룡","뿔 머리뼈 · 갈비뼈 · 다리뼈","4,000원","80,000원","Y -20~9"],["익룡","부리 머리뼈 · 날개뼈 · 발톱","5,000원","100,000원","Y -21 아래"]]}},{"list":["같은 생물의 조각 3종을 모으면 골격으로 복원할 수 있고, 보존도가 평균보다 5 오릅니다.","판매가 = 기준가 × (0.5 + 0.5 × 보존도). 보존도가 높을수록 비쌉니다.","판매는 광부 키레이의 「화석 거래」 창에서, 1인 하루 10개부터 광질 레벨이 오를수록 늘어 최대 30개까지입니다.","박물관 화석관에 기증할 수도 있습니다. → [박물관](#collect-museum)","화석을 털어낼 때마다 30% 확률로 [근원](#growth-origin) 1~2개가 나옵니다."]},{"links":[["#life-fossil","화석 발굴","붓질 미니게임 자세히"]]}]},{"h":"곤충 채집","blocks":[{"p":"아르덴의 곤충 수집가 모스에게서 잠자리채(3,000원)를 사서 코자 대륙으로 갑니다(야생 1 · 2 · 3에도 나오지만 코자 대륙보다 드뭅니다). 풀숲 · 꽃밭 · 물가를 날아다니는 곤충에게 잠자리채를 들고 좌클릭하면 그물 미니게임이 열리고, 쉬프트로 그물을 씌웁니다. 기회는 3번이고, 가운데에 정확히 맞히면 크기가 커집니다."},{"table":{"cols":["곤충","등급","기준가","나오는 때 · 곳"],"num":[2],"rows":[["칠성무당벌레","흔함","500원","낮 · 들판 · 숲 · 초원"],["배추흰나비","흔함","600원","낮 · 들판 · 꽃숲 · 숲"],["고추잠자리","흔함","700원","낮 · 들판 · 초원 · 강가"],["달팽이","보통","1,200원","비 올 때 · 숲 · 늪 · 타이가 · 정글"],["반딧불이","보통","1,400원","밤 · 늪 · 숲 · 강가 · 들판"],["호랑나비","보통","1,500원","낮 · 꽃숲 · 초원 · 벚꽃숲"],["쇠똥구리","보통","1,600원","낮 · 밤 · 사막 · 악지 · 사바나"],["사마귀","희귀","3,800원","낮 · 초원 · 들판 · 사바나 · 정글"],["사슴벌레","희귀","4,000원","밤 · 숲 · 어두운 숲"],["왕잠자리","희귀","4,200원","낮 · 늪 · 맹그로브 · 강 (물가)"],["모르포나비","희귀","4,500원","낮 · 정글"],["장수풍뎅이","아주 희귀","9,000원","밤 · 숲 · 어두운 숲 · 정글"]]}},{"list":["크기가 클수록 비싸게 팝니다. 판매는 모스의 창에서, 1인 하루 30마리부터 사냥 레벨이 오를수록 늘어 최대 90마리까지입니다.","잡은 곤충은 도감 「곤충」과 박물관 곤충관에 기록됩니다.","곤충을 잡을 때마다 20% 확률로 [근원](#growth-origin) 1개가 나옵니다."]},{"links":[["#life-insect","곤충 채집","그물 미니게임 자세히"]]},{"note":{"b":"동물 포획","t":"코자 대륙에서는 올가미로 동물도 잡을 수 있습니다. 잡은 동물은 `/포획창` 에서 기릅니다. → [동물 포획](#life-ranch)"}}]},{"h":"보물지도","blocks":[{"p":"보물지도는 낚시 · 채집 · 광석 캐기 · 몬스터 사냥 중에 낮은 확률로 나옵니다(1인 하루 3장, 광질 레벨이 오를수록 최대 9장). 코자 대륙에서 손에 들면 실제 지형 지도에 붉은 X가 표시됩니다. X 자리 땅을 아무 도구나 맨손으로 파면 보물 상자가 나옵니다. 지도를 들고 X에서 48칸 밖에 있으면 액션바에 「보물은 ○쪽 약 N칸」(8방위)이 1초마다 뜨고, 48칸 안에서는 가까워졌다는 안내가 나옵니다. 다른 서버에서는 지도가 펼쳐지지 않습니다."},{"table":{"cols":["지도","나올 확률","X까지 거리","돈","마일리지","특징"],"rows":[["낡은 보물지도","60%","250~600블록","3,000~6,000원","—","8% 확률로 선장의 보물지도"],["선장의 보물지도","28%","400~900블록","8,000~15,000원","5~10","6% 확률로 해적왕의 보물지도"],["해적왕의 보물지도","10%","600~1,300블록","20,000~35,000원","15~25","수호자 몬스터 등장 · 4% 확률로 고대 왕국의 보물지도"],["고대 왕국의 보물지도","2%","800~1,800블록","60,000~100,000원","40~60","수호자 몬스터 등장 · 찾으면 전체 공지"]]}},{"p":"보물 상자를 찾으면 [근원](#growth-origin)도 나옵니다: 낡은 보물 상자 50% 확률로 1~2개 · 선장의 보물 상자 70% 확률로 1~3개 · 해적왕의 보물 상자 2~4개 · 고대 왕국의 보물 상자 5~8개."},{"p":"수호자가 나온 뒤 40칸 넘게 멀어지거나 5분이 지나면 보물이 다시 묻힙니다. → [보물지도](#life-treasure)"},{"slot":{"id":"지역-코자-보물지도","need":"코자 대륙에서 보물지도를 손에 든 모습 — 지도 위 붉은 X가 보이게"}}]}],"search":[["코자","대륙"],["코자 대륙 포탈","코자 대륙"],["루비","광물"],["설파이트","광물"],["히룸","광물"],["운석","코자 대륙"],["화석","코자 대륙"],["곤충","코자 대륙"],["보물지도","코자 대륙"],["잠자리채","곤충"],["코자 포탈석","코자 대륙"],["코자 구조물","코자 대륙"],["드래곤 이빨","코자 대륙"]]},"life-appraisal":{"id":"life-appraisal","parent":"life","title":"상자 감정","short":"야생 · 코자 대륙의 자연 상자를 우클릭해 자물쇠 따기 · 금고 다이얼로 엽니다.","color":"var(--r-rare)","tags":[["야생 · 코자 대륙",null],["자물쇠 · 다이얼",null],["상자마다 1인 1번","lv"]],"lede":"야생과 코자 대륙에 원래 있던 상자(플레이어가 놓지 않은 상자)는 그냥 열리지 않고, 우클릭하면 감정 미니게임이 시작됩니다. 자물쇠 따기와 금고 다이얼 중 하나가 무작위로 나오고, 성공하면 보상 창에서 랜덤 상자를 받습니다. 같은 상자는 사람마다 한 번씩 감정할 수 있습니다.","info":{"title":"상자 감정","slot":{"id":"생활-감정-대표","need":"야생 상자를 우클릭해 자물쇠 따기 미니게임이 뜬 화면"},"rows":[["장소","[야생](#world-wild) · [코자 대륙](#koza)"],["대상","자연 생성 상자 · 야생 구조물 상자"],["미니게임","자물쇠 따기 / 금고 다이얼 (무작위)"],["조작","웅크리기(Shift) 탭 · 다이얼은 마우스 휠"],["재감정","같은 상자는 1인 1번"],["보상","야생 → 오버월드 · 네더 → 네더월드 · 코자 대륙 → 코자대륙 랜덤 상자"],["도움말","`/상자감정 도움말`"]]},"sections":[{"h":"자물쇠 따기","blocks":[{"list":["바늘이 좌우로 왔다 갔다 합니다. 바늘이 **초록 칸**에 있을 때 웅크리기(Shift)를 톡 누르면 핀 하나가 열립니다.","핀 3개를 모두 열면 성공입니다. 핀마다 초록 칸 위치가 바뀌고 바늘이 10%씩 빨라집니다.","초록 칸 밖에서 누르면 바로 실패합니다. 제한 시간은 30초입니다."]},{"slot":{"id":"생활-감정-자물쇠","need":"자물쇠 따기에서 바늘이 초록 칸에 들어온 순간"}}]},{"h":"금고 다이얼","blocks":[{"list":["마우스 휠(핫바 넘기기)로 12칸짜리 다이얼을 돌리고, 웅크리기(Shift)로 확정합니다. 3자리를 순서대로 맞춥니다. 휠을 굴려도 손에 든 핫바 칸은 바뀌지 않고, 한 번 굴릴 때마다 다이얼이 한 칸씩 돕니다.","숫자는 보이지 않습니다. 소리와 테두리 색으로 맞힙니다: **회색** = 멀다(3칸 이상), **노랑** = 가깝다(1~2칸), **초록** = 정답.","한 자리를 맞히면 다음 자리는 반드시 다른 곳(2칸 이상 떨어진 곳)에 있습니다.","틀린 자리에서 확정하면 바로 실패합니다. 다이얼은 30번까지 돌릴 수 있고, 제한 시간은 20초입니다."]}]},{"h":"공통 규칙","blocks":[{"list":["미니게임 중에는 제자리에 고정되고, 블록 설치 · 파괴 · 아이템 사용 · 공격이 막힙니다.","감정 중에 공격 · 낙하 등으로 피해를 입으면 감정이 **중단**됩니다. 실패로 치지 않으니 그 상자를 다시 감정할 수 있고, 10분 안에 다시 하면 같은 미니게임이 나옵니다.","틀리거나 시간이 다 되면 실패입니다. 감정 중에 접속을 끊거나 서버를 옮겨도 실패로 끝납니다. 실패하면 보상이 없고, 그 상자는 다시 감정할 수 없습니다.","성공하면 보상 수령 창이 열립니다. 창에서는 보상을 꺼내기만 할 수 있고, 꺼내지 않고 닫아도 남은 보상은 인벤토리로 들어옵니다(가득 차면 발밑).","상자는 사라지지 않습니다. 대신 이미 감정한 상자를 바라보면 빨간 테두리와 「이미 감정한 상자입니다」가 뜹니다. 감정하지 않은 다른 사람은 그 상자를 감정할 수 있습니다.","감정 상자 옆에 상자를 붙여 큰 상자로 만들 수 없습니다(웅크려 놓으면 따로 놓임). 직접 놓은 상자는 감정 없이 그냥 열립니다.","처음 5번은 시작할 때 채팅으로 자세한 설명이 나오고, 화면 아래에 늘 조작법이 떠 있습니다.","[야생 구조물](#combat-structures)을 제압하면 나오는 상자는 감정 보상이 별 등급에 따라 늘어납니다(★1~2 2배 · ★3~4 3배 · ★5 4배 · ★6 5배). 구조물은 제압하고 30분 뒤 다시 몬스터가 지키는데, 다시 제압하면 그 상자들을 또 감정할 수 있습니다.","[일일 퀘스트](#quest-daily)에 「구조물 상자 감정」(1번)이 매일 나옵니다."]}]},{"h":"얻는 랜덤 상자","blocks":[{"p":"감정 보상으로 나오는 랜덤 상자는 우클릭해 열면 아래 물건이 **각각 따로** 확률로 나옵니다(여러 개가 한 번에 나올 수 있음)."},{"cards":[{"h":"오버월드 랜덤 상자","color":"var(--reg-forest)","p":"야생(오버월드)의 상자를 감정하면 얻습니다.","dl":[["철 주괴 5","100%"],["철 주괴 1","80%"],["철 주괴 1","60%"],["금 주괴 2","100%"],["금 주괴 1","80%"],["금 주괴 1","60%"],["다이아몬드 1","50%"],["다이아몬드 1","30%"],["드래곤 알 1","2%"]]},{"h":"네더월드 랜덤 상자","color":"var(--reg-volcano)","p":"야생 서버 네더의 상자를 감정하면 얻습니다.","dl":[["다이아몬드 3","100%"],["다이아몬드 2","60%"],["다이아몬드 1","30%"],["철 주괴 16","100%"],["철 주괴 4","60%"],["금 주괴 12","100%"],["금 주괴 2","60%"],["네더라이트 주괴 1","20%"],["네더라이트 강화 대장장이 형판 1","40%"],["네더라이트 강화 대장장이 형판 1","20%"],["빙하 점액 1","30%"],["빙하 점액 1","10%"]]},{"h":"코자대륙 랜덤 상자","color":"var(--gold)","p":"코자 대륙의 상자를 감정하면 얻습니다.","dl":[["드래곤 알 1","4%"],["다이아몬드 4","100%"],["다이아몬드 1","70%"],["다이아몬드 1","50%"],["루비 원석 1","35%"],["루비 원석 1","15%"],["설파이트 원석 1","25%"],["설파이트 원석 1","10%"],["히룸 원석 1","5%"],["네더라이트 파편 1","50%"],["네더라이트 파편 1","20%"],["드래곤 이빨 1","20%"],["드래곤 이빨 1","8%"],["잠식된 심장 1","8%"]]}]},{"p":"드래곤 알은 설치하면 드래곤 펫이 부화합니다. 루비 · 설파이트 · 히룸 원석은 용광로에서 조각으로 녹이고, 조각 9개로 [강화](#growth-enhance) 재료인 루비 · 설파이트 · 히룸을 만듭니다. 빙하 점액과 드래곤 이빨은 [랜덤 스킬북](#growth-skillbook) 4단계 · 5단계 제작 재료입니다."}]}],"search":[["자물쇠 따기","상자 감정"],["금고 다이얼","상자 감정"],["오버월드 랜덤 상자","상자 감정"],["코자대륙 랜덤 상자","상자 감정"],["야생 상자","상자 감정"],["네더월드 랜덤 상자","상자 감정"],["드래곤 이빨","상자 감정"],["빙하 점액","상자 감정"]]},"life-bonanza":{"id":"life-bonanza","parent":"life","title":"광맥 핵 · 황금 수확","short":"광석 캘 때 2% · 채집할 때 6% 뜨는 보너스 미니게임. 성공 2배, 완벽 3배.","color":"var(--gold)","tags":[["광질 2%",null],["채집 6%",null],["최대 3배","lv"]],"lede":"광석을 캐거나 채집물을 캘 때 가끔 보너스 미니게임이 뜹니다. 잘 맞추면 그번에 얻는 양이 2배, 완벽하면 3배가 됩니다. 실패해도 원래 얻을 몫은 그대로 받으니 부담 없이 도전하면 됩니다.","info":{"title":"보너스 미니게임","slot":{"id":"생활-광맥-대표","need":"광맥 핵 두드리기에서 수정 약점 ✦ 3개와 줄어드는 고리가 보이는 순간"},"rows":[["광맥 핵","광석 한 번 휘두를 때 2%"],["황금 수확","채집 한 번에 6%"],["재사용 대기","각 45초"],["성공 / 완벽","×2 / ×3"],["실패","기본 드롭은 그대로"]]},"sections":[{"h":"광맥 핵 두드리기 (광질)","blocks":[{"steps":[{"h":"광석을 캔다","p":"광석을 곡괭이로 칠 때마다 2% 확률로 그 자리에 수정이 솟고 빛나는 약점 ✦ 3개가 나타납니다."},{"h":"고리가 가장 밝을 때 때린다","p":"약점마다 고리가 줄어듭니다. 고리가 다 줄어 가장 밝을 때 곡괭이로 때리면 「완벽」, 그 전후로 맞히면 「좋아」입니다."},{"h":"결과","p":"3개를 모두 맞히면 드롭 ×2, 3개 모두 완벽이면 ×3, 하나라도 놓치면 보너스 없이 원래대로 받습니다."}]},{"list":["대상: 석탄 · 구리 · 철 · 금 · 레드스톤 · 청금석 · 에메랄드 · 다이아몬드 광석(심층암 포함), 네더 금 · 석영 광석, 고대 잔해, 그리고 루비 · 설파이트 · 히룸 같은 특수 광석.","실크터치로 캔 광석도 됩니다.","멀티채굴 [램프](#growth-lamp)로 함께 캔 블록에도 모두 배수가 붙습니다. 다만 미니게임이 뜰지는 직접 캔 광석으로만 정해지고, 램프로 같이 부서진 블록으로는 뜨지 않습니다.","직접 설치한 광석에서는 뜨지 않습니다.","약점을 맞히는 동안 8칸 넘게 멀어지면 실패합니다.","한 번 뜨면 45초 동안은 다시 뜨지 않습니다. 서버 공지는 없습니다."]}]},{"h":"황금 수확 (채집)","blocks":[{"p":"[땅 · 바다 채집](#life-gathering)을 시작할 때 6% 확률로 두 미니게임 중 하나가 무작위로 나옵니다."},{"cards":[{"h":"황금 수확 순간","color":"var(--gold)","p":"채집 게이지에 금빛 구간이 나타납니다. 게이지가 금빛 구간에 들어왔을 때 웅크리기(Shift)를 누르면 「좋아」 ×2, 구간 한가운데면 「완벽」 ×3. 금빛 구간이 뜬 채집은 램프로 빨라도 최소 4초 걸립니다."},{"h":"황금 씨앗 잡기","color":"var(--gold)","p":"채집을 마치면 금빛 씨앗 5개가 하나씩 튀어 오릅니다. 씨앗을 조준해 클릭(좌 · 우 아무거나)해서 잡으세요. 5개를 모두 잡으면 ×3, 3개 이상이면 ×2입니다."}]},{"list":["넓은낫질 [램프](#growth-lamp)처럼 여러 채집물을 함께 캐는 효과가 있으면 그 채집물 전부에 배수가 붙습니다.","배수는 채집물에만 붙고, 농사 경험치는 그대로입니다.","한 번 뜨면 45초 동안은 다시 뜨지 않습니다. 실패해도 기본 채집량은 받습니다."]}]}],"search":[["광맥 핵","광질"],["황금 수확","채집"],["황금 씨앗","채집"],["보너스 미니게임","생활"]]},"life-cooking":{"id":"life-cooking","parent":"life","title":"요리 · 가공 · 연금술","short":"가공대 → 요리솥 → 무역상인. 요리 31 · 연금술 15 · 가공 37 레시피 전체.","color":"var(--reg-volcano)","tags":[["요리 31",null],["연금술 15",null],["가공 37",null],["특제 요리 · 향신료","lv"]],"lede":"요리는 코자 온라인에서 가장 꾸준한 돈벌이입니다. 가공대에서 밀가루 · 손질한 고기 · 천일염 같은 재료를 만들고, 요리솥에서 요리를 만들어 무역상인 나가에게 팝니다. 연금술 솥에서는 낚시로 얻은 손질된 살과 바다 채집물로 전투 · 수중 탐사용 물약을 만듭니다.","info":{"title":"요리 · 가공 · 연금술","slot":{"id":"생활-요리-대표","need":"요리솥을 우클릭해 연 요리 목록 창"},"rows":[["가공대","참나무 판자 7 + 철 주괴 2 (제작대)"],["요리솥","조약돌 6 + 석탄 2 + 부싯돌 1 (제작대)"],["연금술 솥","조약돌 6 + 석탄 3 (제작대)"],["한 번에 만드는 양","1 · 2개 → 레벨에 따라 최대 20개"],["직업 경험치","요리 20~60 · 연금술 35~45 (가공은 없음)"],["근원","요리 · 연금술을 만들 때마다 5% · 1개 ([근원](#growth-origin))"],["판매","[무역상인 나가](#life-trade)"],["관련 직업","[요리 · 연금술](#growth-jobs)"]]},"sections":[{"h":"만드는 법","blocks":[{"steps":[{"h":"작업대를 놓는다","p":"가공대 · 요리솥 · 연금술 솥은 제작대 조합으로 만들어 원하는 곳에 놓는 가구입니다. 이미 놓인 것을 써도 됩니다."},{"h":"우클릭해 레시피를 고른다","p":"목록 창에서 만들 것을 누르면 필요한 재료와 결과물이 보입니다. 재료가 있으면 「충분함」, 모자라면 「부족함」으로 표시됩니다."},{"h":"제작하기","p":"재료가 빠지고 결과물이 들어옵니다. 가방이 가득 차면 넘친 것은 우편함으로 갑니다. 요리 · 연금술은 레벨이 오를수록 결과물이 2배로 나올 확률이 2%에서 최대 30%까지 오릅니다(가공은 해당 없음)."}]},{"note":{"b":"재료는 대부분 농사 · 가축 · 바다","t":"요리 23종은 농작물 · 고기 · 우유 · 달걀과 아르덴 · 듄가르드 앞바다 채집물로 만듭니다. 고기 · 우유 · 달걀은 [동물 포획](#life-ranch)으로 기르는 동물에게서 20분마다 받을 수 있습니다(마을 서버에서는 동물이 저절로 생기지 않습니다). 무역상인은 요리를 손이 가는 정도에 따라 간단 ×0.75 · 보통 ×1.0 · 정성 ×1.3 값으로 사고, 하루 한도는 요리를 합쳐서 셉니다. 바다 채집물이 들어가는 정성 요리가 가장 비싸고, 야채 스프 같은 간단 요리는 싸지만 밭 작물만으로 만들 수 있습니다."}},{"p":"**한 번에 여러 개**: 제작 창 위쪽 수량 버튼으로 한 번에 만들 개수를 고릅니다. 요리솥과 가공대는 요리 레벨, 연금술 솥은 연금술 레벨을 봅니다. 걸리는 시간은 1개 만들 때와 같고, 경험치와 2배 확률은 1개씩 만든 것과 똑같이 셉니다."},{"table":{"cols":["한 번에 만드는 양","필요 레벨"],"rows":[["1개 · 2개","처음부터"],["5개","Lv 300"],["15개","Lv 750"],["20개","Lv 1000"]]}},{"p":"**돌려받는 그릇**: 우유 양동이를 재료로 쓰면 쓴 만큼 빈 양동이를 돌려받습니다. 연금술에서 물병이 들어가는 포션은 완성하면 빈 병을 돌려받고, 한 번에 여러 개를 만들어도 물병은 1개만 씁니다."}]},{"h":"요리 23종 (요리솥)","blocks":[{"table":{"cols":["요리","재료","나가 값"],"rows":[["감자 그라탕","감자 2 + 치즈 1 + 버터 1","보통 3,800원"],["감자 스튜","감자 2 + 돼지 앞다리살 1","간단 2,850원"],["닭가슴살 샐러드","닭 가슴살 1 + 당근 1 + 비트 1","간단 2,850원"],["닭다리 구이","닭 다리살 1 + 당근 1 + 감자 1","간단 2,850원"],["따개비 국","따개비 4 + 다시마 육수 1 + 천일염 1","정성 4,940원"],["미역국","말린 미역 2 + 다시마 육수 1 + 천일염 1","보통 3,800원"],["버섯 리조또","쌀 1 + 빨간 버섯(일반) 1 + 버터 1","보통 3,800원"],["삼겹살 구이","돼지 삼겹살 2","간단 2,850원"],["성게 덮밥","성게 2 + 파래 가루 1 + 쌀 1","정성 4,940원"],["소갈비찜","소 갈비살 1 + 감자 1 + 당근 1 + 설탕 시럽 1","보통 3,800원"],["소고기 스테이크","소 등심 1 + 버터 1","보통 3,800원"],["소시지 야채볶음","소시지 1 + 당근 1 + 호박 1","보통 3,800원"],["야채 스프","당근 1 + 감자 1 + 비트 1","간단 2,850원"],["양갈비 구이","양 갈비살 2","간단 2,850원"],["전복죽","전복 2 + 밀가루 1 + 천일염 1","정성 4,940원"],["조개 술찜","바지락 5 + 천일염 1","보통 3,800원"],["치즈 오믈렛","달걀 2 + 치즈 1","간단 2,850원"],["크림 파스타","면 1 + 치즈 1 + 버터 1","보통 3,800원"],["토마토 파스타","면 1 + 비트 2","보통 3,800원"],["함박 스테이크","고기 패티 1 + 버터 1 + 당근 1","보통 3,800원"],["해물 국수","면 1 + 바지락 3 + 다시마 육수 1","정성 4,940원"],["해물 파전","파래 가루 1 + 바지락 2 + 밀가루 1 + 천일염 1","정성 4,940원"],["해삼 볶음","해삼 2 + 천일염 1 + 당근 2","정성 4,940원"]]}},{"p":"「쌀」은 가공대에서 밀 2개로 만듭니다. 「빨간 버섯(일반)」은 바닐라 빨간 버섯이고, 버섯 간장에 쓰는 미스틱글렌 채집물 「빨간버섯」과 다릅니다. 나가 값은 요리 Lv1 · 시세 1.0 기준입니다. 요리는 들고 우클릭해 먹을 수도 있습니다."}]},{"h":"특제 요리 · 향신료","blocks":[{"p":"이미 만든 요리 1그릇에 그 지역 땅 채집물로 만든 향신료(또는 채집물)를 더하면 **특제 요리**가 됩니다. 무역상인 나가가 기준 5,700원에 사 주고, 일반 요리와 **따로 하루 30그릇**(요리 레벨에 따라 최대 120그릇)을 받습니다."},{"table":{"cols":["특제 요리 (요리솥)","재료"],"rows":[["특제 네잎 샐러드","닭가슴살 샐러드 1 + 네잎클로버 1"],["특제 버섯간장 삼겹살","삼겹살 구이 1 + 버섯 간장 1"],["특제 베리소스 함박","함박 스테이크 1 + 열매잼 1"],["특제 빛버섯 크림 파스타","크림 파스타 1 + 빛나는버섯 1"],["특제 선인장 갈비찜","소갈비찜 1 + 선인장 시럽 1"],["특제 클로버 페스토 파스타","토마토 파스타 1 + 클로버 페스토 1"],["특제 허브솔트 스테이크","소고기 스테이크 1 + 허브솔트 1"],["특제 화산 짬뽕","해물 국수 1 + 불씨 고춧가루 1"]]}},{"table":{"cols":["향신료 (가공대)","재료","채집 지역"],"rows":[["열매잼","야생열매 5","[아르덴](#arden)"],["선인장 시럽","선인장 3","[듄가르드](#dunegard)"],["불씨 고춧가루","데스블룸 2","[이그니스포](#ignispo)"],["클로버 페스토","세잎클로버 3","[베르단트룸](#verdantrum)"],["버섯 간장","빨간버섯 2","[미스틱글렌](#mysticglen)"],["허브솔트","마법허브 1 + 천일염 1","[프로스트하버](#frostharbor)"]]}},{"slot":{"id":"생활-요리-특제","need":"특제 요리 아이템 설명(금빛 반짝임 아이콘)이 보이는 화면"}}]},{"h":"가공 37종 (가공대)","blocks":[{"table":{"cols":["분류","결과물","재료"],"rows":[["기본 재료","밀가루","밀 3"],["기본 재료","쌀","밀 2"],["기본 재료","면","밀가루 2"],["기본 재료","가공된 우유 ×2","우유 양동이 1 (빈 양동이 돌려받음)"],["기본 재료","버터","가공된 우유 2"],["기본 재료","치즈","가공된 우유 3"],["기본 재료","설탕 시럽","설탕 3"],["고기 손질","소 등심","생소고기 2"],["고기 손질","소 갈비살","생소고기 2"],["고기 손질","돼지 삼겹살","생돼지고기 2"],["고기 손질","돼지 앞다리살","생돼지고기 2"],["고기 손질","양 다리살","생양고기 2"],["고기 손질","양 갈비살","생양고기 2"],["고기 손질","닭 가슴살","생닭고기 2"],["고기 손질","닭 다리살","생닭고기 2"],["고기 손질","고기 패티","소 등심 1 + 밀가루 1"],["고기 손질","소시지","돼지 삼겹살 1 + 밀가루 1"],["바다 재료","천일염","소금꽃 2"],["바다 재료","다시마 육수","다시마 3"],["바다 재료","말린 미역","미역 3"],["바다 재료","파래 가루","파래 4"],["바다 재료","농축 해면","해면 2"],["바다 재료","먹물","먹물주머니 2"],["바다 재료","진주","진주조개 3"],["바다 재료","진주 가루","진주 1"],["바다 재료","산
