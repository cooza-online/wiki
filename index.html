목록과 얻는 법"],["#conv-settings","개인설정 · 알림 배너","내 네임태그 보기 켜고 끄기"],["#shop-membership","멤버십","VIP · MVP 칭호"]]}]}],"search":[["네임태그","이름표"],["닉네임 변경권","닉네임"],["칭호북","칭호"],["/칭호","명령어"],["[i]","채팅 아이템 자랑"],["전설의 기수","탈것 칭호"]]},"style-pets":{"id":"style-pets","parent":"style","title":"펫 · 탈것 · 드래곤 알","short":"펫 메뉴로 소환하고 타는 법, 탈것 38종, 드래곤 알 12시간 부화와 성체 진화까지.","color":"var(--reg-forest)","tags":[["/pets",null],["탈것 38종",null],["드래곤 8속성","lv"],["부화 12시간",null]],"lede":"펫은 옆에서 따라다니고, 탈것은 올라타서 달리거나 날아다닙니다. 둘 다 펫 랜덤 상자나 탈것 랜덤 상자에서 나오는 소환권으로 얻고, 탈것은 멋진 코인으로 골라 바꿀 수도 있습니다. 드래곤 알을 부화시키면 새끼 드라코닌이 나오고, 먹이를 줘서 100레벨까지 키우면 타고 다니는 성체 드래곤이 됩니다.","info":{"title":"펫 · 탈것","slot":{"id":"꾸미기-펫-대표","need":"탈것(히포그리프나 룬 수사슴)에 올라탄 캐릭터와 옆을 따라오는 펫"},"rows":[["펫 메뉴","`/pets` · 메인 메뉴(Shift+F) 「펫」 카드"],["분류","일반펫 · 탈것 · 트랙터"],["얻는 법","소환권 우클릭 · 드래곤 알 부화"],["따라오기","30칸 넘게 멀어지면 옆으로 순간이동"],["보호","펫은 다치거나 죽지 않음"],["드래곤 알 부화","12시간 · 마을 서버의 내 마을 땅"],["드래곤 성장","먹이 「태양 조각」 · 100레벨에 진화"]]},"sections":[{"h":"펫 메뉴 쓰는 법","blocks":[{"steps":[{"h":"소환권을 우클릭","p":"뽑기에서 받은 소환권을 들고 우클릭하면 그 펫이 계정에 등록됩니다. 소환권 1장이 쓰입니다."},{"h":"`/pets` 로 펫 메뉴 열기","p":"메인 메뉴 「펫」 카드로도 열립니다. 일반펫 · 탈것 · 트랙터 세 칸이 나옵니다. 칸을 고르면 가진 펫 목록이 보이고, 누르면 소환됩니다."},{"h":"탈것은 우클릭으로 탑승","p":"소환한 탈것을 우클릭하면 올라탑니다. 피해를 받으면 자동으로 내려집니다."},{"h":"웅크리고 우클릭하면 그 펫의 메뉴","p":"소환한 펫을 웅크린 채 우클릭하면 펫 메뉴가 다시 열리고 이름을 지어 줄 수 있습니다. 이름은 16자까지입니다."}]},{"list":["펫이 30칸 넘게 멀어지면 내 옆으로 순간이동해 따라옵니다.","접속을 끊었다 다시 들어오면 마지막에 소환해 둔 펫이 다시 나옵니다.","펫은 다른 플레이어나 몬스터에게 맞아도, 불 · 용암 · 낙하에도 다치지 않고 죽지 않습니다. 공허로 떨어지면 주인 곁으로 돌아옵니다.","펫 이름도 닉네임과 같은 규칙을 따릅니다. 욕설이나 부적절한 이름은 강제로 바뀝니다 ([규칙](#rules))."]},{"slot":{"id":"꾸미기-펫-메뉴","need":"`/pets` 로 연 펫 메뉴의 일반펫 · 탈것 · 트랙터 카테고리 화면"}}]},{"h":"탈것 38종","blocks":[{"p":"탈것 랜덤 상자(잼 7,900 · 마일리지 7,900)에서 38종 중 하나가 나옵니다. 등급이 높을수록 드뭅니다. 촌장으로 진급해도 상자 1개를 받습니다."},{"table":{"cols":["등급","종류","한 종류당","하늘을 나는 탈것 (나머지는 땅)"],"rows":[["커먼","7종","3.8%","없음"],["언커먼","7종","2.2%","없음"],["레어","10종","1.1%","히포그리프 · 수정 히포그리프 · 타락한 히포그리프 · 비취 하늘뱀 · 구름 가오리"],["에픽","9종","0.7%","로열 히포그리프 · 마그마 하늘뱀 · 태양 하늘뱀 · 유령 하늘뱀 · 오로라 두루미 · 등불 해파리"],["레전더리","5종","0.2%","불사조 · 구름 기린 · 하늘섬 거북"]],"num":[2]}},{"p":"이벤트 펫 상자(크리스마스 · 발렌타인 · 할로윈)에도 레전더리 탈것이 하나씩 0.6% 확률로 들어 있습니다 (순록 썰매 · 하트 풍선 고양이는 하늘, 호박 마차 유령말은 땅). 탈것 이름 전체는 [치장 · 펫 뽑기 상자](#style-gacha) 문서에 있습니다."},{"list":["레전더리를 뺀 탈것은 아르덴 보석상 아미나의 「탈것 고르기」에서 멋진 코인으로 직접 고를 수 있습니다 (커먼 30 · 언커먼 50 · 레어 80 · 에픽 150개). 이미 가진 탈것은 고를 수 없습니다.","등급이 있는 탈것을 타고 달리면 등급색 발자국(땅)이나 바람 흔적(하늘)이 남습니다. 에픽 이상은 반짝임이 더해지고, 높이 뛰었다 내려오면 착지 고리가 퍼집니다.","뽑기 상자에서 나오는 탈것을 모아 탈것 도감 38칸을 다 채우면 칭호 「전설의 기수」를 받습니다."]},{"p":"펫 메뉴의 「트랙터」 칸은 농사용 트랙터 자리입니다. 트랙터는 자기 마을 땅의 다 자란 작물을 자동으로 거둬 줍니다. 자세한 내용은 [농사](#life-farming) 문서에 있습니다."}]},{"h":"일반 펫 상자별 목록","blocks":[{"table":{"cols":["상자","종류","한 종류당","어디서"],"rows":[["일반 펫 랜덤 상자","19종 (큐비 16 · 상인 펫 2 · 자고새)","3.2%","잼 3,490 · 마일리지 3,490 · 장인 진급"],["슬라임 펫 랜덤 상자","12종 (수정 · 대지 · 불꽃 슬라임 등)","5.0%","잼 3,900"],["크리스마스 펫 랜덤 상자","9종 (큐비 8 · 순록 썰매)","펫 7.4% · 탈것 0.6%","지금은 상점에 없음"],["발렌타인 펫 랜덤 상자","8종 (큐비 7 · 하트 풍선 고양이)","펫 8.5% · 탈것 0.6%","지금은 상점에 없음"],["할로윈 펫 랜덤 상자","6종 (큐비 · 슬라임 5 · 호박 마차 유령말)","펫 11.9% · 탈것 0.6%","지금은 상점에 없음"]],"num":[]}},{"p":"상자마다 40%는 멋진 코인이 나옵니다. 이미 가진 펫이 나오면 소환권 대신 멋진 코인으로 바꿔 줍니다. 펫 이름 전체 목록은 [치장 · 펫 뽑기 상자](#style-gacha) 문서에 있습니다."}]},{"h":"드래곤 알 부화","blocks":[{"steps":[{"h":"드래곤 알 구하기","p":"야생 구조물 상자에서 나오는 「오버월드 랜덤 상자」에서 2%, 코자 대륙 구조물 상자에서 나오는 「코자대륙 랜덤 상자」에서 4% 확률로 나옵니다. 다른 플레이어와 거래하거나 유저 상점에서 살 수도 있습니다."},{"h":"내 마을 땅에서 설치","p":"마을 서버의 내 마을 땅 안에서 알을 들고 우클릭하면 그 자리에 알이 놓입니다. 다른 곳에서는 놓을 수 없습니다. 알 위에 내 이름과 남은 시간이 뜹니다."},{"h":"12시간 기다리기","p":"접속을 끊어도 시간은 흐릅니다. 다 되면 어느 서버에 있든 화면과 소리로 알려 줍니다. 「드래곤 즉시 부화 주문서」를 알에 쓰면 12시간이 줄어 바로 부화할 수 있습니다."},{"h":"알을 우클릭해 부화","p":"내 알만 부화시킬 수 있습니다. 아직 없는 속성 중 하나가 무작위로 나오고, 이미 가진 속성은 다시 나오지 않습니다. 8속성을 다 가지면 남은 알은 **멋진 코인 1~2개**로 바뀝니다. 놓아 둔 알을 깨우거나, 알 아이템을 손에 들고 우클릭하면(어느 서버에서든) 그 알 1개가 코인이 됩니다. 가방 속 알은 그대로라 거래할 수도 있습니다."}]},{"table":{"cols":["항목","값"],"rows":[["부화 시간","12시간"],["즉시 부화 주문서","부화 시간 −12시간 · 잼 6,900 또는 마일리지 6,900"],["나오는 것","새끼 드라코닌 8속성 중 하나 (중복 없음)"],["속성","불 · 어둠 · 물 · 구름 · 화산 · 독 · 숲 · 밤"]]}},{"slot":{"id":"꾸미기-펫-드래곤알","need":"마을 땅에 놓인 드래곤 알 위로 남은 부화 시간이 떠 있는 모습"}}]},{"h":"드래곤 키우기 · 진화","blocks":[{"list":["새끼 드래곤을 소환한 뒤 「태양 조각」을 들고 우클릭하면 1개가 먹이로 쓰이고 성장 경험치 10이 오릅니다.","레벨 하나 올리는 데 경험치 90, 곧 태양 조각 9개가 필요합니다. 1레벨에서 100레벨까지 태양 조각이 891개 듭니다.","맨손으로 우클릭하면 지금 레벨과 경험치, 다음 레벨까지 · 진화까지 남은 태양 조각 수를 보여 주는 창이 열립니다.","100레벨이 되면 성체 드라코닌으로 진화하고 전체 서버에 알림이 뜹니다. 새끼는 사라지고, 성체는 펫 메뉴의 탈것 칸에서 소환해 탑니다.","성체 드래곤은 하늘을 나는 탈것입니다. 사람이 달리는 것보다 훨씬 빠르지만, 상자에서 나오는 레어 등급 하늘 탈것보다는 조금 느립니다.","속성마다 따로 키웁니다. 불 드래곤을 다 키워도 물 드래곤은 1레벨부터입니다."]},{"note":{"b":"태양 조각 얻는 곳","t":"태양 조각은 농사를 하다가 얻는 재료입니다. 유저 상점이나 거래로도 구할 수 있습니다."}},{"lore":{"name":"드래곤 알","color":"#55FF55","lines":["재료 & 기타","","부화 드래곤 속성: 밤, 물, 불, 어둠, 구름, 화산, 숲, 독","이중 랜덤으로 한마리 부화, 중복 없음","획득 방법: 유저간 거래, 유저상점, 오버월드 구조물 상자"]}}]},{"h":"관련 문서","blocks":[{"links":[["#style-gacha","치장 · 펫 뽑기 상자","펫 상자 확률과 목록"],["#combat-structures","야생 구조물","드래곤 알이 든 상자를 찾는 곳"],["#conv-town","유저 마을","드래곤 알을 놓을 내 땅"]]}]}],"search":[["새끼 드라코닌","펫"],["성체 드라코닌","탈것"],["태양 조각","드래곤 먹이"],["드래곤 즉시 부화 주문서","드래곤 알"],["/pets","펫 메뉴"],["히포그리프","탈것"],["야생 바실리스크","탈것"],["탈것 고르기","탈것"],["전설의 기수","탈것 칭호"],["펫 무적","펫"]]},"style-slash":{"id":"style-slash","parent":"style","title":"검기 스킨 · 활 이펙트 스킨","short":"검을 휘두를 때 나가는 검기, 화살이 날아가는 효과를 바꾸는 스킨과 상자 확률.","color":"var(--r-legend)","tags":[["/검기스킨",null],["/활스킨",null],["상자 각 13종","lv"],["레전더리 2%",null]],"lede":"검으로 힘껏 휘두르면 검기가 나가고, 활을 끝까지 당겨 쏘면 화살에 효과가 붙습니다. 검기 스킨과 활 이펙트 스킨은 이 모양을 바꿉니다. 둘 다 랜덤 상자에서 스킨북으로 나오고, 스킨북을 우클릭하면 내 것이 됩니다.","info":{"title":"검기 · 활 스킨","slot":{"id":"꾸미기-검기-대표","need":"레전더리 검기 스킨(천뢰나 흑룡)의 3타가 터지는 순간"},"rows":[["장착 창","`/검기스킨` · `/활스킨` · 메인 메뉴 「검기」 · 「화살」 카드"],["상자 가격","잼 3,900 (각각)"],["상자 확률","커먼 45% · 언커먼 30% · 레어 16% · 에픽 7% · 레전더리 2%"],["결과물","스킨북 (우클릭하면 습득, 거래 가능)"],["기본 스킨","기본 검기 · 기본 화살"]]},"sections":[{"h":"검기는 이렇게 나갑니다","blocks":[{"list":["모든 검에서 나옵니다 (창 · 도끼 계열은 안 나갑니다). 공격 게이지가 90% 이상 찼을 때 좌클릭하면 검기가 나갑니다.","1.5초 안에 이어서 휘두르면 1타 · 2타 · 3타로 이어집니다. 1타와 2타는 좌우로 베고, 3타는 스킨마다 다른 마무리 동작이 나옵니다.","검기는 눈앞 약 2칸 깊이, 폭 3칸 범위를 벱니다. 피해는 손에 든 검의 공격력 그대로이고 강화 · 인첸트 · 램프 · 데미지 스킨도 똑같이 적용됩니다.","스킨이 바꾸는 것은 모양과 소리뿐입니다. 어떤 스킨을 끼워도 피해는 같습니다."]},{"note":{"b":"검 무기 스킬은 따로입니다","t":"네더라이트 검은 강화 단계에 따라 무기 스킬이 열립니다 (`/무기스킬`). 검기 스킨은 평타 검기의 모양만 바꾸고 무기 스킬과는 상관이 없습니다. 자세한 것은 [강화](#growth-enhance) 문서를 보세요."}}]},{"h":"검기 스킨 상자 확률","blocks":[{"p":"검기 스킨 랜덤 상자(잼 3,900)를 들고 우클릭하면 확률표가 열리고, 「보상 받기」를 누르면 13종 중 하나가 스킨북으로 나옵니다. 이미 가진 스킨이 나와도 스킨북으로 받으니 다른 사람에게 팔 수 있습니다. 이 상자는 한 번에 하나씩 열립니다."},{"table":{"cols":["등급","스킨","한 종류당","등급 합계","3타 마무리"],"num":[2,3],"rows":[["커먼","강철 검기","22.5%","45%","짧은 세 줄을 연달아 긋는 삼연격"],["커먼","나뭇잎 검기","22.5%","","몸을 한 바퀴 도는 회전 베기"],["언커먼","화염 검기","10.0%","30%","몸을 휘감는 불바퀴"],["언커먼","물결 검기","10.0%","","두 겹으로 밀려오는 해일"],["언커먼","번개 검기","10.0%","","앞으로 내지르는 번개 창"],["레어","벚꽃 검기","5.3%","16%","꽃이 피었다 흩날리는 벚꽃 일섬"],["레어","서리 검기","5.3%","","금이 가며 부서지는 빙결 일섬"],["레어","그림자 검기","5.3%","","두 그림자가 X 로 엇갈림"],["에픽","용린 검기","2.3%","7%","용 꼬리 + 바닥 비늘 고리"],["에픽","월광 검기","2.3%","","달 베기 + 바닥 보름달 문양"],["에픽","혈월 검기","2.3%","","핏빛 소용돌이 + 바닥 월식 문양"],["레전더리","천뢰 검기","1.0%","2%","낙뢰 두 번 + 뇌문 장판"],["레전더리","흑룡 검기","1.0%","","검은 용이 감고 돌아 비취 숨결"]]}},{"note":{"b":"상자에서 안 나오는 검기","t":"「기본 검기」는 모두가 처음부터 가집니다. 「오로라 별빛 검기」는 시즌패스 보상인데 시즌패스는 아직 준비 중입니다. 「첫 별」 · 「여명」은 첫 항해 사전 후원 한정입니다 ([후원](#shop-donate))."}}]},{"h":"활 이펙트는 이렇게 나갑니다","blocks":[{"list":["보통 활을 80% 이상 당겨 쏜 화살에만 붙습니다. 덜 당기면 보통 화살이고, 쇠뇌에는 붙지 않습니다.","쏠 때 발밑에 문양이 깔리고, 화살이 꼬리를 끌며 날아가고, 맞은 자리에서 효과가 터집니다. 에픽 · 레전더리는 날아가는 화살 뒤로 화살 분신이 따라갑니다.","화살 효과만 바뀝니다. 피해 · 사거리는 똑같습니다.","활의 생김새를 바꾸는 것은 [아이템 스킨](#style-itemskin)의 활 스킨입니다. 둘은 따로 끼울 수 있습니다."]}]},{"h":"활 이펙트 스킨 상자 확률","blocks":[{"p":"활 이펙트 스킨 랜덤 상자(잼 3,900)도 확률이 검기 상자와 같습니다. 13종 중 하나가 스킨북으로 나옵니다."},{"table":{"cols":["등급","스킨","한 종류당","등급 합계"],"num":[2,3],"rows":[["커먼","강철 화살","22.5%","45%"],["커먼","나뭇잎 화살","22.5%",""],["언커먼","화염 화살","10.0%","30%"],["언커먼","물결 화살","10.0%",""],["언커먼","번개 화살","10.0%",""],["레어","벚꽃 화살","5.3%","16%"],["레어","서리 화살","5.3%",""],["레어","그림자 화살","5.3%",""],["에픽","유성 화살","2.3%","7%"],["에픽","혈월 화살","2.3%",""],["에픽","용린 화살","2.3%",""],["레전더리","천뢰 화살","1.0%","2%"],["레전더리","불사조 화살","1.0%",""]]}},{"note":{"b":"상자에서 안 나오는 화살","t":"「기본 화살」은 처음부터 가집니다. 「오로라 별빛 화살」은 시즌패스 프리미엄 보상(준비 중)이고, 「개척의 신호탄」은 첫 항해 사전 후원 한정입니다 ([후원](#shop-donate))."}}]},{"h":"스킨북 쓰고 장착하기","blocks":[{"steps":[{"h":"스킨북 우클릭","p":"상자에서 나온 스킨북을 들고 우클릭하면 그 스킨이 계정에 들어옵니다. 우클릭하기 전에는 거래 · 유저 상점 판매가 됩니다."},{"h":"장착 창 열기","p":"검기는 `/검기스킨`, 활은 `/활스킨` 을 입력하거나 메인 메뉴(Shift+F)의 「검기」 · 「화살」 카드를 누릅니다. 가진 스킨이 카드로 나옵니다."},{"h":"고르고 미리보기","p":"카드를 누르면 장착, 카드 옆의 **눈 단추**를 누르면 미리보기입니다. 검기는 눈앞에서 1 · 2 · 3타를, 활은 눈앞으로 한 발을 보여 주고, 미리보기가 끝나면 스킨 화면이 같은 쪽으로 다시 열립니다. 스킨을 빼는 기능은 없고, 다른 스킨을 누르면 바뀝니다."}]},{"lore":{"name":"검기 스킨 랜덤 상자","color":"#9FD8FF","lines":["재료 & 기타","","◆ 검기 스킨 13종 중 하나가 나옵니다","커먼 45% · 언커먼 30% · 레어 16%","에픽 7% · 레전더리 2%","사용 방법: 들고 우클릭 → 확률표에서 「보상 받기」","뽑은 스킨은 스킨북으로 받습니다 (우클릭하면 습득)"]}}]},{"h":"관련 문서","blocks":[{"links":[["#style-damageskin","데미지 스킨","때릴 때 뜨는 숫자 모양"],["#style-itemskin","아이템 스킨","검 · 활의 생김새"],["#shop-seasonpass","시즌패스","오로라 별빛 스킨 (준비 중)"]]}]}],"search":[["검기","검기 스킨"],["천뢰 검기","레전더리"],["흑룡 검기","레전더리"],["불사조 화살","레전더리"],["스킨북","검기 · 활 스킨"],["/활스킨","명령어"],["/검기스킨","명령어"],["무기 스킬","검"]]},"style":{"id":"style","title":"꾸미기","short":"치장 · 펫 · 탈것 · 검기 · 활 · 데미지 스킨 · 이름표. 성능은 그대로, 겉모습만.","color":"var(--r-epic)","tags":[["성능 변화 없음",null],["대부분 잼 상점",null],["중복 펫은 멋진 코인",null]],"lede":"코자 온라인의 꾸미기는 전부 겉모습만 바꿉니다. 모자와 날개 같은 치장, 따라다니는 펫과 타고 다니는 탈것, 검을 휘두를 때 나가는 검기, 화살 이펙트, 몬스터를 때릴 때 뜨는 숫자 모양, 내 캐릭터가 추는 이모트까지 모을 수 있습니다. 공격력이나 능력치는 달라지지 않으니 마음에 드는 것만 골라 모으면 됩니다.","info":{"title":"꾸미기","slot":{"id":"꾸미기-대문-대표","need":"치장(모자·날개)을 입고 펫을 데리고 서 있는 캐릭터를 3인칭으로 찍은 모습"},"rows":[["주로 얻는 곳","보석상 아미나의 잼 상점 · 마일리지 상점"],["뽑기 상자","치장 8종 · 펫 6종 · 스킨 9종"],["입는 곳","치장은 아르덴 옷장 구역"],["스킨 바꾸기","메인 메뉴(Shift+F)의 「검기」 · 「화살」 · 「데미지」 카드 · 아이템 스킨은 `/아이템스킨`"],["중복","치장은 교환권 그대로(거래용) · 펫은 멋진 코인"],["여러 개 열기","같은 상자를 2개 이상 들면 「한번에 까기」"]]},"sections":[{"h":"무엇을 꾸밀 수 있나","blocks":[{"table":{"cols":["종류","바뀌는 것","얻는 법","바꾸는 곳"],"rows":[["치장","모자 · 날개 · 등짐 · 풍선","치장 랜덤 상자","아르덴 옷장 구역"],["펫 · 탈것","따라다니는 펫, 타는 탈것","펫 랜덤 상자 · 탈것 랜덤 상자 · 멋진 코인 교환 · 드래곤 알","`/pets` 펫 메뉴 (메인 메뉴 「펫」 카드)"],["아이템 스킨","검 · 곡괭이 · 도끼 · 괭이 · 낚싯대 · 활의 생김새","스킨 랜덤 상자","`/아이템스킨`"],["검기 스킨","검 평타의 검기 모양","검기 스킨 랜덤 상자","`/검기스킨` · 메인 메뉴 「검기」 카드"],["활 이펙트 스킨","화살이 날아가는 효과","활 이펙트 스킨 랜덤 상자","`/활스킨` · 메인 메뉴 「화살」 카드"],["데미지 스킨","때릴 때 뜨는 숫자 글꼴 · 색","데미지 스킨 랜덤 상자","`/데미지스킨` · 메인 메뉴 「데미지」 카드"],["칭호 · 이름표","머리 위 이름표 앞 칭호","칭호북","`/칭호` · 메인 메뉴 「칭호」 카드"],["[이모트](#style-emote)","내 캐릭터 모델이 추는 감정 표현","처음 4종 · 이모트 카드 · 첫 항해 사전 후원","`/이모트` · 메인 메뉴 「이모트」 카드"]]}}]},{"h":"처음이라면","blocks":[{"steps":[{"h":"잼이나 마일리지를 모읍니다","p":"뽑기 상자는 대부분 잼 상점에서 팝니다. 일부 상자는 일일 퀘스트 · 도전과제로 모으는 마일리지로도 살 수 있습니다."},{"h":"상자를 들고 우클릭합니다","p":"보상 목록과 확률표가 먼저 열립니다. 「보상 받기」를 눌러야 상자가 1개 쓰입니다. 치장 · 펫 · 아이템 스킨 상자는 같은 상자를 2개 이상 손에 들고 있으면 「한번에 까기」로 한꺼번에 열 수 있습니다."},{"h":"받은 아이템을 우클릭합니다","p":"치장은 교환권, 펫은 소환권, 검기 · 활 · 데미지 스킨은 스킨북, 아이템 스킨은 스킨 아이템으로 나옵니다. 교환권 · 소환권 · 스킨북은 우클릭하면 내 것이 되고, 쓰기 전에는 다른 사람과 거래할 수도 있습니다."},{"h":"장착합니다","p":"치장은 옷장 구역, 펫은 펫 메뉴, 검기 · 활 · 데미지 스킨은 메인 메뉴 카드나 각 명령어 화면, 아이템 스킨은 `/아이템스킨` 창에서 입힙니다."}]},{"note":{"b":"진급 보상","t":"계정 등급을 올리면 치장 · 펫 · 탈것 상자를 공짜로 받습니다. 개척민(일반 모자 + 일반 몸치장), 정착민(동물 풍선), 장인(일반 펫), 촌장(탈것) 순서입니다. 자세한 조건은 [진급](#growth-rank) 문서에 있습니다."}}]}],"search":[["치장","꾸미기"],["스킨","꾸미기"],["옷장","꾸미기"]]},"verdantrum":{"id":"verdantrum","parent":"world","title":"베르단트룸","short":"덩굴 우상이 지키는 정글과 고대 사원. 사냥 Lv 400부터.","color":"var(--reg-jungle)","tags":[["4단계 지역","lv"],["정글 · 고대 사원",null],["사냥 Lv 400",null],["보스 쿠아라",null]],"lede":"탐사대가 머무는 정글 마을입니다. 사원으로 가는 계단마다 덩굴 우상이 서 있고, 사원의 추적자들이 길목을 지킵니다. 사원 깊은 곳 제단에는 제단을 걷는 자 쿠아라가 있습니다. 이곳 몬스터가 떨어뜨리는 정령의 에메랄드는 19~22강 강화 재료(무기 · 갑옷 · 스킬북 기준)이고, 바다 3단계 베르단트룸 항로도 이 지역에 있습니다.","info":{"title":"베르단트룸","slot":{"id":"지역-베르단트룸-대표","need":"베르단트룸 정글과 고대 사원 계단이 함께 보이는 풍경"},"rows":[["지역 단계","4단계 (6단계 중)"],["사냥터","베르단트룸 정글 · 고대 사원"],["권장 사냥 Lv","400 ~ 620 (Lv 390부터 사냥 가능)"],["권  열립니다. 「도전하기」를 누르면 혼자 보스 던전으로 들어갑니다. 목숨은 2개, 제한 시간은 7분 30초(크라이오스만 10분)이고, 보스를 잡으면 클리어입니다. 입장 사냥 레벨이 모자라면 도전할 수 없고, 한 번 도전한 보스는 5분이 지나야 다시 도전할 수 있습니다."},{"table":{"cols":["보스","파수 NPC","마을","입장 사냥 Lv","권장 강화","보스 체력","제한 시간"],"num":[5],"rows":[["고대림의 군주","테오른 (숲문 파수)","[아르덴](#arden)","1 (제한 없음)","네더라이트 +0~3강","2,530","7분 30초"],["모래왕의 무덤군주, 아지락","자히르 (유적문 파수)","[듄가르드](#dunegard)","100","+3~6강","5,780","7분 30초"],["화산의 심장, 볼카니온","카르반 (분화구 파수)","[이그니스포](#ignispo)","230","+8~11강","20,130","7분 30초"],["제단을 걷는 자, 쿠아라","엘루아 (제단 파수)","[베르단트룸](#verdantrum)","400","+15~18강","61,190","7분 30초"],["균왕의 심장, 마이코라","소린 (균사문 파수)","[미스틱글렌](#mysticglen)","590","+21~24강","200,000","7분 30초"],["천 년을 선 자, 크라이오스","하벤 (빙문 파수)","[프로스트하버](#frostharbor)","780","+27~30강","500,000","10분"]]}},{"p":"권장 강화는 파수 NPC가 알려 주는 값(30강 기준)입니다. 보스가 바닥에 빨간 예고 장판을 그리면 그 자리를 피하세요. 보스 카드의 「랭킹」에서 가장 빨리 잡은 기록을 볼 수 있고, `/보스랭킹` 으로도 봅니다. → [지역 보스](#combat-region-boss)"},{"slot":{"id":"세계-던전서버-보스카드","need":"파수 NPC에게 말을 걸어 연 보스 카드 창 (정보 · 도전하기 · 랭킹)"}}]},{"h":"보스 보상","blocks":[{"p":"보스는 그 지역 보석을 8~14개 떨어뜨리고, 낮은 확률로 그 보스만의 스킬 아이템을 줍니다. [근원](#growth-origin)은 보스마다 매주 첫 처치 때 정해진 만큼 받고, 그 주에 다시 잡으면 30% 확률로 조금 받습니다. 주는 월요일 오전 6시에 바뀝니다."},{"table":{"cols":["보스","지역 보석","보스 스킬 (확률)","사냥 경험치","근원 (매주 첫 처치)","근원 (다시 처치 · 30%)"],"rows":[["고대림의 군주","—","숲의 울림 (5%)","1,200","15","3"],["아지락","사막의 호박석 8~14","모래 폭풍 (5%)","2,000","20","4"],["볼카니온","타오르는 홍옥 8~14","용암 발자국 (3%)","3,600","25","6"],["쿠아라","정령의 에메랄드 8~14","의식의 기둥 (3%)","5,000","30","8"],["마이코라","신비의 자수정 8~14","포자 범람 (2%)","9,000","40","10"],["크라이오스","서리 사파이어 8~14","다섯 개의 못 (2%)","20,000","50","12"]],"num":[3,4,5]}},{"note":{"b":"제한 시간 · 재도전","t":"지역 보스 6마리는 제한 시간이 7분 30초(크라이오스 10분)이고, 같은 보스를 다시 도전하려면 5분을 기다려야 합니다. 보스 처치 사냥 경험치는 위 표의 값입니다."}},{"p":"메인 스토리의 보스 단계도 이 던전에서 보스를 잡으면 끝납니다. → [메인 스토리](#quest-main)"}]},{"h":"알아둘 것","blocks":[{"list":["던전 서버 안에서 죽으면 로비로 가지 않고 던전의 목숨 규칙을 따릅니다. 목숨을 다 쓰면 도전이 끝납니다.","던전이 끝나면 들어갔던 서버의 그 자리로 돌아옵니다.","던전 서버에서는 홈을 저장할 수 없고, `/사냥터` 이동도 쓸 수 없습니다.","가지고 있는 옛 던전 보상 상자는 지금도 열 수 있습니다. 빙하 점액은 네더 구조물, 드래곤 이빨 · 잠식된 심장은 코자 대륙 구조물의 랜덤 상자에서 나옵니다.","끝없는 균열(무한 던전)과 케토그라 레이드는 준비 중입니다."]}]}],"search":[["던전","던전 서버"],["보스 카드","던전 서버"],["/보스랭킹","명령어"],["파수","던전 서버"],["보스 던전","던전 서버"]]},"world-lore":{"id":"world-lore","parent":"world","title":"세계관","short":"이프란 · 코자 · 이름 모를 세 번째 대륙, 그리고 여섯 지역 이야기.","color":"var(--gold)","tags":[["세 대륙","lv"],["이프란",null],["코자",null],["스포일러 없음",null]],"lede":"이 세계는 세 대륙으로 알려져 있습니다. 개척자가 처음 깨어나는 오래되고 조용한 땅 이프란, 귀한 광물이 잠든 깊고 위험한 땅 코자, 그리고 아직 이름조차 알려지지 않은 세 번째 대륙입니다. 이 문서는 게임을 시작하면 바로 듣게 되는 이야기까지만 담았습니다.","info":{"title":"세계관","slot":{"id":"세계-세계관-대표","need":"아르덴 마을 언덕에서 내려다본 이프란 풍경"},"rows":[["시작 대륙","이프란"],["깊은 대륙","코자"],["세 번째 대륙","이름이 알려지지 않음"],["수도","[아르덴](#arden)"],["이야기를 듣는 곳","이장 실바 · 기록관 이엔나"]]},"sections":[{"h":"세 대륙","blocks":[{"cards":[{"h":"이프란","p":"모든 개척자가 처음 깨어나는 대륙입니다. 오래되고 조용한 땅으로, 수도 아르덴을 비롯한 여섯 마을과 그 사이 사냥터가 이어져 있습니다. 요즘 숲이 이상하게 조용하고, 지역마다 이상한 일이 일어나고 있습니다.","color":"var(--reg-forest)","chips":["마을 6곳","사냥터","튜토리얼"]},{"h":"코자","p":"루비 · 설파이트 · 히룸이 나는 유일한 땅입니다. 이프란보다 깊고 위험해서, 이장 실바는 처음 온 개척자에게 \"아직 자네가 갈 땅은 아니야\"라고 말합니다. 하늘에서 운석이 떨어지고 땅속에는 오래된 화석이 묻혀 있습니다.","color":"var(--gold)","chips":["특수 광물","운석","화석"]},{"h":"세 번째 대륙","p":"이름이 알려지지 않은 땅입니다. 실바는 \"코자를 넘어선 자만 그 이름을 듣게 되어 있다\"고만 말합니다.","color":"var(--r-epic)","chips":["이름 미공개"]}]},{"p":"이프란 마을 포탈 너머의 [야생](#world-wild)은 개척자들이 땅을 파고 집을 짓는 바깥 땅입니다. 마을을 세우는 곳은 따로 마련된 [마을 서버](#conv-town)입니다."}]},{"h":"개척자","blocks":[{"p":"플레이어는 이프란의 아르덴 마을에서 눈을 뜬 개척자입니다. 이장 실바가 맞아 주고, 대장장이 루이흐가 장비를, 상점 점원 프루가 살림을 알려 줍니다. 기초 길라잡이를 마치면 실바에게서 「이프란의 개척자」로 인정받고, 그때부터 기록관 이엔나의 부탁으로 이프란 곳곳의 이상한 일을 살피러 떠납니다."},{"note":{"b":"메인 스토리","t":"이야기의 흐름은 [메인 스토리](#quest-main) 문서에 장 목록으로만 정리했습니다. 내용은 직접 플레이하며 확인하세요."}}]},{"h":"이프란의 지역","blocks":[{"table":{"cols":["지역","땅","이야기"],"rows":[["[아르덴](#arden)","숲 · 수도","이프란의 수도이자 시작 마을. 마을 밖 숲에서는 벌레 소리도 새소리도 들리지 않고, 베어낸 나무 속이 검게 변해 있습니다."],["[듄가르드](#dunegard)","사막","대상들이 오가는 사막 마을. 모래 아래 유적에서 불빛이 올라오고, 파수꾼들이 길목을 막고 있습니다."],["[이그니스포](#ignispo)","화산","용광로와 흑요석 통로가 있는 화산 마을. 분화구 아래에서 심장 뛰는 소리가 들립니다."],["[베르단트룸](#verdantrum)","정글 · 고대 사원","탐사대가 머무는 정글 마을. 사원 계단마다 덩굴 우상이 서 있고, 그것들이 살아 움직입니다."],["[미스틱글렌](#mysticglen)","버섯숲","균학자와 포자사냥꾼이 사는 버섯숲 마을. 포자가 마을까지 날아오고 균사가 한 곳으로 이어져 있습니다."],["[능선](#ridge)","산악","미스틱글렌과 프로스트하버 사이의 산길. 마을 대신 야영자 노르의 야영지가 있습니다."],["[프로스트하버](#frostharbor)","얼음","얼음길 안내인이 있는 마지막 마을. 가는 길이 완전히 얼어붙었고, 서리 마도병들이 진형을 갖추고 길을 막고 있습니다."]]}},{"slot":{"id":"세계-세계관-지역","need":"여섯 마을의 입구나 비석을 한 장씩 모은 사진 (가능하면 같은 각도로)"}}]}],"search":[["세계관","세계"],["대륙","세계"],["세 번째 대륙","세계관"],["개척자","세계관"]]},"world-wild":{"id":"world-wild","parent":"world","title":"야생","short":"랜덤 이동으로 가는 넓은 야생. 채굴 · 건축 · 네더 · 야생 구조물.","color":"var(--reg-forest)","tags":[["야생 맵 3개 + 네더","lv"],["구조물 12 + 네더 6",null],["홈 저장 가능",null],["주기적 초기화",null]],"lede":"이프란 마을 포탈 너머의 넓은 바깥 땅입니다. 일반 마인크래프트처럼 나무를 베고 광물을 캐고 집을 지을 수 있습니다. 들판과 네더에는 몬스터가 지키는 야생 구조물이 서 있고, 몬스터를 모두 물리치면 안의 상자를 감정해 보상을 받습니다. 튜토리얼이 끝나면 가장 먼저 오는 곳이기도 합니다.","info":{"title":"야생","slot":{"id":"세계-야생-대표","need":"야생 맵의 넓은 들판 풍경 (멀리 야생 구조물이 보이면 더 좋음)"},"rows":[["가는 법","아르덴 마을 포탈 → 야생 맵 고르기"],["맵","오버월드 1 · 2 · 3 + 네더"],["도착 위치","맵 가운데에서 5,000블록 안 무작위"],["홈 저장","가능 (`/셋홈`)"],["동물 포획","오버월드에서 올가미로 ([동물 포획](#life-ranch))"],["할 일","채굴 · 건축 · 야생 구조물 · 상자 감정"],["주의","주기적으로 초기화될 수 있음"]]},"sections":[{"h":"가는 법","blocks":[{"steps":[{"h":"아르덴 마을 포탈","p":"아르덴의 마을 포탈을 우클릭하면 야생 맵을 고르는 창이 열립니다. 튜토리얼 마지막에 쓰는 그 포탈입니다."},{"h":"맵 고르기","p":"오버월드 1 · 2 · 3 가운데 하나를 고르면 그 맵의 무작위 위치(가운데에서 5,000블록 안)로 이동합니다."},{"h":"홈 저장","p":"도착한 곳이 마음에 들면 `/셋홈 이름` 으로 저장하세요. 다음부터는 어느 서버에서든 `/홈 이름` 으로 바로 옵니다."}]},{"note":{"b":"친구와 같이","t":"같은 야생 서버에 있는 친구에게는 `/tpa 닉네임` 으로 갈 수 있습니다. 상대가 60초 안에 수락하면 이동합니다."}}]},{"h":"야생에서 하는 일","blocks":[{"cards":[{"h":"채굴 · 건축","p":"일반 마인크래프트처럼 자유롭게 캐고 짓습니다. 다이아몬드 · 고대 잔해 · 네더라이트 같은 기본 강화 재료를 여기서 모읍니다. 광석을 캘 때 2% 확률로 광맥 핵 미니게임이 열립니다.","color":"var(--reg-forest)","chips":["다이아몬드","고대 잔해","광맥 핵"]},{"h":"네더","p":"야생 서버에는 네더가 있습니다. 고대 잔해와 네더 광석을 캘 수 있고, 네더에만 생기는 구조물 6종이 있습니다.","color":"var(--reg-volcano)"},{"h":"야생 구조물","p":"야생과 네더에 저절로 생기는 구조물입니다. 다가가면 몬스터가 나오고, 모두 처치하면 문이 열려 상자를 감정할 수 있습니다.","color":"var(--reg-desert)"},{"h":"구조물 상자 전용 재료","p":"네더 구조물 상자에서는 빙하 점액이 나옵니다. 랜덤 스킬북 4단계를 만드는 재료입니다.","color":"var(--r-epic)","chips":["빙하 점액"]},{"h":"동물 포획","p":"튜토리얼에서 받은 올가미를 들고 오버월드의 동물을 우클릭하면 포획 미니게임이 열립니다. 잡은 동물은 `/포획창` 에서 기릅니다. → [동물 포획](#life-ranch)","color":"var(--reg-forest)"}]}]},{"h":"야생 구조물","blocks":[{"p":"야생 구조물은 ★1부터 ★6까지 난이도가 있습니다. 다가가면 몬스터가 나오고, 모두 처치하면 문이 열립니다. 안의 상자는 감정 미니게임으로 열며, 별이 높을수록 감정 보상이 2~5배로 늘어납니다. 제압한 구조물은 30분 뒤 다시 몬스터가 채워지고, 다시 제압하면 다시 감정할 수 있습니다. 구조물을 정복할 때마다 [근원](#growth-origin) 3개도 받습니다."},{"table":{"cols":["난이도","오버월드 구조물","권장 장비","네더 구조물","권장 장비","상자 보상"],"rows":[["★1","버려진 초소 · 무너진 망루","다이아 장비","피글린 약탈 야영지","다이아 장비","×2"],["★2","거미굴 폐광 · 약탈자 야영지","다이아 장비 ~ +3강","영혼 화장터","다이아 장비 ~ +3강","×2"],["★3","봉인된 성소 · 늪 마녀의 오두막","다이아 장비 ~ +4강","뒤틀린 공허 첨탑","다이아 장비 ~ +4강","×3"],["★4","연금술사의 실험탑 · 잿불 전초기지","다이아 장비 ~ +5강","지옥 용광로","다이아 장비 ~ +5강","×3"],["★5","잿불 포격 진지 · 잊힌 지하묘지","다이아 장비 ~ +5강","가스트 둥지","다이아 장비 ~ +5강","×4"],["★6","잿불 요새 · 균열 제단","다이아 장비 ~ +6강","황금 피글린 왕성","다이아 장비 ~ +6강","×5"]]}},{"note":{"b":"생각보다 쉽습니다","t":"오버월드 · 네더 구조물은 다이아 장비로도, 코자 대륙 구조물은 네더라이트 0강부터 혼자 클리어할 수 있게 맞춰져 있습니다. 표의 권장 장비는 구조물에 다가가면 화면에 뜨는 값이고, 그보다 낮아도 도전해 볼 만합니다."}},{"slot":{"id":"세계-야생-네더구조물","need":"네더에 생긴 구조물(예: 피글린 약탈 야영지)을 멀리서 찍은 전경"}},{"p":"코자 대륙에도 따로 구조물 6종이 있습니다 → [코자 대륙](#koza). 구조물 공략은 [야생 구조물](#combat-structures), 감정 미니게임은 [상자 감정](#life-appraisal) 문서에 있습니다."}]},{"h":"알아둘 것","blocks":[{"list":["야생에서 땅을 파고 부수는 것은 자유입니다. 다만 용암 붓기, 불 지르기, 함정, 렉을 일으키는 장치는 금지입니다.","야생은 주기적으로 새로 만들어질 수 있고, 거기 둔 물건은 되돌려 주지 않습니다. 오래 둘 집과 창고는 마을 서버의 내 마을에 지으세요.","마을(땅 보호)은 야생이 아니라 마을 서버에서 만듭니다. → [유저 마을](#conv-town)","죽으면 로비(아르덴)에서 부활하고, 아이템은 떨어지지 않습니다.","엔드 차원은 막혀 있습니다."]}]}],"search":[["야생","세계"],["랜덤 이동","이동"],["네더","야생"],["야생 구조물","야생"],["네더 구조물","야생"],["빙하 점액","야생"]]},"world":{"id":"world","title":"세계 · 지역","short":"이프란 여섯 지역, 능선, 코자 대륙, 야생, 던전 서버.","color":"var(--gold)","tags":[["이프란 6지역","lv"],["코자 대륙",null],["야생",null]],"lede":"개척자가 처음 깨어나는 이프란 대륙에는 마을 여섯 곳과 사냥터가 이어져 있습니다. 아르덴 숲에서 시작해 사막, 화산, 정글, 버섯숲을 지나 얼음 땅 프로스트하버까지 갈수록 몬스터가 강해집니다. 이프란 밖에는 채굴과 건축을 하는 야생과, 가장 깊고 위험한 코자 대륙이 있습니다.","info":{"title":"세계 · 지역","slot":{"id":"세계-대문-대표","need":"비석 마을 목록 창 — 여섯 마을이 보이는 화면"},"rows":[["시작 대륙","이프란 (마을 6곳)"],["진행 순서","아르덴 → 듄가르드 → 이그니스포 → 베르단트룸 → 미스틱글렌 → 프로스트하버"],["마을 사이 이동","비석 (직접 찾아가 열기) · 사냥터는 `/사냥터`"],["이프란 밖","야생 · 코자 대륙"]]},"sections":[{"h":"이프란 여섯 지역","blocks":[{"table":{"cols":["단계","지역","땅","권장 사냥 Lv","권장 강화","지역 보스","지역 전리품 (무기 · 갑옷 · 스킬북 강화 단계)"],"rows":[["1","[아르덴](#arden)","숲 · 수도","1 ~ 120","다이아 장비","고대림의 군주","—"],["2","[듄가르드](#dunegard)","사막","100 ~ 250","+0~3","아지락","사막의 호박석 (10~13강)"],["3","[이그니스포](#ignispo)","화산","230 ~ 420","+5~8","볼카니온","타오르는 홍옥 (14~18강)"],["4","[베르단트룸](#verdantrum)","정글 · 고대 사원","400 ~ 620","+9~17","쿠아라","정령의 에메랄드 (19~22강)"],["5","[미스틱글렌](#mysticglen)","버섯숲","590 ~ 820","+18~23","마이코라","신비의 자수정 (23~27강)"],["—","[능선](#ridge)","산악 야영지","—","—","—","—"],["6","[프로스트하버](#frostharbor)","얼음","780 ~ 1000","+24~30","크라이오스","서리 사파이어 (28~30강)"]]}},{"list":["몬스터마다 사냥 레벨이 있습니다. 내 사냥 레벨이 몬스터 레벨보다 10 넘게 낮으면 주는 피해가 70% 이하로 줄고 경험치 · 전리품이 나오지 않습니다. 그래서 권장 레벨보다 10 낮은 레벨부터 그 사냥터를 쓸 수 있습니다.","강화 · 인첸트 · 램프 · 스킬북 · 상점은 모두 수도 아르덴에 모여 있습니다. 다른 마을에는 그 지역 퀘스트를 주는 사람과 보스 관문을 지키는 파수가 있습니다.","지역 전리품(보석)은 그 지역 사냥터 몬스터와 보스가 떨어뜨리고, 10강 이상 강화 재료로 쓰입니다. 괄호 안은 검 · 활 · 갑옷 · 스킬북(30강까지)에 그 보석이 들어가는 단계이고, 곡괭이 · 낚싯대 같은 도구(20강까지)는 단계가 다릅니다.","사냥터는 `/사냥터` 나 메인 메뉴 「사냥터 이동」으로 바로 갈 수 있습니다. 내 사냥 레벨로 열린 사냥터만 고를 수 있고, 싸운 직후 10초 동안은 이동할 수 없습니다.","이그니스포 · 베르단트룸 사냥터 몬스터는 잡을 때 0.5%, 미스틱글렌 · 프로스트하버 · 능선 몬스터는 1% 확률로 [근원](#growth-origin) 2개를 줍니다 (정예 포함)."]}]},{"h":"지역 문서에 있는 것","blocks":[{"p":"지역 문서마다 마을 사람(NPC)과 하는 일, 사냥터 몬스터의 체력 · 공격력, 그 지역 현상수배 네임드, 땅 · 바다 채집물, 그 지역 퀘스트를 정리했습니다."},{"links":[["#world-lore","세계관","세 대륙과 지역 이야기"],["#koza","코자 대륙","가는 법과 그곳에서 하는 일"],["#world-wild","야생","채굴 · 건축 · 네더 · 야생 구조물"],["#world-dungeon-server","던전 서버","지역 보스 던전이 열리는 곳"]]}]}],"search":[["지역","세계"],["마을","세계"],["사냥터","세계"],["이프란","세계"],["/사냥터","명령어"]]},"growth-power":{"id":"growth-power","title":"전투력","parent":"growth","short":"가진 장비와 레벨로 계산한 숫자 하나. `/전투력` 으로 구성 · 추천을 보고 `/전투력 순위` 로 겨룬다.","tags":[["`/전투력`","lv"],["순위 기준 12가지",null],["아르덴 광장 순위판",null]],"color":"var(--r-legend)","lede":"전투력은 지금 가진 장비와 레벨로 몬스터를 얼마나 빨리 잡고 얼마나 오래 버티는지를 게임 공식 그대로 계산한 숫자입니다. 핫바 왼쪽에 늘 보이고, `/전투력` 화면에서 무엇이 얼마나 차지하는지와 다음에 무엇을 올리면 좋은지를 알려 줍니다. 서버 전체 순위는 `/전투력 순위` 와 아르덴 광장의 순위판에서 봅니다.","info":{"title":"전투력","slot":{"id":"성장-전투력-대표","need":"`/전투력` 창 — 위에 내 머리 · 전투력, 공격력 · 생존력, 구성 6칸, 아래 「다음 성장 추천」 3칸이 보이게"},"rows":[["보기","`/전투력` · 메인 메뉴 「전투력」 카드"],["순위","`/전투력 순위` (100위까지) · [아르덴](#arden) 광장 순위판 (10위까지)"],["다른 사람","`/전투력 <닉네임>`"],["화면","핫바 왼쪽 「전투력 : N」"],["갱신","접속 중 20초마다 · 순위 1분마다"],["보상","없음 (기록 · 순위만)"]]},"sections":[{"h":"계산하는 법","blocks":[{"p":"**전투력 = 10 × √(공격력 × 생존력)** 입니다. 곱한 뒤 제곱근을 씌우므로 공격과 방어를 고르게 키울수록 높게 나옵니다."},{"table":{"cols":["항목","계산","들어가는 것"],"rows":[["공격력","(스킬 초당 피해 + 0.7 × 검 · 활 중 센 쪽 초당 피해) × 사냥 피해 × 룬 피해","스킬북 강화 · 장착 스킬, 검 · 활 강화, 날카로움 · 힘 인첸트, 공격 램프, [사냥 레벨](#growth-jobs) 몬스터 피해, [룬](#growth-rune) 힘 · 치명타"],["생존력","최대 체력 ÷ 받는 피해 비율 ÷ (1 − 회피)","갑옷 강화 · 방어구 · 보호 인첸트, 사냥 레벨 체력 · 회피, 룬 생명 · 방어, 흡혈 · 재생(최대 +50%), 두번째 목숨"]]}},{"list":["받는 피해 비율은 한 방 40을 기준으로 룬 방어 · 강화 갑옷 감소, 방어구, 보호 인첸트를 차례로 적용해 구합니다.","치명타는 무기 강화 · 약점포착 램프 · 룬 치명타의 확률과 피해를 더해 기대값으로 넣습니다. 강화하지 않은 무기도 룬 치명타가 있으면 셉니다.","검 · 활 · 스킬북은 손에 든 것이 아니라 **가방 전체에서 가장 센 것 하나씩**, 갑옷은 **입고 있는 것만** 셉니다.","물약 같은 잠깐 효과와 무한 던전 카드 효과는 빠집니다. 내구도가 다 닳아 잠긴 장비도 빠집니다.","계산에 들어가지 않는 램프도 있습니다 (관통 · 가시 · 불굴 · 완충 · 급습 · 화살비 · 서리화살 · 끈기)."]},{"note":{"b":"계산 예시","t":"사냥 Lv.100 · 네더라이트 검 +10강 · 스킬북(0강)에 1단계 스킬 3개 · 네더라이트 갑옷 0강이면 공격력 약 54.8 (검 초당 49.0 · 스킬 초당 7.84, 사냥 +30%), 생존력 약 265 (체력 120 · 받는 피해 52% · 회피 10% · 흡혈) → 전투력 약 1,205입니다."}}]},{"h":"전투력 화면 `/전투력`","blocks":[{"table":{"cols":["자리","보이는 것"],"rows":[["맨 위 세 칸","공격력 · 전투력(전체 순위, 예: 12위 / 340명) · 생존력. 마우스를 올리면 검 · 활 · 스킬 초당 피해와 사냥 · 룬 피해 증가, 최대 체력 · 받는 피해 · 회피가 보입니다"],["구성 6줄","사냥 레벨 · 무기 강화 · 스킬 · 갑옷 강화 · 인첸트 · 램프 · 룬이 전투력에서 차지하는 몫(막대)과 「없으면 전투력 −N%」"],["다음 성장 추천 3줄","지금 장비 · 레벨에서 한 단계 올렸을 때 전투력이 가장 많이 오르는 것 3개와 오르는 양 (예: 스킬북 +5강 — 스킬 칸이 하나 열려요)"],["순위 보기 · 전투력이란?","전체 순위 화면으로 가기 · 계산식 요약"]]}},{"slot":{"id":"성장-전투력-HUD","need":"핫바 왼쪽 · 왼손 칸 옆에 뜬 「전투력 : N」 글자"}},{"p":"`/전투력 <닉네임>` 으로 다른 사람의 공격력 · 생존력과 구성을 볼 수 있습니다. 다음 성장 추천은 본인에게만 보입니다. 한 번도 접속하지 않아 계산된 적이 없는 사람은 기록이 없습니다. 화면 위 ◀ 단추를 누르면 메인 메뉴로 돌아갑니다."}]},{"h":"올리는 법","blocks":[{"list":["[스킬북](#growth-skillbook) 강화 — 5강 · 10강에 스킬 칸이 하나씩 열리고, 빈 칸에 스킬을 채우면 크게 오릅니다.","무기 · 갑옷 [강화](#growth-enhance), [인첸트](#growth-enchant), [램프](#growth-lamp).","[사냥 레벨](#growth-jobs) — 레벨마다 최대 체력 +1 · 몬스터 피해 +0.3%.","[룬](#growth-rune)의 생명 · 힘 · 방어 · 치명타."]}]},{"h":"순위","blocks":[{"p":"`/전투력 순위` 화면에는 100위까지 한 쪽에 10명씩 나옵니다. 위쪽 탭으로 순위 기준을 바꾸고, 이전 · 다음 단추로 쪽을 넘기며, 줄을 누르면 그 사람의 전투력 화면을 봅니다. 아래에 내 순위가 보이고 「내 전투력」으로 내 화면에 돌아갑니다."},{"table":{"cols":["탭","기준"],"rows":[["전투력","전투력"],["공격력 · 생존력 · 최대 체력","각 수치"],["강화 합계","계산에 쓴 장비 강화 단계 합"],["사냥 레벨","사냥 직업 레벨"],["생활 직업","광질 → 요리 → 연금술 → 농사 → 낚시 → 벌목 레벨 (탭을 누를 때마다 다음 직업)"],["직업 총합","일곱 직업 레벨 합 (벌목 포함)"]]}},{"list":["최고 기록이 아니라 **지금 값**으로 줄을 세웁니다. 장비를 바꾸면 순위도 바뀝니다.","접속해 있는 동안 20초마다, 그리고 인벤토리 창을 닫거나 갑옷을 바꿀 때 바로 다시 계산합니다. 접속하지 않은 동안에는 마지막 값으로 남습니다.","순위와 아르덴 광장 순위판은 1분마다 갱신됩니다. 운영진은 순위에서 빠집니다.","명령어는 띄어 씁니다: `/전투력 순위` (`/전투력순위` 는 없는 명령어입니다)."]},{"slot":{"id":"성장-전투력-순위창","need":"`/전투력 순위` 창 — 위쪽 탭 줄과 1~28위 머리, 오른쪽 위 「내 순위」가 보이게"}},{"links":[["#collect-ranking","순위판","아르덴 광장 전투력 순위판과 다른 순위들"],["#growth-enhance","강화","전투력을 가장 크게 바꾸는 장비 강화"],["#growth-skillbook","스킬북 · 스킬","스킬 칸 열기"]]}]}],"search":[["전투력","전투력"],["전투력 순위","전투력"],["공격력","전투력"],["생존력","전투력"],["성장 추천","전투력"],["강화 합계","전투력 순위"]]},"style-emote":{"id":"style-emote","parent":"style","title":"이모트","short":"`/이모트` 로 내 스킨을 입은 캐릭터 모델이 춤추는 감정 표현. 처음 4종, 나머지는 이모트 카드로 배웁니다.","color":"var(--r-epic)","tags":[["`/이모트`",null],["메인 메뉴 「이모트」 카드",null],["33종 · 5등급",null]],"lede":"이모트를 시작하면 선 자리에 **내 스킨을 입힌 캐릭터 모델**이 나와 춤을 추고, 나는 그 둘레를 자유롭게 도는 카메라가 되어 지켜봅니다. 커먼 4종(인사 · 박수 · 경례 · 배꼽인사)은 처음부터 할 수 있고, 나머지는 **이모트 카드**를 우클릭해 배웁니다. 꾸미기라서 능력치는 바뀌지 않습니다.","info":{"title":"이모트","slot":{"id":"꾸미기-이모트-대표","need":"`/이모트` 로 이모트를 하는 중 — 카메라 시점에서 본, 내 스킨을 입은 캐릭터 모델이 춤추는 모습"},"rows":[["여는 법","`/이모트` · 메인 메뉴(Shift+F) 「이모트」 카드"],["바로 하기","`/이모트 <이름>`"],["끝내기","숫자 5 키 · `/이모트 그만`"],["처음부터","커먼 4종"],["배우는 법","이모트 카드 우클릭"],["중복","상자에서 이미 배운 이모트 → 멋진 코인"]]},"sections":[{"h":"하는 법","blocks":[{"steps":[{"h":"이모트 창 열기","p":"`/이모트` 를 입력하거나 메인 메뉴 「이모트」 카드를 누르면 이모트 화면이 열리고, 배운 이모트가 등급별 탭으로 보입니다. 누르면 바로 시작합니다. `/이모트 <이름>` 으로 창 없이 시작할 수도 있고, `/이모트 목록` 은 채팅으로 목록을 보여 줍니다."},{"h":"카메라로 보기","p":"선 자리에 내 모습의 모델이 나와 움직이고, 나는 모델 둘레(약 5칸 안)를 날아다니는 카메라가 됩니다. 이모트마다 소리와 효과가 함께 나오고, 반복 이모트는 끝낼 때까지 계속됩니다."},{"h":"끝내기","p":"숫자 5 키를 누르면 끝납니다. 클릭 · 공격 · 상호작용 · Q · F · 인벤토리 열기 · 명령어 입력 · 피해를 받아도 끝나고, `/이모트 그만` 도 됩니다. 이모트 화면에서 시작한 이모트를 숫자 5 키로 끝내거나 한 번 추고 저절로 끝나면, 이모트 화면이 같은 탭으로 다시 열립니다."}]},{"note":{"b":"못 하는 때","t":"땅 위에 서 있을 때만 시작합니다. 탈것에 타 있거나 활공 · 수영 · 비행 중, 랜덤 상자 연출 중에는 할 수 없습니다."}}]},{"h":"이모트 목록","blocks":[{"table":{"cols":["등급","이모트","얻는 법"],"rows":[["커먼","인사 · 박수 · 경례 · 배꼽인사","처음부터"],["언커먼","머리하트 · 기지개 · 앉기","이모트 카드"],["레어","덤블링 · 눕기 · 울기 · 화남","이모트 카드"],["에픽","물구나무서기 · L을가져가 · 플로스 · 로봇춤 · 말춤 · 백열권 · 히어로랜딩 · 회오리발차기 · 드럼솔로 · 번개기타","이모트 카드"],["레전더리","BAD · 헤드스핀 · 문워크 · 공중부양 · 잔상연무 · 얼음조각가 · 거인의힘 · 오케스트라지휘 · 별자리그리기","이모트 카드"],["에픽 · 레전더리","모닥불야영(에픽) · 왕좌(레전더리) · 출항(레전더리)","첫 항해 사전 후원 3 · 4 · 5단계 한정 ([후원](#shop-donate))"]]}},{"p":"앉기 · 눕기 · 울기 · 물구나무서기 · L을가져가 · 플로스 · 말춤 · BAD · 헤드스핀 · 공중부양과 사전 후원 3종은 끝낼 때까지 반복되고, 나머지는 한 번 추고 끝납니다."}]},{"h":"이모트 랜덤 상자 · 이모트 카드","blocks":[{"p":"이모트 랜덤 상자를 들고 우클릭하면 확률표가 먼저 열리고, 「보상 받기」를 누르면 연출과 함께 **이모트 카드**가 나옵니다. 카드를 우클릭하면 그 이모트를 배웁니다. 상자에는 처음부터 하는 커먼 4종과 사전 후원 3종을 뺀 **26종**이 들어 있고, 등급을 먼저 뽑은 뒤 그 등급 안에서 똑같은 확률로 하나가 나옵니다."},{"table":{"cols":["등급","등급 확률","종류 수","한 종류당","이미 배운 이모트가 나오면"],"rows":[["언커먼","40%","3","약 13.3%","멋진 코인 2개"],["레어","32%","4","8%","멋진 코인 3개"],["에픽","21%","10","2.1%","멋진 코인 5개"],["레전더리","7%","9","약 0.78%","멋진 코인 10개"]]}},{"note":{"b":"상자 구하는 곳","t":"이모트 랜덤 상자는 지금 잼 상점 · 마일리지 상점 목록에 없습니다(게임 속 설명의 「잼 상점에서 구매」 · 「16종」은 옛 문구). 멋진 코인 쓰는 곳은 [뽑기 상자](#style-gacha) 문서에 있습니다."}}]}],"search":[["이모트","이모트"],["감정 표현","이모트"],["/이모트","명령어"],["이모트 카드","이모트"],["이모트 랜덤 상자","이모트"],["춤","이모트"]]},"start-glossary":{"id":"start-glossary","parent":"start","title":"용어집","short":"램프 · 해방 · 잼 · 룬 · 근원 · 사냥 레벨처럼 코자 온라인에서만 쓰는 말 75개를 한두 줄로.","color":"var(--accent)","tags":[["용어 75개","lv"],["처음 온 분",null],["찾아보기",null]],"lede":"코자 온라인에서만 쓰는 말을 한곳에 모았습니다. 위키나 게임 안내에 설명 없이 나오는 말이 있으면 여기서 뜻을 먼저 보고, 오른쪽 「자세히」 칸의 문서로 넘어가면 됩니다. 마인크래프트 기본 용어는 넣지 않았습니다.","info":{"title":"용어집","rows":[["분류","기본 · 이동 · 재화 · 성장 · 전투 · 생활 · 수집 · 꾸미기"],["용어","75개"],["찾는 법","위 검색창에 용어를 넣으면 이 문서로 옵니다"],["처음이라면","[첫날 가이드](#start-first-day)"]]},"sections":[{"h":"기본 — 세계 · 서버 · 퀘스트","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["이프란 대륙","개척자가 처음 깨어나는 시작 대륙입니다. 마을 6곳과 사냥터가 이어져 있고, 로비 서버가 곧 이프란입니다.","[세계 · 지역](#world)"],["아르덴","이프란의 수도이자 처음 깨어나는 마을입니다. 강화 · 인첸트 · 램프 · 스킬북 · 상점 시설이 모두 여기 있고, 죽으면 여기서 다시 일어납니다.","[아르덴](#arden)"],["코자 대륙","루비 · 설파이트 · 히룸이 나는 깊고 위험한 땅입니다. 네더라이트 장비 9종을 갖추고 이장 실바에게 포탈석을 받아 내 마을에 포탈을 세우면 갈 수 있습니다.","[가는 법](#koza~0)"],["로비","아르덴이 있는 이프란 서버입니다. 어느 서버에서든 `/로비` 나 메인 메뉴 「로비」 카드로 돌아옵니다.","[서버를 오가는 법](#start-servers~1)"],["마을 서버","플레이어가 세운 유저 마을이 모인 서버입니다. 메인 메뉴 「마을」 카드로 가고, 재련 · 양식장 · 드래곤 알 같은 일은 이 서버의 내 마을 땅에서 합니다.","[어디서 무엇을 하나](#start-servers~0)"],["야생","아르덴의 마을 포탈로 가는 넓은 바깥 땅(오버월드 1 · 2 · 3과 네더)입니다. 채굴 · 건축 · 야생 구조물이 있고, 주기적으로 초기화될 수 있습니다.","[야생](#world-wild)"],["던전 서버","지역 보스 던전 전용 서버입니다. 관문 파수에게 도전하면 자동으로 옮겨지고, 끝나면 들어갔던 서버의 그 자리로 돌아옵니다.","[던전 서버](#world-dungeon-server)"],["개척자","아르덴에서 눈을 뜬 플레이어를 부르는 이름입니다. 기초 길라잡이를 졸업하면 칭호 「개척자」도 받습니다.","[세계관](#world-lore~1)"],["팩 검사","서버에 처음 들어올 때 뜨는 「리소스팩 확인」 그림 맞히기 화면으로, 전용 리소스팩이 있는지 확인합니다. 최신 팩(`CZ_V<번호>_RP.zip` 중 번호가 가장 큰 것)을 끼고 있으면 바로 풀립니다.","[리소스팩 받기 · 팩 검사](#start-first-day~1)"],["길라잡이","할 일을 순서대로 하나씩 주는 연속 퀘스트입니다. 기초 36단계 · 심화 29단계 · [메인 스토리](#quest-main) 50단계 줄기를 `/길라잡이` 화면에서 봅니다.","[길라잡이](#quest-guide~0)"],["졸업","기초 길라잡이 22단계에서 이장 실바에게 보고하는 일입니다. 칭호북 「개척자」와 졸업 선물 상자를 받고, 23~33 경제 배우기를 마치면 메인 스토리 · 심화 길라잡이를 고릅니다.","[22 졸업](#start-guide-basic~2)"],["퀘스트 포기","`/퀘스트포기` 로 지금 퀘스트를 내려놓는 일입니다. 기초 길라잡이 말고는 언제든 되고, 완료 기록이 남지 않아 다시 받을 수 있습니다.","[관련 명령어](#quest-guide~4)"]]}}]},{"h":"이동 · 편의","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["메인 메뉴","Shift + F 로 어디서든 여는 메뉴입니다. 이동 · 퀘스트 · 룬 · 근원 · 펫 · 도감 같은 카드 24장이 한 화면에 모여 있습니다.","[메인 메뉴](#conv-menu~0)"],["HUD (화면 표시)","화면에 늘 떠 있는 표시입니다. 왼쪽 위에 돈 · 잼 · 마일리지, 오른쪽 위에 진행 중인 퀘스트가 보이고, 직업 도구를 들면 핫바 오른쪽에 직업 레벨이 뜹니다.","[기본 화면](#start-controls~3)"],["길안내","목적지까지 방향 화살표와 바닥에 그린 길로 데려다 주는 안내입니다. 퀘스트를 받거나 「NPC 안내」에서 NPC를 고르면 켜지고, `/길안내 중지` 로 끕니다.","[길안내](#conv-move~7)"],["퀘스트스킵","`/퀘스트스킵` 은 건너뛸 수 있게 정해 둔 단계(기초의 파티 가입, 심화의 현상수배 · 운석 등)만 넘깁니다. 넘겨도 보상은 나옵니다.","[관련 명령어](#quest-guide~4)"],["비석","이프란 마을마다 서 있는, 우클릭하면 마을 목록이 열리는 이동 장치입니다. 아르덴만 처음부터 열려 있고, 다른 마을은 직접 찾아가 그 비석을 한 번 우클릭해야 열립니다.","[비석](#conv-move~1)"],["셋홈 · 홈","`/셋홈 이름` 으로 지금 자리를 저장하고 `/홈 이름` 으로 돌아옵니다. 야생 · 코자 대륙 · 마을 서버에서만 저장되고, 개수는 진급 등급에 따라 1~6개입니다.","[홈 · 셋홈](#conv-move~4)"],["유저 마을 (내 마을)","마을 서버에 청크 단위로 잡는 내 땅입니다(마을장 포함 최대 4명). 마을원이 아니면 블록 · 상자를 건드릴 수 없고, 재련대 · 양식 수조 · 드래곤 알 · 코자 대륙 포탈은 이 땅에서만 씁니다.","[유저 마을](#conv-town)"],["우편함","인벤토리가 가득 차서 못 받은 보상이 쌓이는 곳입니다. `/우편함` 으로 열고, 5개 서버 어디서 열어도 같습니다.","[우편함](#conv-mailbox)"],["접속 보상","그날 접속 시간이 1 · 2 · 3 · 5 · 8시간이 될 때마다 받는 보상입니다. 메인 메뉴 아래 「접속 보상」 단추로 봅니다.","[접속 보상](#conv-menu~1)"],["NPC 대화창","NPC 에게 말을 걸면 핫바 위에 뜨는 대화창입니다. 오른쪽 위 번호 붙은 선택지를 숫자키로 고르고, 다음 대사는 숫자키 1 로 넘깁니다.","[기본 화면](#start-controls~3)"]]}}]},{"h":"재화 · 상점","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["돈 (원)","거의 모든 활동에서 버는 기본 화폐입니다. 대부분 NPC에게 물건을 팔아 생기고, 강화 · 인첸트 · 마을 확장에 씁니다.","[돈 · 잼 · 마일리지](#shop-currency~0)"],["잼","후원으로 충전하는 화폐(1원 = 1잼)입니다. 잼 상점 · 멤버십 · 유저상점 광고에 씁니다.","[잼](#shop-currency~3)"],["마일리지","일일 퀘스트 · 도전과제 · 박물관 같은 꾸준한 활동으로 모으는 화폐입니다. 마일리지 상점에서 치장 · 펫 · 스킨 상자를 삽니다.","[마일리지](#shop-currency~2)"],["근원","강화 21강부터 · 인첸트 해방 · 상급 램프 · 높은 룬 합성에 꼭 드는 재화입니다. 퀘스트 · 의뢰 · 보스 같은 활동에서 조금씩 모으고, 게임 돈(하루 20개까지)이나 잼 상점 「근원」 쪽에서 살 수 있습니다. 거래는 안 됩니다. `/근원` 으로 봅니다.","[근원](#growth-origin)"],["일일 퀘스트 (일퀘)","매일 자정에 새로 나오는 퀘스트 5개(고정 2 + 무작위 3)입니다. 모두 끝내면 7,000원과 마일리지 150을 따로 받습니다.","[일일 퀘스트](#quest-daily)"],["의뢰 게시판","매일 나에게만 붙는 의뢰서를 한 판에 3장씩, 농사 레벨에 따라 하루 최대 3판(9장)까지 주는 게시판입니다. 납품하면 돈 · 마일리지와 근원(쉬움 2 · 보통 3 · 어려움 5)을 받고, 새 물건을 처음 손에 넣으면 그 물건을 납품하는 의뢰가 다음 날부터 늘어납니다.","[의뢰 게시판](#quest-request~0)"],["무역상인 · 시세","아르덴의 무역상인 나가는 플레이어가 만든 요리를 사 주는 상인입니다. 매입 값에 곱해지는 시세는 매일 0.7~1.5배 사이에서 바뀝니다.","[무역상인 나가](#life-trade~2)"],["멤버십 (VIP · MVP)","잼으로 사는 30일 기간제 혜택입니다. VIP는 추가 가방 · 자동 줍기 · 프리미엄 접속 보상, MVP는 거기에 자동 심기 · 마을 플라이 · 어디서나 상점 열기가 더해집니다.","[멤버십](#shop-membership~0)"],["서버 추천","서버 목록 사이트 마인리스트에서 코자 온라인을 추천하는 일입니다. 일일 퀘스트 「서버 추천하기」가 자동으로 끝나고, 누적 횟수는 진급 조건입니다.","[서버 추천](#shop-vote~0)"],["첫 항해","정식 오픈 전의 사전예약 · 사전후원 · 베타 이벤트입니다. 그때 준 칭호는 다시 얻을 수 없고, 한정 스킬은 지금 거래로만 구합니다. 내 기록은 `/첫항해` 로 봅니다.","[첫 항해](#shop-donate~1)"]]}}]},{"h":"성장","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["직업","따로 고르지 않고, 하는 일에 따라 요리 · 연금술 · 사냥 · 광질(돌 · 광석 캐기) · 농사 · 낚시 · 벌목(자연 원목 베기) 일곱 직업이 각각 오릅니다(최대 Lv.1000). 캐릭터 레벨은 따로 없습니다.","[직업 7종](#growth-jobs~0)"],["사냥 레벨","사냥 직업의 레벨입니다. 레벨마다 최대 체력 +1 · 몬스터 피해 +0.3%가 붙고, 어느 사냥터에서 제대로 싸울 수 있는지를 정합니다.","[사냥 레벨 전투 능력](#growth-jobs~2)"],["사냥 구역 제한","내 사냥 레벨이 몬스터 레벨 − 10보다 낮으면 주는 피해가 70%부터 줄고 경험치 · 전리품이 나오지 않는 규칙입니다.","[레벨이 모자라면](#growth-region-gate~1)"],["2배 드롭 · 보너스 아이템","직업 레벨이 오를수록 커지는 확률입니다. 2배 드롭은 얻는 양이 두 배가 되는 것, 보너스 아이템은 농사의 태양 조각 · 낚시의 고대 닻 조각이 덤으로 나오는 것입니다.","[레벨 구간 보상](#growth-jobs~1)"],["강화","대장장이 루이흐에게 장비 단계를 쌓아 능력치를 올리는 일입니다. 검 · 활 · 삼지창 · 창 · 철퇴 · 스킬북 · 네더라이트 갑옷은 30강, 도구는 20강까지이고, 단계가 오르면 램프 칸 · 스킬북 장착 칸 · 무기 스킬도 열립니다.","[강화](#growth-enhance~0)"],["지역 보석 (지역 전리품)","지역 사냥터 몬스터와 지역 보스가 떨어뜨리는 그 지역의 보석입니다(사막의 호박석 · 타오르는 홍옥 · 정령의 에메랄드 · 신비의 자수정 · 서리 사파이어). 강화 재료로 씁니다.","[지역 보석 얻는 곳](#growth-enhance~5)"],["루비 · 설파이트 · 히룸","코자 대륙 지하에서 나는 상위 광물입니다. 희귀도는 네더라이트 < 루비 < 설파이트 < 히룸이고, 강화 · 랜덤 스킬북 · 트랙터 재료입니다.","[커스텀 광석](#growth-gear~0)"],["인첸트","인첸트 상자에서 나온 마법 책을 장비에 입히는 일입니다. 마법사 후를루카의 인첸트 허브에서 하고, 일반 마법 부여대 · 모루는 쓸 수 없습니다.","[인첸트](#growth-enchant~0)"],["해방","인첸트 해방을 줄인 말입니다. 최대 단계 인첸트 책을 재료로 바닐라 최대 단계를 넘는 책을 만드는 일로, 마법사 후를루카의 인첸트 창에서 하고 해방의 쐐기와 근원이 듭니다.","[인첸트 해방](#growth-enchant~3)"],["룬","능력치를 새기는 돌입니다. 생명(최대 체력) · 힘(주는 피해) · 방어(받는 피해 감소) · 치명타 4종이 1~8성으로 있고 종류마다 1개씩 끼웁니다. 룬 뽑기로 얻고 같은 성 4개를 합쳐 한 성 위로 올립니다. `/룬` · 마법사 후를루카.","[룬](#growth-rune)"],["램프","도구 · 무기 · 갑옷에 다는 특수 능력입니다(멀티채굴 · 빠른입질 · 두번째 목숨 등 40종). 현자 컬티스가 달아 주고, 같은 램프 3개는 다음 단계 1개로 승급합니다.","[램프](#growth-lamp~0)"],["스킬북","스킬을 쓰는 무기입니다. 들고 Q를 눌러 스킬 아이템을 장착하고 좌클릭 · 우클릭 · 쉬프트 조합으로 씁니다. 인벤토리에 1권만 가질 수 있고, 스킬은 랜덤 스킬북 상자 · 지역 보스 · 거래로 모읍니다.","[스킬 장착](#growth-skillbook~1)"],["마나","스킬을 쓸 때 드는 값입니다. 기본 최대 100 · 1초에 4씩 차고, 스킬북 스킬은 등급에 따라, 무기 스킬은 칸마다 다르게 듭니다. 투구 · 흉갑 강화로 최대 마나, 각반 · 부츠 강화로 회복을 늘립니다.","[마나](#growth-mana)"],["무기 스킬","네더라이트 검 · 활 · 삼지창 · 네더라이트 창 · 철퇴에 강화 단계에 따라 하나씩 열리는 전용 스킬 5종씩입니다. 스킬북 없이 그 무기를 들고 씁니다.","[검 무기 스킬](#growth-skillbook~8)"],["진급","나그네 → 개척민 → 정착민 → 장인 → 촌장 → 영주 6단계 계정 등급입니다. 진급 비용(소지금에서 빠짐)과 서버 추천 누적 횟수로 오르고, 셋홈 개수와 상자를 받습니다.","[진급](#growth-rank~0)"],["전투력","지금 가진 장비 · 스킬북 · 사냥 레벨로 계산한 숫자 하나입니다. 핫바 왼쪽에 늘 보이고, `/전투력` 으로 무엇이 얼마나 차지하는지 봅니다.","[전투력](#growth-power~0)"],["내구도 잠김","장비 내구도가 다 닳으면 부서지지 않고 1에서 멈춥니다. 그동안은 쓸 수 없고(갑옷은 능력치 없음), 내구도 수리 보석이나 `/수리` 로 고치면 풀립니다.","[최대 내구도](#growth-enhance~7)"]]}}]},{"h":"전투","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["정예 (미니 보스)","사냥터 1단계 · 2단계 몬스터를 잡을 때 2% · 4% 확률로 기습해 나타나는 3단계 몬스터입니다. 레벨이 없어 누구나 보상을 받습니다.","[레벨이 없는 몬스터](#growth-region-gate~3)"],["지역 보스 · 관문 파수","이프란 여섯 지역마다 하나씩 있는 보스입니다. 그 마을의 관문 파수 NPC에게 도전 카드를 받아 혼자 들어가고, 목숨 2개로 제한 시간 안에 잡습니다. 낮은 확률로 보스 전용 스킬이 나옵니다.","[지역 보스](#combat-region-boss~1)"],["야생 구조물 · ★","야생 · 네더 · 코자 대륙에 자연히 생기는 몬스터 거점 24종입니다. 지키는 몬스터를 모두 쓰러뜨리면(제압) 상자를 감정할 수 있고, ★이 높을수록 감정 보상이 2~5배입니다.","[★ 등급](#combat-structures~1)"],["상자 감정","야생 · 코자 대륙에 원래 있던 상자를 우클릭하면 시작되는 자물쇠 따기 · 금고 다이얼 미니게임입니다. 성공하면 랜덤 상자를 받습니다.","[상자 감정](#life-appraisal)"],["왕관 몬스터","이름 앞에 ♛ 가 붙은 사냥터 몬스터입니다. 아주 큰 금왕관(2%)과 아주 작은 은왕관(3%)이 있고, 잡으면 왕관 트로피를 얻어 순찰대장 가레스에게 팝니다.","[왕관 몬스터](#combat-crown~0)"],["현상수배 네임드","50~80분마다 이프란 사냥터에 나타나는, 사냥터 몬스터가 크게 자란 변종입니다. 20분 안에 함께 잡으면 넣은 피해만큼 현상금과 마일리지를 나눠 받습니다.","[현상수배](#combat-bounty~0)"],["재련 · 공성전","내 마을 땅에 재련대를 놓고 불을 붙이면 재련이 끝날 때까지 「잿불 무리」가 불을 끄러 몰려옵니다. 마을 사람들과 지켜 내면 인첸트 해방 · 강화 21강부터 쓰는 해방의 쐐기가 완성됩니다.","[공성전 흐름](#combat-siege~2) · [해방의 쐐기](#combat-siege~1)"],["검기","검 공격 게이지가 거의 찼을 때 좌클릭하면 나가는 이펙트로, 앞쪽을 함께 벱니다. 모양은 검기 스킨으로 바꿉니다.","[검기 스킨](#style-slash~0)"]]}}]},{"h":"생활","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["땅 채집 · 바다 채집","이프란 들판과 바닷속 채집물을 괭이를 들고 우클릭해 게이지를 채워 캐는 일입니다. 채집할 때마다 농사 경험치가 오릅니다.","[채집하는 법](#life-gathering~0)"],["광맥 핵 · 황금 수확","광석을 캘 때(2%) · 채집할 때(6%) 가끔 뜨는 보너스 미니게임입니다. 성공하면 2배, 완벽하면 3배를 얻고, 실패해도 기본 몫은 받습니다. 광맥 핵은 대박 채굴이라고도 부릅니다.","[광맥 핵 · 황금 수확](#life-bonanza~0)"],["손질 · 손질된 살","식칼을 들고 우클릭해 물고기를 다듬는 일입니다. 손질된 살(1~5등급) · 물고기 뼈 · 비늘이 나오고, 살은 포션 재료, 뼈와 비늘은 미끼 재료입니다.","[손질 · 미끼 제작](#life-fishing~4)"],["대물 · 월척","어종 크기 상위 5%(대물)와 0.5%(월척) 물고기입니다. 월척을 낚으면 서버에 공지됩니다.","[낚시](#life-fishing~1)"],["변이 물고기","직접 낚을 때 낮은 확률로 붙는 황금빛 · 번개 맞은 · 달빛 · 유령 · 알비노 물고기로, 판매가에 배율이 곱해집니다.","[변이 물고기 · 감정](#life-fishing~2)"],["가공대 · 요리솥 · 연금술 솥","설치해서 우클릭하는 생활 가구입니다. 가공대는 요리 재료, 요리솥은 요리, 연금술 솥은 포션 · 물약을 만듭니다.","[만드는 법](#life-cooking~0)"],["특제 요리 · 향신료","요리 1그릇에 그 지역 땅 채집물로 만든 향신료를 더한 요리입니다. 무역상인 나가가 일반 요리와 따로 하루 30그릇(요리 레벨에 따라 최대 120그릇)을 기준 5,700원에 삽니다.","[특제 요리 · 향신료](#life-cooking~2)"],["양식장 · 어란","내 마을 땅에 놓은 양식 수조에 물고기와 사료를 넣으면 4시간마다 어란을 낳습니다. 어란은 가공대에서 가공해 무역상인 나가에게 팝니다.","[양식장](#life-fishfarm~0)"],["자동 심기 · 트랙터","자동 심기는 농사 Lv 300부터 거둔 자리에 씨앗을 써서 저절로 다시 심는 기능입니다. 트랙터는 내 마을 땅에서 3×3~7×7칸 작물을 한 번에 거두는 탈것으로, 농부 미반에게서 만듭니다.","[자동 심기](#life-farming~2) · [트랙터](#life-farming~4)"],["동물 포획 · 포획창","올가미를 들고 오버월드 · 코자 대륙의 동물을 우클릭해 미니게임으로 잡는 일입니다. 잡은 동물은 `/포획창` 내 목장에서 기르고, 20분마다 고기 · 가죽 같은 전리품을 쌓습니다.","[동물 포획](#life-ranch)"]]}}]},{"h":"수집 · 꾸미기","blocks":[{"table":{"cols":["용어","뜻","자세히"],"rows":[["도감","한 번이라도 손에 넣은 아이템이 저절로 등록되는 책입니다. 12분류 464칸이고, 분류마다 다 채우면 칭호북을 받습니다.","[도감](#collect-dex~0)"],["칭호 · 칭호북","칭호는 머리 위 이름 앞에 붙는 그림 글자입니다. 칭호북을 우클릭하면 그 칭호를 얻고, `/칭호` 에서 골라 답니다.","[칭호](#collect-titles~0)"],["치장","모자 · 날개 · 등짐 · 풍선 같은 겉모습 꾸미기입니다. 아르덴의 옷장 구역에 들어가면 열리는 옷장에서 입습니다.","[치장 · 펫 뽑기 상자](#style-gacha~0)"],["교환권 · 소환권","뽑기 상자 결과물입니다. 치장은 교환권, 펫 · 탈것은 소환권으로 나오고, 우클릭하면 계정에 들어옵니다. 우클릭 전에는 아이템이라 거래할 수 있습니다.","[여는 방법](#style-gacha~0)"],["멋진 코인","치장 · 펫 상자에서 40% 확률로 1~3개 나오고, 이미 가진 펫 · 탈것이 또 나왔을 때도 받는 코인입니다. 보석상 아미나의 멋진 코인 교환에서 씁니다.","[멋진 코인과 중복 보상](#style-gacha~3)"],["스킨북","검기 · 활 이펙트 · 데미지 스킨 상자에서 나오는 결과물입니다. 우클릭하면 그 스킨이 계정에 들어오고, 그 전에는 거래할 수 있습니다.","[스킨북 쓰고 장착하기](#style-slash~4)"],["드래곤 알 · 드라코닌","내 마을 땅에 놓고 12시간 기다리면 새끼 드라코닌이 나오는 알입니다. 태양 조각을 먹여 100레벨이 되면 타고 나는 성체 드래곤으로 진화합니다.","[드래곤 알 부화](#style-pets~3)"],["이모트 · 이모트 카드","`/이모트` 로 내 스킨을 입은 캐릭터 모델이 춤추는 감정 표현입니다. 처음 4종 말고는 이모트 카드를 우클릭해 배웁니다.","[이모트](#style-emote~0)"]]}}]},{"h":"더 찾아보기","blocks":[{"p":"용어 하나하나의 자세한 수치와 방법은 오른쪽 칸에 이어 둔 문서에 있습니다. 아이템 · 몬스터 · NPC 이름은 사전에서 찾으세요."},{"links":[["#start-first-day","첫날 가이드","처음 온 날 따라갈 순서"],["#start-faq","자주 묻는 질문","죽으면? 아이템은? 돈은?"],["#conv-commands","플레이어 명령어 모음","분류별 명령어 표"],["#items","아이템 사전","아이템 이름으로 찾기"]]}]}],"search":[["이프란","용어집"],["이프란 대륙","용어집"],["아르덴","용어집"],["코자 대륙","용어집"],["로비","용어집"],["마을 서버","용어집"],["야생","용어집"],["오버월드","용어집"],["던전 서버","용어집"],["개척자","용어집"],["팩 검사","용어집"],["그림 맞히기","용어집"],["길라잡이","용어집"],["기초 길라잡이","용어집"],["심화 길라잡이","용어집"],["메인 스토리","용어집"],["졸업","용어집"],["졸업 선물 상자","용어집"],["메인 메뉴","용어집"],["Shift + F","용어집"],["HUD","용어집"],["화면 표시","용어집"],["길안내","용어집"],["퀘스트스킵","용어집"],["비석","용어집"],["셋홈","용어집"],["유저 마을","용어집"],["내 마을","용어집"],["우편함","용어집"],["접속 보상","용어집"],["돈","용어집"],["잼","용어집"],["잼 상점","용어집"],["마일리지","용어집"],["마일리지 상점","용어집"],["일일 퀘스트","용어집"],["일퀘","용어집"],["의뢰 게시판","용어집"],["무역상인","용어집"],["나가","용어집"],["시세","용어집"],["멤버십","용어집"],["VIP  새겨 능력치를 올리는 돌입니다. **생명 · 힘 · 방어 · 치명타** 네 종류가 있고, 종류마다 1개씩 모두 4개를 끼울 수 있습니다. 1성부터 8성까지 있으며 성이 높을수록 강합니다. 룬은 **룬 뽑기**로 얻고, 같은 성 4개를 **합성**해 한 성 위 룬으로 만듭니다. 룬 능력치는 강화 · 인첸트 · 램프 · 스킬북 · 사냥 레벨 같은 다른 능력치와 모두 합쳐집니다.","info":{"title":"룬","slot":{"id":"새-룬-창","need":"`/룬` 룬 창 — 생명 · 힘 · 방어 · 치명타 장착 칸, 보관함, 룬 설명이 보이는 화면"},"rows":[["여는 곳","`/룬` · 메인 메뉴 「룬」 카드 · [아르덴](#arden) 마법사 후를루카"],["종류","생명 · 힘 · 방어 · 치명타 (1~8성)"],["장착","종류마다 1개, 모두 4개"],["룬 뽑기","1회 100,000원 · 10회 900,000원"],["합성","같은 성 4개 → 한 성 위 1개 (5성부터 근원)"],["분해","1개 → 한 성 아래 2개"],["거래","불가 (아이템이 아니라 가방 칸을 차지하지 않음)"]]},"sections":[{"h":"룬 4종 · 성별 능력치","blocks":[{"table":{"cols":["성","생명 (최대 체력)","힘 (주는 피해)","방어 (받는 피해)","치명타 (확률 · 피해)"],"rows":[["1성","+20","+8%","−2%","+1% · +6%"],["2성","+40","+15%","−4%","+2.5% · +13%"],["3성","+60","+24%","−6%","+4% · +20%"],["4성","+90","+36%","−9%","+6% · +30%"],["5성","+130","+51%","−13%","+8.5% · +43%"],["6성","+175","+69%","−17%","+11.5% · +58%"],["7성","+235","+93%","−23%","+15.5% · +78%"],["8성","+300","+120%","−30%","+20% · +100%"]]}},{"list":["**생명** — 최대 체력이 늘어납니다. 갑옷 강화의 최대 체력 % 가 여기에도 곱해집니다.","**힘** — 평타 · 활 · 무기 스킬 · 스킬북 스킬, 어떤 공격이든 주는 피해가 % 만큼 늘어납니다. 플레이어끼리 싸울 때도 붙습니다.","**방어** — 받는 피해가 % 만큼 줄어듭니다. 갑옷 강화의 피해 감소와 차례로 곱해져 적용됩니다.","**치명타** — 치명타 확률과 치명타 피해가 늘어납니다. 무기 강화 · 약점포착 램프의 치명타에 더해지고, 강화하지 않은 무기도 룬이 있으면 치명타가 터집니다.","끼운 룬의 능력치는 `/룬` 창 맨 위 「내 룬 능력치」에서 합계로 봅니다. 다섯 서버 어디서나 같은 값이 적용됩니다."]}]},{"h":"장착하기","blocks":[{"steps":[{"h":"`/룬` 열기","p":"위쪽에 생명 · 힘 · 방어 · 치명타 장착 칸 4개, 아래에 종류별 1~8성 보관함 32칸이 있습니다. 칸마다 가진 개수가 보이고, 없는 룬은 흐리게 보입니다."},{"h":"보관함에서 누르기","p":"끼울 룬을 누르면 그 종류의 장착 칸에 들어갑니다. 이미 끼운 룬이 있으면 그 룬은 보관함으로 돌아갑니다."},{"h":"빼기","p":"장착 칸의 룬을 누르면 빠져서 보관함으로 돌아갑니다. 끼우고 빼는 데 돈은 들지 않습니다."}]},{"note":{"b":"종류마다 1개","t":"같은 종류 룬은 두 개를 함께 끼울 수 없습니다. 생명 · 힘 · 방어 · 치명타를 하나씩, 모두 4개까지입니다."}}]},{"h":"룬 뽑기","blocks":[{"p":"`/룬` 창의 「룬 뽑기」나 `/룬 뽑기` 에서 돈을 내고 룬을 뽑습니다. 1회 100,000원, 10회 900,000원이고, **10회 뽑기는 3성 이상 1개가 보장**됩니다. 성을 먼저 정하고, 종류는 네 가지가 같은 확률로 나옵니다. 뽑은 룬은 바로 보관함에 들어갑니다."},{"table":{"cols":["성","확률"],"num":[1],"rows":[["1성","40%"],["2성","30%"],["3성","20%"],["4성","6.5%"],["5성","2.5%"],["6성","0.8%"],["7성","0.18%"],["8성","0.02%"]]}},{"list":["뽑기를 누르면 창이 닫히고 연출이 나옵니다. 1회는 「?」가 돌다가 터지며 룬이 나오고, 10회는 「?」 10개가 깔린 뒤 낮은 성부터 하나씩 열립니다. 높은 성은 잠깐 멈추며 빛납니다.","연출 중에 쉬프트를 누르면 건너뛰고 바로 결과를 봅니다. 끝나면 룬 뽑기 창이 다시 열리고 나온 룬이 늘어서 있습니다.","6성 이상은 화면 가운데에 큰 제목이 뜨고, 7성 이상은 서버 전체에 공지됩니다."]}]},{"h":"합성 · 분해","blocks":[{"p":"**합성**은 같은 성 룬 4개를 한 성 위 룬 1개로 만드는 일입니다. 재료 종류가 달라도 되고, 나오는 룬의 종류는 무작위입니다. 합성 1번마다 수수료가 들고, 5성 합성부터는 [근원](#growth-origin)도 듭니다."},{"table":{"cols":["합성","수수료 (1번)","근원 (1번)"],"num":[1,2],"rows":[["1성 4개 → 2성 1개","1,000원","—"],["2성 4개 → 3성 1개","5,000원","—"],["3성 4개 → 4성 1개","20,000원","—"],["4성 4개 → 5성 1개","100,000원","—"],["5성 4개 → 6성 1개","300,000원","3개"],["6성 4개 → 7성 1개","1,000,000원","20개"],["7성 4개 → 8성 1개","3,000,000원","100개"]]}},{"list":["합성 창에서 몇 성을 합성할지 고르고, 재료로 쓸 종류를 켜고 끕니다 (처음엔 모두 켜짐). 재료는 켜 둔 종류 중 많이 가진 종류부터 씁니다.","1번 · 10번 · 전부를 고를 수 있습니다. 돈이나 근원이 모자라면 할 수 있는 만큼만 합니다.","끼워 둔 룬은 재료로 쓰지 않습니다.","**분해**는 룬 1개를 한 성 아래 룬 2개로 나누는 일입니다 (2성 이상). 종류는 무작위이고 수수료는 없습니다."]}]},{"h":"얻는 곳 · 여는 곳","blocks":[{"table":{"cols":["어디서","무엇"],"rows":[["룬 뽑기","`/룬` · `/룬 뽑기` · 후를루카 「룬을 다룬다」 → 「룬 뽑기」"],["기초 길라잡이","룬 창을 처음 열면 1성 생명 룬 1개 ([기초 길라잡이](#start-guide-basic))"],["잼 상점","「근원」 쪽 룬 패키지 — 근원 300개 · 5성 룬 4개(종류별 1개), 매달 1번 ([잼 상점](#shop-gem))"],["합성 · 분해","`/룬 합성` · `/룬 분해` 또는 `/룬` 창 오른쪽 단추"]]}},{"list":["[아르덴](#arden)의 마법사 후를루카에게 말을 걸어 「룬을 다룬다」를 고르면 「룬 보관함」과 「룬 뽑기」를 열 수 있습니다.","룬은 아이템이 아니라 계정에 저장되는 기록이라 가방 칸을 차지하지 않고, 버리거나 거래할 수 없습니다.","룬 뽑기 · 장착 · 합성과 5~8성 룬 얻기는 [도전과제](#collect-achievement) 「룬」 분류에 있습니다."]},{"links":[["#growth-origin","근원","5성부터 합성에 드는 재화"],["#growth-power","전투력","룬이 전투력에 얼마나 들어가는지"],["#growth-enhance","강화","룬과 합쳐지는 강화 능력치"]]}]}],"search":[["생명 룬","룬"],["힘 룬","룬"],["방어 룬","룬"],["치명타 룬","룬"],["룬 뽑기","룬"],["룬 합성","룬"],["룬 분해","룬"],["8성","룬"]]},"growth-mana":{"id":"growth-mana","parent":"growth","title":"마나","short":"스킬을 쓸 때 드는 마나. 기본 최대 100 · 초당 4 회복, 갑옷 oking)","1개","5%"]]}},{"note":{"b":"도감 완료도","t":"[도감](#collect-dex)의 곤충 · 포션 · 왕관 · 음식 분류 완료도가 오르면 곤충 · 연금술 · 사냥터 몬스터 · 요리에서 근원이 나올 확률이 조금씩 올라갑니다."}}]},{"h":"얻는 곳 — 퀘스트 · 도전과제 · 이벤트","blocks":[{"table":{"cols":["어디서","근원","얼마나 자주"],"rows":[["[일일 퀘스트](#quest-daily)","하나에 3개 (하루 5개)","매일"],["서버 추천 (일일 퀘스트 「서버 추천하기」)","5개","매일"],["[메인 스토리](#quest-main)","퀘스트마다 5~12개 · 보스 퀘스트 25~60개","한 번"],["[기초 길라잡이](#start-guide-basic)","하나에 3개","한 번"],["[심화 길라잡이](#quest-guide-advanced)","하나에 8개","한 번"],["[도전과제](#collect-achievement)","브론즈 10 · 실버 20 · 골드 30 · 플래티넘 40개","단계마다 한 번"],["[도감](#collect-dex) 완료도","분류마다 10%를 채울 때마다 쉬움 5 · 보통 10 · 어려움 15 · 매우 어려움 25개, 100%에 30 · 50 · 80 · 150개 더","단계마다 한 번"],["계절 이벤트 · 쿠폰","이벤트마다 다름","이벤트 기간"]]}},{"p":"쿠폰은 `/쿠폰` 으로 코드를 넣어 받습니다. 이벤트 보상은 이벤트가 열릴 때 공지됩니다."}]},{"h":"사기","blocks":[{"p":"**게임 돈** — `/근원` 화면에서 돈으로 삽니다. 1개에 50,000원이고, 돈으로는 하루 20개까지 살 수 있습니다 (매일 오전 6시 초기화). 돈으로 산 근원은 선물할 수 없습니다."},{"table":{"cols":["상품","값"],"num":[1],"rows":[["근원 1개","50,000원"],["근원 5개","250,000원"],["근원 10개","500,000원"]]}},{"p":"**잼** — [잼 상점](#shop-gem)의 다음 쪽 「근원」에서 근원 묶음과 패키지를 삽니다. 상품을 쉬프트 + 좌클릭하고 채팅에 닉네임을 쓰면 다른 사람에게 선물할 수 있습니다 (첫 근원 상자는 선물 불가)."},{"table":{"cols":["상품","값","근원","함께 받는 것","살 수 있는 횟수"],"num":[1,2],"rows":[["근원 20개","1,000잼","20개","—","제한 없음"],["근원 100개","4,900잼","100개","—","제한 없음"],["근원 210개","9,900잼","210개 (덤 10개 포함)","—","제한 없음"],["근원 650개","29,000잼","650개 (덤 50개 포함)","—","제한 없음"],["근원 1,150개","49,000잼","1,150개 (덤 150개 포함)","—","제한 없음"],["근원 2,500개","99,000잼","2,500개 (덤 520개 포함)","—","제한 없음"],["첫 근원 상자","4,900잼","300개 (보통 값의 3배)","—","계정당 1번"],["주간 근원 꾸러미","4,900잼","120개","단계 하락 방지권 10장","매주 1번"],["강화 지원 패키지","16,900잼","400개","단계 하락 방지권 30장","매달 2번"],["램프 패키지","14,900잼","250개","상급 램프 랜덤 상자 2개","매달 2번"],["인첸트 패키지","12,900잼","250개","인첸트 조각 48개","매달 2번"],["룬 패키지","14,900잼","300개","5성 룬 4개 (종류별 1개)","매달 1번"]]}}]},{"h":"`/근원` 화면","blocks":[{"list":["내 근원 보유량, 이번 주 활동으로 얻은 근원, 근원이 꼭 드는 곳이 보입니다.","「근원 얻는 곳」을 누르면 얻는 곳이 한 줄씩 나오고, 이번 주 · 오늘 받은 것과 확률을 볼 수 있습니다.","돈으로 사기 단추(1 · 5 · 10개)와 오늘 더 살 수 있는 개수가 보입니다.","화면 왼쪽 위 소지금 · 잼 · 마일리지 배지 아래에도 내 근원이 늘 보입니다."]},{"links":[["#growth-enhance","강화","21강부터 근원"],["#growth-enchant","인첸트","해방 · 해방 업그레이드"],["#growth-lamp","램프","상급 램프"],["#growth-rune","룬","5성부터 합성"]]}]}],"search":[["근원","근원"],["근원 얻는 곳","근원"],["근원 사기","근원"],["근원 패키지","근원"],["첫 근원 상자","근원"],["주간 근원 꾸러미","근원"]]},"life-ranch":{"id":"life-ranch","parent":"life","title":"동물 포획 · 포획창","short":"포획 올가미로 야생 · 코자 대륙의 동물을 잡아 포획창에서 기르고, 20분마다 쌓이는 전리품을 받습니다.","color":"var(--reg-forest)","tags":[["야생 · 코자 대륙","lv"],["동물 27종",null],["동물마다 10마리",null],["`/포획창`",null]],"lede":"포획 올가미를 들고 동물을 우클릭하면 짧은 미니게임이 열리고, 성공하면 그 동물이 내 **포획창**으로 들어갑니다. 잡은 동물은 20분마다 고기 · 가죽 · 우유 같은 전리품을 쌓고, 포획창에서 한 번에 받습니다. 마을 서버에서는 이제 동물이 저절로 생기지 않으니, 고기 · 우유 · 양털 같은 재료는 포획한 동물에게서 받으면 됩니다.","info":{"title":"동물 포획","slot":{"id":"새-포획창","need":"`/포획창` 내 목장 (잡은 동물 칸)"},"rows":[["도구","포획 올가미 (기본 아이템 세트 · 쓸 때 사라지지 않음)"],["잡는 곳","[야생](#world-wild) · [코자 대륙](#koza)"],["조작","올가미를 들고 동물 우클릭 → 미니게임"],["미니게임","4가지 중 하나 (무작위)"],["한도","동물마다 최대 10마리"],["전리품","20분마다 1마리당 · 최대 12시간치"],["포획창","`/포획창` (`/목장` 도 같음) · 5개 서버 어디서나 같음"],["도전과제","[도전과제](#collect-achievement) 「포획」 분류"]]},"sections":[{"h":"잡는 법","blocks":[{"steps":[{"h":"포획 올가미를 든다","p":"포획 올가미는 대장장이 루이흐에게 받는 기본 아이템 세트에 들어 있습니다. 써도 사라지지 않고, 잃어버렸다면 `/포획창` 의 「내 목장」 칸을 눌러 다시 받을 수 있습니다(가방에 올가미가 없을 때만)."},{"h":"동물을 우클릭한다","p":"[야생](#world-wild)이나 [코자 대륙](#koza)에서 올가미를 들고 동물을 우클릭합니다. 끈을 묶는 것 대신 포획이 시작되고, 화면이 포획 무대로 바뀌며 미니게임 4가지 중 하나가 무작위로 나옵니다."},{"h":"미니게임에 성공한다","p":"성공하면 「포획!」과 함께 지금 몇 마리인지(예: 3 / 10마리)가 채팅에 뜨고, 동물은 포획창으로 들어갑니다. 실패하면 동물이 놀라 빠르게 도망가고, 잠시 뒤에 다시 도전할 수 있습니다. 미니게임 중 Shift 를 누르면 포기합니다."}]},{"list":["로비(이프란) · 마을 서버 · 던전 서버에서는 포획할 수 없습니다.","바닐라 동물만 잡힙니다. 사냥터 몬스터 같은 특별한 몹, 3D 모델 몹, NPC, 펫은 잡을 수 없습니다.","다른 사람이 길들인 동물, 끈에 묶이거나 누가 타고 있는 동물은 잡을 수 없습니다. 안장 · 상자 · 갑옷을 단 동물은 먼저 빼야 합니다(포획하면 사라집니다).","같은 동물은 10마리까지입니다. 꽉 찼으면 포획창에서 놓아주어 자리를 만드세요."]}]},{"h":"포획 미니게임 4가지","blocks":[{"p":"동물마다 난이도가 정해져 있습니다. 소 · 돼지 · 양 · 닭 · 토끼는 **쉬움**, 판다 · 북극곰 · 스니퍼 · 앵무조개 · 행복한 가스트는 **어려움**, 나머지는 **보통**이고, 새끼 동물은 한 단계 쉬워집니다. 어려울수록 판정이 좁고 빠릅니다."},{"cards":[{"h":"올가미 던지기","p":"금빛 고리가 줄어들어 점선 원에 겹칠 때 스페이스를 누릅니다. 올가미는 3번 던질 수 있고, 2번 걸면 성공입니다.","color":"var(--gold)"},{"h":"밧줄 버티기","p":"화면의 밧줄 게이지에서 바늘이 움직이는 초록 구간 안에 있도록 A · D 를 눌러 버팁니다. 18초 안에 포획 게이지를 끝까지 채우면 성공, 바늘이 끝에 오래 닿아 밧줄이 끊어지거나 시간이 다 되면 실패입니다.","color":"var(--reg-forest)"},{"h":"먹이로 꾀기","p":"동물이 좋아하는 먹이 순서(쉬움 3 · 보통 4 · 어려움 5개)를 잘 보고, A · D 로 먹이를 골라 스페이스로 순서대로 내밉니다. 쉬움 · 보통은 한 번까지 틀려도 됩니다.","color":"var(--reg-desert)"},{"h":"발자국 쫓기","p":"동물이 튀는 방향을 따라 A(왼쪽) · D(오른쪽) · W(앞)를 누릅니다. 다섯 걸음 따라붙으면 성공, 두 번 놓치면 따돌려집니다.","color":"var(--reg-jungle)"}]}]},{"h":"포획창 · 전리품 받기","blocks":[{"p":"`/포획창` 을 입력하면 내 목장이 열립니다. 어느 서버에서 열어도 같은 포획창입니다. 동물 27종이 칸마다 나오고, 칸에 마우스를 올리면 몇 마리인지 · 20분마다 1마리당 무엇이 나오는지 · 지금 쌓인 전리품 · 다음 쌓임까지 남은 시간이 보입니다."},{"slot":{"id":"새-포획창","need":"`/포획창` 내 목장 (잡은 동물 칸)"}},{"table":{"cols":["칸 · 조작","하는 일"],"rows":[["동물 칸 좌클릭","그 동물의 쌓인 전리품 받기"],["「전부 회수」","모든 동물의 쌓인 전리품을 한 번에 받기 (가방 칸이 모자라면 들어가는 만큼만)"],["동물 칸 Shift+우클릭 두 번","그 동물 1마리 놓아주기 (3초 안에 한 번 더 · 되돌릴 수 없음)"],["「내 목장」","포획한 동물 수 · 받을 수 있는 전리품 보기, 올가미가 없으면 다시 받기"]]}},{"list":["전리품은 20분마다 마리 수만큼 쌓입니다. 한 마리당 12시간치(36번)까지 쌓이고, 꽉 차면 받기 전까지 더 쌓이지 않습니다.","우유는 빈 양동이 없이 받고, 우유 양동이가 한 칸에 64개까지 겹쳐서 들어옵니다(마시면 빈 양동이가 남습니다).","접속하지 않은 동안에도 쌓입니다."]}]},{"h":"동물 27종과 전리품","blocks":[{"table":{"cols":["동물","20분마다 1마리당","난이도"],"rows":[["소","생 소고기 1~3 · 가죽 0~2 · 우유 0~1","쉬움"],["돼지","생 돼지고기 1~3","쉬움"],["양","생 양고기 1~2 · 흰색 양털 2~4","쉬움"],["닭","생 닭고기 1 · 깃털 0~2 · 달걀 0~1","쉬움"],["토끼","생 토끼고기 0~1 · 토끼 가죽 0~1 · 토끼발 1 (10%)","쉬움"],["염소","우유 0~1","보통"],["무시룸","생 소고기 1~3 · 가죽 0~2","보통"],["말","가죽 0~2","보통"],["당나귀","가죽 0~2","보통"],["노새","가죽 0~2","보통"],["라마","가죽 0~2 (떠돌이 상인 라마도 라마로 셈)","보통"],["낙타","없음","보통"],["고양이","실 0~2","보통"],["늑대","없음","보통"],["여우","없음","보통"],["오셀롯","없음","보통"],["앵무새","깃털 1~2","보통"],["판다","대나무 0~2","어려움"],["북극곰","생 대구 0~2 · 생 연어 0~2","어려움"],["벌","벌집 조각 0~1","보통"],["거북","해초 0~2 · 거북 인갑 1 (10%)","보통"],["개구리","없음","보통"],["아홀로틀","없음","보통"],["아르마딜로","아르마딜로 인갑 0~1","보통"],["스니퍼","횃불꽃 씨앗 1 (10%) · 벌레잡이풀 꼬투리 1 (10%)","어려움"],["앵무조개","없음","어려움"],["행복한 가스트","없음","어려움"]]}},{"p":"전리품이 「없음」인 동물도 포획해 기를 수 있고, 도전과제 · 수집용으로 잡습니다. 고기 · 우유 · 달걀은 [요리 · 가공](#life-cooking) 재료이고, 요리는 [무역상인 나가](#life-trade)에게 팝니다."}]},{"h":"알아 둘 것","blocks":[{"list":["마을 서버에서는 동물 · 몬스터 · 주민이 저절로 생기지 않습니다. 마을에서 쓸 고기 · 양털 · 우유는 포획창에서 받으세요.","[기초 길라잡이](#start-guide-basic)에 「올가미를 던지다」(동물 포획), [심화 길라잡이](#quest-guide-advanced)에 「내 목장」(포획창에서 전리품 받기) 단계가 있습니다.","[도전과제](#collect-achievement)의 「포획」 분류에 첫 포획 · 10 · 50 · 150마리 포획과 판다 · 북극곰 · 아홀로틀 · 스니퍼 포획 과제가 있습니다."]},{"links":[["#life-cooking","요리 · 가공 · 연금술","고기 · 우유 · 달걀로 만드는 요리"],["#world-wild","야생","동물을 잡는 곳"],["#collect-achievement","도전과제","포획 분류"]]}]}],"search":[["포획","동물 포획"],["올가미","동물 포획"],["포획 올가미","동물 포획"],["/포획창","명령어"],["/목장","포획창"],["목장","포획창"],["동물 기르기","동물 포획"],["전리품 회수","포획창"],["밧줄 버티기","포획 미니게임"],["우유","포획창"]]},"life-logging":{"id":"life-logging","parent":"life","title":"벌목","short":"자연에서 자란 원목을 베면 벌목 경험치 · 2배 드롭. 수액 채취 · 황금 솔방울 미니게임, 나무꾼 도르반의 나무 상점.","color":"var(--reg-forest)","tags":[["벌목 직업",null],["최대 Lv.1000","lv"],["미니게임 2종",null],["묘목 심기 금지",null]],"lede":"**벌목**은 7번째 생활 직업입니다. 자연에서 자란 나무의 원목을 베면 벌목 경험치가 오르고(최대 Lv.1000), 레벨이 오를수록 원목이 2개 나올 확률이 커집니다. 원목을 베다 보면 가끔 **수액 채취** · **황금 솔방울** 미니게임이 열립니다. 모은 원목 · 묘목 · 수액 · 황금 솔방울은 마을의 나무꾼 도르반에게 「나무 상점」으로 팝니다.","info":{"title":"벌목","rows":[["직업","벌목 (7번째 생활 직업 · 최대 Lv.1000)"],["경험치","자연 원목 11종 · 하나에 5~8"],["2배 드롭","원목 · 벌목 Lv1 2% → Lv1000 30%"],["미니게임","수액 채취 · 황금 솔방울 (원목을 벨 때 확률)"],["판매","마을의 나무꾼 도르반 「나무 상점」 (팔기만)"],["묘목 심기","모든 서버에서 막힘"],["도감","「나무」 24칸 · 100%면 칭호 「나무꾼」"],["관련 문서","[직업](#growth-jobs) · [도감](#collect-dex)"]]},"sections":[{"h":"경험치를 주는 원목","blocks":[{"p":"벌목 경험치는 **자연에서 자란 원목**을 벨 때만 들어옵니다. 오버월드 나무 9종과 네더의 진홍 · 뒤틀린 자루까지 모두 11종입니다."},{"table":{"cols":["원목","벌목 경험치","판매가 (벌목 Lv1)","판매가 (벌목 Lv1000)"],"num":[1,2,3],"rows":[["참나무 원목","5","50원","75원"],["가문비나무 원목","5","50원","75원"],["자작나무 원목","5","50원","75원"],["정글 나무 원목","6","60원","90원"],["아카시아 원목","6","60원","90원"],["짙은 참나무 원목","6","60원","90원"],["맹그로브 원목","6","60원","90원"],["벚나무 원목","7","70원","105원"],["창백한 참나무 원목","8","80원","120원"],["진홍 자루","7","70원","105원"],["뒤틀린 자루","7","70원","105원"]]}},{"list":["**플레이어가 놓은 원목**은 다시 베어도 경험치가 없습니다.","**뼛가루로 키운 나무**의 원목도 경험치가 없습니다.","경험치 책 · [서버 경험치 부스터](#growth-booster)는 다른 직업처럼 벌목 경험치에도 붙습니다."]}]},{"h":"벌목 레벨 혜택","blocks":[{"table":{"cols":["벌목 레벨","1","10","100","300","500","1000"],"rows":[["원목 2배 드롭","2%","5%","10%","15%","20%","30%"]]}},{"p":"레벨이 위 구간에 닿으면 원목이 2개 나올 확률이 한 번에 오릅니다. 네더라이트 도끼 [강화](#growth-enhance)(1강 +1% → 20강 +40%)와 도끼의 [램프](#growth-lamp) 「목재풍요 I~III」(+5% · +15% · +30%)이 이 확률에 더해집니다."}]},{"h":"묘목 심기 금지","blocks":[{"p":"숲은 숲이 키웁니다. **모든 서버**에서 묘목 · 맹그로브 번식체 · 진홍 균 · 뒤틀린 균을 땅에 심을 수 없습니다. 주운 묘목은 나무꾼 도르반의 나무 상점에 팝니다. 손에 넣으면 [도감](#collect-dex) 「나무」 칸도 열립니다."}]},{"h":"미니게임 — 수액 채취","blocks":[{"p":"자연 원목을 벨 때 가끔 수액 채취가 시작됩니다. 떨어지는 수액 방울을 **A · D** 로 병을 옮겨 받으세요. **쉬프트**를 누르면 포기합니다."},{"table":{"cols":["항목","내용"],"rows":[["나올 확률","기본 1.5% + 도끼 강화 1강마다 0.05%"],["쿨타임","한 번 나오면 90초 동안 다시 나오지 않음"],["조작","A · D 로 병 옮기기 · 쉬프트 포기"],["보상","받은 비율에 따라 수액 1~3개. 벌목 레벨이 높을수록 더 많이 받고, 최대 레벨이면 약 3.5배"]]}}]},{"h":"미니게임 — 황금 솔방울","blocks":[{"p":"아주 드물게 가지 끝에 황금 솔방울이 매달립니다. 게이지 타이밍에 맞춰 **스페이스**로 가지를 3번 쳐서 떨어뜨리고, 떨어지는 솔방울을 받으면 성공입니다. **쉬프트**를 누르면 포기합니다."},{"table":{"cols":["항목","내용"],"rows":[["나올 확률","벌목 Lv1 0.25% → 최대 레벨 0.5% + 도끼 강화 1강마다 0.01%"],["쿨타임","한 번 나오면 300초(5분) 동안 다시 나오지 않음"],["조작","스페이스로 가지 치기 (3번) · 쉬프트 포기"],["보상","성공하면 황금 솔방울 1개"]]}},{"table":{"cols":["얻는 아이템","등급","쓰는 곳"],"rows":[["수액","고급","나무 상점 판매 (표의 값 40원)"],["황금 솔방울","희귀","나무 상점 판매 (표의 값 500원)"]]}}]},{"h":"나무 상점 (나무꾼 도르반)","blocks":[{"p":"마을의 나무꾼 도르반에게 말을 걸고 「나무 상점 열기」를 고르면 나무 상점이 열립니다. **팔기만** 하는 상점이라 원목 · 묘목을 살 수는 없습니다."},{"table":{"cols":["물건","표의 값","받는 돈 (벌목 Lv1)","받는 돈 (벌목 Lv1000)"],"num":[1,2,3],"rows":[["참나무 · 가문비나무 · 자작나무 원목","5원","50원","75원"],["정글 · 아카시아 · 짙은 참나무 · 맹그로브 원목","6원","60원","90원"],["벚나무 function loadIcons(set="items"){
  if(LOADED[set]) return; LOADED[set]="loading";
  fetch(ICONSET[set]).then(r=>r.json()).then(j=>{LOADED[set]=1;
    if(set==="items") Object.assign(W.media,j); else Object.assign(EXTRA,j);
    thumbIndex(); if(DICT[cur]&&$("#dlist")) refreshDict(cur); else go();}).catch(()=>{LOADED[set]=1});
}
function slot(o,cls=""){
  if(!o) return "";
  let real=W.media[o.id], icon="";
  if(real&&typeof real==="object"){icon=" icon"+(real.px?" px":"");real=real.s;}
  if(!real&&/^아이템-/.test(o.id)) loadIcons();
  const src=real||(W.tempFix||{})[o.id]||W.temp[hash(o.id)%W.temp.length];
  return `<figure class="slot ${o.video?"video":""} ${cls}${icon}" data-slot="${esc(o.id)}">
    <img src="${esc(src)}" alt="${esc(o.need||o.id)}" loading="lazy">
    ${real?"":`<span class="tmp">임시</span><figcaption>${o.video?"영상":"사진"} 칸 · ${esc(o.id)}</figcaption>`}</figure>`;
}
/* 몬스터 · NPC · 아이템 · 물고기 · 곤충 · 펫 · 치장 이름 → 렌더 사진 (표 · 카드 · 칩 · 사전 목록에 작게) */
const THUMB={}, THUMBN={}, EXTRA=Object.assign({},(W.thumbs||{}).extra||{});
const nsp=s=>String(s).replace(/\s+/g,"");
function addThumb(name,o){if(!THUMB[name]){THUMB[name]=o;THUMBN[nsp(name)]=o;}}
function thumbIndex(){
  for(const [kind,pre,key] of [["mobs","몬스터-","mob"],["npcs","NPC-","npc"],["items","아이템-","item"]])
    for(const x of (W[kind]||[])){const m=W.media[pre+x.name]; if(!m) continue;
      const o={s:typeof m==="object"?m.s:m,px:typeof m==="object"&&m.px,icon:typeof m==="object",h:"#"+key+"-"+x.k};
      addThumb(x.name,o); const i=x.name.lastIndexOf(", "); if(i>0) addThumb(x.name.slice(i+2),o);}
  for(const [n,v] of Object.entries(EXTRA)) addThumb(n,{s:v.s,px:v.px,icon:1});
  for(const [n,v] of Object.entries((W.thumbs||{}).alias||{})){
    if(v[0]==="="){const t=THUMBN[nsp(v.slice(1))]; if(t) addThumb(n,t);} else addThumb(n,{s:v});}
}
thumbIndex();
function thumbFor(c){
  const t=String(c??"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*`]/g,"").trim();
  if(!t||t.length>40) return null;
  const t2=t.replace(/\s*\(.*\)\s*$/,"");
  let r=THUMB[t]||THUMB[t2]||THUMBN[nsp(t)]||THUMBN[nsp(t2)];
  if(!r&&t2.length>=2&&t!==t2){const k=Object.keys(THUMB).find(n=>n.startsWith(t2+" ")||n.startsWith(t2+"("));if(k) r=THUMB[k];}
  return r||null;
}
function thumbImg(th,cls="thumb"){return `<img class="${cls}${th.icon?" ticon":""}${th.px?" px":""}" src="${esc(th.s)}" alt="" loading="lazy">`}
function tags(t){return (t||[]).map(x=>{const [txt,k]=Array.isArray(x)?x:[x,null];return `<span class="tag ${k==="lv"?"lv":""}">${md(txt)}</span>`}).join("")}

function block(b){
  if(b.p!=null) return `<div class="prose blk"><p>${md(b.p)}</p></div>`;
  if(b.list) return `<div class="prose blk"><ul>${b.list.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div>`;
  if(b.steps) return `<div class="steps blk">${b.steps.map(s=>`<div class="step"><b>${md(s.h)}</b><p>${md(s.p)}</p></div>`).join("")}</div>`;
  if(b.table){const t=b.table, num=new Set(t.num||[]);
    const cells=t.rows.flat(), avg=cells.length?cells.join("").length/cells.length:0; return `<div class="tbl blk${t.cols.length>=4?((t.rows.length>12||avg<14)?" sticky":" wide"):""}"><table><thead><tr>${t.cols.map((c,i)=>`<th class="${num.has(i)?"num":""}">${md(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>{const th=num.has(i)?null:thumbFor(c);return `<td class="${num.has(i)?"num":""}${i===0&&!num.has(0)?" who":""}" data-l="${esc(String(t.cols[i]??"").replace(/\*\*|`/g,""))}">${th?`<a class="trow" href="${th.h}">${thumbImg(th)}</a>`:""}${md(c)}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
  if(b.cards) return `<div class="cards blk">${b.cards.map(c=>{const th=thumbFor(c.h);return `<div class="card${th?" has-cth":""}" style="--cc:${c.color||"var(--line-strong)"}">${th?(th.h?`<a href="${th.h}">${thumbImg(th,"cthumb")}</a>`:thumbImg(th,"cthumb")):""}<h3>${md(c.h)}</h3>${c.p?`<p>${md(c.p)}</p>`:""}
    ${c.chips?`<div class="chips">${c.chips.map(x=>{const th=thumbFor(x);return `<span class="tag${th?" has-chth":""}">${th?thumbImg(th,"chthumb"):""}${md(x)}</span>`}).join("")}</div>`:""}
    ${c.dl?`<dl>${c.dl.map(d=>`<dt>${md(d[0])}</dt><dd>${md(d[1])}</dd>`).join("")}</dl>`:""}</div>`}).join("")}</div>`;
  if(b.chips) return `<div class="chips blk">${b.chips.map(x=>{const th=thumbFor(x);return `<span class="tag${th?" has-chth":""}">${th?thumbImg(th,"chthumb"):""}${md(x)}</span>`}).join("")}</div>`;
  if(b.note) return `<p class="note blk"><b>${md(b.note.b||"")}</b> ${md(b.note.t||"")}</p>`;
  if(b.slot) return `<div class="blk">${slot(b.slot,"wide-slot")}</div>`;
  if(b.lore) return `<div class="blk">${lorecard(b.lore.name,b.lore.lines,b.lore.color)}</div>`;
  if(b.links) return `<div class="links blk children">${b.links.map(l=>`<a href="${esc(l[0])}"><b>${md(l[1])}</b>${l[2]?`<span>${md(l[2])}</span>`:""}</a>`).join("")}</div>`;
  return "";
}
function lorecard(name,lines,color){
  return `<div class="lorecard"><div class="nm" style="color:${esc(color||"#FFFFFF")}">${esc(name)}</div>${(lines||[]).map(l=>{
    const m=/^(사용 방법|획득 방법|[^:]{1,8}):\s?(.*)$/.exec(l);
    return `<div class="ln">${m?`<span class="k">${esc(m[1])}:</span> ${esc(m[2])}`:esc(l)||"&nbsp;"}</div>`}).join("")}</div>`;
}
function crumb(parts){return `<div class="crumb"><a href="#home">대문</a>${parts.map(p=>p[0]?`›<a href="#${p[0]}">${esc(p[1])}</a>`:`›<span>${esc(p[1])}</span>`).join("")}</div>`}

function renderPage(id){
  const p=PAGES[id];
  if(/^style|^shop-gem|^shop-mileage|^life-farming/.test(id)) loadIcons("style");
  if(!LOADED.items){const pj=JSON.stringify(p); if(W.items.some(x=>x.name.length>2&&pj.includes(x.name))) loadIcons("items");}
  const parts=[]; if(p.parent) parts.push([p.parent,titleOf(p.parent)]); parts.push([null,p.title]);
  const kids=(W.children[id]||[]).map(k=>PAGES[k]).filter(Boolean);
  const info=p.info?`<aside class="infobox" style="--rc:${p.color||"var(--accent)"}">${slot(p.info.slot)}<h3>${md(p.info.title||p.title)}</h3>
    <dl>${(p.info.rows||[]).map(r=>`<dt>${md(r[0])}</dt><dd>${md(r[1])}</dd>`).join("")}</dl></aside>`:"";
  return `${crumb(parts)}
  <div class="doc-head ${info?"":"noinfo"}"><div><h1>${md(p.title)}</h1>
    ${p.tags&&p.tags.length?`<div class="tags">${tags(p.tags)}</div>`:""}
    ${p.lede?`<div class="prose" style="margin-top:14px"><p>${md(p.lede)}</p></div>`:""}</div>${info}</div>
  ${kids.length?`<section class="section"><h2>이 분류의 문서</h2><div class="children">${kids.map(k=>`<a href="#${k.id}" style="--cc:${k.color||"var(--accent)"}"><b>${md(k.title)}</b><span>${md(k.short||k.lede||"")}</span></a>`).join("")}</div></section>`:""}
  ${(p.sections||[]).length>=4?`<nav class="toc" aria-label="이 문서 차례"><b>차례</b>${p.sections.map((s,i)=>`<a href="#${p.id}~${i}">${esc(String(s.h).replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/\*\*|`/g,""))}</a>`).join("")}</nav>`:""}${(p.sections||[]).map((s,i)=>`<section class="section" id="s-${i}"><h2>${md(s.h)}</h2>${(s.blocks||[]).map(block).join("")}</section>`).join("")}`;
}

const DICT={
  items:{title:"아이템 사전",data:W.items,key:"item",lede:"게임에서 쓰이는 아이템을 모았습니다. 이름을 누르면 설명과 얻는 곳이 나옵니다.",group:x=>x.cat,sub:x=>x.cat},
  mobs:{title:"몬스터 사전",data:W.mobs,key:"mob",lede:"사냥터, 던전, 야생에서 만나는 몬스터입니다.",group:x=>x.area,sub:x=>`${x.area}${x.tier?" · "+x.tier:""}`},
  npcs:{title:"NPC 사전",data:W.npcs,key:"npc",lede:"이프란 대륙 마을에 사는 NPC입니다.",group:x=>x.town,sub:x=>`${x.town} · ${x.role}`}
};
const dictState={};
function renderDict(kind){
  if(kind==="items") loadIcons();
  const D=DICT[kind], st=dictState[kind]||(dictState[kind]={g:"전체",q:"",n:120});
  const groups=["전체",...[...new Set(D.data.map(D.group))]];
  const list=dictFilter(kind,st);
  return `${crumb([[null,D.title]])}<h1>${D.title}</h1><p class="lede">${D.lede}</p>
   <div class="filters">${groups.map(g=>`<button class="chip ${g===st.g?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
   <input class="dict-q" id="dq" type="text" placeholder="이 사전에서 찾기" value="${esc(st.q)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
   <div id="dlist">${dictList(kind,list,st)}</div>`;
}
function dictList(kind,list,st){
  const D=DICT[kind];
  return `<p class="count" style="margin-top:10px">${list.length}개</p>
   <div class="dict">${list.slice(0,st.n).map(x=>{const th=THUMB[x.name];return `<a href="#${D.key}-${x.k}" class="${th?"has-th":""}">${th?thumbImg(th,"dthumb"):""}<b class="${x.r?"r"+x.r:""}">${esc(x.name)}</b><span>${esc(D.sub(x))}</span></a>`}).join("")}</div>
   ${list.length>st.n?`<button class="chip more" id="dmore">더 보기 (${list.length-st.n}개 남음)</button>`:""}`;
}
function dictFilter(kind,st){
  const D=DICT[kind], v=st.q.trim().replace(/\s+/g,"");
  return D.data.filter(x=>(st.g==="전체"||D.group(x)===st.g)&&(!v||(x.name+(x.cat||"")+(x.area||"")+(x.role||"")).replace(/\s+/g,"").includes(v)));
}
/* 2026-10-30 입력칸은 두고 목록만 다시 그린다 (한글 조합이 끊기지 않게) */
function refreshDict(kind){
  const st=dictState[kind], box=$("#dlist"); if(!st||!box) return;
  box.innerHTML=dictList(kind,dictFilter(kind,st),st);
  const m=$("#dmore"); if(m) m.onclick=()=>{st.n+=240;refreshDict(kind)};
}
function bindDict(kind){
  const st=dictState[kind];
  document.querySelectorAll(".filters .chip").forEach(b=>b.onclick=()=>{st.g=b.dataset.g;st.n=120;draw()});
  const dq=$("#dq"); if(dq){dq.oninput=()=>{st.q=dq.value;st.n=120;refreshDict(kind)};
    /* 2026-10-30 v9 치는 동안 페이지 높이가 줄지 않게 (폰 보기 창에서 커서가 맨 앞으로 가던 것) */
    dq.onfocus=()=>{const b=$("#dlist");if(b)b.style.minHeight=b.offsetHeight+"px"};
    dq.onblur=()=>{const b=$("#dlist");if(b)b.style.minHeight=""}}
  const m=$("#dmore"); if(m) m.onclick=()=>{st.n+=240;refreshDict(kind)};
}

  <div class="doc-head"><div><h1 class="${x.r?"r"+x.r:""}" style="color:inherit">${esc(x.name)}</h1><div class="tags">${tags([[x.cat,null]].concat(x.rn?[[x.rn,null]]:[]))}</div>

/* 사진 필요 목록 (주소 #media-list — 목차에는 없음) */
function collectSlots(){
  const out=[]; const add=(o,where)=>{if(o&&o.id&&!out.find(x=>x.id===o.id))out.push({id:o.id,need:o.need||"",video:!!o.video,where})};
  add(W.home.slot,"대문");
  for(const p of Object.values(PAGES)){ if(p.info) add(p.info.slot,p.title); (p.sections||[]).forEach(s=>(s.blocks||[]).forEach(b=>{if(b.slot) add(b.slot,p.title)})); }
  return out;
}
function renderMediaList(){
  const L=collectSlots(); const done=L.filter(x=>W.media[x.id]).length;
  return `${crumb([[null,"사진·영상 필요 목록"]])}<h1>사진·영상 필요 목록</h1><p class="lede">문서에 들어갈 사진·영상 칸입니다. 칸 번호와 같이 보내 주시면 임시 사진을 바꿔 넣습니다. 완료 ${done} / ${L.length}.
  사전(아이템·몬스터·NPC) 칸은 이 목록에서 뺐습니다.</p>
  <div class="tbl" style="margin-top:14px"><table><thead><tr><th>칸 번호</th><th>무엇을 찍으면 되나</th><th>종류</th><th>문서</th><th>상태</th></tr></thead>
  <tbody>${L.map(x=>`<tr><td class="who">${esc(x.id)}</td><td>${esc(x.need)}</td><td>${x.video?"영상":"사진"}</td><td>${esc(x.where)}</td><td>${W.media[x.id]?"완료":"임시"}</td></tr>`).join("")}</tbody></table></div>`;
}

function draw(){
  const id=cur; let html, navId=id, title;
  const m=/^(item|mob|npc)-(.+)$/.exec(id);
  if(id==="home"){html=renderHome();title=null}
  else if(DICT[id]){html=renderDict(id);title=DICT[id].title}
  else if(m){const kind={item:"items",mob:"mobs",npc:"npcs"}[m[1]];const x=DICT[kind].data.find(z=>z.k===m[2]);navId=kind;
    html=x?({item:renderItem,mob:renderMob,npc:renderNpc}[m[1]])(x):stub(id);title=x?x.name:null}
  else if(id==="media-list"){html=renderMediaList();title="사진·영상 필요 목록"}
  else if(PAGES[id]){html=renderPage(id);title=PAGES[id].title;const p=PAGES[id];if(p.parent&&!NAVFLAT.find(i=>i[0]===id))navId=p.parent}
  else{html=stub(id);title=titleOf(id)}
  main.innerHTML=html;
  rail.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.id===navId));
  document.title=title?`${title} · 코자 온라인 위키`:"코자 온라인 위키";
  if(DICT[id]) bindDict(id);
}
function secOf(){const n=route();const i=n.indexOf("~");return i<0?null:n.slice(i+1)}
function scrollSec(){const s=secOf();if(s==null)return false;const el=document.getElementById("s-"+s);if(!el)return false;el.scrollIntoView({block:"start"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),1600);return true}
function go(){const n=route().split("~")[0];const changed=n!==cur;cur=n;draw();document.body.classList.remove("nav-open");if(!scrollSec()&&changed)window.scrollTo(0,0)}
window.addEventListener("hashchange",go);
cur=route().split("~")[0];draw();setTimeout(scrollSec,60);

const MOB=()=>matchMedia("(max-width:900px)").matches;
$("#menuBtn").onclick=()=>{const o=document.body.classList.toggle("nav-open");$("#menuBtn").setAttribute("aria-expanded",o);if(o&&MOB())window.scrollTo(0,0)};
$("#scrim").onclick=()=>document.body.classList.remove("nav-open");
const root=document.documentElement;
try{const t=localStorage.getItem("kw-theme");if(t)root.dataset.theme=t}catch(e){}
$("#themeBtn").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("kw-theme",root.dataset.theme)}catch(e){}};

/* ───── 검색 ───── */
const INDEX=[];
const plain=o=>{if(o==null)return"";if(typeof o==="string")return o;if(Array.isArray(o))return o.map(plain).join(" ");if(typeof o==="object")return Object.entries(o).filter(([k])=>k!=="slot"&&k!=="id"&&k!=="need"&&k!=="color").map(([,v])=>plain(v)).join(" ");return String(o)};
const clean=s=>String(s).replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/\*\*|`/g,"");
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"");
for(const p of Object.values(PAGES)){
  INDEX.push({t:p.title,k:p.parent?titleOf(p.parent):"분류",h:p.id,x:clean((p.lede||"")+" "+(p.tags||[]).map(t=>Array.isArray(t)?t[0]:t).join(" "))});
  (p.search||[]).forEach(s=>INDEX.push({t:s[0],k:s[1]||p.title,h:p.id,x:""}));
  (p.sections||[]).forEach((s,i)=>INDEX.push({t:clean(s.h),k:p.title,h:p.id+"~"+i,x:clean(plain(s.blocks)),body:1}));
  if(p.info&&p.info.rows) INDEX.push({t:"한눈에",k:p.title,h:p.id,x:clean(plain(p.info.rows)),body:1});
}
W.items.forEach(x=>INDEX.push({t:x.name,k:"아이템 · "+x.cat,h:"item-"+x.k,x:""}));
W.mobs.forEach(x=>INDEX.push({t:x.name,k:"몬스터 · "+x.area,h:"mob-"+x.k,x:""}));
W.npcs.forEach(x=>INDEX.push({t:x.name+" ("+x.role+")",k:"NPC · "+x.town,h:"npc-"+x.k,x:""}));
INDEX.forEach(e=>{e.nt=norm(e.t);e.nk=norm(e.k);e.nx=e.x?norm(e.x):""});
const q=$("#q"), sres=$("#sres"); if(innerWidth<340) q.placeholder="검색";

let sel=-1;
const SYN=[["텔레포트","tp","티피","워프","순간이동","이동"],["창고","보관함","가방"],["부활","죽으면","죽음","사망","리스폰"],["pvp","피빕","대인전","결투"],
 ["돈","골드","재화","돈벌이"],["몹","몬스터"],["레벨업","렙업"],["레벨","렙","lv"],["인첸트","인챈트","마법부여"],["리소스팩","리팩","텍스처"],["치장","코스튬","꾸미기"],
 ["후원","도네","충전"],["귓속말","귓말","msg","dm"],["채팅","챗"],["마을","타운"],["상점","샵","가게"],["퀘스트","퀘","임무"],["다이아","다이아몬드"],
 ["네더라이트","네더라"],["펫","애완동물"],["탈것","라이딩"],["홈","셋홈"],["단축키","조작키"],["메뉴","메인메뉴"],["경험치","exp","xp"]];
function alts(v){const out=new Set([v]);for(const g of SYN){const gn=g.map(norm);for(const m of gn){if((m.length>=2||/[가-힣]/.test(m))&&v.includes(m))gn.forEach(o=>out.add(v.replace(m,o)))}}return[...out].slice(0,12)}
function snip(x,list){for(const s of list){if(!s)continue;const cs=[...s.replace(/\s+/g,"")].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));const m=new RegExp(cs.join("\\s*"),"i").exec(x);
  if(m){const st=Math.max(0,m.index-18);return (st>0?"…":"")+esc(x.slice(st,m.index))+"<mark>"+esc(m[0])+"</mark>"+esc(x.slice(m.index+m[0].length,m.index+m[0].length+40))+"…"}}return""}
function search(){
  const raw=q.value.trim(), v=norm(raw); if(!v){sres.hidden=true;return}
  const A=alts(v), T=[[],[],[],[]];
  for(const e of INDEX){
    if(!e.body&&A.some(a=>e.nt.startsWith(a)))T[0].push(e);
    else if(!e.body&&A.some(a=>e.nt.includes(a)||e.nk.includes(a)))T[1].push(e);
    else if(e.body&&A.some(a=>e.nt.includes(a)))T[2].push(e);
    else if(e.nx&&A.some(a=>e.nx.includes(a)))T[3].push(e);
  }
  const seen=new Set(), hits=[];
  for(const L of T)for(const e of L){if(hits.length>=24)break;if(seen.has(e.h))continue;seen.add(e.h);hits.push(e)}
  sel=-1;
  sres.innerHTML=hits.length?hits.map(h=>{const sn=(h.body||!h.nt.includes(v))&&h.x?snip(h.x,[raw,...A]):"";
    return `<a href="#${h.h}"><span>${esc(h.body?h.k+" › "+h.t:h.t)}${sn?`<small>${sn}</small>`:""}</span><em>${esc(h.body?"본문":h.k)}</em></a>`}).join(""):`<p>「${esc(q.value)}」에 맞는 항목이 없습니다.</p>`;
  sres.hidden=false;
}
let searchT=0; q.addEventListener("input",()=>{clearTimeout(searchT);searchT=setTimeout(search,150)});   /* 2026-10-30 v10 치는 동안 매 글자 말고 멈췄을 때 */
q.addEventListener("keydown",e=>{const as=[...sres.querySelectorAll("a")];if(!as.length)return;
  if(e.key==="ArrowDown"){sel=Math.min(sel+1,as.length-1);e.preventDefault()}
  else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);e.preventDefault()}
  else if(e.key==="Enter"){(as[sel]||as[0]).click();sres.hidden=true;q.blur();return}
  else if(e.key==="Escape"){sres.hidden=true;return}
  as.forEach((a,i)=>a.classList.toggle("sel",i===sel))});
sres.addEventListener("click",e=>{if(e.target.closest("a")){sres.hidden=true;q.value=""}});
document.addEventListener("click",e=>{if(!e.target.closest(".search")&&!e.target.closest("#sres"))sres.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();q.focus()}});
})();
</script>

</body></html>
