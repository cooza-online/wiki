), 요리 재료로 쓰면 무역상인 나가에게 한 그릇 수천 원을 받습니다. 농사 레벨 300이 되면 자동 심기가 열리고, 내 마을 밭에서는 트랙터로 한 번에 수확할 수 있습니다.","info":{"title":"농사","slot":{"id":"생활-농사-대표","need":"내 마을 밭에서 트랙터를 타고 밀을 수확하는 장면"},"rows":[["판매","[아르덴](#arden) 농부 미반 (Lv1 개당 20~80원)"],["경험치","작물 3 · 호박 · 수박 2 · 달콤한 열매 1 · [채집](#life-gathering) 5~30"],["보너스 아이템","태양 조각"],["자동 심기","농사 Lv 300"],["트랙터","농부 미반 · 내 마을 땅에서만"],["관련 직업","[농사](#growth-jobs)"]]},"sections":[{"h":"작물과 판매가","blocks":[{"table":{"cols":["작물","판매가 (농사 Lv1)","판매가 (농사 Lv1000)","농사 경험치","요리 쓰임"],"rows":[["밀","50원","75원","3","밀가루 → 면 · 패티 · 소시지 · 전복죽 · 해물 파전 / 쌀(밀 2개) → 버섯 리조또 · 성게 덮밥"],["비트","50원","75원","3","야채 스프 · 토마토 파스타 · 닭가슴살 샐러드"],["사탕수수","60원","90원","3","설탕 → 설탕 시럽 (소갈비찜)"],["코코아 콩","80원","120원","3","-"],["네더 사마귀","30원","45원","3","저항 · 화염 저항 포션"],["당근","20원","30원","3","야채 스프 · 닭 요리 · 함박 스테이크 등"],["감자","20원","30원","3","야채 스프 · 감자 스튜 · 감자 그라탕"],["호박","60원","90원","2","소시지 야채볶음 · 화염 저항 · 거대화 포션"],["수박 조각","20원","30원","2","거대화 포션"],["달콤한 열매","20원","30원","1","소형화 포션"]],"num":[1,2,3]}},{"p":"농작물은 아르덴의 농부 미반에게 팝니다. 판매가는 농사 레벨이 오를수록 조금씩 올라 Lv1000에 1.5배가 됩니다. 농작물은 하루 판매 한도가 있어 농사 Lv1 100만원어치 → Lv1000 500만원어치까지 제값을 받고, 넘은 부분은 25%만 받습니다(매일 오전 6시 초기화). 쌀은 가공대에서 밀 2개를 도정해 만듭니다."},{"list":["사탕수수는 맨 아래 뿌리 칸을 빼고, 위로 자란 칸마다 경험치를 줍니다.","직접 놓은 사탕수수 · 호박 · 수박을 부수면 경험치 · 2배 드롭 · 보너스 아이템이 없습니다. 호박 · 수박은 줄기에서 열린 것만 인정됩니다."]},{"note":{"b":"그대로 팔지 말고 요리로","t":"당근 · 감자 · 비트 하나씩이면 야채 스프 한 그릇이 됩니다. 셋을 그대로 팔면 Lv1 90원이지만, 야채 스프는 무역상인 나가가 기준 2,850원(간단한 요리라 요리 기준가 3,800원의 0.75배)에 삽니다. 자세한 것은 [요리 · 가공](#life-cooking)과 [무역상인 나가](#life-trade) 문서에 있습니다."}}]},{"h":"농사 레벨 혜택","blocks":[{"table":{"cols":["농사 레벨","1","10","100","300","500","1000"],"rows":[["2배 드롭","2%","5%","10%","15%","20%","30%"],["보너스 아이템(태양 조각)","2%","5%","10%","15%","20%","30%"]]}},{"p":"2배 드롭은 밀 · 당근 · 감자 · 비트 · 사탕수수 · 코코아 · 네더 사마귀 · 호박 · 수박에 적용됩니다. 태양 조각은 드래곤 펫의 먹이입니다. 괭이를 들면 핫바 오른쪽에 농사 레벨 · 경험치 · 확률 판이 뜹니다. 네더라이트 괭이를 [강화](#growth-enhance)하면 농사 2배 드롭이 더 오릅니다 (도끼 강화는 [벌목](#life-logging) 2배 드롭)."}]},{"h":"자동 심기 (농사 Lv 300)","blocks":[{"p":"자동 심기를 켜면 작물을 거둔 자리에 씨앗 1개를 써서 저절로 다시 심어집니다. 씨앗이 없으면 빈칸으로 남습니다. 괭이를 들고 **F**를 누르면 「농사 설정」 창이 열리고(`/직업메뉴 농사`), 여기서 자동 심기를 켜고 발동 단축키를 고릅니다."},{"table":{"cols":["항목","내용"],"rows":[["열리는 레벨","농사 Lv 300"],["지속 시간","Lv 300 30초 → Lv 1000 3분"],["재사용 대기","5분"],["기본 단축키","Shift + 우클릭 (Shift + 좌클릭 · Shift 두 번으로 바꿀 수 있음)"],["MVP 멤버십","레벨 상관없이 늘 켜 둘 수 있음 ([멤버십](#shop-membership))"]]}},{"slot":{"id":"생활-농사-설정창","need":"괭이를 들고 F를 눌러 연 「농사 설정」 창"}}]},{"h":"밭 관리 · 내 마을 밭","blocks":[{"list":["경작지는 밟아도(뛰어내려도 · 동물이 밟아도) 흙으로 바뀌지 않습니다.","마을 서버의 내 마을 밭은 마을원 중 한 명이라도 어느 서버에든 접속해 있으면, 마을에 아무도 없어도 작물이 자랍니다. 누가 마을에 오면 그동안 자란 만큼 한 번에 반영되고, 최대 3시간어치까지 쌓입니다.","작물은 그 칸 밝기가 8 이상이어야 심어지고 9 이상이어야 자랍니다. 지붕 덮인 2층 밭 아래층처럼 어두운 칸은 흙을 다시 갈아도 안 심어지니 횃불 · 랜턴을 가까이 두세요.","`/트랙터 밝기` 를 치면 주변 경작지 중 어두운 칸이 6초 동안 빨간 점(못 심음) · 주황 점(심어지지만 안 자람)으로 보입니다.","어두운 칸에 이미 있던 작물은 옆 칸을 캐도 사라지지 않고 남습니다(자라지는 않음)."]}]},{"h":"트랙터","blocks":[{"p":"트랙터는 탈것입니다. 이용권을 우클릭하면 그 트랙터를 탈 수 있게 되고(이미 있으면 이용권이 소모되지 않음), 펫 메뉴에서 불러내 탑니다. **내 마을 땅** 안에서 트랙터가 선 칸을 가운데로 한 네모 범위의 다 자란 작물을 자동으로 수확합니다. 자동 심기(농사 Lv 300 능력을 켠 동안, 또는 MVP 멤버십)가 켜져 있으면 캔 자리에 바로 다시 심습니다."},{"table":{"cols":["크기","수확 · 심기 범위","연료 최대","석탄 1개당 연료","작물당 연료"],"rows":[["대형","7 × 7칸","4,000","250","2"],["중형","5 × 5칸","3,000","200","2"],["소형","3 × 3칸","2,000","150","2"]],"num":[2,3,4]}},{"list":["수확하는 작물: 밀 · 당근 · 감자 · 비트 · 네더 사마귀 (사탕수수 · 호박 · 수박은 캐지 않음)","캔 작물마다 농사 경험치 · 2배 드롭 · 보너스 아이템이 손으로 거둘 때와 똑같이 붙습니다.","남의 마을 땅에 있는 작물은 캐지 않고, 연료도 줄지 않습니다.","연료는 석탄입니다. 탄 채로 **F**를 누르면 연료 창이 열리고, 석탄을 8개씩 넣습니다.","색은 회색 · 초록 · 주황 · 빨강 · 노랑 5가지, 크기는 대형 · 중형 · 소형 3가지입니다. 같은 크기면 색이 달라도 성능은 같습니다."]},{"table":{"cols":["이용권 (회색)","만드는 곳","돈","재료"],"rows":[["소형 트랙터","농부 미반 「트랙터 제작」","250,000원","다이아몬드 64 · 네더라이트 주괴 4 · 루비 2"],["중형 트랙터","농부 미반 「트랙터 제작」","1,000,000원","루비 16 · 설파이트 8 · 소형 트랙터 이용권(회색)"],["대형 트랙터","농부 미반 「트랙터 제작」","2,500,000원","설파이트 16 · 히룸 8 · 중형 트랙터 이용권(회색)"]]}},{"note":{"b":"다른 색 이용권","t":"초록 · 주황 · 빨강 · 노랑 이용권은 아직 얻는 곳이 없습니다(준비 중). 지금은 회색 이용권만 농부 미반에게서 만들 수 있습니다."}}]}],"search":[["트랙터 이용권","트랙터"],["자동 심기","농사"],["태양 조각","농사"],["농사 설정","농사"],["미반","농부"],["트랙터 밝기","농사"],["쌀","농사"],["경작지","농사"]]},"life-fishfarm":{"id":"life-fishfarm","parent":"life","title":"양식장","short":"내 마을 땅에 수조를 놓고 물고기를 키워 어란을 받습니다. 모든 서버 합쳐 3개.","color":"var(--reg-ice)","tags":[["내 마을 땅",null],["수조 3단계",null],["모든 서버 합쳐 3개","lv"]],"lede":"낚은 물고기를 내 마을에 놓은 양식 수조에 넣고 사료를 채워 두면, 4시간마다 어란을 낳고 가끔 한 마리씩 늘어납니다. 어란은 가공대에서 젓갈 · 숙성 어란 · 캐비어로 만들어 무역상인 나가에게 팝니다. 수조와 사료는 낚시꾼 프쉰의 「양식 용품」 창에서 삽니다.","info":{"title":"양식장","slot":{"id":"생활-양식-대표","need":"내 마을 땅에 놓은 양식 수조와 그 안을 헤엄치는 물고기"},"rows":[["놓는 곳","마을 서버 · [내 마을](#conv-town) 땅 바닥"],["개수","모든 서버 합쳐 1인 3개"],["구매","[아르덴](#arden) 낚시꾼 프쉰 「양식 용품」"],["수조","25,000원"],["사료","개당 200원 (1 · 8 · 32개 묶음)"],["어란 주기","4시간마다 사료 1개"],["판매","가공 후 [무역상인 나가](#life-trade)"]]},"sections":[{"h":"시작하기","blocks":[{"steps":[{"h":"수조와 사료를 산다","p":"아르덴 낚시꾼 프쉰에게 말을 걸어 「양식 수조 · 사료 사기」를 고르면 「양식 용품」 창이 열립니다. 수조 25,000원, 사료는 1개 · 8개 · 32개 묶음(개당 200원)으로 팝니다."},{"h":"내 마을 땅에 놓는다","p":"마을 서버의 내 마을 땅 바닥을 수조 아이템으로 우클릭합니다. 수조는 모든 서버를 합쳐 한 사람당 3개까지 놓을 수 있고, 아이템 설명에 「놓은 수조: N/3」이 보입니다."},{"h":"물고기와 사료를 넣는다","p":"수조를 우클릭하면 관리 창이 열립니다. 아래 가방에서 Shift + 클릭으로 물고기와 사료를 넣습니다. 한 수조에는 같은 종류의 물고기만 넣을 수 있습니다."},{"h":"어란을 받는다","p":"관리 창의 「어란 받기」를 누릅니다. 수조를 치우려면 「회수」를 두 번 누릅니다."}]},{"slot":{"id":"생활-양식-관리창","need":"양식 수조를 우클릭해 연 관리 창 (사료통 · 물고기 칸 · 어란 받기)"}}]},{"h":"번식 규칙","blocks":[{"list":["4시간마다 사료 1개를 먹고 어란을 낳습니다. 어란 수 = 물고기 수 ÷ 2 (최소 1개), 변이 물고기가 들어 있으면 1개 더.","그때마다 35% 확률로 물고기가 한 마리 늘어납니다 (수조 정원까지).","접속하지 않은 동안에도 최대 24시간(6번)까지 밀린 만큼 한꺼번에 계산됩니다.","사료통에는 사료 32개, 어란은 48개까지 쌓입니다. 꽉 차기 전에 받아 가세요."]},{"table":{"cols":["넣은 물고기","나오는 어란","가공 (가공대)","나가 매입가 · 하루"],"rows":[["1~2등급","어란","어란 3 + 천일염 1 → 젓갈","1,800원 · 6개 (요리 Lv1000 24개)"],["3~5등급","고급 어란","고급 어란 2 + 천일염 1 → 숙성 어란","4,500원 · 3개 (요리 Lv1000 12개)"],["철갑상어","철갑상어 알","철갑상어 알 2 + 천일염 1 → 캐비어","12,000원 · 1개 (요리 Lv1000 4개)"]]}},{"p":"천일염은 아르덴 앞바다의 소금꽃 2개를 가공대에서 만듭니다. 수산가공품은 무역상인 나가가 요리 한도와 따로, 셋을 합쳐 하루 10개까지 사 줍니다. 이 한도는 [요리 직업](#growth-jobs) 레벨에 따라 Lv1000 40개까지 늘어나고, 품목별 한도도 같은 비율로 늘어납니다(캐비어는 요리 Lv 168부터 하루 2개)."}]},{"h":"수조 확장","blocks":[{"table":{"cols":["단계","물고기 정원","확장 비용"],"rows":[["1단계","3마리","(처음 상태)"],["2단계","5마리","25,000원 + 빛나는버섯 5"],["3단계","7마리","60,000원 + 용연향 1 + 빛나는버섯 10"]]}},{"p":"빛나는버섯은 미스틱글렌 땅 채집, 용연향은 프로스트하버 앞바다(바다 채집 4단계)에서 나옵니다. [채집](#life-gathering) 문서를 참고하세요. 확장은 관리 창의 「확장」 칸에서 합니다."}]}],"search":[["양식 수조","양식장"],["사료","양식장"],["어란","양식장"],["고급 어란","양식장"],["철갑상어 알","양식장"],["양식 용품","프쉰"]]},"life-fishing":{"id":"life-fishing","parent":"life","title":"낚시","short":"물고기 그림자를 노려 던지고 Shift로 줄다리기. 24종 · 5등급 · 변이 5종.","color":"var(--reg-ice)","tags":[["어종 24",null],["등급 5",null],["변이 5","lv"],["낚시 대회 하루 5번",null]],"lede":"물가에 서면 물속에 물고기 그림자가 돌아다닙니다. 그림자를 노려 던지면 그 물고기가 걸리고, 웅크리기(Shift)로 줄을 감는 줄다리기 미니게임이 시작됩니다. 잡은 물고기는 크기가 클수록 비싸고, 낚시꾼 프쉰에게 팔거나 식칼로 손질해 연금술 · 미끼 재료로 씁니다.","info":{"title":"낚시","slot":{"id":"생활-낚시-대표","need":"낚시 미니게임에서 텐션 게이지와 진행도가 보이는 순간"},"rows":[["낚싯대","강철 낚싯대 (튜토리얼 지급 · 물고기 1마리당 내구도 1)"],["조작","Shift 누르기 = 감기 · 떼기 = 텐션 빼기"],["판매","[아르덴](#arden) 낚시꾼 프쉰"],["판매가","기준가 × 크기(최대 3배) × 변이 × 10 × 낚시 레벨(최대 3배)"],["하루 판매 한도","낚시 Lv1 100만 원 → Lv1000 500만 원"],["대물 / 월척","크기 상위 5% / 0.5% (월척은 서버 공지)"],["자동 낚시","낚시 Lv 50부터 · 판매가 ×0.25"],["관련 직업","[낚시](#growth-jobs)"]]},"sections":[{"h":"낚는 법","blocks":[{"steps":[{"h":"그림자를 찾는다","p":"주변 20칸 안의 물에 물고기 그림자가 최대 5마리 돌아다닙니다(90초 뒤 사라짐). 찌가 그림자 2.6칸 안에 떨어지면 그 물고기가 확정으로 걸립니다. 그림자 없이 던져도 낚입니다."},{"h":"입질을 기다린다","p":"던지고 3~8초 지나면 입질이 옵니다."},{"h":"Shift로 감는다","p":"Shift를 누르고 있으면 진행도가 오르지만 텐션도 같이 오릅니다. 텐션이 한계선 위에 1초 넘게 머물면 줄이 끊어집니다. 위험하면 손을 떼서 텐션을 뺍니다."},{"h":"발버둥 때는 손을 뗀다","p":"물고기가 발버둥 예고를 보내면 손을 떼세요. 누른 채로 맞으면 텐션이 크게 오르고 진행도를 뺏길 수 있습니다. 손을 떼고 있으면 텐션 상승이 10분의 1로 줄어듭니다."},{"h":"진행도 100이면 성공","p":"크기가 정해지고 가방에 들어옵니다. 처음 잡는 어종은 그전까지 「???」로 보입니다."}]},{"slot":{"id":"생활-낚시-미니게임","need":"그림자에 던져서 입질 → 발버둥 예고에 손을 떼고 잡아 올리는 30초 영상"}},{"table":{"cols":["물고기 버릇","해당 어종","요령"],"rows":[["도망형","미꾸라지 · 갈치 · 참다랑어","예고에 손을 떼야 진행도를 안 뺏깁니다"],["대물형","메기 · 철갑상어 · 개복치 · 황금잉어","텐션이 잘 안 빠집니다. 여유를 두고 끊어 감으세요"],["변덕","대왕오징어 · 뇌전어 · 월광어 · 심연의 왕","예고가 가짜일 수 있습니다. 떼고 나서 확인하세요"],["폭발형","-","연타로 옵니다. 한 번 막았다고 바로 감지 마세요"],["잔잔이","그 밖의 어종","예고가 뜨면 손을 떼고, 그 외엔 계속 감아도 됩니다"]]}}]},{"h":"어종 24종과 판매가","blocks":[{"p":"물고기 값은 **기준가 × 크기 배율 × 변이 배율**입니다. 크기 배율은 그 어종의 최대 크기에 가까울수록 커지고, 최대 크기면 3배입니다. 크기는 어종의 최소~최대 사이에서 정해지며 상위 5%는 대물, 상위 0.5%는 월척(서버 전체 공지)입니다. 매일 「오늘의 물고기」 1종이 정해져 평소보다 2배 잘 나옵니다."},{"p":"낚시꾼 프쉰에게 팔 때는 여기에 **물고기 분류 배율 ×10**와 **낚시 레벨 배율**이 더 곱해집니다. 낚시 레벨 배율은 Lv1 ×1 · Lv100 ×1.25 · Lv300 ×1.68 · Lv600 ×2.26 · Lv1000 ×3입니다. 예를 들어 Lv1에서 최대 크기 참다랑어(기준가 1,260원)는 1,260 × 3 × 10 = 37,800원입니다."},{"table":{"cols":["어종","등급","크기(cm)","기준가","최대 크기 값 (×3)","나오는 때","더 잘 나오는 때","자동 낚시"],"num":[3,4],"rows":[["송사리","1 · 일반","3~9","4","12","언제나","-","O"],["피라미","1 · 일반","6~20","6","18","언제나","-","O"],["미꾸라지","1 · 일반","8~26","10","30","언제나","밤","O"],["붕어","1 · 일반","12~34","11","33","언제나","-","O"],["블루길","1 · 일반","10~28","13","39","언제나","-","O"],["은어","2 · 고급","15~40","25","75","새벽·낮","-","O"],["무지개송어","2 · 고급","25~68","34","102","새벽·낮","비","O"],["잉어","2 · 고급","30~90","38","114","언제나","-","O"],["농어","2 · 고급","28~85","39","117","언제나","해질녘","O"],["메기","2 · 고급","30~110","42","126","밤","비","O"],["쏘가리","3 · 희귀","20~65","77","231","언제나","-","O"],["광어","3 · 희귀","30~95","86","258","언제나","-","O"],["참돔","3 · 희귀","25~80","90","270","언제나","낮","O"],["연어","3 · 희귀","40~110","95","285","언제나","새벽","O"],["갈치","3 · 희귀","60~180","117","351","밤","-","O"],["심해아귀","4 · 영웅","45~130","810","2,430","밤 + 비·천둥","천둥","X"],["대왕오징어","4 · 영웅","60~240","990","2,970","밤","천둥","X"],["개복치","4 · 영웅","100~330","1,080","3,240","낮","-","X"],["참다랑어","4 · 영웅","90~300","1,260","3,780","언제나","낮","X"],["철갑상어","4 · 영웅","80~260","1,350","4,050","언제나","-","X"],["뇌전어","5 · 전설","60~210","1,760","5,280","천둥","-","X"],["월광어","5 · 전설","50~190","2,090","6,270","밤","맑음","X"],["황금잉어","5 · 전설","45~160","2,750","8,250","언제나","-","X"],["심연의 왕","5 · 전설","120~420","4,950","14,850","밤 + 천둥","-","X"]]}},{"note":{"b":"자동 낚시는 3등급까지","t":"4~5등급은 직접 낚아야만 잡힙니다. 비 · 천둥 · 밤 조건이 붙은 고급 어종은 날씨와 시간을 맞춰 노리세요."}},{"list":["**하루 판매 한도**: 그날 판 물고기 금액이 낚시 레벨에 따른 한도(Lv1 100만 원 → Lv1000 500만 원)를 넘으면, 넘은 부분은 25%만 받습니다. 판매가 막히지는 않습니다. 매일 아침 6시에 초기화되고, 모든 서버를 합쳐 셉니다.","**5등급 레벨 보너스**: 낚시 Lv 70부터 5등급(전설) 물고기가 레벨마다 조금씩 더 잘 나옵니다. Lv 170에서 3배가 되고, 그 위로는 3배 그대로입니다."]}]},{"h":"변이 물고기 · 감정","blocks":[{"p":"직접 낚을 때(그림자 낚시 포함) 낮은 확률로 변이 물고기가 걸립니다. 변이가 붙은 그림자는 변이 색으로 반짝이고, 판매가에 배율이 곱해집니다. 자동 낚시와 낚시 대회 점수에는 변이가 없습니다."},{"table":{"cols":["변이","확률","조건","판매가"],"rows":[["황금빛","1%","언제나 (잡으면 서버 공지)","×5"],["번개 맞은","4%","천둥 칠 때","×4"],["달빛","3%","보름달 뜬 밤","×3"],["유령","2%","새벽 0~4시","×3"],["알비노","2%","오늘의 물고기","×2.5"]]}},{"p":"**감정**: 낚시꾼 프쉰에게 물고기 1마리를 감정받으면 변이를 다시 굴립니다. 감정비는 그 물고기의 아이템 설명에 적힌 상점 판매가(기준가 × 크기 배율 × 변이 배율)의 40%(최소 100원)입니다. 결과는 변이 없음 86% · 황금빛 2% · 나머지 4종 각 3%이고, 이미 붙은 변이도 다시 굴려져 사라질 수 있습니다. 황금빛이 나오면 서버에 공지됩니다. 자동 낚시로 잡은 물고기는 감정해도 판매가 ×0.25가 그대로 남습니다."},{"slot":{"id":"생활-낚시-변이","need":"황금빛 변이 물고기를 손에 든 모습과 아이템 설명"}}]},{"h":"장비 · 미끼 · 부품","blocks":[{"p":"낚싯대는 **강철 낚싯대** 하나뿐입니다. 튜토리얼에서 대장장이 루이흐가 줍니다. [강화](#growth-enhance)(최대 +20)하면 텐션 상한 · 입질 대기 · 희귀 어종 확률 · 발버둥 · 크기가 좋아집니다. 낚싯대용 [램프](#growth-lamp)(빠른입질 · 쌍끌이 · 월척감각 등)도 붙일 수 있습니다."},{"note":{"b":"낚싯대 내구도","t":"물고기를 1마리 잡을 때마다(자동 낚시 포함) 내구도가 1 줄고, 줄이 끊어지면 2가 줄어듭니다. 빈 바늘을 감거나 입질을 놓쳤을 때는 줄지 않고, 내구성 인챈트가 있으면 덜 닳습니다. 낚싯대는 부서지지 않고 내구도 1에서 멈추지만, 그동안은 던지기 · 입질 · 자동 낚시를 모두 쓸 수 없습니다. **내구도 수리 보석**을 낚싯대에 겹치면 다시 쓸 수 있습니다."}},{"table":{"cols":["강화","텐션 상한","입질 대기","희귀(4~5등급)","발버둥","크기"],"rows":[["+5","+4.2%","-5.1%","+6.8%","-5.1%","+1.4%"],["+10","+9.4%","-11.2%","+15%","-11.2%","+3%"],["+15","+18.1%","-21.8%","+29%","-21.8%","+5.8%"],["+20","+25%","-30%","+40%","-30%","+8%"]]}},{"table":{"cols":["미끼","효과","얻는 법"],"rows":[["지렁이","기본 미끼","낚시 중 부산물"],["새우","2~3등급이 1.6배 잘 나옴","미끼 제작 · 부산물"],["반짝이 미끼","입질 대기 ×0.7","미끼 제작 · 부산물"],["심해 미끼","4등급이 2.2배 잘 나옴 · 크기 +2%","미끼 제작(낚시 Lv 30) · 부산물"],["폭풍 미끼","5등급이 1.5배 잘 나옴","미끼 제작(낚시 Lv 50) · 부산물"],["신비한 미끼","5등급이 4배 잘 나옴 · 크기 +4%","미끼 제작(낚시 Lv 100) · 대물을 낚은 자리"]]}},{"table":{"cols":["부품","1단계","2단계","3단계"],"rows":[["릴","황동 릴: 감기 ×0.85 · 텐션 상승 ×0.75","강철 릴: 감기 ×1.0 · 텐션 ×1.0","고속 릴: 감기 ×1.30 · 텐션 상승 ×1.28"],["줄","합사줄: 텐션 상한 ×0.95 · 대물 확률 +","강화줄: 텐션 상한 ×1.10","심해줄: 텐션 상한 ×1.25 · 대물 확률 -"],["찌","나무 찌: 발버둥 예고 0.45초","전자 찌: 예고 0.60초","심안 찌: 예고 0.75초"]]}},{"p":"부품은 가방 안에서 커서로 집어 낚싯대 위에 놓으면 끼워지고, 원래 끼워 둔 부품은 돌려받습니다. 부품은 직접 낚을 때만 나오는 부산물입니다."},{"table":{"cols":["부산물","확률","조건"],"rows":[["지렁이 1~3","22%","물고기를 잡을 때 (자동 낚시 포함)"],["지렁이 1~2","14%","물에 던졌다가 놓쳤을 때"],["새우 1~2","9%","2등급 이상"],["반짝이 미끼 1~2","5%","3등급 이상"],["심해 미끼 1~2","6%","4등급 이상, 직접 낚기"],["폭풍 미끼 1","4%","4등급 이상, 직접 낚기"],["신비한 미끼 1","12%","4등급 이상 대물 · 월척"],["황동 릴 · 합사줄 · 나무 찌","각 2.2%","직접 낚기"],["강철 릴 · 강화줄 · 전자 찌","각 1.1%","3등급 이상, 낚시 Lv 20"],["고속 릴 · 심해줄 · 심안 찌","각 3.5%","4등급 이상 대물 · 월척, 낚시 Lv 50 (서버 공지)"]]}}]},{"h":"손질 · 미끼 제작","blocks":[{"p":"**식칼**을 들고 우클릭하면 손질 창이 열립니다(`/낚시손질`). 물고기 1마리를 손질하면 등급에 맞는 **손질된 살(1~5등급)** 1개, **물고기 뼈** 2개, **물고기 비늘** 2개가 나오고, 물고기가 클수록 최대 2.5배까지 많이 나옵니다. 실패하면 살은 없고 뼈 · 비늘은 절반입니다. 식칼은 기본 성공률 60% · 3초이고, 강화하면 +20강에서 성공률 100% · 1.2초 · 산출 2배가 됩니다."},{"p":"손질된 살은 [연금술](#life-cooking) 포션 재료, 뼈와 비늘은 미끼 재료입니다. 남는 뼈(30원)와 비늘(25원)은 [무역상인 나가](#life-trade)가 합쳐서 하루 200개까지 사 줍니다. 미끼는 프쉰의 「미끼 제작」(`/낚시제작`)에서 만듭니다."},{"table":{"cols":["미끼","만드는 개수","물고기 뼈","물고기 비늘","필요 낚시 Lv"],"num":[1,2,3,4],"rows":[["새우","3","5","5","-"],["반짝이 미끼","2","8","8","-"],["심해 미끼","2","13","13","30"],["폭풍 미끼","1","20","20","50"],["신비한 미끼","1","30","30","100"]]}}]},{"h":"연속 보너스 · 자동 낚시","blocks":[{"list":["연달아 잡으면 보너스: 3연속부터 입질 대기 ×0.8, 5연속부터 높은 등급이 조금 더 잘 나오고, 10연속이면 10초 동안 「몰입」 상태가 됩니다.","**자동 낚시**는 낚시 Lv 50부터 켤 수 있습니다(낚싯대를 들고 F를 눌러 여는 낚싯대 메뉴 또는 `/낚시자동`). 줄을 물에 던져 둔 상태에서만 돌아가고, 3등급 이하만 잡힙니다. 변이는 붙지 않고, 직업 경험치는 절반, **판매가는 ×0.25**입니다. 낚싯대 내구도도 1마리마다 1씩 줄어듭니다.","자동 낚시로 잡은 물고기와 부산물은 가방이 아니라 [우편함](#conv-mailbox)으로 5분마다 한꺼번에 들어갑니다. 자동 낚시를 끄거나 접속을 끊으면 바로 들어갑니다.","자동 낚시는 마리당 **집중도** 6을 씁니다. 집중도는 직접 낚을 때 등급별 12 · 20 · 32 · 60 · 120씩 차고(대물 2배, 월척 3배), 최대치는 낚시 레벨에 따라 커집니다.","자동 낚시 간격: Lv 50 20초 · Lv 100 16초 · Lv 300 12초 · Lv 500 9초 · Lv 1000 5초","집중도가 모자라거나, 낚싯대 내구도가 1이 되었거나, 찌가 물 밖에 있거나 찌를 잃으면 자동 낚시가 스스로 꺼집니다. 이때 찌는 저절로 거둬지고 화면에 「자동 낚시 꺼짐」과 이유가 뜹니다. 다시 켜기 전까지는 직접 낚시(미니게임)입니다."]},{"table":{"cols":["낚시 레벨","50","100","300","500","1000"],"rows":[["집중도 최대치","600","1,000","1,600","2,200","3,000"],["자동 낚시 간격","20초","16초","12초","9초","5초"]]}},{"p":"낚시 직업 경험치는 등급별로 5 · 12 · 30 · 80 · 200이고 대물이면 1.5배, 월척이면 2배입니다. 낚시 레벨이 오르면 2배 드롭과 보너스 아이템 「고대 닻 조각」 확률이 오르고, Lv 70부터는 5등급 물고기도 더 잘 나옵니다. 자세한 것은 [직업](#growth-jobs) 문서에 있습니다."}]},{"h":"낚시 대회 · 랭킹","blocks":[{"p":"매일 **13시 · 18시 · 22시 · 0시 · 2시**에 20분짜리 낚시 대회가 열립니다. 종목은 회차마다 최대어 → 점수 합산 → 희귀 헌트(4등급 이상만) 순서로 돌아갑니다. 점수는 판매가 공식과 같이 기준가 × 크기 배율입니다. 진행 상황은 `/낚시대회`로 봅니다."},{"table":{"cols":["순위","돈","마일리지"],"num":[1,2],"rows":[["1위","15,000원","10"],["2위","8,500원","6"],["3위","6,000원","3"]]}},{"p":"`/낚시랭킹`에서 어종별 서버 최대어 기록을 볼 수 있습니다. 잡은 어종은 [도감](#collect-dex)에 자동 등록되고, [박물관](#collect-museum) 어류관(24) · 변이관(5)에 기증할 수 있습니다."}]}],"search":[["강철 낚싯대","낚시"],["식칼","손질"],["손질된 살","손질"],["미끼 제작","낚시"],["변이 물고기","낚시"],["황금빛","변이"],["자동 낚시","낚시"],["집중도","자동 낚시"],["오늘의 물고기","낚시"],["월척","낚시"],["심연의 왕","어종"],["프쉰","낚시꾼"],["낚싯대 내구도","낚시"],["하루 판매 한도","낚시"]]},"life-fossil":{"id":"life-fossil","parent":"life","title":"화석 발굴","short":"코자 대륙과 야생 지하에서 나오는 화석 블록을 솔로 털어 조각 4종 × 3을 모읍니다.","color":"var(--reg-desert)","tags":[["코자 대륙 · 야생","lv"],["4종 × 3조각",null],["골격 최대 120,000원",null]],"lede":"코자 대륙과 [야생](#world-wild)의 깊은 땅속에서 돌을 캐다 보면 가끔 뼈가 파묻힌 화석 흙블록이 나타납니다. 코자 대륙에서 훨씬 자주 나옵니다. 솔로 흙을 조심스럽게 털어 내면 화석 조각을 얻고, 같은 생물 조각 3개를 모으면 골격으로 맞출 수 있습니다. 판매와 골격 맞추기는 아르덴의 광부 키레이가 맡습니다.","info":{"title":"화석 발굴","slot":{"id":"생활-화석-대표","need":"코자 대륙 지하에서 발견한 화석 흙블록(흙에 뼈가 파묻힌 모습)"},"rows":[["장소","[코자 대륙](#koza) · [야생](#world-wild) 높이 40 이하"],["나오는 확률","돌 종류를 캘 때 코자 대륙 0.3% · 야생 0.1%"],["도구","솔"],["판매 · 골격 맞추기","[아르덴](#arden) 광부 키레이 「화석 거래」"],["하루 판매","10개 (광질 레벨에 따라 최대 30개)"],["근원","발굴 성공마다 30% · 1~2개 ([근원](#growth-origin))"],["기증","[박물관](#collect-museum) 화석관 16"]]},"sections":[{"h":"발굴하는 법","blocks":[{"steps":[{"h":"깊은 곳의 돌을 캔다","p":"코자 대륙이나 야생에서 높이 40 이하의 돌 · 심층암 · 응회암 · 안산암 · 섬록암 · 화강암을 캘 때 화석 흙블록이 생깁니다 (코자 대륙 0.3% · 야생 0.1%). 멀티채굴 램프로 함께 캐진 블록에서는 생기지 않고, 직접 캔 블록에서만 생깁니다. 10분 안에 발굴하지 않으면 원래 돌로 돌아갑니다."},{"h":"솔로 우클릭","p":"솔을 들고 화석 흙블록을 우클릭하면 붓질 화면이 뜹니다. 흙판 아래에 뼈가 묻혀 있습니다. 내구도가 1로 잠긴 솔로는 붓질할 수 없으니 수리 보석으로 고쳐 쓰세요."},{"h":"Shift를 누른 채 시점을 움직인다","p":"Shift를 누르고 마우스로 시점을 움직이면 솔이 움직이며 흙이 털립니다. 털 때마다 블록 모델의 흙덩이도 떨어져 나갑니다."},{"h":"드러난 뼈는 살살","p":"이미 드러난 뼈를 너무 세게(빠르게) 긁으면 보존도가 떨어집니다. 뼈가 모두 드러나면 화석 조각과 보존도(%)를 얻습니다."}]},{"list":["한 번에 화석 하나만 털 수 있습니다.","[운석](#life-meteor) 수정맥을 캘 때도 6% 확률로 주변 땅에 화석 흙블록이 생깁니다.","화석 흙블록은 일반 곡괭이질 · 폭발 · 피스톤으로 부서지지 않습니다. 솔로만 발굴됩니다.","화석 하나를 다 털어 낼 때마다 30% 확률로 [근원](#growth-origin) 1~2개가 함께 들어옵니다."]},{"slot":{"id":"생활-화석-붓질","need":"화석 붓질 미니게임 화면 (흙판 · 솔 · 힘 막대 · 진행도)"}}]},{"h":"생물 4종 · 조각 12종","blocks":[{"table":{"cols":["생물","조각 3종","조각 기준가","골격 기준가"],"num":[2,3],"rows":[["고대 어룡","머리뼈 · 등뼈 · 꼬리지느러미","3,000원","60,000원"],["뿔공룡","뿔 머리뼈 · 갈비뼈 · 다리뼈","4,000원","80,000원"],["익룡","부리 머리뼈 · 날개뼈 · 발톱","5,000원","100,000원"],["매머드","엄니 · 어금니 · 등뼈","6,000원","120,000원"]]}},{"table":{"cols":["깊이 (높이)","고대 어룡","뿔공룡","익룡","매머드"],"num":[1,2,3,4],"rows":[["40 ~ 10","40%","20%","-","40%"],["9 ~ -20","20%","40%","30%","10%"],["-21 ~ -64","10%","35%","45%","10%"]]}},{"p":"익룡은 높이 10 아래에서만 나옵니다. 매머드는 얕은 곳(40~10)에서 가장 잘 나옵니다."}]},{"h":"골격 맞추기 · 팔기","blocks":[{"p":"광부 키레이에게 말을 걸어 「화석 판매 · 뼈대 맞추기」를 고르면 「화석 거래」 창이 열립니다."},{"list":["**뼈대 맞추기**: 같은 생물의 조각 3종을 넣으면 골격 하나가 됩니다. 골격의 보존도는 세 조각 평균 + 5%입니다.","**판매가** = 기준가 × (0.5 + 0.5 × 보존도). 보존도 100%면 기준가 그대로, 0%면 절반입니다.","한 사람당 하루 10개까지 팔 수 있고, 광질 레벨이 오를수록 늘어나 Lv1000에 30개입니다. 골격도 1개로 셉니다. 골격으로 맞춰 팔면 조각 3개를 따로 파는 것보다 훨씬 비쌉니다.","[박물관](#collect-museum) 화석관에는 조각 12종과 골격 4종, 모두 16칸이 있습니다."]},{"note":{"b":"코자 대륙 가는 법","t":"네더라이트 장비 9종(투구 · 흉갑 · 레깅스 · 부츠 · 검 · 곡괭이 · 괭이 · 도끼 · 삽)을 모두 가진 뒤 아르덴 이장 실바에게 말을 걸면 포탈 아이템을 줍니다. 마을 서버의 내 마을에서 우클릭해 포탈을 세우고, 포탈을 우클릭하면 코자 대륙의 무작위 위치로 갑니다. 자세한 것은 [코자 대륙](#koza) 문서에 있습니다."}}]}],"search":[["화석","발굴"],["보존도","화석"],["골격","화석"],["매머드","화석"],["익룡","화석"],["키레이","광부"]]},"life-gathering":{"id":"life-gathering","parent":"life","title":"땅 채집 · 바다 채집","short":"이프란 곳곳의 채집물을 괭이로 우클릭. 땅 8종 · 바다 4단계 22종.","color":"var(--reg-forest)","tags":[["땅 8종",null],["바다 22종",null],["괭이 우클릭",null],["이프란 전용","lv"]],"lede":"이프란 대륙 여섯 지역의 들판과 바닷속에 채집물이 자라 있습니다. 괭이를 들고 우클릭하면 화면에 채집 게이지가 차오르고, 다 차면 채집물을 얻습니다. 채집할 때마다 농사 직업 경험치도 오릅니다. 땅 채집물은 향신료와 특제 요리, 바다 채집물은 해산물 요리와 물약의 재료입니다.","info":{"title":"채집","slot":{"id":"생활-채집-대표","need":"괭이를 들고 야생열매 덤불을 채집하는 중 화면의 채집 게이지"},"rows":[["도구","괭이 (아무 괭이)"],["조작","채집물에 우클릭 → 게이지가 다 찰 때까지 움직이지 않기"],["장소","이프란 6개 지역 (땅) · 앞바다 4곳 (바다)"],["반복 제한","같은 자리 10번 → 10분 잠김"],["농사 경험치","채집 1번에 5~30 ([농사](#growth-jobs))"],["보너스","[황금 수확](#life-bonanza) 6%"],["기증","[박물관](#collect-museum) 채집 표본관 30"]]},"sections":[{"h":"채집하는 법","blocks":[{"steps":[{"h":"괭이를 든다","p":"어떤 괭이든 됩니다. 채집물 위에는 이름표가 떠 있고, 다시 자라는 중이면 이름표가 숨겨집니다. 내구도가 1로 잠긴 괭이로는 채집할 수 없으니 수리 보석으로 고쳐 쓰세요."},{"h":"4칸 안에서 우클릭","p":"화면 가운데에 화단(바다는 해저) 그림과 오른쪽 게이지가 뜹니다. 채집 시간은 채집물마다 3~9초입니다."},{"h":"움직이지 않는다","p":"채집 중 1.2칸 넘게 움직이면 취소됩니다. 바닷속에서 숨이 다하면 「숨이 다해 채집이 중단되었습니다」가 뜨며 취소됩니다."},{"h":"얻고 기다린다","p":"채집물이 가방에 들어오고 농사 경험치를 받습니다. 그 자리는 정해진 시간(±20%)이 지나면 다시 자랍니다. 같은 자리의 채집물을 10번 캐면 그 자리는 10분 동안 잠깁니다."}]},{"list":["농사 경험치는 게이지를 끝까지 채웠을 때만 받습니다. 움직여 취소되거나 숨이 다해 끊기면 0입니다.","[램프](#growth-lamp) 넓은낫질로 주변 채집물을 함께 캐면, 함께 캔 채집물의 경험치는 절반입니다."]},{"note":{"b":"황금 수확","t":"채집할 때 6% 확률로 보너스 미니게임이 뜹니다. 성공하면 2배, 완벽하면 3배를 받습니다. 자세한 것은 [광맥 · 황금 수확](#life-bonanza) 문서에 있습니다. 채집 중에는 0.5% 확률로 [보물지도](#life-treasure)도 나옵니다."}}]},{"h":"땅 채집 8종","blocks":[{"table":{"cols":["단계","지역","채집물","등급","채집 시간","다시 자람","한 번에","농사 경험치","쓰임"],"rows":[["1","[아르덴](#arden)","야생열매","일반","3초","100초","2~3개","8","열매잼 (특제 베리소스 함박)"],["2","[듄가르드](#dunegard)","선인장","고급","4초","140초","1~3개","10","선인장 시럽 (특제 선인장 갈비찜)"],["3","[이그니스포](#ignispo)","데스블룸","희귀","5초","180초","1~2개","12","불씨 고춧가루 (특제 화산 짬뽕) · [재련](#combat-siege) 재료"],["4","[베르단트룸](#verdantrum)","세잎클로버","희귀","5초","210초","1~2개","12","클로버 페스토 (특제 클로버 페스토 파스타)"],["4","베르단트룸","네잎클로버","영웅","7초","480초","1개","24","특제 네잎 샐러드"],["5","[미스틱글렌](#mysticglen)","빨간버섯","영웅","6초","250초","1~2개","16","버섯 간장 (특제 버섯간장 삼겹살)"],["5","미스틱글렌","빛나는버섯","전설","8초","420초","1개","30","특제 빛버섯 크림 파스타 · 양식 수조 확장"],["6","[프로스트하버](#frostharbor)","마법허브","전설","7초","300초","1~2개","22","허브솔트 (특제 허브솔트 스테이크)"]]}},{"p":"땅 채집물은 일일 퀘스트 · [의뢰 게시판](#quest-request) · 사이드 퀘스트 납품에도 쓰입니다. 향신료와 특제 요리 만드는 법은 [요리 · 가공](#life-cooking) 문서에 있습니다."}]},{"h":"바다 채집 4단계 22종","blocks":[{"p":"바다 채집물은 지역 앞바다의 물속에 있습니다. 조작은 땅 채집과 같고, 물속에서는 해저 장면 게이지가 뜹니다. 단계가 높을수록 깊은 곳에 있고 채집 시간이 길어서 숨이 모자랍니다."},{"slot":{"id":"생활-채집-해저","need":"물속에서 해저 채집물을 캐는 중 해저 게이지 화면"}},{"table":{"cols":["단계","바다","지형","등급","채집 시간","다시 자람","한 번에","농사 경험치","채집물"],"rows":[["1","아르덴 앞바다","갯벌 · 얕은 물","일반","3초","120초","1~3개","5","미역 · 다시마 · 파래 · 바지락 · 따개비 · 소금꽃"],["2","듄가르드 앞바다","암초 · 산호밭","고급","5초","200초","1~2개","8","전복 · 해삼 · 성게 · 산호 조각 · 진주조개 · 진주 · 해면"],["3","베르단트룸 항로","심해 협곡","희귀","7초","320초","1~2개","12","심해 산호 · 말미잘 촉수 · 먹물주머니 · 심해 해초 · 흑진주"],["4","프로스트하버 앞바다","해저 열수구","전설","9초","600초","1개","15","열수구 결정 · 용궁 연꽃 · 별불가사리 · 용연향"]]}},{"table":{"cols":["채집물","어디에 쓰나"],"rows":[["미역 · 다시마 · 파래 · 소금꽃","말린 미역 · 다시마 육수 · 파래 가루 · 천일염 (해산물 요리의 기본). 다시마는 수중호흡 물약에도"],["바지락 · 따개비","조개 술찜 · 해물 국수 · 해물 파전 · 따개비 국"],["전복 · 해삼 · 성게","전복죽 · 해삼 볶음 · 성게 덮밥, 성게 가시(물약 재료)"],["해면","농축 해면 → 수중호흡 · 심해 호흡 물약"],["산호 조각 · 진주조개 · 진주","산호 가루 · 진주 · 진주 가루 (물약 재료)"],["3단계 5종","야간투시 · 촉수 근력 · 먹물 은신 · 해초 재생 · 행운 물약"],["열수구 결정 · 용궁 연꽃 · 별불가사리","심연의 가호 · 심해 호흡 · 해류 물약"],["용연향","양식 수조 3단계 확장"]]}}]},{"h":"숨 관리 · 수중호흡 물약","blocks":[{"p":"1단계는 얕아서 숨을 참고도 충분합니다. 2단계부터는 채집 시간이 길고 깊어서, 숨이 다하면 채집이 끊깁니다. 연금술 솥에서 물약을 만들어 가세요."},{"table":{"cols":["물약","효과","재료"],"rows":[["수중호흡 물약","4분간 물속에서 숨쉬기","다시마 2 + 농축 해면 1"],["심해 호흡 물약","10분간 물속에서 숨쉬기 (심해 협곡 · 열수구용)","용궁 연꽃 1 + 농축 해면 2"],["심연의 가호 물약","4분간 물속 시야 · 채굴 속도 · 호흡 모두 좋아짐","정제 결정 2 + 산호 가루 1"],["해류 물약","3분간 물속에서 매우 빠르게 헤엄침","별불가사리 1 + 성게 가시 1"],["야간투시 물약","5분간 어둠 속에서도 보임","심해 산호 1 + 먹물 1"]]}},{"p":"농축 해면은 2단계 해면 2개를 가공대에서 만듭니다. 처음 한 번은 숨을 참고 해면을 모으거나, 다른 사람에게 물약을 사세요. 호흡 인첸트가 붙은 투구도 효과가 있습니다."}]}],"search":[["야생열매","땅 채집"],["선인장","땅 채집"],["데스블룸","땅 채집"],["네잎클로버","땅 채집"],["빛나는버섯","땅 채집"],["마법허브","땅 채집"],["용연향","바다 채집"],["흑진주","바다 채집"],["수중호흡 물약","바다 채집"],["해면","바다 채집"],["소금꽃","바다 채집"],["채집 경험치","땅 채집"]]},"life-insect":{"id":"life-insect","parent":"life","title":"곤충 채집","short":"코자 대륙과 야생에서 잠자리채로 곤충 12종을 잡아 곤충 수집가 모스에게 팝니다.","color":"var(--reg-jungle)","tags":[["코자 대륙 · 야생","lv"],["12종",null],["하루 30~90마리 판매",null]],"lede":"코자 대륙과 [야생](#world-wild)의 들판 · 숲 · 사막 · 물가에는 나비, 딱정벌레, 잠자리 같은 곤충이 날아다닙니다. 코자 대륙에서 더 자주 나타납니다. 잠자리채를 들고 곤충을 좌클릭하면 그물 미니게임이 시작되고, 잡은 곤충은 크기에 따라 값이 달라집니다. 잠자리채 구매와 곤충 판매는 아르덴의 곤충 수집가 모스가 맡습니다.","info":{"title":"곤충 채집","slot":{"id":"생활-곤충-대표","need":"코자 대륙 꽃밭에서 잠자리채를 들고 나비를 노리는 장면"},"rows":[["장소","[코자 대륙](#koza) · [야생](#world-wild) (코자 대륙이 2배 넘게 자주)"],["도구","잠자리채 3,000원 (곤충 수집가 모스)"],["조작","곤충 좌클릭(4.5칸 안) → Shift로 그물"],["판매","[아르덴](#arden) 곤충 수집가 모스 · 하루 30~90마리 (사냥 레벨)"],["판매가","기준가 × 0.8~1.3 (크기)"],["근원","잡을 때마다 20% · 1개 ([근원](#growth-origin))"],["기증","[박물관](#collect-museum) 곤충관 12"]]},"sections":[{"h":"잡는 법","blocks":[{"steps":[{"h":"잠자리채를 산다","p":"아르덴의 곤충 수집가 모스에게 말을 걸어 곤충 상점 창에서 잠자리채를 삽니다(3,000원)."},{"h":"야생에서 곤충을 찾는다","p":"곤충은 코자 대륙과 야생에서 내 주변 6~16칸에 생겨나 1분 남짓 날아다니다 사라집니다. 코자 대륙에서 훨씬 자주 나옵니다. 바이옴 · 시간 · 날씨가 맞아야 나오고, 풀숲 · 모래 · 물가처럼 서식지 블록이 충분해야 합니다. 달려서 바짝(2칸 안) 다가가면 놀라 달아날 수 있으니 걸어서 다가가세요."},{"h":"좌클릭으로 그물 미니게임","p":"잠자리채를 들고 4.5칸 안의 곤충을 바라보며 좌클릭하면 화면에 들판 장면이 뜨고 곤충 아이콘이 좌우로 날아다닙니다. 그물 고리 안에 곤충이 들어왔을 때 Shift를 누르세요."},{"h":"한 번에 맞힌다","p":"Shift는 한 번만 누를 수 있습니다. 가운데 과녁에 딱 맞추면 「완벽」으로 크기가 5% 커집니다. 고리 밖에서 누르거나, 곤충이 3번 왕복할 때까지 누르지 않으면 달아납니다. 희귀할수록 고리가 좁고 빠르며 갑자기 방향을 바꿉니다."}]},{"slot":{"id":"생활-곤충-미니게임","need":"곤충 채집 그물 미니게임 화면 (들판 장면 · 남은 기회 · 그물 고리)"}}]},{"h":"곤충 12종","blocks":[{"table":{"cols":["곤충","등급","나오는 때 · 대표","need":"코자 대륙에 떨어진 금맥 운석을 여러 명이 곡괭이로 캐는 장면"},"rows":[["장소","[코자 대륙](#koza)"],["간격","60~100분"],["예고","3분 전 전체 공지 + 방향 표시 막대"],["유지","25분 또는 다 캘 때까지"],["도구","철 곡괭이 이상"],["판매","[아르덴](#arden) 광부 키레이 「운석 거래」 · 하루 40~120개 (광질 레벨)"],["근원","한 번 캘 때마다 20% · 1~2개 ([근원](#growth-origin))"]]},"sections":[{"h":"캐는 법","blocks":[{"steps":[{"h":"공지를 본다","p":"떨어지기 3분 전에 모든 서버에 공지가 뜨고 대략적인 좌표(50칸 단위)가 나옵니다. 코자 대륙에 있으면 화면 위 막대가 방향을 알려 줍니다. 운석은 코자 대륙에 사람이 있을 때만, 그중 한 명에게서 220~650칸 떨어진 곳에 떨어지고, 마을 땅 근처에는 떨어지지 않습니다."},{"h":"낙하","p":"운석이 떨어지면서 충격파가 주변을 밀어냅니다. 피해는 없습니다. 떨어진 자리에 금맥 또는 수정맥 운석이 남습니다."},{"h":"좌클릭으로 캔다","p":"철 · 금 · 다이아몬드 · 네더라이트 곡괭이로 운석을 좌클릭하면 한 번에 광석 하나가 가방에 들어옵니다. 한 번 캐면 2초 기다려야 다시 캘 수 있고, 곡괭이 내구도가 1 줄어듭니다. 내구도가 1로 잠긴 곡괭이로는 캘 수 없습니다."},{"h":"사라질 때까지","p":"광석을 다 캐면 운석이 부서지고, 25분이 지나도 사라집니다."}]}]},{"h":"운석 2종","blocks":[{"table":{"cols":["운석","나올 확률","캘 수 있는 횟수","한 번에 얻는 것","판매가"],"rows":[["금맥 운석","60%","40~52번","운석 금덩이 1~2개","1,400원"],["수정맥 운석","40%","30~40번","별빛 수정 1개","3,200원"]]}},{"list":["수정맥 운석을 캘 때는 6% 확률로 주변 땅에 [화석](#life-fossil) 흙블록이 생깁니다.","광부 키레이에게 말을 걸어 「운석 광석 판매」를 고르면 「운석 거래」 창이 열립니다. 한 사람당 하루 40개까지 팔 수 있고, 광질 레벨이 오를수록 늘어나 Lv1000에 120개입니다.","별빛 수정은 [박물관](#collect-museum) 보석 · 광물관에 기증할 수 있고, [의뢰 게시판](#quest-request)에 운석 금덩이 · 별빛 수정 의뢰가 있습니다.","운석을 한 번 캘 때마다 20% 확률로 [근원](#growth-origin) 1~2개가 함께 들어옵니다."]},{"note":{"b":"코자 대륙 가는 법","t":"네더라이트 장비 9종(투구 · 흉갑 · 레깅스 · 부츠 · 검 · 곡괭이 · 괭이 · 도끼 · 삽)을 모두 가진 뒤 아르덴 이장 실바에게 말을 걸면 포탈 아이템을 줍니다. 마을 서버의 내 마을에서 우클릭해 포탈을 세우고, 포탈을 우클릭하면 코자 대륙의 무작위 위치로 갑니다. 자세한 것은 [코자 대륙](#koza) 문서에 있습니다."}}]}],"search":[["운석 금덩이","운석"],["별빛 수정","운석"],["운석 낙하","운석"],["금맥","운석"],["수정맥","운석"]]},"life-money":{"id":"life-money","parent":"life","title":"돈 버는 법 한눈에","short":"활동별 판매가 · 하루 한도 비교와 초반 · 중반 · 후반 추천 루트.","color":"var(--gold)","tags":[["수입 비교표",null],["하루 한도",null],["추천 루트","lv"]],"lede":"코자 온라인의 돈(원)은 대부분 NPC에게 물건을 팔아서 생깁니다. 서버 상점은 대부분 물건을 사 주기만 하는 곳이라(농부 미반은 씨앗 · 일부 작물을 300원에 팔기도 합니다) 돈이 새로 생기는 곳이고, 강화·인첸트·재련·트랙터 같은 곳에서 크게 나갑니다. 아래 표는 실제 판매가와 하 [["나가","무역상인"],["무역상인","요리 판매"],["시세","무역상인"],["수산가공품","무역상인"],["캐비어","수산가공품"],["젓갈","수산가공품"],["지역 전리품","무역상인"],["수산부산물","무역상인"],["손질 단계","무역상인"]]},"life-treasure":{"id":"life-treasure","parent":"life","title":"보물지도","short":"어디서나 낚시 · 채집 · 채광 · 사냥 중 얻고, 코자 대륙에서 X를 파서 보물 상자를.","color":"var(--r-legend)","tags":[["얻기: 모든 곳",null],["발굴: 코자 대륙","lv"],["4등급",null],["하루 3~9장",null]],"lede":"낚시 · 채집 · 광석 캐기 · 몬스터 사냥 중에 가끔 보물지도가 나옵니다. 지도를 코자 대륙에서 손에 들면 실제 지형이 그려진 지도에 붉은 X가 표시되고, 그 자리를 파면(삽이 아니어도 됨) 보물 상자가 나옵니다. 높은 등급 지도는 보물을 지키는 수호자가 함께 나타납니다.","info":{"title":"보물지도","slot":{"id":"생활-보물-대표","need":"코자 대륙에서 손에 든 보물지도 (지형 · 붉은 X · 등급 리본)"},"rows":[["얻는 곳","모든 서버"],["하루 한도","1인 3장 (광질 레벨에 따라 최대 9장)"],["펼치는 곳","[코자 대륙](#koza)"],["발굴 도구","아무 도구 (맨손도 됨)"],["길 안내","지도를 들면 액션바에 방향 · 거리 (48칸 안은 가까움 안내)"],["보상","돈 3,000~100,000원 + 마일리지 + [근원](#growth-origin)"]]},"sections":[{"h":"얻는 법","blocks":[{"table":{"cols":["활동","확률"],"rows":[["낚시로 물고기를 잡을 때","0.8%"],["[채집](#life-gathering)할 때","0.5%"],["광석을 캘 때","0.25%"],["몬스터를 잡을 때","0.35%"]]}},{"p":"어느 서버에서든 나오지만 한 사람당 하루 3장까지이고, 광질 레벨이 오를수록 늘어나 Lv1000에 9장입니다. 보물 상자에서 다음 등급 지도가 나오기도 하고, [심화 길라잡이](#quest-guide-advanced)의 화석 발굴 단계 보상으로 낡은 보물지도를 받습니다. 코자 대륙이 아닌 곳에서는 말린 지도로 보이고, 코자 대륙에서 펼치라는 안내가 뜹니다."}]},{"h":"발굴하는 법","blocks":[{"steps":[{"h":"코자 대륙에서 손에 든다","p":"처음 손에 든 자리를 기준으로 등급별 거리만큼 떨어진 흙 · 풀 · 모래 같은 땅이 보물 자리로 정해집니다(마을 땅 근처는 피함). 지도에는 실제 지형, 내 위치 화살표, 붉은 X가 그려집니다."},{"h":"X로 간다","p":"지도를 손에 들고 있으면 화면 아래(액션바)에 보물이 있는 **방향(8방위)과 대략의 거리**가 뜹니다 (예: 「보물은 북동쪽 약 350칸」 — 100칸 넘으면 50칸 단위, 그 안은 10칸 단위). 48칸 안으로 들어오면 「이 근처 어딘가…」 → 「가까워요」(25칸) → 「아주 가까워요」(10칸) → 「바로 발밑입니다!」(3칸)로 바뀌고, 3칸 안에서는 X 자리에 붉은 가루가 보입니다. 지도 가장자리의 작은 점은 내 위치이니, 멀리 있을 때는 이 방향 안내를 보고 가세요."},{"h":"아무 도구로 판다","p":"X 자리 근처(약 1.6칸 안)의 땅을 삽 · 곡괭이 · 맨손 등 무엇으로든 파면, 캔 블록 바로 위로 보물 상자가 솟아오릅니다."},{"h":"수호자를 물리친다","p":"해적왕 · 고대 왕국 지도는 수호자 몬스터가 나타납니다. 40칸 넘게 벗어나거나 5분이 지나면 보물이 다시 묻힙니다."},{"h":"상자를 연다","p":"지도 1장이 사라지고 돈 · 마일리지와, 확률에 따라 다음 등급 지도를 받습니다."}]}]},{"h":"지도 4등급과 보상","blocks":[{"table":{ 니다. 채집은 아무 괭이나 들고 하면 됩니다."},{"h":"아르덴에서 몸 풀기","p":"아르덴 숲의 야생열매 채집, 아르덴 앞바다 낚시와 바다 채집으로 재료를 모읍니다. 채집할 때마다 농사 경험치도 오릅니다. 기초 길라잡이가 이 과정을 하나씩 안내합니다."},{"h":"요리를 만들어 나가에게","p":"농사와 [포획](#life-ranch)한 동물에게서 얻은 재료를 가공대·요리솥에서 요리로 만들고 무역상인 나가에게 팝니다. 요리 기준가는 3,800원이고(간단한 요리 ×0.75 · 바다 재료를 쓰는 정성 요리 ×1.3), 그날 시세에 따라 오르내리고 요리 레벨에 따라 오릅니다. 초반 돈벌이의 중심입니다."},{"h":"마을을 세우고 양식장 · 트랙터","p":"마을 서버에 내 마을을 세우면 양식 수조와 트랙터를 쓸 수 있습니다."},{"h":"코자 대륙으로","p":"네더라이트 장비 9종을 모아 이장 실바에게 포탈을 받으면 코자 대륙에서 운석·보물 발굴을 할 수 있습니다. 곤충과 화석도 야생보다 코자 대륙에서 훨씬 자주 나옵니다."}]},{"links":[["#life-money","돈 버는 법 한눈에","활동별 수입 비교와 초반 · 중반 · 후반 추천"],["#growth-jobs","직업","낚시 · 농사 · 요리 · 연금술 · 광질 · 벌목 레벨과 2배 드롭"],["#life-logging","벌목","원목 베기 · 미니게임 · 나무 상점"],["#collect-museum","박물관","물고기 · 채집물 · 곤충 · 화석을 기증하고 보상 받기"]]}]},{"h":"어디서 무엇을 하나","blocks":[{"table":{"cols":["장소","할 수 있는 생활 활동"],"rows":[["이프란 (아르덴 등 6개 마을)","땅 채집 · 바다 채집 · 낚시 · 요리 재료 판매 · NPC 거래 전부"],["야생","낚시 · 농사 · 광질(광맥 핵) · 상자 감정 · 곤충 채집 · 화석 발굴 · 동물 포획 (곤충 · 화석은 코자 대륙보다 드물게)"],["마을 서버 (내 마을)","양식 수조 · 트랙터 자동 수확 · 농사 (마을원이 접속해 있으면 마을 밭이 자람) · 동물은 저절로 생기지 않음"],["코자 대륙","곤충 채집 · 화석 발굴 · 운석 채굴 · 보물지도 발굴 · 상자 감정 · 동물 포획"]]}},{"note":{"b":"판매는 NPC 창에서","t":"화석 · 운석 · 곤충 · 양식 용품은 명령어가 아니라 해당 NPC에게 말을 걸어 여는 거래 창에서 사고팝니다. 물고기는 낚시꾼 프쉰, 농작물은 농부 미반, 광물은 광부 키레이, 원목 · 묘목은 나무꾼 도르반이 삽니다."}},{"note":{"b":"광물 · 물고기 · 농작물 · 나무 판매가","t":"서버 상점에 팔 때 광물은 4배, 물고기는 10배(크기 · 변이 배율 별도), 농작물 · 나무는 10배로 쳐 줍니다. 물고기는 낚시 레벨, 광물은 광질 레벨, 농작물은 농사 레벨, 나무는 벌목 레벨이 오를수록 더 받습니다(Lv1000 물고기 ×3 · 광물 · 농작물 · 나무 ×1.5). 분류마다 하루 판매 한도가 있어 Lv1 100만원어치에서 Lv1000 500만원어치까지 늘고(광물은 광질 레벨), 넘은 부분은 25%만 받습니다. 매일 오전 6시에 초기화됩니다. 자세한 것은 [돈 버는 법](#life-money) 문서에 있습니다."}}]},{"h":"생활 활동에서 나오는 근원","blocks":[{"p":"[근원](#growth-origin)은 높은 단계 성장(강화 21강 이상 · 인첸트 해방 · 상급 램프 · 룬 합성 등)에 쓰는 재화입니다. 아래 생활 활동을 할 때마다 정해진 확률로 조금씩 들어옵니다. 하루 상한은 없습니다."},{"table":{"cols":["활동","확률","개수"],"rows":[["[운석](#life-meteor) 캐기 (한 번 캘 때마다)","20%","1~2개"],["[화석](#life-fossil) 털어내기 (발굴 성공)","30%","1~2개"],["[곤충](#life-insect) 잡기","20%","1개"],["[보 90"],["22","가공대에서 수산가공품 1개 만들기 (젓갈 · 숙성 어란 · 캐비어)","10,000원 · 마일리지 90"],["23","무역상인 나가에게 수산가공품 1번 팔기","20,000원 · 마일리지 90"],["24","대장장이 루이흐에게 장비 강화 1번 시도","30,000원 · 마일리지 120"],["25","현자 컬티스에게 램프 부여 1번","20,000원 · 마일리지 120"],["25-1","룬 뽑기 1번 (마법사 후를루카 · `/룬`, 1회 100,000원)","30,000원"],["26","검기 스킨이나 데미지 스킨 1번 장착","10,000원 · 마일리지 90"],["27","기록관 이엔나에게 마지막 보고","100,000원 · 마일리지 3,000 · 랜덤 스킬북 4단계 · 전체 공지 · 「이프란의 일꾼」 타이틀"]]}}]},{"h":"미리 챙기면 좋은 것","blocks":[{"list":["**내 마을**: 7단계 수조는 내 마을 땅에만 놓을 수 있습니다. 마을이 없다면 [유저 마을](#conv-town)을 먼저 만드세요.","**돈 25,000원**: 수조 값입니다. 7단계 보상으로 150,000원을 받습니다.","**코자 대륙**: 4막의 보물지도 · 운석은 코자 대륙에서만 됩니다. 곤충 · 화석은 야생에서도 나오지만 코자 대륙에서 더 잘 나옵니다. 잠자리채(3,000원)는 아르덴의 곤충 수집가 모스에게서 삽니다.","**올가미 · 룬 뽑기 돈**: 15-1은 기초 길라잡이 24-1에서 잡아 둔 동물의 전리품을 받으면 되고, 25-1 룬 뽑기는 1회 100,000원이 듭니다.","**어란 기다리기**: 수조는 사료가 있는 동안 4시간마다 어란을 낳습니다. 2막에서 미리 놓아 두면 5막에 받을 수 있습니다.","**졸업 선물 상자**: 25단계 램프와 26단계 스킨은 기초 길라잡이 졸업 선물 상자에서 나온 것을 쓰면 됩니다."]},{"links":[["#quest-request","의뢰 게시판","1단계"],["#life-fishfarm","양식장","2막 · 5막"],["#combat-crown","왕관 몬스터","3막"],["#life-insect","곤충 채집","4막"],["#life-fossil","화석 발굴","4막"],["#growth-lamp","램프","5막"],["#life-ranch","동물 포획","4막 15-1"],["#growth-rune","룬","5막 25-1"]]}]}],"search":[["이프란의 생업","심화 길라잡이"],["이프란의 일꾼","심화 길라잡이"],["심화 퀘스트","퀘스트"]]},"quest-guide":{"id":"quest-guide","parent":"quest","title":"길라잡이","short":"기초 36단계 · 심화 29단계 · 메인 50단계를 한 화면에서 관리.","color":"var(--accent)","tags":[["기초 36 (필수)","lv"],["심화 29 (선택)",null],["메인 50 (선택)",null]],"lede":"길라잡이는 해야 할 일을 순서대로 하나씩 주는 연속 퀘스트입니다. 처음에 받는 기초 길라잡이, 생활 콘텐츠를 체험하는 심화 길라잡이, 메인 스토리가 모두 길라잡이 화면에 줄기(라인)로 정리되어 있습니다.","info":{"title":"길라잡이","slot":{"id":"퀘스트-길라잡이-대표","need":"`/길라잡이` 로 연 길라잡이 화면 (기초 · 심화 · RPG 메인 카드 3장)"},"rows":[["여는 법","`/길라잡이` · 메인 메뉴 「퀘스트」 → 「길라잡이」"],["기초","36단계 · 필수 · 포기 안 됨"],["심화","29단계 · 기초 졸업 후"],["메인 (RPG 메인)","50단계 · 기초 36단계 완료 후"],["동시 진행","한 줄기만"],["근원","기초 단계마다 3 · 심화 8 · 메인 5~60"]]},"sections":[{"h":"세 줄기","blocks":[{"table":{"cols":["줄기","열리는 조건","단계","보상","자세히"],"rows":[["기초 길라잡이","처음부터 (튜토리얼 직후)","36","124,500원 · 근원 108 · 칭호북 「개척자」 · 졸업 선물 상자","[기초 길라잡이](#start-guide-basic)"],["심화 길라잡이 「이프란의 생업」","기초 36단계 완료","29","760,000원 · 마일리지 6,480 · 근원 232 · 랜덤 스킬북","[심화 길라잡이](#quest-guide-advanced)"],["메인 스토리 「어긋난 순환」","기초 36단계 완료","50","4,191,000원 · 근원 632 · 랜덤 스킬북","[메인 스토리](#quest-main)"]]}},{"p":"심화와 메인은 **기초 길라잡이를 모두 끝내야** 열립니다. NPC 대화로 받을 때도 마찬가지입니다."}]},{"h":"기초 36단계의 짜임","blocks":[{"table":{"cols":["구간","내용","보상"],"rows":[["01~21","나무 · 돌 · 석탄 · 다이아 캐기, 파티 가입, 아르덴 숲길 사냥, 마을 가입, 땅 · 바다 채집, 낚시와 손질, 요리 · 연금술, 무역상인, 도전과제, 구조물 상자 감정, 인첸트, 다이아 장비 한 벌","88,000원"],["22","이장 실바에게 보고 — **졸업**","칭호북 「개척자」 · 졸업 선물 상자"],["23~32","경제 배우기: 밀 수확 · 농작물 판매 · 올가미 포획(24-1) · 낚시 · 물고기 판매 · 손질 · 연금술 · 룬 열기 · 룬 장착(28-1 · 28-2) · 채집 · 요리 · 무역상인 판매 · 광물 판매","36,500원 · 1성 생명 룬"],["33","이장 실바에게 돌아가기 → 메인 스토리 또는 심화 길라잡이 선택","—"]]}},{"lore":{"name":"길라잡이 졸업 선물 상자","color":"#FFD27A","lines":["◆ 기초 길라잡이를 마친 개척자에게 주는 선물","하급 램프 랜덤 상자 x3","검기 스킨 랜덤 상자 x1","데미지 스킨 랜덤 상자 x1","","사용 방법: 우클릭하면 바로 받습니다","획득 방법: 기초 길라잡이 졸업 (실바에게 보고)"]}},{"p":"단계별 할 일과 금액은 [기초 길라잡이](#start-guide-basic) 문서에 모두 정리되어 있습니다. 모든 단계가 근원 3개를 함께 줍니다. 졸업하면 전체 공지와 폭죽이 터집니다. 기초를 다 마친 뒤 새 단계가 추가되면 보상 없이 완료로 채워집니다."}]},{"h":"퀘스트 HUD","blocks":[{"p":"진행 중인 퀘스트는 화면 오른쪽 끝에 붙어 표시됩니다. 맨 위에 퀘스트 제목, 그 아래 진행도(예: 8/14), 그 아래 할 일 설명이 몇 줄 나옵니다. 목표를 다 채우면 「누구에게 가서 보고하세요」 같은 안내가 뜨고, 필요하면 길안내가 그 NPC 쪽으로 바뀝니다. 기초 길라잡이가 아니면 그 아래에 「퀘스트 포기: /퀘스트포기」 안내도 나옵니다."},{"slot":{"id":"퀘스트-길라잡이-HUD","need":"사냥 퀘스트 진행 중 화면 오른쪽 퀘스트 HUD를 크게 찍은 사진"}}]},{"h":"길라잡이 화면 쓰는 법","blocks":[{"list":["첫 화면에 **기초 길라잡이 · 심화 길라잡이 · RPG 메인** 카드 3장이 있습니다. 카드마다 진행 막대와 「완료 수 / 전체」, 상태(모두 완료 · 진행 중)가 보이고, 잠긴 줄기는 흑백 그림에 자물쇠가 붙습니다.","카드를 누르면 그 줄기의 단계 목록이 열립니다. 한 쪽에 12줄씩이고 ◀ ▶ 로 쪽을 넘깁니다 (기초 · 심화 3쪽, 메인 5쪽). 줄마다 완료 · 진행 중이 표시되고, 줄에 마우스를 올리면 그 단계 설명과 보상이 나옵니다.","심화 · 메인 카드 아래 **「진행하기」**를 누르면 그 줄기의 다음 단계를 이어서 받습니다. 다음 단계를 주는 NPC가 있으면 그 NPC를 찾아가라는 안내가 채팅으로 옵니다. 기초는 단계가 자동으로 이어져서 단추가 없습니다.","목록 화면 오른쪽 아래 「이 라인 잠시 접기」를 누르면 지금 진행 중인 퀘스트만 내려놓고 완료 기록은 그대  퀘스트 HUD(제목·진행도·설명)가 떠 있는 평소 화면"},"rows":[["여는 곳","메인 메뉴(Shift+F) 「퀘스트」 카드"],["길라잡이 창","`/길라잡이`"],["일일 퀘스트","`/일일퀘스트`"],["의뢰 게시판","`/의뢰`"],["동시에 진행","길라잡이 · 메인 · 사이드 중 1개"],["포기","`/퀘스트포기` (기초 길라잡이 빼고)"]]},"sections":[{"h":"처음이라면 이 순서로","blocks":[{"steps":[{"h":"기초 길라잡이 36단계","p":"튜토리얼이 끝나면 바로 이어집니다. 나무 캐기부터 다이아 장비 한 벌, 올가미 포획과 룬 장착까지 따라가면 보상만 124,500원과 근원 108개가 모입니다. 자세한 목록은 [기초 길라잡이](#start-guide-basic) 문서에 있습니다."},{"h":"졸업 · 갈림길","p":"33단계에서 이장 실바에게 돌아가면 메인 스토리를 시작하거나, 심화 길라잡이 「이프란의 생업」을 고를 수 있습니다. 둘 다 기초를 모두 마쳐야 열리고, 어느 쪽을 골라도 나중에 길라잡이 화면에서 갈아탈 수 있습니다."},{"h":"메인 스토리와 사이드","p":"기록관 이엔나에게 장을 받아 지역을 하나씩 돕니다. 그 지역 사람들이 주는 사이드 퀘스트로 돈을 더 벌 수 있습니다."},{"h":"매일 할 일","p":"일일 퀘스트 5개와 의뢰 게시판 3장은 매일 자정에 새로 나옵니다. 둘 다 끝내면 돈과 마일리지가 꽤 쌓입니다."}]}]},{"h":"퀘스트 종류 한눈에","blocks":[{"table":{"cols":["종류","받는 곳","횟수","보상"],"rows":[["[기초 길라잡이](#start-guide-basic)","튜토리얼 끝나면 자동","1회 · 36단계","합계 124,500원 · 근원 108 + 졸업 선물"],["[심화 길라잡이](#quest-guide-advanced)","이장 실바 (기초 졸업 후)","1회 · 29단계","760,000원 · 마일리지 6,480 · 근원 232 + 랜덤 스킬북"],["[메인 스토리](#quest-main)","이장 실바 → 기록관 이엔나","1회 · 9장 50단계","4,191,000원 · 근원 632 + 랜덤 스킬북"],["[사이드 퀘스트](#quest-side)","각 지역 NPC","1회 · 20개","855,000원 + 지역 보석 · 랜덤 스킬북 등"],["[일일 퀘스트](#quest-daily)","메인 메뉴 「퀘스트」 · `/일일퀘스트`","매일 5개","개당 400~8,000원 + 모두 완료 7,000원 · 마일리지 150"],["[의뢰 게시판](#quest-request)","기록관 이엔나 · `/의뢰`","매일 3장 (농사 레벨에 따라 최대 9장)","장당 8,000~18,000원 + 마일리지 · 근원 2~5"]]}}]},{"h":"알아둘 규칙","blocks":[{"list":["길라잡이 · 메인 · 사이드 퀘스트는 **한 번에 하나만** 진행합니다. 메인 스토리를 하는 동안에는 사이드 퀘스트를 받을 수 없습니다.","[기초 길라잡이](#start-guide-basic)를 **모두** 마쳐야 메인 스토리와 심화 길라잡이를 받을 수 있습니다.","`/퀘스트포기` 로 지금 퀘스트를 언제든 내려놓을 수 있습니다 (기초 길라잡이만 안 됨). 완료 기록이 남지 않아 다시 받을 수 있습니다.","메인 스토리 · 심화 길라잡이는 순서대로만 진행됩니다. 중간 단계를 내려놓고 다시 받으면 안 깬 가장 앞 단계부터 줍니다.","라인을 바꾸고 싶으면 [길라잡이 화면](#quest-guide)에서 지금 라인을 「잠시 접기」 합니다. 완료 기록은 남아 있어서 나중에 「진행하기」로 그 자리부터 이어집니다.","진행 중인 퀘스트는 화면 오른쪽 퀘스트 HUD에 목표와 진행도가 나옵니다.","퀘스트를 받으면 목적지까지 길안내(바닥 경로와 화살표)가 자동으로 켜지는 경우가 많습니다.","대부분의 퀘스트는 돈과 함께 그 일에 맞는 직업 경험치(지금 레벨에서 그 직업 약 5~20분어치)를 줍니다. es)"}]}],"search":[["능선","지역"],["노르","능선 NPC"],["야영지","능선"],["구조물 정리","사이드 퀘스트"]]},"rules":{"id":"rules","title":"규칙 · 처벌","short":"경제 위반은 1회 영구 정지, 나머지는 경고 → 일시 정지 → 영구 3단계.","tags":[["5개 서버 공통 적용","lv"],["경제 위반 1회 영구",null],["90일 무사고면 한 단계 감경",null],["2026-09-22 개정",null]],"lede":"코자 온라인의 다섯 서버(로비 · 마을 서버 · 야생 · 코자 대륙 · 던전 서버)는 하나의 세계입니다. 계정, 돈, 잼, 직업 레벨, 마을, 우편함, 제재 기록이 모두 공유되어 한 서버에서 받은 제재는 다섯 서버 모두에 적용됩니다. 규칙에 없더라도 다른 사람의 플레이를 망치거나 정상적으로는 불가능한 이득을 얻는 행위는 제재 대상입니다.","info":{"title":"규칙","slot":{"id":"규칙-대표","need":"로비의 규칙 안내 표지판이나 디스코드 규칙 채널 화면"},"rows":[["최종 개정","2026-09-22"],["적용","5개 서버 공통"],["경제 위반","단계 없이 1회 영구 정지 + 전부 회수"],["그 밖의 위반","경고 → 일시 정지 → 영구 정지"],["감경","90일 동안 추가 위반이 없으면 한 단계 내려감"],["신고 · 이의 제기","디스코드 (이의 제기는 14일 안)"]]},"sections":[{"h":"제재는 이렇게 매겨집니다","blocks":[{"table":{"cols":["종류","해당하는 것","처벌"],"rows":[["경제 위반","복사 · 버그 악용 · 현금 거래 · 사기 · 후원 사기","단계 없이 1회 영구 정지 + 얻은 것 전부 회수"],["그 외 전부","채팅 · 매너 · 계정 · 플레이 · 마을 · PvP","경고 → 일시 정지 → 영구 정지 (3단계)"]]}},{"p":"경제를 깨는 위반은 되돌릴 수 없어서 봐주지 않습니다. 누가 몇 달 모은 것과 복사로 만든 것이 같아지면 서버가 끝나기 때문입니다. 채팅이나 매너 문제는 되돌릴 수 있어 단계를 밟습니다."},{"list":["단계는 계정에 쌓입니다. 유형이 달라도 같이 올라갑니다 (욕설로 1차를 받은 뒤 광고로 걸리면 2차).","90일 동안 추가 위반이 없으면 한 단계 내려갑니다.","경제 위반 기록은 사라지지 않습니다."]},{"cards":[{"h":"한 단계 무거워지는 경우","color":"var(--reg-volcano)","p":"여러 명이 짜고 계획적으로 한 경우 · 신규 유저를 노린 경우 · 적발된 뒤 증거를 지우거나 재화를 다른 계정으로 옮긴 경우 · 운영진에게 거짓말한 경우"},{"h":"한 단계 가벼워지는 경우","color":"var(--reg-forest)","p":"자진 신고 · 바로 인정하고 협조한 경우 · 피해 복구에 적극 협력한 경우 · 초범이고 그동안 문제가 없던 경우 (경제 위반의 자진 신고는 아래 2장 규칙이 먼저입니다)"}]},{"table":{"cols":["통하지 않는 변명","이유"],"rows":[["\"몰랐어요\"","첫 한 번은 참작합니다. 두 번째부터는 통하지 않습니다"],["\"남들도 하는데요\"","그 사람들도 처리합니다. 내 제재가 줄지는 않습니다"],["\"실수였어요\"","회수는 그대로 합니다. 정지 기간만 조정될 수 있습니다"]]}},{"note":{"b":"애매하면 먼저 물어보세요","t":"물어보고 한 일로 제재받는 경우는 없습니다. 규칙은 계속 다듬어지고, 바뀌면 디스코드에 공지합니다."}}]},{"h":"1. 계정","blocks":[{"list":["**한 사람당 계정 하나입니다.** 서버 추천 보상 · 일일 퀘스트 · 마일리지 · 접속 보상 · 파티 경험치 공유가 전부 계정 단위라 부계정은 용도를 가리지 않고 금지합니다. 창고용 · 구경용도 안 됩니다.","**같은 집에서 여러 명이 하는 경우**(형제 · 가족 · 룸메이트)는 디스코드로 미리 신고하세요. 신고된 계정끼리는 같은 인터넷을 써도 문제 삼지 않습니다. 신고 없이 발각되면 부계정으로 처리하며, 나중에 \"사실은 동생이었다\"는 인정되지 않습니다.","**계정을 넘기거나 빌려주지 마세요.** 판매 · 양도 · 교환 · 대여 · 공유 모두 금지입니다. 내 계정에서 일어난 일은 누가 했든 계정 주인 책임입니다.","제재 중에 다른 계정으로 접속하지 마세요."]},{"table":{"cols":["위반","1차","2차","3차","함께 하는 조치"],"rows":[["부계정","부계정 영구 정지 · 본계정 경고","본계정 7일","본계정 영구","부계정 재화 전량 회수 (미리 신고한 같은 집 계정은 예외)"],["계정 판매 · 양도 · 대여","영구 정지 (양쪽 계정)","—","—","—"],["대리 플레이","7일 (맡긴 쪽 · 받은 쪽 모두)","30일","영구","대리로 올린 랭킹 기록 삭제"],["제재 회피 접속","회피 계정 영구 정지 + 원래 제재 기간 2배","본계정 영구","—","—"]]}}]},{"h":"2. 경제 — 여기는 봐주지 않습니다","blocks":[{"list":["**버그 · 오류 악용 금지.** 아이템 복사, 돈 · 잼 복사, 의도되지 않은 무한 획득, 가격 오기입 악용, 들어가면 안 되는 곳 진입, 판정 우회 모두 해당합니다. \"이거 정상이 아닌데?\" 싶었다면 그 순간부터 악용입니다. 모르고 한 첫 번은 참작하지만, 안 뒤 한 번 더 쓰면 고의입니다.","**현금 거래 금지.** 게임 안의 돈 · 잼 · 아이템 · 마을 · 계정을 현실 돈이나 다른 게임 재화와 바꾸는 모든 행위입니다. 사겠다 · 팔겠다는 제안, 중개, 광고도 포함하며, 거래가 안 됐어도 제안만으로 제재합니다. 산 사람과 판 사람을 똑같이 처벌하고 오간 재화는 양쪽 모두 회수합니다.","**사기 금지.** 선입금 후 잠수, 물건 바꿔치기, 거짓 설명, 빌려 간 뒤 안 돌려주기."]},{"table":{"cols":["버그를 찾았을 때","결과"],"rows":[["발견하고 바로 신고","경제에 영향을 주는 버그를 처음 신고하면 잼 포상"],["써 버린 뒤, 운영진이 알기 전에 자진 신고","얻은 것 회수만 · 정지 없음"],["숨기고 계속 쓰다가 적발","영구 정지 + 전량 회수"]]}},{"p":"버그를 찾으면 바로 쓰기를 멈추고 디스코드로 신고하세요. 재현 방법까지 적어 주면 더 좋습니다. 이미 써 버렸어도 늦지 않았으니 말해 주세요 — 신고가 항상 더 이득입니다."},{"list":["**후원:** 후원은 게임 안 `/후원하기` 로 방법을 안내받아 입금한 뒤, `/후원하기 <입금자명> <금액>` 으로 직접 신고하면 운영진이 입금을 확인하고 잼을 지급하는 방식입니다. 사람이 확인하므로 시간이 조금 걸릴 수 있습니다.","대리 후원은 됩니다. 부모님이나 친구가 대신 입금해도 괜찮지만, `/후원하기` 에는 실제로 입금한 사람의 이름을 정확히 적어 주세요. 이름이 다르면 확인이 늦어집니다.","입금하지 않고 거짓으로 신고하지 마세요. 처리된 후원은 되돌리지 않으며, 입금 후 취소나 환불을 요구하지 마세요. 잼으로 산 물건도 환불되지 않습니다."]},{"list":["**유저 간 거래:** 플레이어끼리 바닥에 던지거나 상자로 주고받은 거래는 기록이 남지 않아 운영진이 개입하기 어렵습니다. 가능하면 [유저 상점](#shop-usershop)을 쓰고, 직접 거래한다면 주고받는 장면을 녹화해 두세요.","**유저 상점 가격 오입력은 판매자 책임입니다.** 다만 명백한 자릿수 실수(예: 100,000원짜리를 100원)를 알고도 쓸어 담은 경우는 운영진 판단으로 되돌릴 수 있습니다.","**직원 권한 악용 금지.** 유저 상점 직원으로 초대받은 뒤 물건이나 수익을 빼돌리지 마세요."]},{"table":{"cols":["위반 (단계 없음)","처벌","함께 하는 조치"],"rows":[["아이템 · 돈 · 잼 복사","영구 정지","전량 + 그것으로 만든 것 전부 회수"],["무한 획득 버그 악용","영구 정지","그 기간 획득분 전체 회수"],["가격 오류 · 판정 우회 악용","영구 정지","차익 전액 회수"],["버그 악용 후 자진 신고","정지 없음","얻은 것만 회수"],["현금 거래 (사든 팔든 중개하든)","영구 정지 (양쪽 모두)","오간 재화 전량 회수"],["현금 거래를 제안만 한 경우","30일 정지","—"],["후원 허위 신고","영구 정지","지급된 잼 + 그것으로 산 것 전부 회수"],["후원 취소 · 환불 강요","영구 정지","해당 잼 + 그것으로 산 것 전부 회수"],["사기 (고액 또는 상습)","영구 정지","피해자에게 원래대로 돌려줌"],["사기 (소액 1회)","7일 정지","피해자에게 원래대로 돌려줌"]]}},{"note":{"b":"회수는 벌이 아니라 되돌리기입니다","t":"정지 여부와 상관없이 항상 회수합니다. 복사한 아이템 → 그걸 판 돈 → 그 돈으로 산 것 → 강화에 쓴 장비까지 따라갑니다. 모르고 산 사람은 보호합니다 — 물건은 회수하되 낸 돈은 돌려드립니다."}}]},{"h":"3. 플레이","blocks":[{"list":["**오토 · 매크로 · 비정상 클라이언트 금지.** 클릭 매크로, 키 고정 장치, 자동 낚시 프로그램, 자동 채굴 봇, 그리고 엑스레이 · 킬 오라 · 플라이 · 속도 핵 · 리치 등 서버가 허용하지 않는 기능을 주는 모드, 무기 · 방어구 · 몹 판정을 조작하는 프로그램이 해당합니다.","미니맵 · 조명 개선 · FPS 개선 · 인벤토리 정리 같은 편의 모드는 허용합니다. 애매하면 쓰기 전에 물어보세요.","**잠수(자리 비움)는 자유입니다.** 시간 제한도 없고 접속 보상을 받는 것도 정상 이용입니다. 금지되는 것은 잠수가 아니라 사람이 하지 않는데 게임이 계속 굴러가게 만드는 자동 조작입니다.","**사냥 레벨 제한은 시스템입니다.** 몬스터 레벨보다 사냥 레벨이 10 넘게 낮으면 주는 피해가 줄고 경험치 · 전리품이 나오지 않습니다. 이것을 우회하려는 것이 위반이며, 판정을 속이는 방법을 찾았다면 신고하세요(포상 대상)."]},{"table":{"cols":["마음껏 써도 되는 공식 기능","조건"],"rows":[["`/낚시자동` 자동 낚시","낚시 직업 50레벨 이상 · 집중도 소모 · 3등급 물고기까지 (자동으로 잡은 물고기는 판매가 ×0.25)"],["자동 줍기","VIP · MVP 멤버십"],["자동 심기","MVP 멤버십 (상시) · 농사 300레벨 능력 (켜 두는 시간 · 대기 시간 있음)"],["멀티채굴 · 넓은낫질 등 램프 능력","램프 부여"]]}},{"table":{"cols":["위반","1차","2차","3차","함께 하는 조치"],"rows":[["오토 · 매크로","7일","30일","영구","그 기간 획득분 회수"],["핵 클라이언트 (전투 · 엑스레이)","30일","영구","—","경제에 영향을 줬으면 즉시 영구"],["핵 클라이언트 (이동 · 시야)","7일","30일","영구","—"],["사냥 레벨 제한 우회","영구 정지","—","—","버그 악용이라 2장 적용"]]}}]},{"h":"4. 채팅과 대화","blocks":[{"p":"서버 채팅은 디스코드와 연결되어 있습니다. 모든 서버의 게임 채팅 · 확성기가 디스코드 채널 하나에 「서버 | 닉네임: 내용」으로 함께 올라가고, 한 번 쓴 말은 양쪽에 남습니다."},{"list":["욕설 · 비하 · 모욕 · 성적인 표현 금지","성별 · 지역 · 인종 · 장애 · 종교 · 성적 지향에 대한 차별 발언 금지","특정 사람을 향한 반복적인 괴롭힘 · 조롱 · 저격 금지","정치 · 종교 논쟁 금지","다른 서버 홍보 금지 (주소 · 이름 · 초대 링크 · \"다른 데 가자\" 유도 모두)","도배 · 의미 없는 반복 · 과도한 대문자 · 특수문자 금지","확성기는 서버 전체가 듣습니다. 잡담이나 시비에 쓰지 말고, 쿨타임마다 이어 쓰는 것도 도배입니다.","본인 것이든 남의 것이든 실명 · 주소 · 전화번호 · 학교 · 사진 · 금융 정보를 채팅에 쓰지 마세요.","운영자인 척하거나 운영자를 사칭해 아이템 · 비밀번호 · 후원을 요구하지 마세요. **운영진은 어떤 경우에도 비밀번호를 묻지 않습니다.** 누군가 묻는다면 사칭이니 바로 신고하세요.","닉네임 · 칭호 · 마을 이름 · 상점 이름 · 펫 이름에 욕설 · 성적 표현 · 차별 표현 · 운영자 사칭 · 다른 서버 홍보가 들어가면 강제로 바뀌며 변경권은 주지 않습니다."]},{"table":{"cols":["위반","1차","2차","3차"],"rows":[["욕설 · 비하","채팅 금지 1시간","채팅 금지 24시간","7일 정지"],["차별 발언","채팅 금지 24시간","7일 정지","30일 정지"],["지속적인 괴롭힘 · 저격","3일 정지","7일 정지","30일 정지"],["다른 서버 광고","채팅 금지 24시간","7일 정지","영구 정지"],["채팅 도배","채팅 금지 1시간","채팅 금지 24시간","7일 정지"],["확성기 남용","채팅 금지 24시간","채팅 금지 7일","채팅 금지 30일"],["정치 · 종교 논쟁","경고 (양쪽 모두)","채팅 금지 24시간","7일 정지"],["개인정보 유포","영구 정지","—","—"],["운영자 사칭","7일 정지","영구 정지","—"],["부적절한 이름","강제 변경 + 경고","3일 정지","7일 정지"]]}},{"list":["채팅 금지를 받으면 확성기도 함께 막힙니다.","욕설이 지나치게 심하면 1차에서 바로 정지될 수 있습니다.","운영자를 사칭해 아이템이나 비밀번호를 요구했다면 1차에서 영구 정지입니다."]}]},{"h":"5. 마을과 건축","blocks":[{"list":["**알박기 금지.** 남의 마을 바로 옆에 쓰지도 않을 청크를 잡아 확장을 막는 행위입니다. \"먼저 잡았다\"는 이유가 되지 않으며, 실제로 쓰는 마을이 우선입니다.","마을 초대는 신중히 하세요. 마을장은 마을 안에서 일어난 일에 책임이 있습니다. 초대해서 건물을 짓게 한 뒤 내쫓고 차지하는 것은 사기입니다.","마을원 사이의 다툼은 원칙적으로 당사자끼리 해결합니다. 운영진은 명백한 사기가 있을 때만 개입합니다.","마을 PvP 설정은 마을장이 정합니다. 남의 마을에서는 그 마을 규칙을 따르세요.","**야생은 마음껏 파헤쳐도 됩니다.** 야생은 주기적으로 초기화되므로 구조물을 부수든 지형을 갈아엎든 괜찮습니다. 그 대신 야생에 중요한 물건이나 건물을 두지 마세요 — 초기화되면 복구해 드릴 수 없습니다. 보관은 마을에 하세요.","야생이든 어디든 금지: 용암 붓기 · 용암풀 만들기, 불 지르기, 함정(구덩이 · 숨긴 낙하 · 압력판 폭발 · 길목 막기), 렉 유발 장치(대량 호퍼 · 대규모 몹 농장 · 무한 회로 · 아이템 대량 방치)."]},{"table":{"cols":["위반","1차","2차","3차","함께 하는 조치"],"rows":[["알박기","경고 + 청크 강제 해제","3일 정지","7일 정지","—"],["마을 초대 악용 (추방 후 탈취)","7일 정지","30일 정지","영구 정지","피해자에게 원래대로. 사기로 볼 수 있으면 2장 적용(영구)"],["용암 · 불 · 함정 설치","경고 + 철거","3일 정지","7일 정지","피해를 입혔으면 피해자에게 원래대로"],["렉 유발 장치","경고 + 철거","3일 정지","7일 정지","고의로 반복하면 30일"]]}},{"p":"렉 유발 장치와 용암 · 불 · 함정은 예고 없이 철거될 수 있습니다. 야생 구조물을 부수는 것 자체는 제재 대상이 아닙니다."}]},{"h":"6. PvP","blocks":[{"p":"이 서버는 죽어도 아이템을 잃지 않습니다. 그래서 PvP 로 남의 물건을 뺏을 수는 없지만, 괴롭히는 데 쓸 수는 있습니다."},{"list":["마을 PvP 설정을 존중하세요. 꺼져 있는 마을에서는 화살 같은 발사체 피해도 들어가지 않습니다. 우회해 때리려 하지 마세요.","반복 살해 · 스폰 캠핑 금지. 상대가 그만하자고 하면 그만해야 합니다 ot":{"id":"상점-NPC-대표","need":"광부 키레이에게 말을 걸어 광물 상점 창을 연 화면"},"rows":[["광물","광부 키레이"],["농작물 · 씨앗","농부 미반"],["물고기","낚시꾼 프쉰"],["원목 · 묘목","나무꾼 도르반 ([벌목](#life-logging))"],["단계 하락 방지권","대장장이 루이흐 (6,000원)"],["재련대","대장장이 루이흐 (500,000원)"],["하루 판매 한도","분류마다 100만 원(Lv1) → 500만 원(Lv1000)"],["어디서나","MVP `/상점`"],["위치","[아르덴](#arden)"]]},"sections":[{"h":"파는 법","blocks":[{"list":["NPC에게 말을 걸고 대화에서 상점을 고르면 상점 창이 열립니다.","창에서 팔 물건 칸을 **우클릭하면 1개**, **쉬프트+클릭하면 가진 만큼 한 번에** 팝니다.","인벤토리에 있는 **완전히 같은 아이템**만 팔립니다. 이름이나 설명이 다른 물건은 같은 종류여도 따로 봅니다.","MVP 멤버십이 있으면 `/상점` 으로 어디서든 광물 · 농작물 · 대장장이 · 잼 · 마일리지 상점을 엽니다 (가구 상점은 로비에서만)."]},{"p":"광물 · 농작물 · 물고기 · 나무를 팔 때 받는 돈은 아래와 같이 정해집니다."},{"table":{"cols":["분류","받는 돈","하루 판매 한도 기준"],"rows":[["광물","표의 값 × 4 × 광질 레벨 배율 (Lv1 ×1 → Lv1000 ×1.5)","광질 레벨"],["농작물","표의 값 × 10 × 농사 레벨 배율 (Lv1 ×1 → Lv1000 ×1.5)","농사 레벨"],["물고기","기준가 × 크기 · 변이 배율 × 10 × 낚시 레벨 배율 (Lv1 ×1 → Lv1000 ×3)","낚시 레벨"],["나무","표의 값 × 10 × 벌목 레벨 배율 (Lv1 ×1 → Lv1000 ×1.5)","벌목 레벨"]]}},{"note":{"b":"하루 판매 한도","t":"네 분류는 따로 셉니다. 한도는 직업 레벨에 따라 Lv1 100만 원에서 Lv1000 500만 원까지 늘고, 한도까지는 제값, 넘은 부분은 25%만 받습니다. 판매가 막히지는 않습니다. 매일 오전 6시에 초기화되고, 내 한도와 남은 금액은 상점 창 가운데 위 정보 칸에 나옵니다. 무역상인 나가 · 트로피 판매는 따로입니다."}}]},{"h":"광물 상점 (광부 키레이)","blocks":[{"table":{"cols":["광물","Lv1 받는 돈 (×4)"],"rows":[["석탄","20원"],["구리 주괴","24원"],["레드스톤 가루","24원"],["청금석","24원"],["네더 석영","24원"],["철 주괴","60원"],["금 주괴","120원"],["에메랄드","240원"],["다이아몬드","800원"],["네더라이트 주괴","8,000원"],["루비","14,000원"],["설파이트","22,000원"],["히룸","34,000원"]],"num":[1]}},{"p":"광질 레벨이 오를수록 더 받아 Lv1000에는 위 값의 1.5배입니다 (Lv100 약 ×1.06 · Lv300 약 ×1.17 · Lv500 약 ×1.27)."},{"p":"루비 · 설파이트 · 히룸은 [코자 대륙](#koza) 깊은 곳에서만 나는 광물입니다. 희귀도는 네더라이트 < 루비 < 설파이트 < 히룸 순입니다. 강화 재료로도 쓰니 팔기 전에 [강화](#growth-enhance)에 얼마나 필요한지 확인하세요."}]},{"h":"물고기 상점 (낚시꾼 프쉰)","blocks":[{"p":"아래는 **기준가**입니다. 실제로 받는 돈은 기준가에 크기 배율(최대 크기면 3배) · 변이 배율(2.5~5배)을 곱하고, 다시 물고기 분류 배율 ×10와 낚시 레벨 배율을 곱한 값입니다. 자동 낚시로 잡은 물고기는 ×0.25 입니다. 물고기 설명에 판매가가 적혀 나옵니다. 자세한 것은 [낚시](#life-fishing)."},{"table":{"cols":["어종","등급","크 )은 거래할 수 없고, 활동으로 얻거나 게임 돈(1개 50,000원 · 하루 20개) · [잼 상점](#shop-gem) 「근원」 쪽에서 삽니다. 쿠폰 입력은 [돈 · 잼 · 마일리지](#shop-currency) 문서에 있습니다."}}]},{"h":"처음 돈 벌기","blocks":[{"p":"처음에는 [기초 길라잡이](#quest-guide) 보상(끝까지 124,500원)과 광물 · 물고기 판매로 시작합니다. 어느 정도 익숙해지면 요리를 만들어 [무역상인 나가](#life-trade)에게 파는 것이 가장 큰 반복 수입원입니다. 자세한 것은 [돈 버는 법](#life-money)을 보세요."}]}]},"start-controls":{"id":"start-controls","parent":"start","title":"조작키 · 기본 화면","short":"Shift+F 메인 메뉴, NPC 대화 숫자키, 스킬북 Q, 콘텐츠별 조작과 화면 표시(HUD).","color":"var(--accent)","tags":[["Shift + F 메뉴","lv"],["스킬 5트리거",null],["HUD",null]],"lede":"코자 온라인은 마인크래프트 기본 키를 그대로 쓰면서 몇 가지 키에 기능을 더했습니다. 가장 많이 쓰는 것은 [메인 메뉴](#conv-menu)를 여는 Shift + F 입니다. 손에 무엇을 들었느냐에 따라 같은 키가 다른 일을 하기도 하니, 아래 표에서 「손에 든 것」을 함께 보세요.","info":{"title":"꼭 알아둘 키","slot":{"id":"시작-조작-대표","need":"기본 화면 전체 — 왼쪽 위 돈 표시, 오른쪽 위 퀘스트 표시가 함께 보이게"},"rows":[["메인 메뉴","Shift + F"],["NPC 대화 고르기","숫자키 (다음 대사는 1)"],["스킬 장착 창","[스킬북](#growth-skillbook)을 들고 Q"],["스킬 쓰기","스킬북을 들고 클릭 · 쉬프트 조합"],["채집","괭이를 들고 우클릭"],["낚시 감기","입질 뒤 웅크리기(Shift) 누르기"],["농사 설정","괭이를 들고 F"],["동물 포획","올가미를 들고 동물 우클릭"]]},"sections":[{"h":"메인 메뉴 (Shift + F)","blocks":[{"p":"Shift 를 누른 채 F(손 바꾸기 키)를 누르면 메인 메뉴가 **한 화면**으로 열립니다. 카드 24장이 모여 있어 쪽을 넘길 필요 없이 카드를 누르면 바로 그 창이 열리고, 카드에 마우스를 올리면 설명이 나옵니다. 위쪽에는 내 이름 · 직업 레벨 · 마을 · 재화 같은 정보가 함께 보입니다."},{"chips":["NPC 안내","로비","마을","사냥터 이동","가방","펫","퀘스트","의뢰 게시판","진급","근원","룬","전투력","도전과제","도감","칭호","박물관","시즌패스","서버 추천","이모트","데미지 스킨","검기 스킨","활 스킨","후원","위키"]},{"list":["화면 아래 단추 4개는 **우편함 · 개인 설정 · [접속 보상](#conv-menu~1) · 휴지통**입니다. 접속 보상 창에서 오늘 접속 시간과 1 · 2 · 3 · 5 · 8시간 단계 보상을 받습니다.","메뉴에서 연 화면의 ◀ 단추를 누르면 메인 메뉴로 돌아옵니다. 메뉴에서 연 상자 창(상점 등)은 ESC 로 닫으면 메인 메뉴가 다시 열립니다.","「NPC 안내」는 아르덴 지도에 NPC 자리를 보여 주고, 목록에서 NPC 를 누르면 그 사람까지 [길안내](#conv-move~7)가 켜집니다. 「길안내 멈추기」 단추로 끕니다.","「마을」 카드를 누르면 「내 마을」(내 마을로 이동)과 「랜덤 이동」(마을 서버의 무작위 위치로 이동) 중에 고릅니다.","「퀘스트」 카드에서는 [길라잡이](#quest-guide)와 [일일 퀘스트](#quest-daily)를 고릅니다."]},{"slot":{"id":"시작-조작-메인메뉴","need":"Shift+F 로 연 메인 메뉴 (카드 24장이 한 화면에 보이는 새 메뉴)"}}]},{"h":"스킬 (스킬북)","blocks":[{"p":"스킬은 스킬북에 넣어서 씁니다. 스킬북을 손에 들고 Q(아이템 버리기 키)를 누르면 스킬 장착 창이 열립니다. 스킬북은 버려지지 않습니다. 창에서 원하는 칸으로 스킬 아이템을 끌어다 놓으면 장착되고, 빈 손으로 장착된 칸을 클릭하면 빠집니다. 스킬을 쓸 때마다 [마나](#growth-mana)가 들고, 마나가 모자라면 스킬이 나가지 않습니다."},{"table":{"cols":["칸","스킬북을 든 채 이렇게 하면 발동","열리는 조건"],"rows":[["1","좌클릭","처음부터"],["2","우클릭","처음부터"],["3","쉬프트 + 좌클릭","처음부터"],["4","쉬프트 + 우클릭","스킬북 5강"],["5","쉬프트 빠르게 두 번","스킬북 10강"]]}},{"list":["같은 스킬을 두 칸에 넣을 수는 없습니다.","스킬북은 인벤토리에 1권만 가질 수 있습니다.","스킬북을 들면 핫바 위에 다섯 칸의 아이콘과 남은 대기 시간, 그 스킬에 드는 마나가 보입니다."]},{"links":[["#growth-skillbook","스킬북 · 스킬","스킬 얻는 법과 종류"]]}]},{"h":"손에 든 것에 따라 달라지는 조작","blocks":[{"table":{"cols":["손에 든 것","조작","하는 일"],"rows":[["괭이","채집물에 우클릭","땅 · 바다 [채집](#life-gathering). 게이지가 다 찰 때까지 움직이지 마세요"],["괭이","F","농사 설정 창 (자동 심기 켜기, 단축키 고르기)"],["괭이","쉬프트 + 우클릭","자동 심기 (농사 Lv.300부터, 기본 단축키)"],["강철 낚싯대","입질 뒤 웅크리기 누르고 있기","줄 감기. 손을 떼면 줄이 느슨해집니다. 물고기가 버둥거린다는 표시가 뜨면 잠깐 손을 떼세요 ([낚시](#life-fishing))"],["식칼","우클릭","물고기 손질"],["곡괭이","광석을 캘 때 나타난 빛나는 약점을 때리기","광맥 핵 미니게임 — 성공하면 드롭 2배, 완벽하면 3배 ([광맥](#life-bonanza))"],["검","공격 게이지가 거의 찼을 때 좌클릭","검기 이펙트가 나가며 앞쪽을 함께 벱니다 ([검기 스킨](#style-slash))"],["네더라이트 검","우클릭 · 쉬프트 + 우클릭 · 쉬프트 + 좌클릭 · 쉬프트 두 번 · 쉬프트 + Q","검 [무기 스킬](#growth-skillbook~8) 5가지. 0 · 2 · 5 · 10 · 15강마다 하나씩 열립니다 ([강화](#growth-enhance))"],["삼지창","좌클릭 · 웅크린 채 던지기 · 쉬프트 + 좌클릭 · 쉬프트 두 번 · 쉬프트 + Q","삼지창 [무기 스킬](#growth-skillbook~10) 5가지. 그냥 던진 삼지창은 자동으로 돌아옵니다"],["네더라이트 창","좌클릭 · 웅크린 채 우클릭 · 쉬프트 + 좌클릭 · 쉬프트 두 번 · 쉬프트 + Q","창 [무기 스킬](#growth-skillbook~11) 5가지 (서서 우클릭은 원래 창 돌격)"],["철퇴","우클릭 · 쉬프트 + 우클릭 · 쉬프트 + 좌클릭 · 쉬프트 두 번 · 쉬프트 + Q","철퇴 [무기 스킬](#growth-skillbook~12) 5가지"],["올가미","동물에 우클릭","동물 포획 미니게임 (오버월드 · 코자 대륙). 성공하면 `/포획창` 내 목장으로 갑니다 ([동물 포획](#life-ranch))"],["잠자리채","곤충에 좌클릭 → 쉬프트","곤충 채집 미니게임 ([곤충](#life-insect))"],["솔","화석 흙블록에 우클릭 → 쉬프트를 누른 채 시점 이동","화석 발굴. 세게 긁으면 보존도가 떨어집니다 ([화석](#life-fossil))"],["아무 도구 · 맨손","코자 대륙에서 보물지도의 X 자리 파기","[보물지도](#life-treasure) 상자 찾기. 펼친 지도를 들고 X에서 48칸 밖이면 액션바에 보물 방향과 거리가 뜹니다"],["서버 경험치 부스터","5초 안에 두 번 우클릭","모든 서버에 직업 경험치 +50% 30분 ([부스터](#growth-booster))"],["트랙터 탑승 중","F","연료 넣는 창"]]}},{"note":{"b":"무기 스킬도 마나","t":"네더라이트 검 · 활 · 삼지창 · 네더라이트 창 · 철퇴의 무기 스킬도 칸마다 [마나](#growth-mana)가 들고, 다섯 번째 칸(궁극기)은 45가 듭니다."}},{"table":{"cols":["상황","조작"],"rows":[["상점 창에서 팔기","우클릭 = 1개, 쉬프트 + 우클릭 = 가진 만큼 전부"],["상자 감정 · 자물쇠 따기","핀이 초록 칸에 올 때 웅크리기를 톡 누르기"],["상자 감정 · 금고 다이얼","마우스 휠로 돌리고 웅크리기로 확정 (20초 안에 3자리). 휠을 돌려도 손에 든 칸은 바뀌지 않습니다"],["채팅에 아이템 자랑","채팅에 `[i]` 를 넣으면 손에 든 아이템이 표시됩니다"],["NPC 대화창","숫자키 1 · 2 · 3 으로 선택지 고르기 · 다음 대사는 숫자키 1"]]}}]},{"h":"기본 화면 (HUD)","blocks":[{"table":{"cols":["위치","보이는 것"],"rows":[["왼쪽 위","돈(원) · [잼](#start-glossary~2) · [마일리지](#start-glossary~2) · [근원](#growth-origin)이 세로로 표시됩니다"],["오른쪽 위","지금 진행 중인 퀘스트 이름 · 진행도 · 설명과 포기 방법(「퀘스트 포기: /퀘스트포기」, 기초 길라잡이는 안 나옴), 그 아래 [멤버십](#shop-membership) 등급과 남은 날짜"],["오른쪽 위 퀘스트 아래","포션 효과 아이콘"],["화면 아래 가운데 (액션바 바로 위)","알림 띠 — 판매 완료 · 돈 부족 같은 알림 (초록 · 파랑 · 빨강)"],["화면 아래 (체력 막대 옆)","[마나](#growth-mana) 막대 — 지금 마나 / 최대 마나. 체력 · 갑옷 · 배고픔 · 숨 막대 옆에는 그 막대를 알려 주는 작은 그림(하트 · 갑옷 · 배고픔 · 숨 방울)이 붙어 있습니다"],["핫바 오른쪽","직업 도구(괭이 · 낚싯대 · 곡괭이 · 검)를 들면 그 직업의 레벨 · 경험치 게이지 · 2배 드롭 · 보너스 · 회피 확률. 사냥은 [사냥 레벨](#growth-jobs~2)로 오른 최대 체력 · 몬스터 피해도 보입니다"],["핫바 왼쪽 (왼손 칸 옆)","「전투력 : 숫자」 — 지금 장비 · 스킬북 · 사냥 레벨로 계산한 내 전투력. `/전투력` 으로 자세히 보고 순위도 봅니다 ([전투력](#growth-power))"],["핫바 위","스킬북을 들면 스킬 다섯 칸과 대기 시간 · 드는 마나"],["핫바 위 (대화 중)","NPC 대화창. 선택지가 대화창 오른쪽 위에 차례로 나오고 왼쪽에 번호가 붙습니다. 숫자키로 고르고, 다음 대사는 숫자키 1 로 넘깁니다. 대화하는 동안에는 스킬 · 직업 표시가 잠시 숨겨졌다가 대화가 끝나면 돌아옵니다"],["몬스터 머리 위","이름과 체력 바 · 체력 숫자"],["던전 보스전","화면 위 보스 이름 · 체력 바 · 남은 시간"],["액션바 (핫바 바로 위 글자)","길안내 남은 거리, 사냥 레벨이 모자랄 때 피해 배율"]]}},{"slot":{"id":"새-npc대화창","need":"NPC 대화창 — 오른쪽 위에 번호 붙은 선택지가 쌓여 있는 화면"}},{"slot":{"id":"시작-조작-직업HUD","need":"괭이를 들었을 때 핫바 오른쪽에 뜨는 직업 레벨 · 경험치 판"}},{"list":["알림을 띠로 볼지, 띠와 채팅으로 같이 볼지, 채팅으로만 볼지는 `/알림 배너` · `/알림 같이` · `/알림 채팅` 으로 바꿉니다.","길안내가 켜지면 목적지 쪽 화살표와 바닥에 빛나는 길이 나타납니다. 목적지가 다른 서버에 있으면 그 서버로 갈 때까지 화면 가운데에 「길안내 중 · ○○ 서버로 가세요」가 떠 있고, 그 서버로 가는 순간 다시 이어집니다. 길안내를 끄려면 `/길안내 중지` 를 입력하거나 메인 메뉴 「NPC 안내」의 「길안내 멈추기」를 누릅니다.","경험치 바 자리에 뜨던 바닐라 위치 표시줄(다른 플레이어 방향 점)은 꺼 두었습니다. Tab 접속자 목록은 운영진 → 멤버십 등급 순서로 정렬됩니다.","화면 표시가 겹쳐 보이면 GUI 비율을 2로 맞추고, 리소스팩을 받았는지 확인하세요."]},{"links":[["#conv-menu","메인 메뉴","카드별 기능 자세히"],["#conv-settings","개인설정","자동 줍기 · 채팅 채널 · 네임태그"],["#conv-commands","명령어 모음","플레이어 명령어 전체"]]}]}],"search":[["Shift+F","조작키"],["쉬프트 F","조작키"],["단축키","조작키"],["/메뉴","명령어"],["Q키","스킬북"],["HUD","기본 화면"],["/알림","명령어"],["숫자키","조작키"],["대화 선택지","조작키"],["마나 막대","기본 화면"],["올가미","조작키"]]},"start-faq":{"id":"start-faq","parent":"start","title":"자주 묻는 질문","short":"죽으면? 아이템은? 돈은 어떻게? 리소스팩은? 처음 생기는 궁금증.","color":"var(--accent)","tags":[["FAQ","lv"],["처음 온 분",null]],"lede":"처음 온 분들이 자주 묻는 것을 모았습니다. 답이 짧은 것은 여기서 끝내고, 자세한 내용은 연결된 문서로 이어 두었습니다.","info":{"title":"자주 묻는 질문","slot":{"id":"시작-질문-대표","need":"아르덴 마을에서 여러 플레이어가 모여 있는 장면"},"rows":[["죽으면","로비([아르덴](#arden))에서 부활"],["아이템","죽어도 안 떨어짐"],["첫 돈","[기초 길라잡이](#start-guide-basic) 124,500원 · 근원 108"],["리소스팩","필수 · 디스코드에서 `CZ_V<번호>_RP.zip` 받기 또는 접속 때 받기"],["못 받은 보상","`/우편함`"],["퀘스트 포기","`/퀘스트포기` (기초 길라잡이 빼고)"]]},"sections":[{"h":"죽음 · 아이템","blocks":[{"cards":[{"h":"죽으면 어떻게 되나요?","p":"어느 서버에서 죽어도 로비(아르덴)에서 다시 일어납니다. 침대나 리스폰 정박기를 설정해 두어도 로비로 갑니다. [던전 서버](#world-dungeon-server) 안에서는 던전의 목숨 규칙을 따릅니다."},{"h":"죽으면 아이템을 잃나요?","p":"아니요. 모든 서버에서 죽어도 인벤토리와 경험치가 그대로 남습니다. 다른 플레이어가 내 물건을 주워 갈 일도 없습니다."},{"h":"떨어지면 다치나요?","p":"[이프란 대륙](#world)(마을 6곳과 사냥터)에서는 낙하 피해가 없습니다. 마을 서버와 야생(오버월드 1 · 2 · 3), 코자 대륙에서도 낙하 피해가 없고, 네더와 던전 서버에서는 보통처럼 다칩니다."},{"h":"인벤토리가 꽉 차서 보상을 못 받았어요","p":"`/우편함` 을 열면 받지 못한 보상이 쌓여 있습니다. 메인 메뉴 아래 우편함 단추로도 열 수 있습니다. 모든 서버가 같은 우편함을 씁니다."},{"h":"장비 내구도가 다 닳으면 부서지나요?","p":"아니요. 내구도가 다 닳아도 부서지지 않고 1에서 멈춥니다. 1인 동안은 그 장비를 쓸 수 없으니(갑옷은 입어도 능력치가 없음) [수리 보석](#growth-enhance~7)이나 `/수리` 로 고치세요."},{"h":"체력을 채우면 배고픔이 너무 빨리 줄어요","p":"자연회복에 드는 배고픔은 최대 체력에 비례해 줄어듭니다. 최대 체력 180이면 체력 10%를 채우는 데 배고픔 약 1.5칸이고, 빈 체력을 다 채워도 배고픔 바 1.5개(포만감 포함)면 됩니다. 회복 속도는 그대로라 싸우는 중에는 포션 · 흡혈로 채우세요. → [전투](#combat)"}]}]},{"h":"돈 · 성장","blocks":[{"cards":[{"h":"처음엔 어떻게 돈을 버나요?","p":"기초 길라잡이를 끝까지 하면 124,500원과 [근원](#growth-origin) 108개가 모입니다. 그다음은 매일 [일일 퀘스트](#quest-daily)(5개 모두 하면 7,000원 + [마일리지](#start-glossary~2) 150 추가), [접속 보상](#conv-menu~1)(그날 1 · 2 · 3 · 5 · 8시간째), 요리를 만들어 [무역상인 나가](#life-trade)에게 파는 것이 기본입니다. → [돈 버는 법](#life-money)"},{"h":"물건은 어디서 파나요?","p":"아르덴의 NPC에게 팝니다. 광물은 광부 키레이, 농작물은 농부 미반, 물고기는 낚시꾼 프쉰, 요리는 무역상인 나가가 삽니다. 왕관 트로피와 현상수배 머리는 순찰대장 가레스, 화석과 운석은 키레이, 곤충은 곤충 수집가 모스에게 팝니다."},{"h":"강화는 어디서 하나요?","p":"아르덴의 대장장이 루이흐입니다. 네더라이트 갑옷 · 검, 활, 스킬북은 30강까지, 곡괭이 · 도끼 · 괭이 · 강철 낚싯대 · 식칼은 20강까지 올립니다. 강화 1단계마다 최대 내구도도 원래 내구도의 5%씩 늘어납니다 (30강이면 2.5배, 내구도 있는 장비만). 21강부터는 시도마다 [근원](#growth-origin)과 해방의 쐐기도 듭니다. 강화는 아르덴에서만 합니다. → [강화](#growth-enhance)"},{"h":"사냥 레벨이 모자라면요?","p":"몬스터마다 [사냥 레벨](#growth-jobs~2)이 있어서, 내 사냥 레벨이 몬스터 레벨보다 10 넘게 낮으면 주는 피해가 70% 아래로 줄고 경험치와 전리품을 받지 못합니다. 사냥 레벨이 오르면 최대 체력(레벨당 +1)과 몬스터에게 주는 피해(레벨당 +0.3%)도 늘어납니다. → [사냥 구역 제한](#growth-region-gate)"},{"h":"다른 마을로는 어떻게 가나요?","p":"마을마다 있는 비석을 우클릭합니다. 아르덴만 처음부터 열려 있고, 다른 마을은 한 번 직접 걸어가서 그 마을 비석을 우클릭해야 열립니다. 사냥터는 `/사냥터` 로 바로 갈 수 있습니다."},{"h":"코자 대륙은 언제 가나요?","p":"네더라이트 장비 9종(투구 · 흉갑 · 레깅스 · 부츠 · 검 · 곡괭이 · 괭이 · 도끼 · 삽)을 모두 갖추고 이장 실바에게 말을 걸면 포탈을 받을 수 있습니다. → [코자 대륙](#koza)"},{"h":"빙하 점액 · 드래곤 이빨은 어디서 나오나요?","p":"빙하 점액은 네더 구조물 상자, 드래곤 이빨 · 잠식된 심장은 코자 대륙 구조물 상자에서 나옵니다. 가지고 있는 옛 던전 보상 상자는 지금도 열 수 있습니다."},{"h":"룬은 무엇인가요?","p":"[룬](#growth-rune)은 능력치를 새기는 돌입니다. 생명 · 힘 · 방어 · 치명타 룬(1~8성)을 종류마다 1개씩 끼웁니다. 마법사 후를루카나 메인 메뉴 「룬」 · `/룬` 에서 뽑고(1회 100,000원) 같은 성 4개를 합쳐 올립니다. 룬은 거래할 수 없습니다."},{"h":"근원은 어디서 얻나요?","p":"퀘스트 보상, 의뢰 납품(쉬움 2 · 보통 3 · 어려움 5), 지역 보스 처치, 구조물 정복, 도전과제 보상 같은 활동에서 조금씩 모입니다. 게임 돈으로도 하루 20개까지(1개 50,000원) 살 수 있고 거래는 안 됩니다. `/근원` 의 「근원 얻는 곳」에 모두 나옵니다. → [근원](#growth-origin)"},{"h":"스킬이 안 나가요 (마나 부족)","p":"스킬마다 [마나](#growth-mana)가 듭니다. 기본 최대 마나는 100이고 1초에 4씩 차며, 3초 동안 스킬을 안 쓰면 2배로 찹니다. 투구 · 흉갑 강화로 최대 마나, 각반 · 부츠 강화로 마나 회복을 늘립니다."},{"h":"동물은 어떻게 기르나요?","p":"튜토리얼에서 받은 올가미로 오버월드 · 코자 대륙의 동물을 잡아 `/포획창` 에서 기릅니다. 잡은 동물은 20분마다 고기 · 가죽 같은 전리품을 쌓고(최대 12시간치), 마을에는 동물이 저절로 생기지 않습니다. → [동물 포획](#life-ranch)"}]}]},{"h":"퀘스트","blocks":[{"cards":[{"h":"퀘스트를 여러 개 받을 수 있나요?","p":"한 번에 1개만 진행합니다. 메인 스토리를 하는 동안에는 사이드 퀘스트를 받을 수 없습니다. 메인과 심화 길라잡이는 [길라잡이 화면](#quest-guide)에서 라인을 잠시 접고 갈아탈 수 있습니다."},{"h":"퀘스트를 그만두고 싶어요","p":"`/퀘스트포기` (또는 `/퀘스트 포기`)로 지금 퀘스트를 언제든 내려놓을 수 있습니다. **기초 길라잡이만** 포기할 수 없습니다. 포기한 퀘스트는 완료 기록이 남지 않아 다시 받을 수 있고, 메인 스토리 · 심화 길라잡이는 다시 받으면 안 깬 가장 앞 단계부터 이어서 줍니다. 건너뛸 수 있게 만든 단계(파티 가입 등)는 `/퀘스트스킵` 으로 넘깁니다."},{"h":"어디로 가야 할지 모르겠어요","p":"NPC를 찾아가는 퀘스트는 화살표와 바닥 길이 자동으로 켜집니다. 화면 오른쪽 위 퀘스트 설명에 장소가 적혀 있습니다."},{"h":"일일 퀘스트는 언제 바뀌나요?","p":"매일 자정에 5개가 새로 나옵니다. 구조물 상자 감정과 서버 추천 2개는 매일 고정이고 나머지 3개가 바뀝니다. → [일일 퀘스트](#quest-daily)"},{"h":"메인 스토리 · 심화를 안 줘요","p":"[기초 길라잡이](#start-guide-basic) 36단계를 모두 마쳐야 이장 실바 · 기록관 이엔나가 메인 스토리와 심화 길라잡이를 줍니다. 길라잡이 화면에서 기초 카드의 남은 단계를 확인하세요."},{"h":"기초 길라잡이에 새 단계가 생겼어요","p":"기초를 이미 다 마친 사람은 새로 추가된 단계가 접속할 때 보상 없이 완료로 채워집니다. 다시 할 필요가 없습니다."}]}]},{"h":"접속 · 화면","blocks":[{"cards":[{"h":"리소스팩을 꼭 받아야 하나요?","p":"네. 전용 리소스팩이 있어야 플레이할 수 있습니다. 디스코드 리소스팩 채널에서 번호가 가장 큰 `CZ_V<번호>_RP.zip` 을 받아 **옵션 → 리소스 팩 → 팩 폴더 열기**에 넣고 켜 두면 접속할 때 기다리지 않고 바로 들어갑니다. 넣는 방법은 안내 영상(`youtu.be/63TcdAfnqGE`)에 있습니다. 넣지 않았으면 접속할 때 팩 검사에서 「받기」를 눌러 서버가 보내는 팩을 받으면 됩니다. → [첫날 가이드](#start-first-day~1)"},{"h":"접속하자마자 그림 맞히기 창이 떠요","p":"리소스팩을 확인하는 팩 검사입니다. 큰 그림과 같은 그림의 번호 버튼을 3번 고르면 됩니다. 큰 그림만 하얀 네모로 보이면 옛 팩이니 「큰 그림만 하얀 네모로 보여요」를 누르고 디스코드에서 최신 번호의 팩을 받아 넣으세요. 그림이 보라 · 검정으로 깨져 보이면 팩이 없는 것이니 「그림이 보라 · 검정으로 깨져 보여요」 → 「받기」를 누릅니다."},{"h":"메뉴나 글자가 겹쳐 보여요","p":"마인크래프트 설정에서 GUI 비율을 2로 맞춰 보세요. 서버의 메뉴와 화면 표시는 GUI 비율 2에 맞춰 그려져 있습니다. 리소스팩을 받지 않았을 때도 깨져 보입니다."},{"h":"메뉴는 어떻게 여나요?","p":"Shift + F 입니다. 카드 24장이 한 화면에 모여 있습니다. → [조작키 · 기본 화면](#start-controls)"},{"h":"홈은 어디에 몇 개 저장하나요?","p":"야생 · 코자 대륙 · 마을 서버에서 `/셋홈 이름` 으로 저장합니다. 로비와 던전 서버에서는 안 됩니다. 처음엔 1개이고 [진급](#growth-rank) 등급이 오를 때마다 늘어 최대 6개입니다."},{"h":"주민과 거래가 안 돼요","p":"모든 서버에서 주민(마을 사람) 거래가 막혀 있습니다. 물건은 아르덴의 NPC 상점이나 [유저 상점](#shop-usershop)에서 사고팝니다."},{"h":"NPC 대화에서 답은 어떻게 고르나요?","p":"대화창 오른쪽 위에 번호가 붙은 선택지가 나옵니다. 숫자키로 고르고, 다음 대사로 넘길 때는 숫자키 1 을 누릅니다."},{"h":"서버가 꽉 찼다고 나와요","p":"한 번에 60명까지 들어올 수 있습니다. [VIP · MVP 멤버십](#shop-membership)이 있으면 꽉 차도 들어올 수 있습니다."},{"h":"쿠폰은 어디에 입력하나요?","p":"채팅에 `/쿠폰 <코드>` 를 입력합니다. 쿠폰마다 한 사람 한 번만 받을 수 있고 쓸 수 있는 기간이 있습니다. 디스코드나 영상에서 새로운 쿠폰이 자주 나오니 꼭 확인하세요."}]}]},{"h":"규칙에 관한 질문","blocks":[{"cards":[{"h":"잠수해도 되나요?","p":"됩니다. 시간에 상관없이 허용되고, 잠수 중에도 접속 보상을 받습니다."},{"h":"매크로를 써도 되나요?","p":"매크로와 오토클릭은 금지입니다. 다만 서버에 있는 자동 기능(자동 낚시 · 자동 줍기 · 자동 심기, 멀티채굴 · 넓은낫질 램프)은 써도 됩니다."},{"h":"야생에서 땅을 파괴해도 되나요?","p":"됩니다. 다만 용암 붓기, 불 지르기, 함정, 렉을 일으키는 장치는 금지입니다. → [규칙](#rules)"},{"h":"후원은 어떻게 하나요?","p":"게임 안에서 `/후원하기` 를 입력해 안내를 확인하세요. 후원하면 잼이 들어옵니다. → [후원](#shop-donate)"}]}]}],"search":[["죽으면","자주 묻는 질문"],["아이템 유지","자주 묻는 질문"],["리소스팩","자주 묻는 질문"],["우편함","자주 묻는 질문"],["잠수","규칙"],["매크로","규칙"],["빙하 점액","자주 묻는 질문"],["내구도","자주 묻는 질문"],["팩 검사","자주 묻는 질문"],["그림 맞히기","자주 묻는 질문"],["퀘스트 포기","자주 묻는 질문"],["퀘스트포기","자주 묻는 질문"],["쿠폰","자주 묻는 질문"],["룬","자주 묻는 질문"],["근원","자주 묻는 질문"],["마나","자주 묻는 질문"],["포획","자주 묻는 질문"],["정원","자주 묻는 질문"],["서버 꽉 참","자주 묻는 질문"],["숫자키","자주 묻는 질문"],["하얀 네모","자주 묻는 질문"]]},"start-first-day":{"id":"start-first-day","parent":"start","title":"첫날 가이드","short":"처음 온 분의 출발점. 리소스팩 · 시야 → 튜토리얼 → 기초 길라잡이 → 졸업 → 다음 할 일.","color":"var(--accent)","tags":[["처음 온 분의 출발점","lv"],["기초 길라잡이 36단계",null],["돈 124,500원 · 근원 108",null]],"lede":"처음 온 분은 이 문서 하나를 위에서부터 따라오면 됩니다. 순서는 **리소스팩 · 시야 → 튜토리얼 → 기초 길라잡이 → 졸업 → 다음 할 일**입니다. 따라가다 보면 [야생](#world-wild) → [아르덴](#arden) → [마을 서버](#start-glossary~0)를 한 번씩 오가며 채굴 · 사냥 · 낚시 · 채집 · 요리 · 구조물 [상자 감정](#life-appraisal) · [동물 포획](#life-ranch) · [룬](#growth-rune)을 모두 해 보게 되고, 기초 길라잡이 36단계를 마치면 돈 124,500원 · [근원](#growth-origin) 108개와 졸업 선물 상자가 남습니다. 단계마다 더 자세한 표는 [튜토리얼](#start-tutorial) · [기초 길라잡이](#start-guide-basic) 문서에, 모르는 말은 [용어집](#start-glossary)에 있습니다.","info":{"title":"첫날 한눈에","slot":{"id":"시작-첫날-대표","need":"야생에서 철 갑옷을 입고 첫 나무를 캐는 장면"},"rows":[["1. 리소스팩 · 시야","디스코드에서 `CZ_V<번호>_RP.zip` 받기 · 팩 검사"],["2. 튜토리얼","아르덴 · 약 5분"],["3. 기초 길라잡이","01~21 기본기 · 88,000원"],["4. 졸업 · 경제 배우기","22 졸업 · 23~33 36,500원"],["5. 다음 할 일","메인 스토리 · 심화 길라잡이"],["받는 돈","124,500원 + 근원 108 (+ 일일 퀘스트 · 접속 보상)"]]},"sections":[{"h":"접속 전에","blocks":[{"list":["코자 온라인은 **전용 리소스팩**이 있어야 플레이할 수 있습니다. 접속하기 전에 디스코드에서 최신 리소스팩을 받아 넣어 두면 기다리지 않고 바로 들어갑니다 (아래 「리소스팩 받기 · 팩 검사」).","마인크래프트 설정에서 GUI 비율을 2로 맞춰 두면 메뉴와 화면 표시가 가장 잘 보입니다."]}]},{"h":"리소스팩 받기 · 팩 검사","blocks":[{"p":"리소스팩은 두 가지 방법으로 넣습니다. 디스코드에서 미리 받아 넣어 두는 쪽이 빠르고, 넣지 않았으면 접속할 때 서버가 보내 줍니다. 넣는 방법은 리소스팩 안내 영상(`youtu.be/63TcdAfnqGE`)에도 있습니다."},{"steps":[{"h":"디스코드에서 받기","p":"코자 온라인 디스코드(`discord.com/invite/fp6VfzezYq`)의 리소스팩 채널에서 최신 리소스팩을 받습니다. 파일 이름은 `CZ_V<번호>_RP.zip` (예: `CZ_V3_RP.zip`)이고, 새 팩이 나올 때마다 번호가 하나씩 올라갑니다. **번호가 가장 큰 것**이 최신입니다."},{"h":"팩 폴더에 넣기","p":"마인크래프트 **옵션 → 리소스 팩 → 팩 폴더 열기**를 누르고, 받은 zip 파일을 압축을 풀지 않고 그대로 넣습니다."},{"h":"켜기","p":"리소스 팩 목록에서 코자 팩을 오른쪽(선택된 팩)으로 옮기고 완료를 누릅니다."},{"h":"접속","p":"서버에 들어오면 팩 검사의 그림 문제가 바로 풀리고 아르덴으로 들어갑니다."}]},{"table":{"cols":["팩 검사","내용"],"rows":[["언제","서버에 처음 들어올 때 (다른 서버로 옮겨 다닐 때는 다시 묻지 않음)"],["문제","「리소스팩 확인」 화면 — 큰 그림과 **같은 그림**의 번호 버튼(4개 중 하나)을 누르기 · 3문제 · 세 문제를 합쳐 60초 안에"],["그림이 이상할 때","「큰 그림만 하얀 네모로 보여요」 → 옛 리소스팩이라 접속이 끊기고 최신 버전 번호(예: V3)를 알려 줌 · 「그림이 보라 · 검정으로 깨져 보여요」 → 리소스팩이 없는 것이라 받기 · 안내 영상 · 나가기 창이 뜸"],["못 풀면","2번 틀리거나 60초가 지나면 받기 · 안내 영상 · 나가기 창이 뜸 → **받기**를 누르면 서버가 리소스팩을 보내 줌 (아무것도 안 고르고 오래 두면 접속 끊김)"],["서버에서 받기","10분 안에 다 받아야 함 · 받는 데 2~4분 걸리고 화면이 멈춘 것처럼 보여도 끄지 말 것 · 넘으면 접속이 끊기니 디스코드에서 받아 넣고 다시 접속"]]}},{"list":["리소스팩을 끼고 있으면 그림이 제대로 보여서 바로 풀립니다. 그림이 깨져 보이면 리소스팩이 없거나 옛 팩입니다.","리소스팩이 새로 나오면 옛 팩으로는 큰 그림이 하얀 네모로 보여 풀리지 않습니다. 디스코드에서 번호가 가장 큰 `CZ_V<번호>_RP.zip` 을 다시 받아 넣으세요.","서버에서 받다가 자꾸 튕기면 런처 설정에서 메모리(RAM)를 4GB 이상으로 올려 보세요.","서버 목록에서 코자 온라인을 「편집」해 **서버 리소스 팩**을 「사용」으로 두세요. 「사용 안 함」이면 서버가 보낸 팩을 받지 못해 접속이 끊깁니다."]}]},{"h":"첫날 순서 — 이대로 따라오세요","blocks":[{"steps":[{"h":"1. 리소스팩 · 시야","p":"위 「리소스팩 받기 · 팩 검사」대로 팩을 넣고 접속합니다. 그다음 화면이 검게 가려지면 GUI 비율을 2로 맞춘 뒤 `/시야` 로 화면 비율을 정합니다."},{"h":"2. 튜토리얼 (아르덴)","p":"아르덴에서 깨어나 [길안내](#start-glossary~1)대로 이장 실바, 대장장이 루이흐, 상점 점원 프루를 만납니다. 루이흐에게 철 갑옷 한 벌과 도구 · 포션 · 강철 낚싯대 · 식칼 · 올가미 같은 기본 장비를 받고, 마지막에 마을 포탈을 우클릭해 야생 맵을 고릅니다. → [진행 순서 · 받는 장비](#start-tutorial)"},{"h":"3. 기초 길라잡이 01~21 (기본기)","p":"야생에서 나무 · 돌 · 석탄 · 다이아몬드를 캐고, 아르덴 마을 주변 길에서 숲의 이끼 토끼를 잡고, 내 마을을 세웁니다. 이어서 채집 · 낚시 · 손질 · 요리 · 포션 · 무역상인 거래 · 상자 감정 · 인첸트를 한 번씩 해 본 뒤 다이아 장비 한 벌을 모읍니다. 다음 장소는 길안내가 계속 알려 줍니다. → [단계별 할 일 · 보상](#start-guide-basic~1)"},{"h":"4. 졸업 (22) · 경제 배우기 (23~33)","p":"이장 실바에게 보고하면 졸업입니다. 「길라잡이 졸업」 글자와 폭죽이 뜨고 [칭호북](#start-glossary~6) 「개척자」와 졸업 선물 상자를 받습니다. 이어서 밀 농사 · 물고기 · 채집 · 요리 · 광물을 직접 만들어 아르덴 NPC에게 팔아 보고, 그 사이에 올가미로 동물을 한 마리 잡고 룬을 하나 장착해 본 뒤 실바에게 돌아가면 돈을 버는 기본 흐름을 다 해 본 것입니다. → [졸업 선물](#start-guide-basic~2) · [23~33 경제 배우기](#start-guide-basic~3)"},{"h":"5. 다음 할 일","p":"메인 스토리나 심화 길라잡이를 고르고, 모은 돈으로 강화를 시작합니다. → [졸업 다음에 할 일](#start-first-day~4)"}]},{"list":["야생에 처음 도착하면 먼저 `/셋홈 집` 으로 홈을 저장해 두세요. 나중에 `/홈` 으로 돌아올 수 있습니다.","아르덴으로 돌아올 때는 Shift + F 메인 메뉴의 「로비」 카드나 `/로비`, 다시 야생으로 나갈 때는 아르덴의 마을 포탈을 씁니다.","내 마을은 메인 메뉴 「마을」 → 「랜덤 이동」으로 마을 서버의 무작위 위치로 가서 빈 땅에 세우거나, 친구 마을에 초대를 받아 들어갑니다. 내 마을 땅은 남이 건드리지 못해 밭과 창고를 두기 좋습니다. → [유저 마을](#conv-town)","`/길라잡이` 를 입력하면 길라잡이 화면이 열려 앞으로 할 일을 미리 볼 수 있습니다.","혼자라면 03 파티 가입은 `/퀘스트스킵` 으로 넘깁니다. 넘겨도 보상은 나옵니다.","다이아 장비는 직접 만들거나 유저 상점에서 사도 됩니다."]}]},{"h":"첫날 들어오는 돈","blocks":[{"table":{"cols":["어디서","얼마","비고"],"num":[1],"rows":[["기초 길라잡이 01~21","88,000원","단계마다 1,500~20,000원"],["기초 길라잡이 23~33","36,500원","단계마다 2,000~4,000원 (24-1 올가미 · 28-2 룬 장착 포함)"],["기초 길라잡이 근원","108개","36단계마다 3개. 강화 21강부터 · 인첸트 해방 · 룬 합성에 쓰는 [근원](#growth-origin)"],["일일 퀘스트 5개 모두 완료","7,000원 + 마일리지 150","개별 퀘스트 보상은 따로. 매일 자정에 새로 나옵니다"],["접속 보상","1시간 1,500원부터","그날 접속 1 · 2 · 3 · 5 · 8시간째에 받습니다. 일반 합계 12,000원, 3시간째부터 아이템도 줍니다"]]}},{"note":{"b":"돈을 아끼려면","t":"포션은 사지 말고 연금술 솥으로 만드세요. 요리는 상점보다 무역상인 나가가 훨씬 비싸게 삽니다. 자세한 건 [돈 버는 법](#life-money)에 있습니다."}}]},{"h":"졸업 다음에 할 일","blocks":[{"cards":[{"h":"메인 스토리","p":"이장 실바에게서 시작해 이프란 여섯 지역을 차례로 돕는 50단계 이야기입니다. 보상은 돈 합계 4,191,000원 · 근원 632개와 랜덤 스킬북 상자입니다.","color":"var(--accent)","chips":["돈 보상","랜덤 스킬북","지역 보스"]},{"h":"심화 길라잡이","p":"「이프란의 생업」 29단계. 의뢰 게시판, 박물관, 양식장, 왕관 몬스터, 화석, 포획창, 룬 뽑기처럼 여러 콘텐츠를 한 번씩 해 봅니다.","color":"var(--gold)","chips":["돈 760,000원","마일리지 6,480","근원 232"]},{"h":"강화 시작","p":"모은 돈으로 아르덴 대장장이 루이흐에게서 장비를 강화합니다. 갑옷 · 검 · 활 · 스킬북은 6강까지는 다이아몬드, 7~9강은 네더라이트 주괴가 들고, 10강부터 루비 · 설파이트 같은 코자 대륙 광물과 지역 보석이 필요합니다. 곡괭이 · 도끼 · 괭이 · 강철 낚싯대 · 식칼은 4강까지 다이아몬드, 5~6강은 네더라이트 주괴, 7강부터 설파이트와 지역 보석이 듭니다. 21강부터는 시도마다 [근원](#growth-origin)과 해방의 쐐기도 듭니다.","color":"var(--r-legend)"},{"h":"사냥 레벨 올리기","p":"아르덴 숲에서 [사냥 레벨](#growth-jobs~2)을 90 넘게 올리면 다음 지역 듄가르드의 사막 유령등(Lv 100)을 제대로 잡을 수 있습니다.","color":"var(--reg-forest)"},{"h":"룬 모으기","p":"[룬](#growth-rune)은 마법사 후를루카나 `/룬` 에서 뽑기(1회 100,000원)로 얻고, 같은 성 4개를 합쳐 한 성 위로 올립니다. 생명 · 힘 · 방어 · 치명타 칸을 하나씩 채워 보세요.","color":"var(--r-epic)"}]},{"links":[["#quest-main","메인 스토리","50단계 · 9장"],["#quest-guide-advanced","심화 길라잡이","이프란의 생업 27단계"],["#quest-daily","일일 퀘스트","매일 5개"],["#arden","아르덴","첫 사냥터와 모든 상점"]]}]}],"search":[["첫날","시작하기"],["뭐부터","시작하기"],["루트","시작하기"],["리소스팩 받기","첫날 가이드"],["팩 검사","첫날 가이드"],["디스코드 리소스팩","첫날 가이드"],["그림 맞히기","첫날 가이드"],["CZ_V","첫날 가이드"],["리소스팩 버전","첫날 가이드"],["리소스팩 영상","첫날 가이드"],["하얀 네모","첫날 가이드"]]},"start-guide-basic":{"id":"start-guide-basic","parent":"start","title":"기초 길라잡이","short":"36단계 할 일과 보상. 끝까지 하면 124,500원 · 근원 108 + 졸업 선물.","color":"var(--gold)","tags":[["36단계 (01~33 + 24-1 · 28-1 · 28-2)","lv"],["돈 124,500원 · 근원 108","lv"],["졸업 칭호 「개척자」",null]],"lede":"[첫날 가이드](#start-first-day) 3 · 4단계(기초 길라잡이 · 졸업)를 단계별 표로 풀어 둔 문서입니다. [튜토리얼](#start-tutorial)이 끝나면 자동으로 시작되는 첫 퀘스트 라인입니다. 한 단계를 끝내면 다음 단계가 바로 이어지고, 화면 오른쪽 위에 지금 할 일과 진행도가 보입니다. 01~21은 채굴 · 사냥 · 낚시 · 요리 · [구조물](#combat-structures) 상자 같은 기본기를 익히며 강화에 도전할 돈을 모으는 구간이고, 22에서 졸업한 뒤 23~33에서 직접 만들어 NPC에게 파는 법과 [동물 포획](#life-ranch) · [룬](#growth-rune)을 배웁니다. 모든 단계가 [근원](#growth-origin) 3개씩을 함께 줍니다.","info":{"title":"기초 길라잡이","slot":{"id":"시작-길라잡이-대표","need":"`/길라잡이` 로 연 길라잡이 목록 창"},"rows":[["단계","36 (한 번에 1개씩 자동 진행)"],["목록 보기","`/길라잡이` · 메인 메뉴 「퀘스트」 → 「길라잡이」"],["01~21 보상","88,000원"],["22 졸업","[칭호북](#start-glossary~6) 「개척자」 + 졸업 선물 상자"],["23~33 보상","36,500원 + 1성 생명 룬"],["근원","단계마다 3개 · 합계 108개"],["포기","안 됨 (기초 길라잡이만)"],["다음","[메인 스토리](#quest-main) 또는 [심화 길라잡이](#quest-guide-advanced)"]]},"sections":[{"h":"진행 방법","blocks":[{"list":["단계를 끝내면 보상이 바로 들어오고 다음 단계가 자동으로 주어집니다. 모든 단계가 돈과 함께 [근원](#growth-origin) 3개를 줍니다.","NPC를 찾아가야 하는 단계는 화면에 화살표와 바닥 길([길안내](#start-glossary~1))이 켜집니다.","`/길라잡이` 를 입력하면 길라잡이 화면이 열립니다. 「기초 길라잡이」 카드를 누르면 단계 목록이 한 쪽에 12줄씩 나오고, 줄에 마우스를 올리면 그 단계 설명이 보입니다. → [길라잡이 화면](#quest-guide~3)","03 파티 가입 · 10 땅 채집 · 12 바다 채집 · 14 감자 그라탕 · 16 무역상인 거래 · 19 상자 감정은 `/퀘스트스킵` 으로 넘길 수 있습니다. 넘겨도 보상은 나옵니다.","기초 길라잡이는 필수라서 `/퀘스트포기` 로 내려놓거나 잠시 접을 수 없습니다. 36단계를 **모두** 마쳐야 [메인 스토리](#quest-main)와 [심화 길라잡이](#quest-guide-advanced)를 받을 수 있습니다.","채굴 · 사냥 · 채집 · 낚시 · 요리 · 연금술 · 농사 단계는 돈과 함께 그 [직업](#growth-jobs)의 경험치(지금 레벨에서 약 5분어치)도 줍니다. 04 첫 사냥 단계는 돈만 줍니다.","아이템을 모으는 단계는 가지고만 있으면 됩니다. 가져가지 않습니다."]},{"note":{"b":"기초를 이미 다 마쳤다면","t":"나중에 기초 길라잡이에 새 단계가 추가되면, 기초를 모두 마친 사람에게는 새 단계가 **보상 없이 완료**로 채워집니다. 접속할 때 채팅으로 「새로 추가된 기초 길라잡이 퀘스트 N개를 완료 처리했습니다」가 뜨고, 메인 · 심화도 그대로 이어서 받을 수 있습니다."}}]},{"h":"01~21 기본기 (강화 도전 자금)","blocks":[{"table":{"cols":["단계","할 일","어디서 · 방법","보상"],"num":[0,3],"rows":[["01","나무 원목 12개 캐기","야생. 어떤 나무든 됩니다","2,000원"],["02","길라잡이 목록 창 열기","`/길라잡이` 입력","1,500원"],["03","파티 가입","`/파티 생성` 으로 만들거나 다른 파티에 들어가기. 혼자라면 `/퀘스트스킵`","3,000원"],["04","숲의 이끼 토끼 5마리 처치","아르덴 마을 주변 길 (`/로비` 또는 Shift + F → 「로비」, 길안내가 사냥터까지 안내)","2,000원"],["05","돌 26개 캐기","곡괭이로 회색 돌","2,500원"],["06","석탄 광석 10개","심층암 석탄도 인정","3,000원"],["07","다이아몬드 광석 5개","철 곡괭이 이상. Y -50 아래에 많습니다","4,000원"],["08","광물 상점 열기","Shift + F → 「로비」로 아르덴에 가서 광부 키레이에게 말 걸기 (길안내)","2,500원"],["09","마을 가입 또는 만들기","마을 서버에서 내 마을을 세우거나 친구 마을 초대 수락 ([유저 마을](#conv-town))","3,500원"],["10","땅 채집 3번","아르덴 숲 야생열매 덤불에 괭이 우클릭 (길안내)","3,000원"],["11","낚시 3번 성공","받은 강철 낚싯대로 아무 물에서나","3,000원"],["12","바다 채집 3번","아르덴 앞바다 얕은 물에서 괭이 우클릭 (길안내)","3,000원"],["13","물고기 손질 3번","식칼을 들고 우 광물 · 구조물 · 운석","끝나면 원래 자리로"]]}},{"list":["엔드 차원은 막혀 있습니다.","홈 개수는 [진급](#growth-rank) 등급에 따라 1개(나그네)부터 6개(영주)까지 늘어납니다.","던전이 끝나면 들어갔던 서버의 그 자리로 돌아옵니다.","주민(마을 사람)과의 거래는 모든 서버에서 막혀 있습니다.","동물 [포획](#life-ranch)은 야생(오버월드)과 코자 대륙에서만 됩니다. 마을 서버에는 동물이 저절로 생기지 않습니다.","한 번에 들어올 수 있는 인원은 60명입니다. 꽉 차도 [VIP · MVP 멤버십](#shop-membership)은 들어올 수 있습니다."]},{"note":{"b":"야생은 초기화될 수 있습니다","t":"야생은 주기적으로 새로 만들어질 수 있고, 거기 둔 물건은 되돌려 주지 않습니다. 오래 둘 건물과 창고는 마을 서버의 내 마을에 지으세요."}}]},{"h":"관련 문서","blocks":[{"links":[["#conv-move","이동","비석 · 로비 · 사냥터 · 랜덤 이동 · TPA · 홈"],["#conv-town","유저 마을","마을 만들기와 넓히기"],["#world","세계 · 지역","이프란 여섯 지역과 코자 대륙"]]}]}],"search":[["로비","서버"],["마을 서버","서버"],["야생","서버"],["던전 서버","서버"],["/로비","명령어"],["서버 이동","이동"]]},"start-tutorial":{"id":"start-tutorial","parent":"start","title":"튜토리얼","short":"검은 화면에서 시야 맞추기 → 아르덴 NPC 세 명 → 포탈로 야생.","color":"var(--reg-forest)","tags":[["첫 접속","lv"],["아르덴",null],["약 5분",null]],"lede":"[첫날 가이드](#start-first-day) 1 · 2단계(시야 맞추기 · 튜토리얼)를 자세히 적은 문서입니다. 처음 접속하면 바로 튜토리얼이 시작됩니다. 검은 화면에서 화면 비율을 맞추고, [아르덴](#arden) 마을에서 깨어나 이장 실바 · 대장장이 루이흐 · 상점 점원 프루를 차례로 만납니다. 마지막에 마을 포탈을 우클릭하면 [야생](#world-wild)으로 나가고, 기초 길라잡이 01번이 시작됩니다.","info":{"title":"튜토리얼","slot":{"id":"시작-튜토리얼-대표","need":"튜토리얼 첫 화면 — 검은 화면에 시야 설정 안내 글자가 떠 있는 모습"},"rows":[["시작","처음 접속할 때 자동"],["장소","[아르덴](#arden) 마을"],["만나는 NPC","실바 → 루이흐 → 프루"],["받는 것","철 갑옷 한 벌 · 철 도구 5종 · 솔 · 익힌 소고기 · 체력 회복 포션 30 · 강철 낚싯대 · 식칼 · 올가미"],["끝나면","포탈 → 야생 · [기초 길라잡이](#start-guide-basic) 01 시작"]]},"sections":[{"h":"진행 순서","blocks":[{"steps":[{"h":"검은 화면에서 시야 맞추기","p":"처음 접속하면 화면이 검게 가려지고 시점이 고정됩니다. 화면에 뜬 안내대로 마인크래프트 설정에서 GUI 비율을 2로 맞춘 뒤 채팅에 `/시야 숫자` 를 입력하세요. 숫자는 30~110 사이이고, `/시야 기본` 이나 `/시야 보통` 도 됩니다. 이 단계에서는 움직이거나 다른 명령어를 쓸 수 없습니다."},{"h":"아르덴에서 깨어나기","p":"시야를 정하면 아르덴 마을로 옮겨지고, 3초 동안 화면이 어두워졌다가 혼잣말 대화가 나옵니다. 대화가 끝나면 화면에 화살표와 바닥 길이 나타나 첫 번째 사람에게 안내합니다."},{"h":"이장 실바","p":"아르덴 마을의 이장입니다. 이 세계의 대륙들에 대해 이야기해 줍니다. 대화를 마치면 다음 사람에게 [길안내](#start-glossary~1)가 이어집니다."},{"h":"대장장이 루이흐","p":"기본 장비를 줍니다. 철 갑옷 한 벌을 입혀 주고, 철 검 · 곡괭이 · 도끼 · 삽 · 괭이, 솔, 익힌 소고기, 체력 회복 포션, 강철 낚싯대와 식칼, 동물을 잡는 올가미를 받습니다. [강화](#growth-enhance)도 여기서 한다는 것을 알려 줍니다."},{"h":"상점 점원 프루","p":"[유저 상점](#shop-usershop)과 [가구 상점](#shop-furniture)을 소개하고, 마을 밖(야생)으로 나가는 포탈을 알려 줍니다. 프루와 이야기를 마치면 돈 · 퀘스트 같은 화면 표시([HUD](#start-controls~3))가 나타납니다."},{"h":"마을 포탈로 나가기","p":"길안내를 따라 포탈에 가서 우클릭하면 야생 맵을 고르는 창이 뜹니다. 고른 맵의 무작위 위치로 이동하고, 기초 길라잡이 01 「나무 원목 캐기」가 시작됩니다."}]},{"slot":{"id":"시작-튜토리얼-루이흐","need":"대장장이 루이흐와 대화해 기본 장비를 받는 장면 (대화창이 보이게)"}}]},{"h":"루이흐에게 받는 기본 장비","blocks":[{"table":{"cols":["아이템","수량","쓰는 곳"],"num":[1],"rows":[["철 투구 · 흉갑 · 레깅스 · 부츠","1벌","바로 입혀 줍니다. 첫 사냥용"],["철 검 · 곡괭이 · 도끼 · 삽 · 괭이","각 1","사냥 · 채굴 · 벌목 · 땅파기 · 채집(괭이 우클릭)"],["솔","1","[화석 발굴](#life-fossil)"],["익힌 소고기","64","먹을거리"],["체력 회복 포션","30","전투 중 체력 회복"],["강철 낚싯대","1","낚시. [강화](#growth-enhance)로 성능을 올립니다"],["식칼","1","잡은 물고기 손질"],["올가미","1","[동물 포획](#life-ranch). 써도 사라지지 않고, 잃어버리면 `/포획창` 「내 목장」에서 다시 받습니다"]]}},{"note":{"b":"낚싯대와 식칼은 하나뿐","t":"다른 낚싯대나 손질 도구를 사지 않습니다. 받은 강철 낚싯대와 식칼을 강화해서 끝까지 씁니다."}}]},{"h":"알아두면 좋은 것","blocks":[{"list":["튜토리얼 중에 접속이 끊겨도 다시 접속하면 이어서 진행됩니다.","대화창 오른쪽 위에 번호가 붙은 선택지가 나오면 숫자키 1 · 2 · 3 으로 고릅니다. 답이 하나뿐인 다음 대사는 숫자키 1 로 넘깁니다.","길안내 화살표는 목적지에 가까이 가면 사라집니다.","돈 · 퀘스트 같은 화면 표시(HUD)는 튜토리얼 앞부분에는 숨겨져 있다가 프루와 이야기를 마치면 나타납니다. 글자가 겹쳐 보이면 GUI 비율을 2로 맞췄는지 확인하세요."]},{"note":{"b":"베타 기간에만","t":"베타 테스트 기간에는 프루와의 대화 끝에 「[첫 항해](#start-glossary~2) 전시관」을 한 번 체험하는 단계가 들어갑니다. 전시관에서 보상을 하나 체험하면 포탈을 쓸 수 있습니다. 보상은 없습니다."}},{"links":[["#start-guide-basic","기초 길라잡이","튜토리얼 다음에 이어지는 33단계"],["#start-controls","조작키 · 기본 화면","HUD 와 키 설명"],["#arden","아르덴","튜토리얼이 열리는 마을"]]}]}],"search":[["시야","튜토리얼"],["/시야","튜토리얼"],["GUI 비율","튜토리얼"],["기본 장비","튜토리얼"],["강철 낚싯대","튜토리얼"],["식칼","튜토리얼"],["올가미","튜토리얼"]]},"start":{"id":"start","title":"시작하기","short":"처음 접속한 날 알아야 할 것을 순서대로 모았습니다.","color":"var(--accent)","tags":[["처음 온 분","lv"],["첫날 가이드",null],["튜토리얼",null],["기초 길라잡이",null],["용어집",null]],"lede":"코자 온라인에 처음 오셨다면 [첫날 가이드](#start-first-day)부터 따라오세요. 리소스팩을 넣고 접속해 튜토리얼을 마치고, 기초 길라잡이 36단계로 돈 버는 법과 장비 갖추는 법을 익히는 데까지가 한 문서에 순서대로 들어 있습니다. 조작키 · 서버 구성 · 자주 묻는 질문 · 용어집은 필요할 때 찾아보면 됩니다.","info":{"title":"시작하기","slot":{"id":"시작-대문-대표","need":"아르덴 마을 광장에서 이장 실바 앞에 선 새 캐릭터"},"rows":[["처음 깨어나는 곳","[아르덴](#arden) (이프란 대륙)"],["첫 안내 NPC","이장 실바 → 대장장이 루이흐 → 상점 점원 프루"],["첫 퀘스트 라인","기초 길라잡이 36단계"],["길라잡이 보상","돈 124,500원 + 근원 108 + 졸업 선물 상자"],["메인 메뉴","Shift + F"],["모르는 말","[용어집](#start-glossary)"]]},"sections":[{"h":"이 순서로 읽으세요","blocks":[{"p":"처음 온 분이 따라갈 문서는 **첫날 가이드** 하나입니다. 리소스팩 · 시야 → 튜토리얼 → 기초 길라잡이 → 졸업 → 다음 할 일 순서가 그 문서에 그대로 들어 있고, 튜토리얼 · 기초 길라잡이 문서는 그 단계를 자세히 풀어 둔 표입니다."},{"steps":[{"h":"[첫날 가이드](#start-first-day) — 여기서 시작","p":"접속 전 리소스팩부터 졸업 뒤 할 일까지, 처음 온 날 할 일을 순서대로 한 장에 담았습니다. 이 문서만 위에서부터 따라가면 됩니다."},{"h":"[튜토리얼](#start-tutorial) — 2단계 자세히","p":"검은 화면에서 `/시야` 로 화면을 맞추고, 아르덴 사람 세 명을 만나 기본 장비를 받는 과정과 받는 장비 표입니다."},{"h":"[기초 길라잡이](#start-guide-basic) — 3 · 4단계 자세히","p":"단계마다 할 일 · 장소 · 보상과 졸업 선물 상자입니다. 36단계(01~33과 사이에 끼운 24-1 · 28-1 · 28-2)이고, 01~21은 88,000원, 23~33은 36,500원, 합계 124,500원과 근원 108개입니다."}]}]},{"h":"필요할 때 찾아보기","blocks":[{"p":"처음부터 다 읽을 필요는 없습니다. 막히거나 궁금할 때 여는 문서입니다."},{"links":[["#start-controls","조작키 · 기본 화면","Shift + F 메인 메뉴 · 스킬북 키 · NPC 대화 숫자키 · 화면 표시"],["#start-servers","서버 구성","로비 · 마을 서버 · 야생 · 코자 대륙 · 던전 서버와 오가는 법"],["#start-faq","자주 묻는 질문","죽으면? 아이템은? 돈은?"],["#start-glossary","용어집","램프 · 해방 · 잼 · 룬 · 근원처럼 서버에서만 쓰는 말"]]}]},{"h":"처음에 알아두면 편한 것","blocks":[{"list":["죽어도 아이템은 떨어지지 않습니다. 대신 로비(아르덴)에서 다시 일어납니다.","이프란 대륙(마을 6곳과 사냥터)에서는 떨어져도 다치지 않습니다.","퀘스트는 한 번에 1개만 진행합니다. 화면 오른쪽 위에 지금 할 일이 보이고, 그만두려면 `/퀘스트포기` 를 입력합니다 (기초 길라잡이는 포기할 수 없습니다).","목적지가 있는 퀘스트는 화면에 화살표와 바닥 길이 표시됩니다. 그대로 따라가면 됩니다.","인벤토리가 꽉 차서 못 받은 보상은 `/우편함` 에 쌓입니다.","NPC 대화창의 선택지는 숫자키로 고릅니다. 다음 대사로 넘길 때는 숫자키 1 입니다."]},{"note":{"b":"막히면","t":"[자주 묻는 질문](#start-faq)을 먼저 보세요. 대부분의 질문이 거기에 있습니다."}},{"cards":[{"h":"[룬](#growth-rune)","p":"능력치를 새기는 돌입니다. 생명 · 힘 · 방어 · 치명타 4종을 1개씩 끼우고, 기초 길라잡이 28-1에서 1성 생명 룬을 하나 받습니다.","color":"var(--r-epic)"},{"h":"[근원](#growth-origin)","p":"강화 21강부터 · 인첸트 해방 · 상급 램프 · 높은 룬 합성에 드는 재화입니다. 퀘스트 · 의뢰 · 보스에서 조금씩 모이고 거래할 수 없습니다.","color":"var(--gold)"},{"h":"[마나](#growth-mana)","p":"스킬을 쓸 때 드는 값입니다. 화면 아래 체력 막대 옆 마나 막대로 보고, 기본 최대 100 · 1초에 4씩 찹니다.","color":"var(--accent)"},{"h":"[동물 포획](#life-ranch)","p":"튜토리얼에서 받는 올가미로 오버월드 · 코자 대륙의 동물을 잡아 `/포획창` 에서 기릅니다. 잡은 동물은 20분마다 전리품을 쌓습니다.","color":"var(--reg-forest)"}]}]}],"search":[["처음","시작하기"],["초보","시작하기"],["뉴비","시작하기"]]},"style-damageskin":{"id":"style-damageskin","parent":"style","title":"데미지 스킨","short":"몬스터를 때릴 때 뜨는 숫자 글꼴 · 색 바꾸기. 상자 16종 각 6.25%.","color":"var(--r-rare)","tags":[["/데미지스킨",null],["상자 16종","lv"],["각 6.25%",null],["잼 2,900",null]],"lede":"몬스터를 때리면 머리 위에 피해 숫자가 튀어 오릅니다. 데미지 스킨은 이 숫자의 글꼴과 색을 바꿉니다. 처음에는 「클래식 블루」가 끼워져 있고, 데미지 스킨 랜덤 상자에서 다른 스킨을 스킨북으로 얻습니다.","info":{"title":"데미지 스킨","slot":{"id":"꾸미기-데미지스킨-대표","need":"데미지 스킨을 끼우고 몬스터를 때려 숫자가 튀어 오르는 순간 (치명타 숫자 포함이면 더 좋음)"},"rows":[["장착 창","`/데미지스킨` · 메인 메뉴 「데미지」 카드"],["기본 스킨","클래식 블루"],["상자","데미지 스킨 랜덤 상자 · 잼 2,900"],["상자 확률","16종 각 6.25%"],["결과물","스킨북 (우클릭하면 습득, 거래 가능)"],["치명타","숫자가 흰색으로 크게"]]},"sections":[{"h":"상자 여는 법","blocks":[{"steps":[{"h":"상자를 들고 우클릭","p":"확률표가 열립니다. 스킨마다 이름, 확률, 숫자 모양 미리보기, 내가 가졌는지가 보입니다."},{"h":"「보상 받기」","p":"상자 1개가 쓰이고 시선이 정면으로 고정된 뒤 연출이 시작됩니다. 연출 중에는 움직이거나 명령어를 쓸 수 없습니다. 이 상자는 한 번에 하나씩 열립니다."},{"h":"25연타 → 치명타","p":"눈앞에서 숫자가 25번 튀어 오르다가 마지막에 당첨 스킨으로 큰 치명타 숫자가 터집니다."},{"h":"스킨북 받기","p":"가진 스킨이든 아니든 항상 스킨북으로 받습니다. 인벤토리가 가득 차면 우편함으로 갑니다. 연출 도중 접속이 끊겨도 스킨북은 들어옵니다."}]}]},{"h":"상자에서 나오는 16종","blocks":[{"table":{"cols":["스킨","확률","스킨","확률"],"num":[1,3],"rows":[["네온 팝","6.25%","맹독","6.25%"],["화염","6.25%","원목","6.25%"],["심연","6.25%","설빙","6.25%"],["자수정","6.25%","아케이드","6.25%"],["마그마","6.25%","오션 골드","6.25%"],["글리치","6.25%","호러","6.25%"],["캔디 팝","6.25%","슬라임","6.25%"],["빙결","6.25%","별빛","6.25%"]]}},{"note":{"b":"상자에서 안 나오는 스킨","t":"「클래식 블루」는 기본 스킨입니다. 「오로라 별빛」은 시즌패스 보상인데 시즌패스는 아직 준비 중입니다. 「항해 일지」는 첫 항해 사전 후원 한정 스킨입니다 ([후원](#shop-donate))."}}]},{"h":"장착하기","blocks":[{"list":["스
